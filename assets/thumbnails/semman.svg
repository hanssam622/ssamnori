<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">셈맨 썸네일</title>
  <desc id="desc">사과와 숫자 카드로 수 세기와 덧셈을 익히는 초등 수학 게임</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8ff"/>
      <stop offset="1" stop-color="#fff1dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#355166" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="32" fill="url(#bg)"/>
  <circle cx="705" cy="88" r="78" fill="#ffcc67" opacity=".34"/>
  <circle cx="92" cy="420" r="86" fill="#72d7ca" opacity=".3"/>
  <g filter="url(#shadow)">
