        <circle cx="56" cy="78" r="17"/><circle cx="90" cy="78" r="17"/>
      </g>
      <g fill="#347b43"><path d="M38 27q2-15 14-14q-3 12-14 14"/><path d="M72 27q2-15 14-14q-3 12-14 14"/><path d="M106 27q2-15 14-14q-3 12-14 14"/></g>
      <text x="73" y="105" text-anchor="middle" fill="#8a5b00" font-family="system-ui,sans-serif" font-size="16" font-weight="800">세어 보아요</text>
