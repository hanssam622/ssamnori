    <rect x="82" y="70" width="100" height="36" rx="18" fill="#ff9a1f"/>
    <text x="132" y="95" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="800">1~2학년</text>
    <text x="82" y="174" fill="#1d2838" font-family="system-ui,sans-serif" font-size="62" font-weight="900">셈맨</text>
    <text x="84" y="210" fill="#647184" font-family="system-ui,sans-serif" font-size="22" font-weight="750">세기 · 더하기 · 빼기 · 구구단</text>
    <rect x="82" y="239" width="636" height="174" rx="22" fill="#f7fbfc" stroke="#e3edf0" stroke-width="3"/>
    <g transform="translate(105 268)">
