        <rect x="15" y="59" width="32" height="32" rx="8"/><rect x="57" y="59" width="32" height="32" rx="8"/><rect x="99" y="59" width="32" height="32" rx="8"/>
      </g>
      <g fill="#ffb12b"><circle cx="31" cy="33" r="8"/><circle cx="73" cy="33" r="8"/><circle cx="115" cy="33" r="8"/><circle cx="31" cy="75" r="8"/><circle cx="73" cy="75" r="8"/></g>
      <text x="74" y="109" text-anchor="middle" fill="#275c59" font-family="system-ui,sans-serif" font-size="15" font-weight="800">10칸 상자</text>
