<!DOCTYPE html>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --ink: #1d2838;
      --ink-2: #3b4759;
      --muted: #6b7687;
      --line: #e1e8ef;
      --soft: #f3f7fa;
      --teal: #12b3a3;
      --teal-d: #0b8f83;
      --teal-s: #e2f7f4;
      --coral: #ff5b4f;
      --coral-d: #e2443a;
      --coral-s: #ffece9;
      --amber: #ffb12b;
      --amber-s: #fff4dc;
      --good: #1fae6a;
      --bad: #ec5050;
      /* 자리별 색 (교과서 자릿값 표와 같은 계열) */
      --p2: #8a6be0;
      --p1: #f08a24;
      --p0: #22a565;
      --pm1: #3a7ff2;
      --pm2: #e64f95;
      --pm3: #8b5cf0;
      --s: 1;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: #f3faf8;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; padding: 0; }
    .hidden { display: none !important; }

    .samnori-home-float {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 80;
      display: grid;
      place-items: center;
      width: 78px;
      height: 54px;
      border-radius: 18px;
      background: rgba(255,255,255,.94);
      border: 2px solid #ffe3a5;
      color: #8a5b00;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 10px 26px rgba(29, 40, 56, .16);
    }
    body.playing .samnori-home-float,
    body.modal .samnori-home-float { display: none; }

    /* ---------- 숫자 표기 ---------- */
    .num {
      display: inline-flex;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: .01em;
    }
    .dp {
      display: inline-block;
      width: .21em;
      height: .21em;
      margin: 0 .07em;
      border-radius: 50%;
      background: var(--coral);
      flex: 0 0 auto;
    }
    .pl2 { color: var(--p2); }
    .pl1 { color: var(--p1); }
    .pl0 { color: var(--p0); }
    .plm1 { color: var(--pm1); }
    .plm2 { color: var(--pm2); }
    .plm3 { color: var(--pm3); }
    .dg.hi {
      color: #fff;
      background: var(--coral);
      border-radius: .16em;
      padding: 0 .08em;
      margin: 0 .04em;
      box-shadow: 0 .06em 0 var(--coral-d);
    }
    .fr {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      line-height: 1.02;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      margin: 0 .08em;
    }
    .fr > b { font-weight: inherit; padding: 0 .12em; border-bottom: .08em solid currentColor; }
    .fr > i { font-style: normal; padding: 0 .12em; }
    .fr-wrap { display: inline-flex; align-items: center; gap: .12em; font-weight: 900; }

    /* ---------- 공통 배경: 모눈 ---------- */
    .screen {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background:
        linear-gradient(rgba(57,169,204,.12) 1.5px, transparent 1.5px) -1px -1px / 48px 48px,
        linear-gradient(90deg, rgba(57,169,204,.12) 1.5px, transparent 1.5px) -1px -1px / 48px 48px,
        radial-gradient(circle at 10% 8%, rgba(230,79,149,.13), transparent 36%),
        radial-gradient(circle at 92% 14%, rgba(57,169,204,.14), transparent 34%),
        radial-gradient(circle at 72% 96%, rgba(255,177,43,.14), transparent 40%),
        linear-gradient(180deg, #fffbfd 0%, #f3f8fb 100%);
    }

    /* ---------- 시작 화면 ---------- */
    .start-wrap {
      min-height: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 48px;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
      align-items: center;
      gap: 28px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 8px 8px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--ink-2);
      font-size: 16px;
      font-weight: 750;
      box-shadow: 0 8px 20px rgba(29,40,56,.06);
    }
    .hero-badge b {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--teal);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }
    .hero-title {
      margin: 22px 0 12px;
      font-size: clamp(58px, 7.8vw, 116px);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -.045em;
      color: var(--ink);
    }
    .hero-title .tdot {
      display: inline-block;
      width: .2em;
      height: .2em;
      margin-left: .05em;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 .05em 0 var(--coral-d);
      animation: dotHop 2.6s ease-in-out infinite;
    }
    @keyframes dotHop {
      0%, 62%, 100% { transform: translateY(0); }
      70% { transform: translateY(-.42em) scale(.92, 1.08); }
      78% { transform: translateY(0) scale(1.12, .88); }
      86% { transform: translateY(-.1em); }
    }
    .hero-sub {
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 1.7vw, 21px);
      font-weight: 600;
      line-height: 1.65;
      word-break: keep-all;
    }
    .hero-sub strong { color: var(--ink); font-weight: 800; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 30px; }
    .start-btn {
      height: 66px;
      padding: 0 36px;
      border-radius: 22px;
      background: linear-gradient(180deg, #1cc6b5, #0ea193);
      color: #fff;
      font-size: 23px;
      font-weight: 850;
      letter-spacing: -.01em;
      box-shadow: 0 16px 32px rgba(14,161,147,.32), inset 0 -4px 0 rgba(0,0,0,.12);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 38px rgba(14,161,147,.38), inset 0 -4px 0 rgba(0,0,0,.12); }
    .start-btn:active { transform: translateY(1px); }
    .hero-note { color: var(--muted); font-size: 15px; font-weight: 650; }
    .topic-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 30px;
      max-width: 560px;
    }
    .topic-list span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 1.5px solid var(--line);
      font-size: 14.5px;
      font-weight: 750;
      color: var(--ink-2);
    }
    .topic-list span::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c, var(--teal));
    }

    .hero-art { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; justify-self: center; }
    .art-card {
      position: absolute;
      left: 9%;
      top: 13%;
      width: 64%;
      aspect-ratio: 1;
      padding: 14px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 30px 60px rgba(29,61,72,.14);
      transform: rotate(-7deg);
    }
    #hero-fig, #hero-fig svg { display: block; width: 100%; height: 100%; }
    .art-tag {
      position: absolute;
      left: -20px;
      bottom: 30px;
      z-index: 4;
      padding: 8px 16px;
      border-radius: 16px;
      background: var(--ink);
      color: #fff;
      font-size: 21px;
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 12px 24px rgba(29,40,56,.25);
      transform: rotate(7deg);
    }
    .art-tag .dp { background: var(--coral); }
    .hero-art .kid-art {
      position: absolute;
      right: -2%;
      bottom: -2%;
      width: 66%;
      height: 66%;
      z-index: 2;
      animation: floaty 4.2s ease-in-out infinite;
      filter: drop-shadow(0 18px 22px rgba(29,61,72,.18));
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .bubble {
      position: absolute;
      z-index: 3;
      padding: 8px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 24px rgba(29,40,56,.1);
      font-size: 22px;
      font-weight: 900;
      animation: floaty 5s ease-in-out infinite;
    }
    .bubble.b1 { left: 0; top: 2%; animation-delay: -1s; }
    .bubble.b2 { right: 4%; top: 4%; animation-delay: -2.4s; color: var(--teal-d); }
    .bubble.b3 { left: 6%; bottom: 2%; animation-delay: -3.3s; }
    .bubble.b4 { right: 0; top: 36%; animation-delay: -.6s; font-size: 18px; color: var(--coral-d); }

    .kid-art { background-position: center bottom; background-size: contain; background-repeat: no-repeat; }

    /* ---------- 게임 선택 화면 ---------- */
    .select-wrap { max-width: 1180px; margin: 0 auto; padding: 22px 30px 70px; }
    .select-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .brand-mini { display: flex; align-items: center; gap: 12px; }
    .brand-mini .kid-art {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      background-color: #fff;
      background-size: 120%;
      background-position: center 12%;
      border: 1.5px solid var(--line);
      box-shadow: 0 8px 18px rgba(29,40,56,.08);
    }
    .brand-mini h2 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
    .brand-mini h2 .tdot {
      display: inline-block;
      width: .2em;
      height: .2em;
      margin-left: .04em;
      border-radius: 50%;
      background: var(--coral);
    }
    .brand-mini p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; font-weight: 650; }
    .ghost-btn {
      height: 46px;
      padding: 0 16px;
      border-radius: 15px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--ink-2);
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(29,40,56,.05);
    }
    .ghost-btn:hover { background: #f8fbfc; }

    .settings-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 26px;
      padding: 14px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,.9);
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 30px rgba(29,61,72,.06);
    }
    .setting-row { display: flex; align-items: center; gap: 10px; }
    .setting-label { font-size: 15px; font-weight: 800; color: var(--ink-2); white-space: nowrap; }
    .seg {
      display: inline-flex;
      padding: 4px;
      gap: 2px;
      border-radius: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
    }
    .seg button {
      min-width: 46px;
      height: 40px;
      padding: 0 10px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 800;
      color: var(--muted);
      transition: background .15s, color .15s;
    }
    .seg button.on { background: #fff; color: var(--teal-d); box-shadow: 0 2px 8px rgba(29,40,56,.12); }
    .select, .card-select {
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
    }
    .select:focus, .card-select:focus { outline: none; border-color: var(--teal); }
    .toggle-btn {
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #fff;
      font-size: 15px;
      font-weight: 800;
    }
    .toggle-btn.on { background: var(--teal-s); border-color: #9fdcd3; color: var(--teal-d); }
    .toggle-btn.off { background: var(--soft); color: #98a2b0; }

    .stage-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      margin: 16px -30px 0;
      padding: 12px 30px;
      overflow-x: auto;
      scrollbar-width: none;
      background: linear-gradient(180deg, rgba(246,251,250,.97) 72%, rgba(246,251,250,0));
    }
    .stage-nav::-webkit-scrollbar { display: none; }
    .stage-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px 0 6px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--line);
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .stage-chip b {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--sc, var(--teal));
      color: #fff;
      font-size: 14px;
    }
    .stage-chip:hover { border-color: var(--sc, var(--teal)); }

    .stage { margin-top: 30px; scroll-margin-top: 70px; }
    .stage-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 14px; }
    .stage-no {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--sc, var(--teal));
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 8px 16px color-mix(in srgb, var(--sc, var(--teal)) 30%, transparent);
    }
    .stage-title { margin: 0; font-size: 25px; font-weight: 900; letter-spacing: -.02em; }
    .stage-page {
      padding: 5px 11px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
      gap: 16px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border-radius: 24px;
      background: #fff;
      border: 1.5px solid var(--line);
      box-shadow: 0 8px 22px rgba(29,61,72,.06);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--tb, #bfe5df); box-shadow: 0 18px 36px rgba(29,61,72,.12); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card .ic {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--tint, var(--teal-s));
    }
    .card .ic svg { width: 40px; height: 40px; }
    .card .cap {
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .card h4 { margin: 4px 0 0; font-size: 19px; font-weight: 850; letter-spacing: -.02em; }
    .card p { flex: 1; margin: 0; color: var(--muted); font-size: 14.5px; font-weight: 560; line-height: 1.55; word-break: keep-all; }
    .card .card-select { width: 100%; height: 42px; font-size: 14px; }
    .card .go {
      height: 46px;
      border-radius: 15px;
      background: var(--ink);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      transition: background .15s;
    }
    .card .go:hover { background: #2b3a50; }
    .card.concept { background: linear-gradient(165deg, #edfaf7 0%, #fff 62%); border-color: #c7ece5; }
    .card.concept .go { background: #fff; color: var(--teal-d); border: 1.5px solid #9edfd5; }
    .card.concept .go:hover { background: var(--teal-s); }
    .card.wide { grid-column: span 2; }
    .card .cap.pc { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 4px 7px; background: var(--teal-s); color: var(--teal-d); }
    .card .cap.pc svg { width: 15px; height: 15px; flex: 0 0 auto; }
    .card .cap.pc.lim { background: var(--amber-s); color: #a46a00; }
    .card .cap.pc.over { background: #ffe9e6; color: var(--coral-d); box-shadow: inset 0 0 0 1.5px #ffbdb6; }
    .cap-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 12px 0 0;
      padding: 10px 14px;
      border-radius: 14px;
      background: #fff7e6;
      border: 1px solid #ffe0a3;
      color: #8a5b00;
      font-size: 14.5px;
      font-weight: 650;
      line-height: 1.55;
      word-break: keep-all;
    }
    .cap-note:empty { display: none; }
    .cap-note b { font-weight: 850; }
    .cap-note svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px; color: #e09a0b; }
    .mix-chip .mcap { margin-left: 2px; padding: 2px 7px; border-radius: 999px; background: var(--amber-s); color: #a46a00; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
    .notice-card { width: min(470px, 92vw); }
    .notice-card h2 { font-size: 28px; }
    .notice-ic { width: 66px; height: 66px; margin: 4px auto 4px; display: grid; place-items: center; border-radius: 22px; background: var(--amber-s); color: #e09a0b; }
    .notice-ic svg { width: 38px; height: 38px; }
    .notice-main { margin: 6px 0 8px; font-size: 19px; font-weight: 750; line-height: 1.55; word-break: keep-all; }
    .notice-main b { color: var(--coral-d); font-weight: 900; }
    .notice-why { margin: 0; color: var(--muted); font-size: 15px; font-weight: 600; line-height: 1.6; word-break: keep-all; }
    .notice-now { margin: 14px 0 0; padding: 9px 12px; border-radius: 12px; background: var(--soft); color: var(--ink-2); font-size: 15px; font-weight: 750; }

    /* ---------- 게임 화면 ---------- */
    .game-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .topbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.97);
      z-index: 5;
    }
    .top-title { min-width: 0; text-align: center; }
    .top-title h1 {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      font-size: clamp(20px, 2.5vw, 31px);
      font-weight: 900;
      letter-spacing: -.03em;
      white-space: nowrap;
    }
    .top-title h1 .ic { width: 1.25em; height: 1.25em; flex: 0 0 auto; display: grid; place-items: center; }
    .top-title h1 .ic svg { width: 100%; height: 100%; }
    .top-title p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .timer { position: relative; width: 58px; height: 58px; flex: 0 0 auto; }
    .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer circle { fill: none; stroke-width: 6; }

    /* 글자로 된 보기만 한 줄로 쌓고, 짧은 수 보기는 두 줄 그대로 둔다 */

    .bell-card .bell-opts { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 14px; padding: 14px 16px; border-radius: 20px; background: #fff8e3; }
    .bell-card .seg button { padding: 0 12px; }
    .bell-pad-link { align-self: flex-start; color: var(--teal-d); font-size: 14px; font-weight: 800; text-decoration: underline; }
    .bell-err { color: var(--bad); font-size: 14px; font-weight: 800; }
    .bell-err:empty { display: none; }

    /* 칠판(선생님) */
    .bell-screen { background: #f6fbfa; }
    .bell-screen .topbar { grid-template-columns: auto minmax(0, 1fr) auto auto; }
    .bell-room { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: var(--amber-s); color: #8a5b00; font-size: 15px; font-weight: 850; white-space: nowrap; }
    .bell-room b { color: var(--ink); font-size: 20px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
    .bell-room .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); }
    .bell-room.off .dot { background: var(--coral); animation: blink 1s infinite; }
    .bell-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: calc(var(--s) * 14px) 18px 18px; }
    .bell-panel { padding: 18px; border-radius: 24px; background: #fff; box-shadow: 0 8px 24px rgba(29,40,56,.08); }
    .bell-lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; max-width: 1280px; min-height: 100%; margin: 0 auto; }
    .bell-joinbox { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
    .bell-qr { width: min(48vh, 100%); max-width: 400px; aspect-ratio: 1; padding: 8px; border-radius: 18px; border: 2px solid var(--line); background: #fff; image-rendering: pixelated; }
    .bell-code-label { margin-top: 4px; color: var(--muted); font-size: 16px; font-weight: 800; }
    .bell-code { font-size: clamp(44px, 7vh, 76px); font-weight: 900; letter-spacing: .14em; line-height: 1; font-variant-numeric: tabular-nums; }
    .bell-hint { margin: 6px 0 0; color: var(--ink-2); font-size: 16px; font-weight: 700; line-height: 1.6; word-break: keep-all; }
    .bell-hint b { color: #9a6400; }
    .bell-rosterbox { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .bell-rosterbox h3 { margin: 0; font-size: 24px; font-weight: 900; }
    .bell-rosterbox h3 b { color: var(--teal-d); }
    .bell-chips { flex: 1 1 auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; min-height: 160px; padding: 12px; border-radius: 18px; background: var(--soft); overflow-y: auto; }
    .bell-chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px 0 10px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(29,40,56,.08); font-size: 18px; font-weight: 850; animation: pop .35s ease both; }
    .bell-chip .em { font-size: 26px; }
    .bell-chip.off { opacity: .45; }
    .bell-chip .x { width: 28px; height: 28px; border-radius: 50%; color: #a5afbc; font-size: 14px; }
    .bell-chip .x:hover { background: #ffeded; color: var(--bad); }
    .bell-empty { margin: auto; color: var(--muted); font-size: 16px; font-weight: 700; line-height: 1.6; text-align: center; }
    .bell-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: var(--ink-2); font-size: 16px; font-weight: 800; }
    .bell-sum .ghost-btn { height: 40px; margin-left: auto; }
    .bell-go { height: 66px; border-radius: 20px; font-size: 23px; }

    .bell-play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 16px; max-width: 1440px; margin: 0 auto; }
    .bell-main { min-width: 0; display: flex; flex-direction: column; gap: calc(var(--s) * 12px); }
    .bell-main > * { width: 100%; max-width: calc(var(--s) * 820px); align-self: center; }
    .bell-qhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
    .bell-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #fff; color: var(--ink-2); font-size: calc(var(--s) * 14px); font-weight: 800; box-shadow: 0 2px 8px rgba(29,40,56,.07); }
    .bell-tag svg { width: calc(var(--s) * 22px); height: calc(var(--s) * 22px); }
    .bell-tag.no { background: var(--ink); color: #fff; }
    .bell-show .choice { position: relative; cursor: default; }
    .bell-show .choice:active { transform: none; box-shadow: 0 4px 0 #e2e9f0; }
    .bell-show .choice .mk { position: absolute; left: 8px; top: 7px; width: calc(var(--s) * 22px); height: calc(var(--s) * 22px); display: grid; place-items: center; border-radius: 50%; background: var(--soft); color: var(--muted); font-size: calc(var(--s) * 12px); font-weight: 900; }
    .bell-show .choice .ct { position: absolute; right: 8px; top: 7px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.85); color: var(--ink-2); font-size: calc(var(--s) * 13px); font-weight: 900; }
    .bell-show .choice.dim { opacity: .4; }
    .bell-padnote { margin: 0; color: var(--teal-d); font-size: calc(var(--s) * 18px); font-weight: 850; text-align: center; }
    .bell-faces { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; min-height: calc(var(--s) * 30px); font-size: calc(var(--s) * 24px); }
    .bell-faces span { animation: pop .3s ease both; }
    .bell-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
    .bell-foot.end { justify-content: center; }
    .bell-count { font-size: calc(var(--s) * 17px); font-weight: 850; white-space: nowrap; }
    .bell-count b { color: var(--teal-d); font-size: 1.3em; }
    .bell-bar { flex: 1 1 120px; height: 12px; border-radius: 999px; background: #e3ebf0; overflow: hidden; }
    .bell-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1cc6b5, #0ea193); transition: width .3s; }
    .bell-next { min-width: 220px; height: calc(var(--s) * 56px); font-size: calc(var(--s) * 19px); }
    .bell-next small { margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.25); font-size: .8em; }
    .bell-result-head { margin: 0; font-size: calc(var(--s) * 24px); font-weight: 900; text-align: center; }
    .bell-result-head b { color: var(--good); }
    .bell-ans { border-color: var(--good); box-shadow: 0 0 0 5px rgba(31,174,106,.15); color: #12804a; }
    .bell-explain { margin: 0; padding: 12px 16px; border-radius: 16px; background: var(--teal-s); font-size: calc(var(--s) * 17px); font-weight: 750; line-height: 1.6; text-align: center; word-break: keep-all; }
    .bell-side { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 10px; }
    .bell-side h3 { margin: 0; font-size: 19px; font-weight: 900; }
    .bell-leaders { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .bell-leader { display: grid; grid-template-columns: 28px 30px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 14px; background: var(--soft); font-size: 16px; font-weight: 850; }
    .bell-leader.r1 { background: #fff5d6; }
    .bell-leader .rk { color: var(--muted); font-weight: 900; text-align: center; }
    .bell-leader .em { font-size: 22px; text-align: center; }
    .bell-leader .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bell-leader .pt { text-align: right; font-variant-numeric: tabular-nums; }
    .bell-leader .pt small { display: block; color: var(--good); font-size: 12px; }
    .bell-more { margin: 0; color: var(--muted); font-size: 14px; font-weight: 700; text-align: center; }

    .bell-end { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 980px; margin: 0 auto; text-align: center; }
    .bell-end h2 { margin: 0; font-size: calc(var(--s) * 38px); font-weight: 900; letter-spacing: -.03em; }
    .bell-end .sub { margin: -6px 0 0; color: var(--muted); font-weight: 700; }
    .bell-podium { display: flex; align-items: flex-end; justify-content: center; gap: 14px; width: 100%; }
    .bell-pod { flex: 0 1 220px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bell-pod .em { font-size: calc(var(--s) * 54px); line-height: 1.1; animation: rise .5s both; }
    .bell-pod .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(var(--s) * 22px); font-weight: 900; }
    .bell-pod .pt { color: var(--muted); font-weight: 800; }
    .bell-pod .block { width: 100%; display: grid; place-items: start center; padding-top: 10px; border-radius: 18px 18px 6px 6px; color: #fff; font-size: calc(var(--s) * 32px); font-weight: 900; }
    .bell-pod.p1 .block { height: calc(var(--s) * 160px); background: linear-gradient(180deg, #ffc531, #f0a500); }
    .bell-pod.p2 .block { height: calc(var(--s) * 115px); background: linear-gradient(180deg, #c9d3dd, #9fadbb); }
    .bell-pod.p3 .block { height: calc(var(--s) * 85px); background: linear-gradient(180deg, #eab385, #cf8a4f); }
    .bell-rest { width: min(620px, 100%); }

    /* 학생 태블릿 */
    .bell-pad { display: flex; flex-direction: column; }
    .bp-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
    .bp-me { flex: 1 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 8px; overflow: hidden; font-size: 19px; font-weight: 900; white-space: nowrap; text-overflow: ellipsis; }
    .bp-me .em { font-size: 28px; }
    .bp-room { color: var(--muted); font-size: 14px; font-weight: 800; white-space: nowrap; }
    .bp-dot { flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; background: #c4ced9; }
    .bp-dot.open { background: var(--good); }
    .bp-dot.connecting { background: var(--amber); animation: blink 1s infinite; }
    .bp-top .ghost-btn { height: 40px; padding: 0 12px; font-size: 14px; }
    .bp-body { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: safe center; gap: calc(var(--s) * 12px); width: 100%; max-width: 760px; margin: 0 auto; padding: 16px; }
    .bp-form { display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 26px; background: #fff; box-shadow: 0 10px 30px rgba(29,40,56,.1); }
    .bp-form .kid-art { width: 110px; height: 110px; margin: 0 auto -6px; }
    .bp-form h2 { margin: 0; font-size: 28px; font-weight: 900; text-align: center; }
    .bp-field { display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); font-weight: 850; }
    .bp-field input { height: 56px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--line); color: var(--ink); font: inherit; font-size: 22px; font-weight: 850; user-select: text; -webkit-user-select: text; }
    .bp-field input:focus { outline: none; border-color: var(--teal); }
    .bp-field input.code { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
    .bp-animals { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
    .bp-animals button { height: 54px; border-radius: 14px; border: 2px solid transparent; background: var(--soft); font-size: 30px; }
    .bp-animals button.on { border-color: var(--teal); background: var(--teal-s); }
    .bp-err { min-height: 1.4em; margin: 0; color: var(--bad); font-weight: 800; text-align: center; }
    .bp-form .btn-main, .bp-big .btn-main { height: 60px; font-size: 20px; }
    .bp-big { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 18px; border-radius: 26px; background: #fff; box-shadow: 0 10px 30px rgba(29,40,56,.1); text-align: center; }
    .bp-big .emo { font-size: 76px; line-height: 1; animation: pop .45s ease both; }
    .bp-big h2 { margin: 0; font-size: 32px; font-weight: 900; word-break: keep-all; }
    .bp-big p { margin: 0; color: var(--ink-2); font-size: 19px; font-weight: 750; line-height: 1.55; word-break: keep-all; }
    .bp-big.good h2 { color: #12804a; }
    .bp-big.bad h2 { color: #c13b3b; }
    .bp-big .ans { padding: 8px 16px; border-radius: 14px; background: var(--soft); font-size: 22px; font-weight: 850; }
    .bp-big .bp-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
    .bp-big .bp-btns .ghost-btn { height: 60px; }
    .bp-qhead { display: flex; align-items: center; gap: 10px; font-size: calc(var(--s) * 17px); font-weight: 900; }
    .bp-time { flex: 1 1 auto; height: 12px; border-radius: 999px; background: #e3ebf0; overflow: hidden; }
    .bp-time i { display: block; width: 100%; height: 100%; border-radius: inherit; background: var(--teal); transform-origin: left; transition: transform .2s linear; }
    .bp-time.warn i { background: var(--coral); }
    .bp-left { min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
    .bp-q { display: flex; flex-direction: column; gap: calc(var(--s) * 12px); }
    .bp-q .choice.picked { border-color: var(--teal); background: var(--teal-s); box-shadow: 0 4px 0 var(--teal); color: var(--teal-d); }
    .bp-q.locked .choice:not(.picked) { opacity: .4; }
    .bp-q.locked .keypad, .bp-q.locked .bp-submit { display: none; }
    .bp-submit { width: 100%; height: calc(var(--s) * 60px); font-size: calc(var(--s) * 20px); }
    .bp-msg:empty { display: none; }
    .bp-msg { padding: 12px; border-radius: 16px; background: var(--amber-s); color: #8f5c08; font-size: calc(var(--s) * 18px); font-weight: 850; text-align: center; }
    .bp-msg.hint { background: #ffeded; color: #b23535; }

    /* 시간 대결 */
    body.racing .game-exit, body.racing .game-finish { display: none; }
    .race-board { display: flex; flex-direction: column; gap: 14px; max-width: 1280px; margin: 0 auto; }
    .race-head { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .race-clock { font-size: calc(var(--s) * 64px); font-weight: 900; line-height: 1; color: var(--teal-d); font-variant-numeric: tabular-nums; }
    .race-clock.warn { color: var(--coral); }
    .race-info { margin: 0; color: var(--ink-2); font-size: calc(var(--s) * 16px); font-weight: 750; text-align: center; word-break: keep-all; }
    .race-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .race-list.two { grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); }
    .race-row { display: grid; grid-template-columns: 34px 34px minmax(70px, 150px) minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 16px; background: #fff; box-shadow: 0 4px 12px rgba(29,40,56,.06); font-size: calc(var(--s) * 17px); font-weight: 850; }
    .race-row.r1 { background: #fff5d6; }
    .race-row .rk { color: var(--muted); font-weight: 900; text-align: center; }
    .race-row .em { font-size: 1.5em; text-align: center; }
    .race-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .race-row .track { height: 14px; border-radius: 999px; background: #e9eff3; overflow: hidden; }
    .race-row .track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1cc6b5, #0ea193); }
    .race-row.r1 .track i { background: linear-gradient(90deg, #ffc531, #f0a500); }
    .race-row .pt { min-width: 3.6em; text-align: right; font-variant-numeric: tabular-nums; }
    .race-row .ok { min-width: 3.2em; color: var(--good); font-size: .85em; text-align: right; }
    .race-count { color: var(--teal-d); font-size: 64px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }

    /* 단원 평가 (반 전체) */
    .exam-note { display: grid; gap: 6px; margin-top: 12px; padding: 14px 16px; border-radius: 20px; background: #f3efff; }
    .exam-note p { margin: 0; color: var(--ink-2); font-size: 15px; font-weight: 700; line-height: 1.6; word-break: keep-all; }
    .exam-note b { color: #6b3fd6; }
    .exam-privacy { margin: 4px 0 0; color: #6b3fd6; font-size: 14px; font-weight: 800; word-break: keep-all; }
    .bell-chip.warn { background: #ffeded; color: var(--bad); }
    .exam-pv-card { width: min(1180px, 96vw); padding: 22px 22px 0; text-align: left; }
    .exam-pv-head h2 { margin: 0 0 4px; font-size: 28px; }
    .exam-pv-head p { margin: 0; color: var(--muted); font-weight: 700; word-break: keep-all; }
    .exam-pv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; margin-top: 14px; }
    .exam-pv { --s: .72; display: flex; flex-direction: column; min-width: 0; border: 1.5px solid var(--line); border-radius: 18px; background: #fff; overflow: hidden; }
    .exam-pv header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--soft); font-size: 14px; font-weight: 800; color: var(--ink-2); }
    .exam-pv header b { display: grid; place-items: center; min-width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; }
    .exam-pv header .ghost-btn { height: 34px; margin-left: auto; padding: 0 10px; font-size: 13px; }
    .exam-pv header .rate { margin-left: auto; color: var(--good); }
    .exam-pv header .rate.low { color: var(--bad); }
    .exam-pv-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 10px; pointer-events: none; }
    .exam-pv-body .keypad, .exam-pv-body .spk, .exam-pv-body .btns { display: none; }
    .exam-pv footer { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px dashed var(--line); color: var(--good); font-size: 15px; font-weight: 850; }
    .exam-pv footer .ans { color: var(--ink); }
    .exam-pv-card .mix-btns { position: sticky; bottom: 0; justify-content: flex-end; margin: 14px -22px 0; padding: 12px 22px 16px; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); }
    .exam-names-card { width: min(520px, 94vw); text-align: left; }
    .exam-names-card h2 { font-size: 26px; }
    .exam-names-card p { margin: 0 0 8px; color: var(--ink-2); font-weight: 700; line-height: 1.6; word-break: keep-all; }
    .exam-names-card textarea { width: 100%; padding: 12px; border: 2px solid var(--line); border-radius: 14px; font: inherit; font-size: 16px; line-height: 1.5; resize: vertical; }
    .exam-names-card .mix-btns { justify-content: flex-end; margin-top: 12px; }
    .exam-row { grid-template-columns: minmax(56px, 110px) minmax(0, 1fr) 5em 3.2em; }
    .exam-row.done { background: #ecfbf3; }
    .exam-row .ok { min-width: 0; color: var(--ink-2); }
    .exam-row.done .ok { color: var(--good); }
    .exam-row .away { color: var(--coral); font-size: .85em; text-align: right; }
    .exam-end { display: flex; flex-direction: column; gap: 14px; max-width: 1180px; margin: 0 auto; }
    .exam-end-head { text-align: center; }
    .exam-end-head h2 { margin: 0; font-size: calc(var(--s) * 36px); font-weight: 900; }
    .exam-end-head .sub { margin: 4px 0 0; color: var(--ink-2); font-size: 18px; font-weight: 800; }
    .exam-end-head .sub b { color: var(--teal-d); font-size: 1.3em; }
    .exam-end h3 { margin: 0 0 10px; font-size: 20px; font-weight: 900; }
    .exam-rates { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 6px 18px; margin: 0 0 8px; padding: 0; list-style: none; }
    .exam-rates li { display: grid; grid-template-columns: 28px 8.5em minmax(0, 1fr) 3.2em; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; }
    .exam-rates .no { display: grid; place-items: center; height: 26px; border-radius: 8px; background: var(--soft); }
    .exam-rates .sec { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .exam-rates .track { height: 12px; border-radius: 999px; background: #e9eff3; overflow: hidden; }
    .exam-rates .track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1cc6b5, #0ea193); }
    .exam-rates b { text-align: right; font-variant-numeric: tabular-nums; }
    .exam-rates li.low .track i { background: linear-gradient(90deg, #ff8a7a, #e5484d); }
    .exam-rates li.low b, .exam-rates li.low .no { color: var(--bad); }
    .exam-res-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .exam-res-head h3 { margin: 0; }
    .exam-res-head .ghost-btn { height: 40px; }
    .exam-table-wrap { overflow-x: auto; }
    .exam-table { width: 100%; border-collapse: collapse; font-size: 14px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .exam-table th, .exam-table td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    .exam-table th { color: var(--muted); font-size: 12.5px; }
    .exam-table .o { color: var(--good); }
    .exam-table .x { color: var(--bad); font-weight: 900; }
    .exam-table .na { color: #b8c2cc; }
    .exam-table .nm { text-align: left; }
    .bp-nos { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
    .bp-nos button { height: 52px; border-radius: 14px; border: 2px solid transparent; background: var(--soft); font-size: 20px; font-weight: 850; }
    .bp-nos button.on { border-color: #8b5cf0; background: #efeaff; color: #6b3fd6; }
    body.exam-quiet .pscore { display: none; }
    .player-cell.exam-sent .cell-body, .player-cell.exam-sent .btns { pointer-events: none; opacity: .55; }

    @media (max-width: 860px) {
      .bell-lobby, .bell-play { grid-template-columns: minmax(0, 1fr); }
      .bell-side { position: static; }
      .bell-room { height: 40px; padding: 0 10px; font-size: 13px; }
      .bell-room b { font-size: 17px; }
    }
    @media (max-width: 560px) {
      .bp-q .choices.c2.txtc, .bp-q .choices.c4 { grid-template-columns: minmax(0, 1fr); }
      .bell-screen .topbar { grid-template-columns: auto minmax(0, 1fr) auto; }
      .bell-screen .top-actions { grid-column: 1 / -1; justify-content: center; }
    }

    /* ---------- 인쇄 ---------- */
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      html, body { width: auto; height: auto; overflow: visible; background: #fff; }
      body > *:not(#print-root) { display: none !important; }
      #print-root { display: block !important; }
      #print-root .ws-page { box-shadow: none; break-after: page; page-break-after: always; margin: 0; }
      #print-root .ws-page:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>

<body>
  <a class="samnori-home-float" href="https://hanssam622.github.io/ssamnori/" aria-label="쌤노리 홈화면으로 가기">쌤노리 홈</a>

  <section id="start-screen" class="screen">
    <div class="start-wrap">
      <div class="hero-text">
        <span class="hero-badge"><b>4-2</b>6단원 · 평면도형의 이동</span>
        <h1 class="hero-title">도형맨<span class="tdot"></span></h1>
        <p class="hero-sub">점과 도형을 밀고, 뒤집고, 돌려 보며 <br /><strong>모눈 · 점 종이 · 퍼즐 · 무늬</strong>로 직접 움직여 봐요</p>
        <div class="hero-actions">
          <button class="start-btn" type="button" onclick="showScreen('game-select-screen')">시작하기 →</button>
          <span class="hero-note">1~6명이 한 화면에서 함께 겨뤄요</span>
        </div>
        <div class="topic-list" aria-hidden="true">
          <span style="--c:var(--p0)">점의 이동</span>
          <span style="--c:var(--p1)">밀기</span>
          <span style="--c:var(--pm2)">뒤집기</span>
          <span style="--c:var(--pm1)">돌리기</span>
          <span style="--c:var(--teal)">무늬 만들기</span>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="art-card">
          <div id="hero-fig"></div>
          <span class="art-tag" id="hero-tag">처음 모양</span>
        </div>
        <div class="kid-art"></div>
        <span class="bubble b1">밀기 →</span>
        <span class="bubble b2">뒤집기 ⇆</span>
        <span class="bubble b3">돌리기 ↻ 90°</span>
        <span class="bubble b4">무늬 만들기</span>
      </div>
    </div>
  </section>

  <section id="game-select-screen" class="screen hidden">
    <div class="select-wrap">
      <div class="select-head">
        <div class="brand-mini">
          <div class="kid-art"></div>
          <div>
            <h2>도형맨<span class="tdot"></span></h2>
            <p>4학년 2학기 · 6. 평면도형의 이동</p>
          </div>
        </div>
        <div class="head-btns">
          <button class="ghost-btn bell-hl" type="button" onclick="openBellSetup()">🔔 골든벨</button>
          <button class="ghost-btn hl" type="button" onclick="openWorksheet()">🖨 학습지 만들기</button>
          <button class="ghost-btn" type="button" onclick="showScreen('start-screen')">← 처음으로</button>
        </div>
      </div>

      <div class="settings-bar">
        <div class="setting-row">
          <span class="setting-label">참가 인원</span>
          <div class="seg" id="player-seg"></div>
        </div>
        <div class="setting-row">
          <span class="setting-label">제한 시간</span>
          <select id="timer-select" class="select" aria-label="제한 시간">
            <option value="60">1분</option>
            <option value="90" selected>1분 30초</option>
            <option value="180">3분</option>
            <option value="300">5분</option>
            <option value="none">무제한</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-label">읽어 주기</span>
          <button id="voice-toggle" class="toggle-btn on" type="button" onclick="toggleVoice()">🔊 켜짐</button>
        </div>
      </div>

      <p class="cap-note" id="cap-note"></p>
      <nav class="stage-nav" id="stage-nav" aria-label="단계 바로 가기"></nav>
      <div id="stages"></div>
    </div>
  </section>

  <section id="game-screen" class="game-screen hidden">
    <div class="topbar">
      <button class="ghost-btn game-exit" type="button" onclick="exitGame()">← 목록</button>
      <div class="top-title">
        <h1 id="mode-title">도형맨</h1>
        <p id="mode-sub"></p>
      </div>
      <div class="timer" id="timer">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle class="track" cx="30" cy="30" r="25" />
          <circle class="bar" id="timer-bar" cx="30" cy="30" r="25" stroke-dasharray="157.08" stroke-dashoffset="0" />
        </svg>
        <span id="time-left">∞</span>
      </div>
      <div class="top-actions">
        <button class="ghost-btn opt" id="voice-toggle-2" type="button" onclick="toggleVoice()">🔊 소리</button>
        <button class="ghost-btn opt" type="button" onclick="toggleFullscreen()">⛶ 전체화면</button>
        <button class="ghost-btn game-finish" type="button" onclick="finishGame()">🏁 결과</button>
      </div>
    </div>
    <div class="players" id="players"></div>
  </section>

  <section id="bell-screen" class="game-screen bell-screen hidden">
    <div class="topbar">
      <button class="ghost-btn" type="button" onclick="bellQuit()">← 끝내기</button>
      <div class="top-title">
        <h1 id="bell-title">🔔 도형맨 골든벨</h1>
        <p id="bell-sub"></p>
      </div>
      <div class="timer hidden" id="bell-timer">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle class="track" cx="30" cy="30" r="25" />
          <circle class="bar" id="bell-timer-bar" cx="30" cy="30" r="25" stroke-dasharray="157.08" stroke-dashoffset="0" />
        </svg>
        <span id="bell-time-left"></span>
      </div>
      <div class="top-actions">
        <span class="bell-room" id="bell-room"></span>
        <button class="ghost-btn opt" id="voice-toggle-3" type="button" onclick="toggleVoice()">🔊 소리</button>
        <button class="ghost-btn opt" type="button" onclick="toggleFullscreen()">⛶ 전체화면</button>
        <button class="ghost-btn hidden" id="bell-finish" type="button" onclick="bellFinish()">🏁 결과</button>
      </div>
    </div>
    <div class="bell-body" id="bell-body"></div>
  </section>

  <section id="bell-join-screen" class="screen bell-pad hidden">
    <div class="bp-top">
      <span class="bp-me" id="bp-me"></span>
      <span class="bp-room" id="bp-room"></span>
      <span class="bp-dot" id="bp-dot"></span>
      <button class="ghost-btn" type="button" onclick="bellLeave()">나가기</button>
    </div>
    <div class="bp-body" id="bp-body"></div>
  </section>

  <div id="result-overlay" class="overlay hidden"></div>
  <div id="concept-overlay" class="overlay hidden" onclick="if (event.target === this) hideConcept()"></div>
  <div id="mix-overlay" class="overlay hidden" onclick="if (event.target === this) hideMix()"></div>
  <div id="notice-overlay" class="overlay hidden" onclick="if (event.target === this) hideNotice()"></div>
  <div id="ws-overlay" class="overlay hidden" onclick="if (event.target === this) hideWorksheet()"></div>
  <div id="bell-overlay" class="overlay hidden" onclick="if (event.target === this) hideBellSetup()"></div>
  <div id="print-root"></div>

  <script>
    /* =========================================================
       공통 데이터 (그래프맨 · 도형맨이 함께 쓰는 부분)
       ========================================================= */
    const ANIMALS = [
      { emoji: '🐶', name: '강아지' },
      { emoji: '🐱', name: '고양이' },
      { emoji: '🐰', name: '토끼' },
      { emoji: '🦊', name: '여우' },
      { emoji: '🐻', name: '곰' },
      { emoji: '🐼', name: '판다' }
    ];
    const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/></svg>';
    const STAR = '<svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z" fill="#ffb12b"/></svg>';

    const EXAM_TOTAL = 20;
    const EXAM_POINT = 5;

    let playerCount = 2;
    let players = [];
    let scores = [];
    let mode = '';
    let modeOpt = 'all';
    let timerId = null;
    let timeLeft = 0;
    let timeTotal = 0;
    let gameActive = false;
    let voiceOn = true;
    let combos = [];
    let examQueues = [];
    let examIndex = [];
    let examLog = [];
    // 문제를 만드는 순간의 칸 크기 (좁은 칸이면 그림의 글씨를 키운다)
    const QCTX = { narrow: false };
    const overlayTimers = {};
    const nextTimers = {};

    function withOpt(o, fn) {
      const prev = modeOpt;
      modeOpt = o;
      try { return fn(); } finally { modeOpt = prev; }
    }

    /* =========================================================
       작은 도우미
       ========================================================= */
    function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
    function rand(min, max) { return min + Math.random() * (max - min); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    const uid = () => Math.random().toString(36).slice(2, 8);
    const r1 = (v) => Math.round(v * 10) / 10;
    const r2 = (v) => Math.round(v * 1000) / 1000;
    function mkChoices(answer, distractors, n = 4, render = (v) => v) {
      const vals = [answer];
      distractors.forEach((d) => {
        if (vals.length < n && d !== null && d !== undefined && d !== '' && !vals.includes(d)) vals.push(d);
      });
      return shuffle(vals).map((v) => ({ v, html: render(v) }));
    }

    // 두 번에 나눠 고르는 문제(○✕ → 이유)를 한 번에 고르는 문제로 (평가·골든벨용)
    function oxToChoice(q) {
      const list = [{ v: 'yes', html: q.yes }, ...q.reasons.map((r) => ({ v: r.v, html: `아니에요: ${r.html}` }))];
      return {
        kind: 'choice', key: q.key, ans: q.isYes ? 'yes' : q.why, txt: true, cols: 1,
        choices: list, prompt: q.prompt, visual: q.visual, speech: q.speech,
        explain: stripTags(q.isYes ? q.okYes : q.okNo).replace(/^맞아요! /, '')
      };
    }

    // 답은 자연수 또는 소수 두 자리까지. 골든벨·평가 모듈과 같은 이름으로 쓴다.
    function fmt(n) { return String(Math.round(n * 1000) / 1000); }
    function parseNum(s) { return /^\d+(\.\d+)?$/.test(String(s)) ? Math.round(Number(s) * 1000) / 1000 : NaN; }
    function numHtml(str, opts = {}) { return `<span class="num${opts.cls ? ` ${opts.cls}` : ''}">${str}</span>`; }
    function N(n, opts) { return numHtml(fmt(n), opts); }
    const sameNum = (a, b) => Math.abs(a - b) < 1e-9;
    // 한글 단위(개, 번, 명, 일, 만 명)는 붙여 쓰고 cm, kg, °C 같은 단위는 띄어 쓴다
    const withUnit = (v, u) => `${fmt(v)}${u ? (/^[가-힣%]/.test(u) ? u : ` ${u}`) : ''}`;

    const KD = ['영', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
    function sinoInt(n) {
      if (n === 0) return '영';
      let s = '';
      let r = n;
      [['만', 10000], ['천', 1000], ['백', 100], ['십', 10]].forEach(([u, v]) => {
        const d = Math.floor(r / v);
        if (d) { s += (d === 1 ? '' : KD[d]) + u; r %= v; }
      });
      if (r) s += KD[r];
      return s;
    }
    function hasBatchim(text) {
      const code = String(text).charCodeAt(String(text).length - 1);
      if (Number.isNaN(code)) return false;
      if (code >= 0x30 && code <= 0x39) return [0, 1, 3, 6, 7, 8].includes(code - 0x30);
      if (code < 0xac00 || code > 0xd7a3) return false;
      return (code - 0xac00) % 28 !== 0;
    }
    function eunNeun(t) { return hasBatchim(t) ? '은' : '는'; }
    function iGa(t) { return hasBatchim(t) ? '이' : '가'; }
    function eulReul(t) { return hasBatchim(t) ? '을' : '를'; }

    function ieYo(t) { return hasBatchim(t) ? '이에요' : '예요'; }
    function roEuro(t) {
      const code = String(t).charCodeAt(String(t).length - 1);
      if (code >= 0xac00 && code <= 0xd7a3 && (code - 0xac00) % 28 === 8) return '로';
      return hasBatchim(t) ? '으로' : '로';

    function speak(text) {
      if (!voiceOn || !text || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        u.rate = 0.88;
        u.pitch = 1.05;
        const ko = window.speechSynthesis.getVoices().find((v) => (v.lang || '').toLowerCase().startsWith('ko'));
        if (ko) u.voice = ko;
        window.speechSynthesis.speak(u);

    }

    let audioCtx = null;
    function blip(kind) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const notes = kind === 'ok' ? [660, 880] : kind === 'tick' ? [520] : kind === 'fanfare' ? [523, 659, 784, 1047] : kind === 'put' ? [440] : [320, 240];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = kind === 'fanfare' ? 'triangle' : 'sine';
          osc.frequency.value = freq;
          const t0 = audioCtx.currentTime + i * (kind === 'fanfare' ? 0.12 : 0.09);
          const vol = kind === 'tick' || kind === 'put' ? 0.06 : 0.14;
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (kind === 'fanfare' ? 0.3 : 0.16));
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.32);
        });
      } catch (err) { /* 무시 */ }

    /* =========================================================
       모눈 · 도형 · 이동
       점은 모눈 좌표 [x, y] (오른쪽으로 x, 아래로 y가 커진다). 모눈 한 칸 = 1 cm

    // 칸 모음(폴리오미노)의 바깥 테두리를 꼭짓점 목록으로
    function cellsOutline(cells) {
      const key = (x, y) => `${x},${y}`;
      const set = new Set(cells.map(([x, y]) => key(x, y)));
      const next = new Map();
      cells.forEach(([x, y]) => {
        const es = [[[x, y], [x + 1, y], [x, y - 1]], [[x + 1, y], [x + 1, y + 1], [x + 1, y]], [[x + 1, y + 1], [x, y + 1], [x, y + 1]], [[x, y + 1], [x, y], [x - 1, y]]];
        es.forEach(([a, b, nb]) => { if (!set.has(key(nb[0], nb[1]))) next.set(key(a[0], a[1]), b); });
      });
      const start = next.keys().next().value;
      const pts = [];
      let cur = start;
      for (let guard = 0; guard < 400; guard += 1) {
        const [x, y] = cur.split(',').map(Number);
        pts.push([x, y]);
        const b = next.get(cur);
        cur = key(b[0], b[1]);
        if (cur === start) break;
      }
      return corners(pts);
    }
    // 한 직선 위에 있는 점은 꼭짓점에서 뺀다
    function corners(pts) {
      const n = pts.length;
      return pts.filter((b, k) => {
        const a = pts[(k + n - 1) % n];
        const c = pts[(k + 1) % n];
        return Math.abs((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0])) > 1e-9;
      });
    }
    function polyArea(pts) {
      let a = 0;
      pts.forEach((p, k) => { const q = pts[(k + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; });
      return a / 2;
    }
    function segCross(p1, p2, p3, p4) {
      const d = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
      const d1 = d(p3, p4, p1);
      const d2 = d(p3, p4, p2);
      const d3 = d(p1, p2, p3);
      const d4 = d(p1, p2, p4);
      if (((d1 > 1e-9 && d2 < -1e-9) || (d1 < -1e-9 && d2 > 1e-9)) && ((d3 > 1e-9 && d4 < -1e-9) || (d3 < -1e-9 && d4 > 1e-9))) return true;
      const on = (a, b, c) => Math.abs(d(a, b, c)) < 1e-9 && Math.min(a[0], b[0]) - 1e-9 <= c[0] && c[0] <= Math.max(a[0], b[0]) + 1e-9 && Math.min(a[1], b[1]) - 1e-9 <= c[1] && c[1] <= Math.max(a[1], b[1]) + 1e-9;
      return on(p3, p4, p1) || on(p3, p4, p2) || on(p1, p2, p3) || on(p1, p2, p4);
    }

    /* ---------- 이동 ---------- */
    const OPS = {
      flipH: ([x, y]) => [-x, y], // 왼쪽·오른쪽으로 뒤집기
      flipV: ([x, y]) => [x, -y], // 위쪽·아래쪽으로 뒤집기
      cw: ([x, y]) => [-y, x], // 시계 방향으로 90°

    function normPts(pts) {
      const mx = Math.min(...pts.map((p) => p[0]));
      const my = Math.min(...pts.map((p) => p[1]));
      return pts.map(([x, y]) => [r2(x - mx), r2(y - my)]);
    }
    function applyOps(pts, ops) {
      let out = pts.map((p) => [...p]);

    }
    const rotOps = (deg, cw) => Array.from({ length: Math.round(deg / 90) % 4 }, () => (cw ? 'cw' : 'ccw'));
    function shapeKey(pts) {

      const n = P.length;

      for (let i = 0; i < n; i += 1) {
        const a = `${P[i][0]},${P[i][1]}`;
        const b = `${P[(i + 1) % n][0]},${P[(i + 1) % n][1]}`;
        e.push(a < b ? `${a}|${b}` : `${b}|${a}`);

      return e.sort().join(';');
    }

    const POSES_ALL = [[], ['cw'], ['cw', 'cw'], ['ccw'], ['flipH'], ['flipH', 'cw'], ['flipV'], ['flipH', 'ccw']];
    /* ---------- 도형 모음 (모두 대칭이 없는 모양: 8가지 방향이 모두 달라요) ---------- */
    const SHAPE_COLORS = ['#ffd166', '#9fd8ff', '#ff9fb8', '#a8e6b4', '#c9b6ff', '#ffb98a'];

    // 8가지 방향 (뒤집기 × 돌리기)
    const POSES = [[], ['cw'], ['cw', 'cw'], ['ccw'], ['flipH'], ['flipH', 'cw'], ['flipV'], ['flipH', 'ccw']];
    function pickShape(o = {}) {

    // 이동 낱말

    const turnTxt = (deg, cw) => `시계${cw ? '' : ' 반대'} 방향으로 ${deg}°만큼`;
    const turnSay = (deg, cw) => `시계${cw ? '' : ' 반대'} 방향으로 ${deg}도만큼`;

    /* ---------- 모눈 그리기 ---------- */
    // o: cols, rows, cell, shapes[{pts, fill, stroke, dash, op, lab}], points[{x, y, lab, color, big}], arrows, lines, cm, hit
    function gridSvg(o) {
      const cols = o.cols;
      const rows = o.rows;
      const c = o.cell || 30;
      const pad = o.pad == null ? 8 : o.pad;
      const top = o.cm ? 22 : 0;
      const left = o.cm ? 30 : 0;
      const W = cols * c + pad * 2 + left;
      const H = rows * c + pad * 2 + top;
      const X = (x) => r1(pad + left + x * c);
      const Y = (y) => r1(pad + top + y * c);
      const tb = /\bbig\b/.test(o.cls || '') ? 1.45 : 1;
      let s = `<svg class="mg${o.cls ? ` ${o.cls}` : ''}" viewBox="0 0 ${W} ${H}" aria-hidden="true"${o.idx != null ? ` data-p="${o.idx}"` : ''}>`;
      if (!o.noGrid) {
        s += `<rect x="${X(0)}" y="${Y(0)}" width="${cols * c}" height="${rows * c}" fill="${o.bg || '#fff'}" stroke="#39a9cc" stroke-width="1.4"/>`;
        let g = '';
        for (let i = 1; i < cols; i += 1) g += `M${X(i)} ${Y(0)}V${Y(rows)}`;
        for (let j = 1; j < rows; j += 1) g += `M${X(0)} ${Y(j)}H${X(cols)}`;
        s += `<path d="${g}" stroke="#8fd0e3" stroke-width="1" stroke-dasharray="3 3"/>`;
      }
      if (o.cm) {
        s += `<path d="M${X(0)} ${Y(0) - 6}c0-5 ${c} -5 ${c} 0" fill="none" stroke="#39a9cc" stroke-width="1" stroke-dasharray="2 2"/><text x="${r1(X(0.5))}" y="${Y(0) - 10}" text-anchor="middle" class="ml">1 cm</text>`;
        s += `<path d="M${X(0) - 6} ${Y(0)}c-5 0 -5 ${c} 0 ${c}" fill="none" stroke="#39a9cc" stroke-width="1" stroke-dasharray="2 2"/><text x="${X(0) - 13}" y="${r1(Y(0.5) + 4)}" text-anchor="end" class="ml">1 cm</text>`;
      }
      (o.lines || []).forEach((l) => { s += `<path d="M${X(l[0])} ${Y(l[1])}L${X(l[2])} ${Y(l[3])}" stroke="${l[4] || '#e64f95'}" stroke-width="2.2" stroke-dasharray="6 4"/>`; });
      (o.shapes || []).forEach((sh) => {
        const d = `M${sh.pts.map(([x, y]) => `${X(x)} ${Y(y)}`).join('L')}Z`;
        s += `<path d="${d}" fill="${sh.fill || 'none'}" fill-opacity="${sh.op == null ? 1 : sh.op}" stroke="${sh.stroke || '#1d2838'}" stroke-width="${sh.sw || 2.4}" stroke-linejoin="round"${sh.dash ? ' stroke-dasharray="5 4"' : ''}${sh.cls ? ` class="${sh.cls}"` : ''}/>`;
        if (sh.dot) s += `<circle cx="${X(sh.pts[0][0])}" cy="${Y(sh.pts[0][1])}" r="4" fill="#e2443a"/>`;
        if (sh.lab) {
          const cx = sh.pts.reduce((a, p) => a + p[0], 0) / sh.pts.length;
          const cy = Math.min(...sh.pts.map((p) => p[1]));

        }
      });
      (o.arrows || []).forEach(([x1, y1, x2, y2]) => {
        const ang = Math.atan2(Y(y2) - Y(y1), X(x2) - X(x1));
        const ax = X(x2) - Math.cos(ang) * 6;
        const ay = Y(y2) - Math.sin(ang) * 6;
        s += `<path d="M${X(x1)} ${Y(y1)}L${r1(ax)} ${r1(ay)}" stroke="#ff8a3d" stroke-width="2.6" stroke-linecap="round"/><path d="M${r1(ax + Math.cos(ang + 2.5) * 7)} ${r1(ay + Math.sin(ang + 2.5) * 7)}L${r1(X(x2))} ${r1(Y(y2))}L${r1(ax + Math.cos(ang - 2.5) * 7)} ${r1(ay + Math.sin(ang - 2.5) * 7)}" fill="none" stroke="#ff8a3d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
      });

        if (p.lab) s += `<text x="${X(p.x) + (p.lx || 9)}" y="${Y(p.y) + (p.ly || -8)}" class="mlab">${p.lab}</text>`;
        if (p.tag) s += `<g transform="translate(${X(p.x)} ${Y(p.y) - 14 * tb}) scale(${tb})"><rect x="-27" y="-17" width="54" height="17" rx="8" fill="${p.tagBg || '#fde3c4'}"/><text x="0" y="-4.5" text-anchor="middle" class="mtag sm">${p.tag}</text></g>`;
      });
