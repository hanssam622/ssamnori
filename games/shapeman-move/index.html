        <div class="done-card">
          <div class="kid-art"></div>
          <div class="done-score">${scores[p.idx]}점</div>
          <div class="done-sub">${EXAM_TOTAL}문제 중 ${correct}문제를 맞혔어요!<br />친구들이 끝날 때까지 기다려요.</div>
          <div class="done-list">${secs.map((s) => {
            const rs = log.filter((r) => r.sec === s);
            return `<div class="done-row"><span>${s}</span><span>${rs.filter((r) => r.correct).length} / ${rs.length}</span></div>`;
          }).join('')}</div>
        </div>`;
    }

    const BODIES = { choice: choiceBody, keypad: keypadBody, ox: oxBody, ...APP_BODIES };

    /* =========================================================
       정답 처리
       ========================================================= */
    function setMsg(idx, html, state = '') {
      const p = players[idx];
      if (!p) return;
      p.message = html;
      p.state = state;
      const el = document.getElementById(`msg-${idx}`);
      if (el) { el.innerHTML = `<span>${html}</span>`; el.className = `message ${state}`; }
    }

    function queueNext(idx, p, ms) {
      clearTimeout(nextTimers[idx]);
      nextTimers[idx] = setTimeout(() => {
        if (!gameActive || players[idx] !== p) return;
        players[idx] = createPlayer(idx);
        renderCell(idx);
      }, ms);
    }

    function award(idx, msg, speechText) {
      const p = players[idx];
      if (!p || p.locked) return;
      let gain = p.tries === 0 ? 2 : 1;
      if (mode === 'speed') {
        combos[idx] += 1;
        if (combos[idx] >= 3) gain += 1;
      }
      scores[idx] += gain;
      if (BP.race && BP.race.running) { BP.race.correct += 1; bellRaceReport(); }
      p.state = 'ok';
      p.locked = true;
      p.message = `${msg} <b>+${gain}점</b>`;
      renderCell(idx);
      const sc = document.getElementById(`sc-${idx}`);
      if (sc) sc.classList.add('bump');
      showAnswerOverlay(idx, true);
      blip('ok');
      if (speechText) speak(speechText);
      queueNext(idx, p, mode === 'speed' ? 1000 : 1800);
    }

    function miss(idx, msg) {
      const p = players[idx];
      if (!p) return;
      p.tries += 1;
      p.state = 'no';
      p.message = msg;
      if (mode === 'speed') combos[idx] = 0;
      renderCell(idx);
      showAnswerOverlay(idx, false);
      blip('no');
    }

    function resolve(idx, ok, okMsg, noMsg, speechText) {
      if (mode === 'exam') { examAdvance(idx, ok); return; }
      if (ok) award(idx, okMsg, speechText);
      else miss(idx, noMsg);
    }

    function examAdvance(idx, correct) {
      const p = players[idx];
      const q = p.q;
      examLog[idx].push({ sec: q.sec, correct });
      if (correct) scores[idx] += EXAM_POINT;
      examIndex[idx] += 1;
      p.locked = true;
      // 반 전체 평가 중인 태블릿은 맞았는지 알려 주지 않고 칠판에만 보낸다
      if (BP.exam && BP.exam.running) { bellExamAnswered(p, correct); return; }
      p.state = correct ? 'ok' : 'no';
      const ansText = q.ansText || (q.choices ? (q.choices.find((c) => c.v === q.ans) || {}).html : '');
      p.message = correct ? `정답! <b>+${EXAM_POINT}점</b>` : `아쉬워요. 정답: <b>${ansText}</b>`;
      renderCell(idx);
      showAnswerOverlay(idx, correct);
      blip(correct ? 'ok' : 'no');
      clearTimeout(nextTimers[idx]);
      nextTimers[idx] = setTimeout(() => {
        if (players[idx] !== p) return;
        players[idx] = createPlayer(idx);
        renderCell(idx);
        if (examIndex.every((v) => v >= EXAM_TOTAL)) finishGame();
      }, correct ? 1100 : 2400);
    }

    function skipQuestion(idx) {
      if (!gameActive || !players[idx]) return;
      if (mode === 'speed') combos[idx] = 0;
      players[idx] = createPlayer(idx);
      renderCell(idx);
    }

    const CONF_COLORS = ['#ff5b4f', '#12b3a3', '#ffb12b', '#3a7ff2', '#e64f95', '#8b5cf0'];
    function showAnswerOverlay(idx, correct) {
      const ov = document.getElementById(`ov-${idx}`);
      if (!ov) return;
      let conf = '';
      if (correct) {
        conf = `<div class="confetti">${Array.from({ length: 16 }, (_, i) => {
          const ang = (i / 16) * Math.PI * 2 + Math.random() * 0.4;
          const dist = 90 + Math.random() * 80;
          return `<i style="--c:${CONF_COLORS[i % CONF_COLORS.length]};--dx:${Math.round(Math.cos(ang) * dist)}px;--dy:${Math.round(Math.sin(ang) * dist)}px"></i>`;
        }).join('')}</div>`;
      }
      ov.className = `answer-overlay ${correct ? 'correct' : 'wrong'}`;
      ov.innerHTML = `${conf}<div class="answer-mark">${correct ? '○' : '✕'}</div>`;
      clearTimeout(overlayTimers[idx]);
      overlayTimers[idx] = setTimeout(() => {
        const live = document.getElementById(`ov-${idx}`);
        if (!live) return;
        live.className = 'answer-overlay';
        live.innerHTML = '';
      }, correct ? 950 : 800);
    }

    /* ---------- 고르기 ---------- */
    function choose(idx, i) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q) return;
      const q = p.q;
      if (q.kind === 'ox') { oxChoose(idx, i); return; }
      if (p.picked.includes(i)) return;
      p.picked.push(i);
      const ok = q.choices[i].v === q.ans;
      if (mode === 'exam') { examAdvance(idx, ok); return; }
      if (ok) award(idx, `정답! ${q.explain || ''}`, q.okSpeech);
      else miss(idx, q.wrongWhy && q.wrongWhy[q.choices[i].v] ? `아쉬워요. ${q.wrongWhy[q.choices[i].v]}` : `아쉬워요. ${q.hint || '다시 골라 보세요.'}`);
    }
    function oxChoose(idx, i) {
      const p = players[idx];
      const q = p.q;
      if (p.stage === 'ox') {
        if (p.picked.includes(i)) return;
        const saidYes = i === 0;
        if (saidYes && q.isYes) { award(idx, q.okYes, stripTags(q.okYes)); return; }
        if (!saidYes && !q.isYes) {
          p.stage = 'why';
          p.state = 'ok';
          p.message = '맞아요! 그 이유를 골라 보세요.';
          renderCell(idx);
          blip('tick');
          return;
        }
        p.picked.push(i);
        miss(idx, saidYes ? q.hintYes : q.hintNo);
        return;
      }
      if (p.pickedWhy.includes(i)) return;
      if (q.reasons[i].v === q.why) { award(idx, q.okNo, stripTags(q.okNo)); return; }
      p.pickedWhy.push(i);
      miss(idx, '다시 골라 보세요. 그림을 꼼꼼히 살펴봐요.');
    }

    /* ---------- 키패드 ---------- */
    function kp(idx, key) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q || p.q.kind !== 'keypad') return;
      if (key === 'del') p.input = p.input.slice(0, -1);
      else if (key === '.') {
        if (!p.q.dot || p.input.includes('.')) return;
        p.input = `${p.input || '0'}.`;
      } else if (/^[0-9]$/.test(key)) {
        if (p.input.replace('.', '').length >= 6) return;
        if (p.input.includes('.') && p.input.split('.')[1].length >= 2) return;
        p.input = p.input === '0' ? key : p.input + key;
      } else return;
      p.inputBad = false;
      const el = document.getElementById(`ans-${idx}`);
      if (el) el.outerHTML = ansBoxHtml(p);
    }
    function submitAns(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q) return;
      const q = p.q;
      if (!p.input) { setMsg(idx, '답을 써 주세요.', 'hint'); return; }
      const ok = sameNum(parseNum(p.input), q.ans);
      p.inputBad = !ok;
      resolve(idx, ok, `정답! ${q.explain || ''}`, `다시 생각해 봐요.${q.hint ? ` ${q.hint}` : ''}`, q.okSpeech || `${fmt(q.ans)}${UNIT_SAY[q.unit] || ''}`);
    }

    const livePlayer = (idx, kind) => {
      const p = players[idx];
      return gameActive && p && !p.locked && p.q && p.q.kind === kind ? p : null;
    };

    /* ---------- 점 이동하기 ---------- */
    function ptTap(idx, x, y) {
      const p = livePlayer(idx, 'ptmove');
      if (!p) return;
      const q = p.q;
      p.tap = [x, y];
      const who = q.robot ? '로니가 있던 곳' : '점 ㄱ';
      if (x === q.target[0] && y === q.target[1]) {
        p.state = 'ok';
        award(idx, `정답! ${moveTxt(q.moves)} 이동한 곳이에요.`, '정답이에요');
        return;
      }
      if (x === q.start[0] && y === q.start[1]) { p.tap = null; setMsg(idx, `처음 자리예요. ${moveTxt(q.moves)} 이동한 곳을 눌러요.`, 'hint'); return; }
      miss(idx, `지금 누른 곳은 ${who}에서 ${offTxt([x - q.start[0], y - q.start[1]])} 간 곳이에요. 한 칸씩 다시 세어 보세요.`);
    }

    /* ---------- 도형 밀기 ---------- */
    function slideMove(idx, d) {
      const p = livePlayer(idx, 'slide');
      if (!p) return;
      const q = p.q;
      const off = [p.off[0] + DIR_V[d][0], p.off[1] + DIR_V[d][1]];
      const moved = shiftPts(q.pts, off[0], off[1]);
      if (moved.some(([x, y]) => x < 0 || y < 0 || x > q.cols || y > q.rows)) { setMsg(idx, '모눈 밖으로는 밀 수 없어요.', 'hint'); return; }
      p.off = off;
      blip('tick');
      if (p.state) { p.state = ''; p.message = START_MSG.slide; }
      renderCell(idx);
    }
    function slideReset(idx) {
      const p = livePlayer(idx, 'slide');
      if (!p) return;
      p.off = [0, 0];
      renderCell(idx);
    }
    function slideCheck(idx) {
      const p = livePlayer(idx, 'slide');
      if (!p) return;
      const q = p.q;
      if (!p.off[0] && !p.off[1]) { setMsg(idx, '화살표 버튼을 눌러 도형을 밀어 보세요.', 'hint'); return; }
      if (p.off[0] === q.off[0] && p.off[1] === q.off[1]) { award(idx, `정답! ${moveTxt(q.moves)} 밀었어요. 모양과 방향은 그대로예요.`, '정답이에요'); return; }
      miss(idx, `지금은 ${offTxt(p.off)} 밀었어요. 몇 칸 밀어야 하는지 다시 세어 보세요.`);
    }

    /* ---------- 도형 그리기 ---------- */
    function drawTap(idx, k) {
      const p = livePlayer(idx, 'draw');
      if (!p || p.closed) return;
      const D = drawDots(p.q);
      const path = p.path;
      const say = (m) => setMsg(idx, m, 'hint');
      if (!path.length) { path.push(k); blip('tick'); renderCell(idx); return; }
      const last = path[path.length - 1];
      if (k === last) { path.pop(); renderCell(idx); return; }
      if (k === path[0]) {
        if (path.length < 3) { say('점을 3개 이상 이어야 도형을 닫을 수 있어요.'); return; }
        for (let i = 1; i < path.length - 2; i += 1) if (segCross(D[path[i]], D[path[i + 1]], D[last], D[k])) { say('선이 서로 엇갈리면 안 돼요. 되돌리기를 눌러 고쳐 보세요.'); return; }
        p.closed = true;
        drawCheck(idx);
        return;
      }
      if (path.includes(k)) { say('이미 이은 점이에요. 다른 점을 골라요.'); return; }
      for (let i = 0; i < path.length - 2; i += 1) if (segCross(D[path[i]], D[path[i + 1]], D[last], D[k])) { say('선이 서로 엇갈리거나 겹치면 안 돼요.'); return; }
      path.push(k);
      blip('tick');
      if (p.state === 'hint' || p.state === 'no') { p.state = ''; p.message = START_MSG.draw; }
      renderCell(idx);
    }
    function drawUndo(idx) {
      const p = livePlayer(idx, 'draw');
      if (!p) return;
      p.closed = false;
      p.path.pop();
      renderCell(idx);
    }
    function drawDone(idx) {
      const p = livePlayer(idx, 'draw');
      if (!p) return;
      if (p.path.length < 3) { setMsg(idx, '점을 3개 이상 이어 보세요.', 'hint'); return; }
      drawTap(idx, p.path[0]);
    }
    function drawCheck(idx) {
      const p = players[idx];
      const q = p.q;
      const D = drawDots(q);
      const cs = corners(p.path.map((k) => D[k]));
      const fail = (m) => {
        p.closed = false;
        if (p.tries >= 1) {
          const [w, h] = sizeOf(q.targetPts);
          p.showAns = shiftPts(q.targetPts, Math.floor((q.cols - w) / 2), Math.floor((q.rows - h) / 2));
          m += ' 초록 점선을 따라 그려 보세요.';
        }
        miss(idx, m);
      };
      if (cs.length < 3 || Math.abs(polyArea(cs)) < 1e-9) { fail('선분으로 둘러싸인 도형을 그려요.'); return; }
      const key = canon(cs);
      if (key === q.target) { award(idx, '정답! 바르게 그렸어요.', '정답이에요'); return; }
      if (key === canon(q.src)) { fail('처음 도형과 똑같이 그렸어요. 움직이면 도형의 방향이 바뀌어요.'); return; }
      if (POSES.some((ops) => canon(applyOps(q.src, ops)) === key)) { fail('모양은 같지만 방향이 달라요. 어느 쪽이 어디로 가는지 다시 생각해 보세요.'); return; }
      fail('모양이 조금 달라요. 꼭짓점의 위치를 한 칸씩 세어 보세요.');
    }

    /* ---------- 퍼즐 · 모양 맞추기 ---------- */
    const OPS_TXT = (ops) => {
      const k = ops.join(',');
      return {
        cw: '시계 방향으로 90°만큼 돌렸어요', 'cw,cw': '시계 방향으로 180°만큼 돌렸어요', ccw: '시계 반대 방향으로 90°만큼 돌렸어요',
        flipH: '오른쪽으로 뒤집었어요', flipV: '아래쪽으로 뒤집었어요',
        'flipH,cw': '오른쪽으로 뒤집고, 시계 방향으로 90°만큼 돌렸어요', 'flipH,ccw': '오른쪽으로 뒤집고, 시계 반대 방향으로 90°만큼 돌렸어요'
      }[k] || '';
    };
    function poseDo(idx, op) {
      const p = livePlayer(idx, 'pose');
      if (!p) return;
      const q = p.q;
      p.ops.push(op);
      blip('tick');
      if (canon(applyOps(q.src, p.ops)) === q.target) {
        if (q.puzzle) {
          const k = ((p.ops.filter((o) => o === 'cw').length - p.ops.filter((o) => o === 'ccw').length) % 4 + 4) % 4;
          award(idx, `꼭 맞아요! 시계 방향으로 ${k * 90}°만큼 돌린 것과 같아요${k === 2 ? '' : ` (시계 반대 방향으로 ${(4 - k) * 90}°)`}.`, `시계 방향으로 ${k * 90}도만큼 돌렸어요`);
        } else {
          const best = POSES.find((ops) => canon(applyOps(q.src, ops)) === q.target) || [];
          award(idx, `똑같아요! 처음 조각을 ${OPS_TXT(best) || '움직였어요'}.`, '똑같이 만들었어요');
        }
        return;
      }
      if (p.state) { p.state = ''; p.message = START_MSG.pose; }
      renderCell(idx);
    }
    function poseReset(idx) {
      const p = livePlayer(idx, 'pose');
      if (!p) return;
      p.ops = [];
      renderCell(idx);
    }

    /* ---------- 무늬 완성하기 ---------- */
    function tilesSel(idx, i) {
      const p = livePlayer(idx, 'tiles');
      if (!p) return;
      p.sel = i;
      blip('tick');
      renderCell(idx);
    }
    function tilesPick(idx, k) {
      const p = livePlayer(idx, 'tiles');
      if (!p) return;
      const q = p.q;
      if (p.sel == null) { setMsg(idx, '먼저 채울 빈칸을 눌러요.', 'hint'); return; }
      p.fill[p.sel] = q.palette[k];
      p.bad = p.bad.filter((i) => i !== p.sel);
      blip('put');
      const nextEmpty = q.blanks.find((i) => !p.fill[i]);
      p.sel = nextEmpty == null ? p.sel : nextEmpty;
      if (p.state) { p.state = ''; p.message = START_MSG.tiles; }
      renderCell(idx);
    }
    function tilesCheck(idx) {
      const p = livePlayer(idx, 'tiles');
      if (!p) return;
      const q = p.q;
      const left = q.blanks.filter((i) => !p.fill[i]).length;
      if (left) { setMsg(idx, `빈칸이 ${left}개 남았어요.`, 'hint'); return; }
      const bad = q.blanks.filter((i) => !poseEq(p.fill[i], q.grid[Math.floor(i / 4)][i % 4]));
      if (!bad.length) { award(idx, `정답! ${q.txt}`, '무늬를 완성했어요'); return; }
      p.bad = bad;
      p.sel = bad[0];
      miss(idx, `빨간 칸의 모양이 규칙과 달라요. 옆의 모양과 비교해 보세요.`);
    }

    /* ---------- 자동차 탈출 ---------- */
    function carPick(idx, i) {
      const p = livePlayer(idx, 'car');
      if (!p) return;
      p.sel = i;
      blip('tick');
      if (p.state) { p.state = ''; }
      p.message = `${p.cars[i].name} 자동차를 골랐어요. ${p.cars[i].h ? '왼쪽·오른쪽' : '위쪽·아래쪽'}으로 밀 수 있어요.`;
      renderCell(idx);
    }
    function carMove(idx, d) {
      const p = livePlayer(idx, 'car');
      if (!p) return;
      if (p.sel == null) { setMsg(idx, '움직일 자동차를 먼저 눌러 골라요.', 'hint'); return; }
      const c = p.cars[p.sel];
      if (c.h !== (d === 'L' || d === 'R')) { setMsg(idx, `${c.name} 자동차는 ${c.h ? '왼쪽·오른쪽' : '위쪽·아래쪽'}으로만 밀 수 있어요.`, 'hint'); return; }
      const [dx, dy] = DIR_V[d];
      if (!carFree(p.cars, p.sel, dx, dy)) { setMsg(idx, '막혀서 더 밀 수 없어요. 다른 자동차를 먼저 밀어 보세요.', 'hint'); return; }
      c.x += dx;
      c.y += dy;
      p.carMoves += 1;
      const last = p.log[p.log.length - 1];
      if (last && last.i === p.sel && last.d === d) last.n += 1;
      else p.log.push({ i: p.sel, d, n: 1 });
      blip('tick');
      if (p.cars[0].x + p.cars[0].len === CAR_N) {
        const story = p.log.filter((l) => l.i !== 0).slice(0, 4).map((l) => `${p.cars[l.i].name} 자동차를 ${DIR[l.d]}으로 ${l.n}칸`).join(', ');
        award(idx, `탈출 성공! ${story ? `${story} 밀었어요.` : ''} (${p.carMoves}번)`, '탈출 성공');
        return;
      }
      p.state = '';
      p.message = `${c.name} 자동차를 ${DIR[d]}으로 밀었어요.`;
      renderCell(idx);
    }
    function carReset(idx) {
      const p = livePlayer(idx, 'car');
      if (!p) return;
      APP_SETUP.car(p, p.q);
      p.message = START_MSG.car;
      renderCell(idx);
    }

    // 모눈·점 종이·무늬·자동차는 손가락이나 마우스로 누른다
    document.addEventListener('pointerdown', (e) => {
      const t = e.target;
      if (!t || !t.closest) return;
      const pt = t.closest('[data-pt]');
      if (pt) { e.preventDefault(); const [x, y] = pt.dataset.pt.split(',').map(Number); ptTap(Number(pt.dataset.p), x, y); return; }
      const gi = t.closest('[data-gi]');
      if (gi) { e.preventDefault(); drawTap(Number(gi.dataset.p), Number(gi.dataset.gi)); return; }
      const tc = t.closest('[data-tc]');
      if (tc) { e.preventDefault(); tilesSel(Number(tc.dataset.p), Number(tc.dataset.tc)); return; }
      const car = t.closest('[data-car]');
      if (car) { e.preventDefault(); carPick(Number(car.dataset.p), Number(car.dataset.car)); }
    });

    // 혼자 할 때: 화살표 키로 밀기
    function appKey(e, p) {
      const d = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D' }[e.key];
      if (!d) return false;
      if (p.q.kind === 'slide') { slideMove(0, d); return true; }
      if (p.q.kind === 'car') { carMove(0, d); return true; }
      return false;
    }

    /* =========================================================
       도형맨 학습지 종류
       ========================================================= */
    const WS_TYPES = [
      { id: 'pt', st: 1, title: '점의 이동', guide: '모눈 한 칸은 1 cm예요. 점을 이동한 곳에 점을 찍어 보세요.', per: 4, cols: 2 },
      { id: 'slide', st: 2, title: '도형 밀기', guide: '도형을 밀었을 때의 도형을 모눈에 그려 보세요.', per: 4, cols: 2 },
      { id: 'flip', st: 3, title: '도형 뒤집기', guide: '도형을 뒤집었을 때의 도형을 오른쪽 모눈에 그려 보세요.', per: 4, cols: 2 },
      { id: 'turn', st: 4, title: '도형 돌리기', guide: '도형을 돌렸을 때의 도형을 오른쪽 모눈에 그려 보세요.', per: 4, cols: 2 },
      { id: 'pattern', st: 5, title: '무늬를 만든 방법', guide: '무늬를 어떤 방법으로 만들었는지 써 보세요.', per: 4, cols: 1 },
      { id: 'desc', st: 6, title: '이동 방법 설명하기', guide: '도형을 어떻게 이동했는지 써 보세요. 방법이 여러 가지라면 한 가지만 써도 돼요.', per: 6, cols: 2 }
    ];
    function wsItem(T) {
      switch (T.id) {
        case 'pt': {
          const q = withOpt(Math.random() < 0.5 ? 'one' : 'two', makePtMove);
          if (q.kind !== 'ptmove') return null;
          return { key: q.key, q };
        }
        case 'slide': {
          const q = makeSlide();
          if (q.kind !== 'slide') return null;
          return { key: q.key, q };
        }
        case 'flip': return { ...makeDraw('flip') };
        case 'turn': return { ...makeDraw('turn') };
        case 'pattern': {
          const m = randInt(0, MOTIFS.length - 1);
          const base = pick([[0, 0], [0, 1], [1, 0]]);
          const k = pick(Object.keys(PAT_METHODS));
          return { key: `${m}${k}${base}`, m, base, k };
        }
        case 'desc': {
          const S = pickShape();
          const [txt, ops] = pick([...FLIP_POOL().slice(0, 2), ...TURN_POOL().slice(0, 6)]);
          return { key: `${S.id}${ops.join('')}`, S, ops, txt };
        }
        default: return null;
      }
    }
    function wsItemHtml(T, it, ans) {
      const line = (html) => `<div class="ws-line">${html}</div>`;
      const red = '#e2443a';
      switch (T.id) {
        case 'pt': {
          const q = it.q;
          const pts = [{ x: q.start[0], y: q.start[1], lab: 'ㄱ' }];
          if (ans) pts.push({ x: q.target[0], y: q.target[1], color: red, lab: 'ㄱ' });
          return `<div class="ws-q">점 ㄱ을 <b>${moveTxt(q.moves)}</b> 이동하세요.</div>${gridSvg({ cols: q.cols, rows: q.rows, cell: 22, cm: true, points: pts, cls: 'ws-m' })}`;
        }
        case 'slide': {
          const q = it.q;
          const shapes = [{ pts: q.pts, fill: '#f1f4f7', sw: 1.8 }];
          if (ans) shapes.push({ pts: shiftPts(q.pts, q.off[0], q.off[1]), fill: 'none', stroke: red, sw: 2 });
          return `<div class="ws-q">도형을 <b>${moveTxt(q.moves)}</b> 미세요.</div>${gridSvg({ cols: q.cols, rows: q.rows, cell: 20, shapes, cls: 'ws-m' })}`;
        }
        case 'flip':
        case 'turn': {
          const [w, h] = sizeOf(it.src);
          const n = Math.max(w, h) + 2;
          const src = shiftPts(it.src, Math.floor((n - w) / 2), Math.floor((n - h) / 2));
          const [tw, th] = sizeOf(it.targetPts);
          const tg = shiftPts(it.targetPts, Math.floor((n - tw) / 2), Math.floor((n - th) / 2));
          return `<div class="ws-q">${it.prompt.replace('의 도형을 그려 보세요.', '')}</div><div class="ws-pair">${gridSvg({ cols: n, rows: n, cell: 20, shapes: [{ pts: src, fill: '#f1f4f7', sw: 1.8 }], cls: 'ws-m sq' })}<span class="ws-op">${it.ic}</span>${gridSvg({ cols: n, rows: n, cell: 20, shapes: ans ? [{ pts: tg, fill: 'none', stroke: red, sw: 2 }] : [], cls: 'ws-m sq' })}</div>`;
        }
        case 'pattern':
          return `<div class="ws-patrow">${tileSvg(it.m, it.base, { cls: 'ws-tile' })}${patternSvg(it.m, PAT_METHODS[it.k].grid(it.base), { cls: 'ws-pat' })}</div>${line(`<span class="wbox wide2">${ans ? `<span>모양을 ${PAT_METHODS[it.k].txt}</span>` : ''}</span>`)}`;
        case 'desc':
          return `${beforeAfter(it.S.pts, applyOps(it.S.pts, it.ops), { f1: '#f1f4f7' })}${line(`<span class="wbox wide2">${ans ? `<span>${it.txt}</span>` : ''}</span>`)}`;
        default: return '';
      }
    }

    /* =========================================================
       학습지 만들기 (공통 틀)
       WS_TYPES · wsItem · wsItemHtml 은 앱마다 따로 정한다.
       ========================================================= */
    const ws = { type: WS_TYPES[0].id, pages: 1, key: true, data: [] };
    function wsType() { return WS_TYPES.find((t) => t.id === ws.type) || WS_TYPES[0]; }
    function wsGen() {
      const T = wsType();
      const pages = [];
      for (let pg = 0; pg < ws.pages; pg += 1) {
        const items = [];
        const seen = new Set();
        let guard = 0;
        while (items.length < T.per && guard < T.per * 20) {
          const q = wsItem(T);
          guard += 1;
          if (!q) continue;
          if (seen.has(q.key) && guard < T.per * 12) continue;
          seen.add(q.key);
          items.push(q);
        }
        pages.push({ items });
      }
      ws.data = pages;
    }
    const wsBox = (html, cls = '', ans = false) => `<span class="wbox${cls ? ` ${cls}` : ''}">${ans ? `<span>${html}</span>` : ''}</span>`;
    function wsPageHtml(T, page, pi, total, ans) {
      const count = page.items.length;
      const rows = Math.ceil(count / T.cols);
      const body = `<div class="ws-grid" style="grid-template-columns:repeat(${T.cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr))">${page.items.map((q, i) => `<div class="ws-item ws-${T.id}"><span class="ws-no">${i + 1}</span>${wsItemHtml(T, q, ans)}</div>`).join('')}</div>`;
      return `<div class="ws-page">
        ${ans ? '<span class="ws-key">정답</span>' : ''}
        <div class="ws-head">
          <div class="tt"><div class="kid-art"></div><div><span class="lv">${APP_NAME} 학습지 · ${T.st}단계 ${STAGES[T.st - 1].title}</span><h1>${T.title}</h1></div></div>
          <div class="who"><span>날짜 <u class="s"></u>월 <u class="s"></u>일</span><span>이름 <u></u></span><span>맞힌 수 <u class="s"></u>/ ${T.marks ? T.marks(page) : count}</span></div>
        </div>
        <p class="ws-guide">${T.guide}</p>
        ${body}
        <div class="ws-foot"><span>${APP_NAME} · 쌤노리 · 문제는 만들 때마다 새로 바뀌어요</span><span>${pi + 1} / ${total}</span></div>
      </div>`;
    }
    function wsAllPagesHtml() {
      const T = wsType();
      const total = ws.data.length * (ws.key ? 2 : 1);
      const qs = ws.data.map((pg, i) => wsPageHtml(T, pg, i, total, false));
      const ks = ws.key ? ws.data.map((pg, i) => wsPageHtml(T, pg, ws.data.length + i, total, true)) : [];
      return [...qs, ...ks].join('');
    }
    function openWorksheet(stageNo) {
      if (stageNo) ws.type = WS_TYPES.find((t) => t.st === stageNo).id;
      wsGen();
      document.getElementById('ws-overlay').innerHTML = '';
      document.getElementById('ws-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
      renderWs();
    }
    function hideWorksheet() {
      document.getElementById('ws-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }
    function wsSet(k, v) {
      if (k === 'type') ws.type = v;
      if (k === 'pages') ws.pages = v;
      if (k === 'key') ws.key = v;
      if (k !== 'key') wsGen();
      renderWs();
    }
    function renderWs() {
      const T = wsType();
      const groups = STAGES.map((s) => {
        const list = WS_TYPES.filter((t) => t.st === s.no);
        return list.length ? `<optgroup label="${s.no}단계 · ${s.title}">${list.map((t) => `<option value="${t.id}"${t.id === T.id ? ' selected' : ''}>${t.title}</option>`).join('')}</optgroup>` : '';
      }).join('');
      const box = document.getElementById('ws-overlay');
      const again = !!box.firstElementChild;
      const mainScroll = again ? box.querySelector('.ws-main').scrollTop : 0;
      const sideScroll = again ? box.querySelector('.ws-side').scrollTop : 0;
      box.innerHTML = `
        <div class="result-card ws-card"${again ? ' style="animation:none"' : ''}>
          <div class="ws-side">
            <h2>🖨 학습지 만들기</h2>
            <p>누를 때마다 새 문제로 만들어져요. 앱에서 익힌 것을 종이로 한 번 더 연습해요.</p>
            <div class="ws-field"><label for="ws-type">학습지 종류</label><select id="ws-type" class="select" onchange="wsSet('type', this.value)">${groups}</select></div>
            <div class="ws-field"><span class="lab">장 수</span><div class="seg">${[1, 2, 3, 5].map((n) => `<button type="button" class="${ws.pages === n ? 'on' : ''}" onclick="wsSet('pages', ${n})">${n}장</button>`).join('')}</div></div>
            <div class="ws-field"><label class="ws-check"><input type="checkbox" ${ws.key ? 'checked' : ''} onchange="wsSet('key', this.checked)" /> 정답지도 함께 뽑기</label></div>
            <div class="ws-actions">
              <button class="btn-main" type="button" onclick="wsPrint()">🖨 인쇄하기</button>
              <button class="ghost-btn" type="button" onclick="wsSet('regen')">🔄 새 문제로 바꾸기</button>
              <button class="ghost-btn" type="button" onclick="hideWorksheet()">닫기</button>
            </div>
          </div>
          <div class="ws-main">
            <div class="ws-pages" id="ws-pages">${wsAllPagesHtml()}</div>
          </div>
        </div>`;
      fitWs();
      box.querySelector('.ws-main').scrollTop = mainScroll;
      box.querySelector('.ws-side').scrollTop = sideScroll;
    }
    function fitWs() {
      const main = document.querySelector('#ws-overlay .ws-main');
      const pages = document.getElementById('ws-pages');
      if (!main || !pages) return;
      const k = Math.min(1, (main.clientWidth - 28) / 720);
      pages.style.zoom = String(Math.max(0.3, k));
    }
    function wsPrint() {
      document.getElementById('print-root').innerHTML = wsAllPagesHtml();
      setTimeout(() => window.print(), 60);
    }
    window.addEventListener('afterprint', () => { document.getElementById('print-root').innerHTML = ''; });
    window.addEventListener('resize', fitWs);

    /* =========================================================
       골든벨
       칠판(선생님)이 문제를 내고, 반 친구들이 각자 태블릿으로 같은 문제를 한꺼번에 풀어요.
       방 서버는 Cloudflare Workers(bell-server 폴더)예요. 칠판이 문제·채점·점수를 모두 쥐고,
       서버는 학생 명단을 관리하고 말을 전해 주기만 해요. 학생 태블릿은 이 파일을 ?bell=방번호 로 열어요.
       ========================================================= */
    const BELL_SERVER_URL = 'https://ssamnori-bell.thinkchain-hansang.workers.dev';
    // 선생님 컴퓨터의 파일(file://)로 열었을 때 학생 QR이 가리킬 도형맨 주소
    const BELL_PAGE_URL = 'https://hanssam622.github.io/ssamnori/games/shapemoveman/index.html';
    const PAGE_PARAMS = new URLSearchParams(location.search);
    // 내 컴퓨터에서 서버를 시험할 때만 ?bellServer=http://localhost:8787 처럼 바꿀 수 있다
    const BELL_LOCAL = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(PAGE_PARAMS.get('bellServer') || '') ? PAGE_PARAMS.get('bellServer') : '';
    const BELL_SERVER = BELL_LOCAL || BELL_SERVER_URL;
    const BELL_CFG_KEY = 'shapemoveman-bell-v1';
    const BELL_ME_KEY = 'shapemoveman-bell-me';
    const BELL_MAX_POINTS = 1000;
    const BELL_LEADERS = 5;
    const BELL_EXTEND = 10;
    // 태블릿에서 0초 직전에 누른 답이 칠판에 닿을 때까지 조금 더 기다린다
    const BELL_GRACE_MS = 600;
    const BELL_ANIMALS = [
      ['dog', '🐶'], ['cat', '🐱'], ['rabbit', '🐰'], ['fox', '🦊'], ['bear', '🐻'], ['panda', '🐼'], ['koala', '🐨'],
      ['tiger', '🐯'], ['lion', '🦁'], ['cow', '🐮'], ['pig', '🐷'], ['frog', '🐸'], ['monkey', '🐵'], ['chick', '🐤'],
      ['penguin', '🐧'], ['owl', '🦉'], ['unicorn', '🦄'], ['octopus', '🐙'], ['whale', '🐳'], ['dino', '🦖']
    ];
    const bellEmoji = (id) => (BELL_ANIMALS.find(([k]) => k === id) || BELL_ANIMALS[0])[1];
    const bellWs = () => BELL_SERVER.replace(/^http/, 'ws');
    function bellEsc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // 골든벨에서 낼 수 있는 유형: 태블릿에서 한 번 눌러 답하는 것만 낸다.
    // 그래프·모눈에 직접 그리거나 옮기는 게임은 빼고, ○✕ 뒤에 이유를 고르는 문제는 한 번에 고르는 모양으로 바꾼다.
    const BELL_SKIP = new Set(['ptMove', 'slide', 'car', 'flipDraw', 'turnDraw', 'puzzle', 'mMake', 'xMatch']);
    const BELL_LABEL = {};
    const BELL_LESSONS = LESSONS.map((l) => ({ ...l, items: l.items.filter((id) => !BELL_SKIP.has(id)) })).filter((l) => l.items.length);
    const BELL_IDS = BELL_LESSONS.flatMap((l) => l.items);
    const BELL_COUNTS = [5, 10, 15, 20];
    const BELL_SECONDS = [10, 20, 30, 60];
    const BELL_AUTOS = [0, 5, 10];
    // 시간 대결: 태블릿마다 기존 도형맨 게임을 돌리므로 직접 그리는 게임까지 모든 유형을 낼 수 있다.
    const BELL_RACES = [60, 90, 180, 300];
    const RACE_IDS = Object.keys(MIX_ITEMS);
    const bellTimeText = (sec) => (sec % 60 ? `${Math.floor(sec / 60) ? `${Math.floor(sec / 60)}분 ` : ''}${sec % 60}초` : `${sec / 60}분`);

    // 단원 평가: 제한 시간(분, 0은 무제한)과 끝난 뒤 학생 태블릿에 점수를 보여 줄지
    const EXAM_MINS = [10, 15, 20, 30, 40, 0];
    const BELL_KINDS = ['bell', 'race', 'exam'];

    let bellCfg = { kind: 'bell', sel: [...BELL_IDS], count: 10, seconds: 20, auto: 0, race: 180, raceSel: [...RACE_IDS], examMin: 20, examShow: true };
    try {
      const saved = JSON.parse(localStorage.getItem(BELL_CFG_KEY) || 'null');
      if (saved && Array.isArray(saved.sel)) {
        bellCfg = {
          kind: BELL_KINDS.includes(saved.kind) ? saved.kind : 'bell',
          sel: saved.sel.filter((id) => BELL_IDS.includes(id)),
          count: BELL_COUNTS.includes(saved.count) ? saved.count : 10,
          seconds: BELL_SECONDS.includes(saved.seconds) ? saved.seconds : 20,
          auto: BELL_AUTOS.includes(saved.auto) ? saved.auto : 0,
          race: BELL_RACES.includes(saved.race) ? saved.race : 180,
          raceSel: Array.isArray(saved.raceSel) ? saved.raceSel.filter((id) => RACE_IDS.includes(id)) : [...RACE_IDS],
          examMin: EXAM_MINS.includes(saved.examMin) ? saved.examMin : 20,
          examShow: saved.examShow !== false
        };
      }
    } catch (err) { /* 저장소를 쓸 수 없으면 기본 설정으로 한다 */ }
    // 지금 고른 게임 방식의 유형 목록
    const bellSelKey = () => (bellCfg.kind === 'race' ? 'raceSel' : 'sel');
    const bellLessons = () => (bellCfg.kind === 'race' ? LESSONS : BELL_LESSONS);
    const bellItemLabel = (id) => (bellCfg.kind === 'race' ? MIX_ITEMS[id].label : BELL_LABEL[id] || MIX_ITEMS[id].label);
    function saveBellCfg() {
      try { localStorage.setItem(BELL_CFG_KEY, JSON.stringify(bellCfg)); } catch (err) { /* 무시 */ }
    }

    /* ---------- 방 연결 (칠판과 태블릿이 함께 쓴다) ---------- */
    // 학교 와이파이에서 조용히 끊기거나 태블릿이 잠들었다 깨어나도 저절로 다시 붙는다.
    class BellSocket {
      constructor(url, handlers) {
        this.url = url;
        this.h = handlers;
        this.queue = [];
        this.retry = 0;
        this.stopped = false;
        this.fatal = false;
        this.lastHeard = 0;
        this.probe = this.probe.bind(this);
        document.addEventListener('visibilitychange', this.probe);
        window.addEventListener('online', this.probe);
        // 만든 쪽이 이 소켓을 변수에 담은 뒤에 연결을 시작한다
        setTimeout(() => this.connect(), 0);
      }
      connect() {
        if (this.stopped || this.fatal) return;
        this.h.status('connecting');
        let ws;
        try { ws = new WebSocket(this.url()); } catch (err) { this.later(); return; }
        this.ws = ws;
        ws.onopen = () => {
          if (this.ws !== ws) return;
          this.lastHeard = Date.now();
          clearTimeout(this.stable);
          this.stable = setTimeout(() => { this.retry = 0; }, 30000);
          while (this.queue.length) ws.send(this.queue.shift());
          clearInterval(this.pinger);
          this.pinger = setInterval(() => this.check(), 10000);
          this.h.status('open');
        };
        ws.onmessage = (e) => {
          if (this.ws !== ws) return;
          this.lastHeard = Date.now();
          let m;
          try { m = JSON.parse(e.data); } catch (err) { return; }
          if (m.t === 'pong') return;
          if (m.t === 'closed' || (m.t === 'error' && ['kicked', 'closed', 'not-found', 'full'].includes(m.code))) this.fatal = true;
          this.h.message(m);
        };
        ws.onclose = () => {
          if (this.ws !== ws) return;
          clearInterval(this.pinger);
          if (this.stopped || this.fatal) { this.h.status('closed'); return; }
          this.later();
        };
        ws.onerror = () => ws.close();
      }
      later() {
        this.h.status('connecting');
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.connect(), Math.min(10000, 500 * 2 ** Math.min(this.retry++, 5)));
      }
      // 25초 동안 아무 말도 못 받았으면 끊긴 것으로 보고 다시 붙는다. 핑에는 Cloudflare가 대신 답한다.
      check() {
        if (document.visibilityState === 'hidden' || !this.ws || this.ws.readyState !== 1) return;
        if (Date.now() - this.lastHeard > 25000) this.restart();
        else this.ws.send('{"t":"ping"}');
      }
      // 화면이 다시 켜지거나 와이파이가 돌아오면 핑을 보내 보고, 5초 안에 답이 없으면 다시 붙는다.
      probe() {
        const ws = this.ws;
        if (this.stopped || this.fatal || document.visibilityState === 'hidden' || !ws || ws.readyState !== 1) return;
        const at = Date.now();
        ws.send('{"t":"ping"}');
        setTimeout(() => { if (this.ws === ws && this.lastHeard < at) this.restart(); }, 5000);
      }
      restart() {
        const old = this.ws;
        this.ws = null;
        clearInterval(this.pinger);
        try { old.close(); } catch (err) { /* 이미 닫힘 */ }
        this.connect();
      }
      send(m) {
        if (this.stopped || this.fatal) return;
        const s = JSON.stringify(m);
        if (this.ws && this.ws.readyState === 1) this.ws.send(s);
        else this.queue.push(s);
      }
      close() {
        this.stopped = true;
        document.removeEventListener('visibilitychange', this.probe);
        window.removeEventListener('online', this.probe);
        clearTimeout(this.timer);
        clearTimeout(this.stable);
        clearInterval(this.pinger);
        try { if (this.ws) this.ws.close(1000); } catch (err) { /* 이미 닫힘 */ }
      }
    }

    /* ---------- 골든벨 문제: 도형맨 문제를 '한 번에 답하는' 모양으로 ---------- */
    // input: 'choice'(보기 고르기, ans는 번호) 또는 'keypad'(수 쓰기)
    function toBell(raw) {
      const q = raw.kind === 'ox' ? oxToChoice(raw) : raw;
      const base = { speech: q.speech, explain: q.explain || '' };
      if (q.kind === 'choice') {
        const ans = q.choices.findIndex((c) => c.v === q.ans);
        return { ...base, input: 'choice', prompt: q.prompt, visual: q.visual || '', choices: q.choices.map((c) => c.html), cols: q.cols || 2, txt: Boolean(q.txt), figs: Boolean(q.figs), ans, ansHtml: ans >= 0 ? q.choices[ans].html : '' };
      }
      if (q.kind === 'keypad') {
        return { ...base, input: 'keypad', prompt: q.prompt || '', visual: q.visual || '', lhs: q.lhs || '', unit: q.unit || '', ans: q.ans, ansHtml: q.ansText || withUnit(q.ans, q.unit) };
      }
      return null;
    }

    // 고른 유형을 돌아가며 내고, 같은 문제는 다시 내지 않는다.
    function bellMakeSet() {
      const ids = shuffle(bellCfg.sel.filter((id) => BELL_IDS.includes(id)));
      if (!ids.length) return [];
      const out = [];
      const keys = new Set();
      for (let guard = 0; out.length < bellCfg.count && guard < bellCfg.count * 10; guard += 1) {
        const id = ids[out.length % ids.length];
        const raw = MIX_ITEMS[id].make();
        if (raw.key && keys.has(raw.key)) continue;
        const bq = toBell(raw);
        if (!bq || (bq.input === 'choice' && bq.ans < 0) || (bq.input === 'keypad' && !Number.isInteger(bq.ans))) continue;
        keys.add(raw.key);
        out.push({ ...bq, id, label: BELL_LABEL[id] || MIX_ITEMS[id].label });
      }
      return out;
    }

    // 맞히면 바로 1000점, 시간이 다 될 즈음이면 500점. 틀리면 0점.
    function bellPoints(ms, seconds) {
      const ratio = Math.min(1, Math.max(0, ms) / Math.max(1000, seconds * 1000));
      return Math.round(BELL_MAX_POINTS * (1 - ratio / 2));
    }

    /* ---------- 골든벨 준비 (유형·문제 수·시간 고르기) ---------- */
    function openBellSetup() {
      renderBellSetup();
      document.getElementById('bell-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideBellSetup() {
      document.getElementById('bell-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }
    function renderBellSetup() {
      const box = document.getElementById('bell-overlay');
      const prevScroll = box.firstElementChild ? box.firstElementChild.scrollTop : 0;
      const race = bellCfg.kind === 'race';
      const exam = bellCfg.kind === 'exam';
      const sel = bellCfg[bellSelKey()];
      const n = exam ? EXAM_TOTAL : sel.length;
      const seg = (key, list) => `<div class="seg">${list.map(([v, t]) => `<button type="button" class="${String(bellCfg[key]) === String(v).replace(/'/g, '') ? 'on' : ''}" onclick="bellSet('${key}', ${v})">${t}</button>`).join('')}</div>`;
      box.innerHTML = `
        <div class="result-card mix-card bell-card">
          <div class="concept-head">
            <div class="kid-art"></div>
            <div>
              <h2>${exam ? '📝 도형맨 단원 평가' : race ? '⏱ 도형맨 시간 대결' : '🔔 도형맨 골든벨'}</h2>
              <p>${exam
                ? '단원 마무리 평가 20문제를 반 전체 태블릿에 한꺼번에 보내요. 칠판에서 문제를 미리 보고 바꿀 수 있고, 시간이 끝나면 학생별·문항별 결과가 선생님 화면에 모여요.'
                : race
                ? '반 친구들이 각자 태블릿으로 제한 시간 안에 최대한 많은 문제를 풀어요. 처음에 맞히면 2점, 다시 풀어 맞히면 1점! 칠판에 순위가 바로바로 보여요.'
                : '반 친구들이 각자 태블릿으로 같은 문제를 한꺼번에 풀어요. 맞히면 500~1000점, 빨리 맞힐수록 점수가 높아요.'}</p>
            </div>
          </div>
          <div class="bell-opts">
            <div class="setting-row"><span class="setting-label">게임 방식</span>${seg('kind', [["'bell'", '🔔 골든벨 · 같은 문제 동시에'], ["'race'", '⏱ 시간 대결 · 많이 풀기'], ["'exam'", '📝 단원 평가 · 결과 받기']])}</div>
            ${exam ? `
            <div class="setting-row"><span class="setting-label">제한 시간</span>${seg('examMin', EXAM_MINS.map((v) => [v, v ? `${v}분` : '없음']))}</div>
            <div class="setting-row"><span class="setting-label">끝나면 태블릿에</span>${seg('examShow', [[true, '점수 보여 주기'], [false, '점수 숨기기']])}</div>` : race ? `
            <div class="setting-row"><span class="setting-label">제한 시간</span>${seg('race', BELL_RACES.map((v) => [v, bellTimeText(v)]))}</div>` : `
            <div class="setting-row"><span class="setting-label">문제 수</span>${seg('count', BELL_COUNTS.map((v) => [v, `${v}문제`]))}</div>
            <div class="setting-row"><span class="setting-label">한 문제 시간</span>${seg('seconds', BELL_SECONDS.map((v) => [v, `${v}초`]))}</div>
            <div class="setting-row"><span class="setting-label">정답 공개 뒤</span>${seg('auto', [[0, '선생님이 넘기기'], [5, '5초 뒤 다음'], [10, '10초 뒤 다음']])}</div>`}
          </div>
          ${exam ? `
          <section class="exam-note">
            <p>📋 <b>문제 구성</b> · ${EXAM_SECS.map((t) => `${t} ${EXAM_PLAN.filter(([, k]) => EXAM_SECS[k] === t).length}`).join(' · ')}문제 (한 문제 ${EXAM_POINT}점)</p>
            <p>🔢 학생은 이름 대신 <b>번호</b>로 들어와요. 문제마다 한 번만 답하고, 푸는 동안에는 맞았는지 보여 주지 않아요.</p>
            <p>🔒 이름은 서버로 보내지 않아요. 결과는 이 화면에만 모이고 창을 닫으면 사라지니, 끝나면 <b>CSV로 저장</b>하거나 인쇄해 두세요.</p>
          </section>` : bellLessons().map((l) => {
            const full = l.items.every((id) => sel.includes(id));
            return `
              <section class="mix-lesson">
                <div class="mix-lesson-head">
                  <span class="mix-page">${l.page}</span>
                  <h3>${l.title}</h3>
                  <button class="mix-all${full ? ' on' : ''}" type="button" onclick="bellToggleLesson('${l.id}')">${full ? '모두 해제' : '모두 선택'}</button>
                </div>
                <div class="mix-items">${l.items.map((id) => {
                  const on = sel.includes(id);
                  return `
                  <button class="mix-chip${on ? ' on' : ''}" type="button" aria-pressed="${on}" onclick="bellToggleItem('${id}')">
                    <span class="ck">${CHECK}</span><span class="mi">${ICONS[MIX_ITEMS[id].icon]}</span>${bellItemLabel(id)}
                  </button>`;
                }).join('')}
                </div>
              </section>`;
          }).join('')}
          <div class="mix-foot">
            <div class="mix-sum">
              <span>${exam ? `단원 전체 <b>${n}</b>문제` : `<b>${n}</b>가지 유형을 골랐어요`}</span>
              <span class="mix-cap">학생은 태블릿·스마트폰으로 QR을 찍어 ${exam ? '번호로 ' : ''}들어와요 (최대 40명)</span>
              <span class="bell-err" id="bell-setup-err"></span>
              <button class="bell-pad-link" type="button" onclick="hideBellSetup(); openBellPad()">📱 학생 태블릿으로 참여 →</button>
            </div>
            <div class="mix-btns">
              <button class="ghost-btn" type="button" onclick="hideBellSetup()">닫기</button>
              <button class="btn-main" id="bell-setup-go" type="button" onclick="bellSetupGo()"${n ? '' : ' disabled'}>${BH.code ? '바꾸기' : '방 만들기 →'}</button>
            </div>
          </div>
        </div>`;
      box.firstElementChild.scrollTop = prevScroll;
    }
    function bellSet(key, v) {
      bellCfg[key] = v;
      saveBellCfg();
      renderBellSetup();
    }
    function bellToggleItem(id) {
      const key = bellSelKey();
      bellCfg[key] = bellCfg[key].includes(id) ? bellCfg[key].filter((x) => x !== id) : [...bellCfg[key], id];
      saveBellCfg();
      renderBellSetup();
    }
    function bellToggleLesson(lid) {
      const key = bellSelKey();
      const l = bellLessons().find((x) => x.id === lid);
      const full = l.items.every((id) => bellCfg[key].includes(id));
      bellCfg[key] = full ? bellCfg[key].filter((id) => !l.items.includes(id)) : [...new Set([...bellCfg[key], ...l.items])];
      saveBellCfg();
      renderBellSetup();
    }
    async function bellSetupGo() {
      if (bellCfg.kind !== 'exam' && !bellCfg[bellSelKey()].length) return;
      if (BH.code) { hideBellSetup(); bellRender(); bellSend(); return; }
      const btn = document.getElementById('bell-setup-go');
      const err = document.getElementById('bell-setup-err');
      btn.disabled = true;
      btn.textContent = '방 만드는 중…';
      err.textContent = '';
      try {
        const res = await fetch(`${BELL_SERVER}/api/rooms`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.code) throw new Error(data.error);
        hideBellSetup();
        bellHostStart(data.code, data.hostKey);
      } catch (e) {
        err.textContent = navigator.onLine === false
          ? '인터넷에 연결되어 있지 않아요. 골든벨은 인터넷이 있어야 해요.'
          : '방을 만들지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
        btn.disabled = false;
        btn.textContent = '방 만들기 →';
      }
    }

    /* ---------- 칠판(선생님) ---------- */
    const BH = {
      code: '', key: '', sock: null, online: false, roster: [], game: 0,
      qs: [], index: -1, stage: 'lobby', openedAt: 0, seconds: 20, asked: 0,
      // 시간 대결: 게임 방식, 제한 시간(초), 시작·끝 시각
      kind: 'bell', raceSec: 0, raceStart: 0, raceEnd: 0, raceItems: [],
      // 단원 평가: 칠판에서 정한 20문제, 제한 시간(초, 0은 무제한), 끝 시각, 학생별 답(맞음·틀림), 결과표를 펼쳤는지
      examQs: [], examSec: 0, examEnd: 0, examRes: {}, examOpen: false,
      answers: {}, scores: {}, tick: null, autoTimer: null, revealTimer: null, autoLeft: 0
    };
    const bellRound = () => `${BH.code}-${BH.game}-${BH.index}`;
    const bellOnline = () => BH.roster.filter((p) => p.online);

    function bellHostStart(code, key) {
      Object.assign(BH, { code, key, online: false, roster: [], game: 0, qs: [], index: -1, stage: 'lobby', answers: {}, scores: {} });
      BH.sock = new BellSocket(() => `${bellWs()}/api/rooms/${code}/ws?role=host&key=${key}`, {
        status: (st) => { BH.online = st === 'open'; bellRoomChip(); },
        message: bellHostMessage
      });
      showScreen('bell-screen');
      bellRender();
    }
    function bellHostMessage(m) {
      if (m.t === 'ready' || m.t === 'players') bellRoster(m.players || [], m.t === 'ready');
      else if (m.t === 'input' && m.data && m.data.kind === 'race') bellRaceInput(m.from, m.data);
      else if (m.t === 'input' && m.data && m.data.kind === 'exam') bellExamInput(m.from, m.data);
      else if (m.t === 'input') bellInput(m.from, m.data);
      else if (m.t === 'error' && (m.code === 'closed' || m.code === 'not-found')) {
        BH.online = false;
        bellRoomChip();
        alert('골든벨 방이 닫혔어요. 끝내기를 누른 뒤 새로 만들어 주세요.');
      } else if (m.t === 'error' && m.message) console.warn('골든벨:', m.message);
    }
    function bellRoster(list, all) {
      const before = new Set(bellOnline().map((p) => p.id));
      BH.roster = list;
      list.forEach((p) => { if (BH.scores[p.id]) Object.assign(BH.scores[p.id], { name: p.name, avatar: p.avatar }); });
      // 칠판이 다시 붙었거나 학생이 새로 들어오면 지금 화면을 보내 준다(방이 잠들었다 깨면 서버는 화면을 잊는다).
      const fresh = all ? list.map((p) => p.id) : bellOnline().filter((p) => !before.has(p.id)).map((p) => p.id);
      if (fresh.length) bellSend(fresh);
      if (BH.stage === 'lobby') bellRender();
      else bellRefreshLive();
    }
    function bellNewScore(p) {
      return { id: p.id, name: p.name, avatar: p.avatar, points: 0, correct: 0, gained: 0 };
    }

    // 학생마다 지금 보여 줄 태블릿 화면
    function bellViewFor(id) {
      if (BH.stage === 'lobby') {
        if (bellCfg.kind === 'race') return { screen: 'wait', emoji: '⏱', title: '곧 시간 대결을 시작해요', message: `${bellTimeText(bellCfg.race)} 안에 최대한 많이 맞혀요` };
        if (bellCfg.kind === 'exam') return { screen: 'wait', emoji: '📝', title: '곧 단원 평가를 시작해요', message: `${EXAM_TOTAL}문제 · ${bellCfg.examMin ? `제한 시간 ${bellCfg.examMin}분` : '시간 제한 없음'} · 문제마다 한 번만 답할 수 있어요` };
        return { screen: 'wait', emoji: '🔔', title: '곧 골든벨을 시작해요', message: `모두 ${bellCfg.count}문제 · 한 문제 ${bellCfg.seconds}초 · 빨리 맞힐수록 점수가 높아요` };
      }
      if (BH.stage === 'race') {
        const s = BH.scores[id];
        const now = Date.now();
        return {
          screen: 'race', round: bellRound(), items: BH.raceItems, total: BH.raceSec,
          wait: Math.max(0, BH.raceStart - now), seconds: Math.max(0, (BH.raceEnd - Math.max(now, BH.raceStart)) / 1000),
          // 태블릿을 새로 불러와도 이어서 하도록 지금까지의 점수를 함께 보낸다
          score: s ? s.points : 0, correct: s ? s.correct : 0
        };
      }
      const q = BH.qs[BH.index];
      const a = BH.answers[id];
      const s = BH.scores[id];
      if (BH.stage === 'question') {
        if (a) return { screen: 'wait', emoji: '✋', title: '답을 냈어요!', message: '정답 공개를 기다려요', round: bellRound() };
        const left = Math.max(1, (BH.openedAt + BH.seconds * 1000 - Date.now()) / 1000);
        return {
          // elapsed: 문제를 낸 뒤 지난 시간. 중간에 다시 들어온 태블릿도 처음부터 잰 시간으로 점수를 받는다.
          screen: 'q', round: bellRound(), no: BH.index + 1, total: BH.qs.length, seconds: left, elapsed: Date.now() - BH.openedAt,
          q: { input: q.input, prompt: q.prompt, visual: q.visual, choices: q.choices, cols: q.cols, txt: q.txt, sign: q.sign, lhs: q.lhs, unit: q.unit, big: q.big }
        };
      }
      if (BH.stage === 'reveal') {
        if (!s) return { screen: 'wait', emoji: '🔔', title: '다음 문제부터 함께 풀어요', message: '칠판을 봐요' };
        const standing = `지금 ${bellRankOf(id)}등 · ${s.points.toLocaleString()}점`;
        if (a && a.ok) return { screen: 'result', good: true, title: `정답! +${a.gained}점`, message: standing };
        return { screen: 'result', good: false, title: a ? '아쉬워요' : '시간이 다 됐어요', answer: q.ansHtml, message: standing };
      }
      if (BH.kind === 'exam') return bellExamEndView(id);
      const ranked = bellRanking();
      const mine = ranked.find((r) => r.s.id === id);
      if (!mine) return { screen: 'wait', emoji: '🏆', title: '골든벨 끝!', message: '칠판을 봐요' };
      return { screen: 'end', kind: BH.kind, rank: mine.rank, count: ranked.length, points: mine.s.points, correct: mine.s.correct, asked: BH.asked };
    }
    // 화면을 보낸다. 문제는 모두 같으니 한 번에, 결과는 학생마다 따로.
    function bellSend(ids) {
      if (!BH.sock) return;
      const targets = ids || BH.roster.map((p) => p.id);
      if (!targets.length) return;
      // 시간 대결에 늦게 들어온 학생도 순위표에 0점으로 올린다
      if (BH.stage === 'race') targets.forEach((id) => {
        const p = BH.roster.find((x) => x.id === id);
        if (p && p.online && !BH.scores[id]) BH.scores[id] = bellNewScore(p);
      });
      // 평가 문제는 모두 같으니 한 번에 보낸다(학생마다 따로 보내면 말이 너무 커진다)
      if (BH.stage === 'exam') {
        // 늦게 들어온 학생도 진행표에 0문제로 올린다
        targets.forEach((id) => { if (BH.roster.some((p) => p.id === id && p.online)) bellExamRec(id); });
        BH.sock.send({ t: 'view', to: targets, view: bellExamView() });
        return;
      }
      if (BH.stage === 'question') {
        const fresh = targets.filter((id) => !BH.answers[id]);
        if (fresh.length) BH.sock.send({ t: 'view', to: fresh, view: bellViewFor(fresh[0]) });
        const done = targets.filter((id) => BH.answers[id]);
        if (done.length) BH.sock.send({ t: 'view', to: done, view: bellViewFor(done[0]) });
        return;
      }
      const views = {};
      targets.forEach((id) => { views[id] = bellViewFor(id); });
      BH.sock.send({ t: 'views', views });
    }

    function bellStart() {
      if (!bellOnline().length) return;
      BH.kind = bellCfg.kind;
      if (BH.kind === 'race') { bellRaceStart(); return; }
      if (BH.kind === 'exam') { bellExamStart(); return; }
      BH.qs = bellMakeSet();
      if (!BH.qs.length) return;
      BH.scores = {};
      BH.asked = 0;
      bellOpen(0);
    }
    function bellOpen(i) {
      bellStopTimers();
      Object.assign(BH, { index: i, stage: 'question', openedAt: Date.now(), seconds: bellCfg.seconds, answers: {} });
      bellOnline().forEach((p) => { if (!BH.scores[p.id]) BH.scores[p.id] = bellNewScore(p); });
      Object.values(BH.scores).forEach((s) => { s.gained = 0; });
      bellSend();
      bellRender();
      blip('tick');
      speak(BH.qs[i].speech);
      BH.tick = setInterval(bellTick, 200);
      bellTick();
    }
    function bellTick() {
      const left = BH.openedAt + BH.seconds * 1000 - Date.now();
      bellTimerUi(Math.ceil(Math.max(0, left) / 1000), BH.seconds);
      if (left <= -BELL_GRACE_MS) bellReveal();
    }
    function bellMore() {
      if (BH.stage !== 'question') return;
      BH.seconds += BELL_EXTEND;
      bellSend(BH.roster.map((p) => p.id).filter((id) => !BH.answers[id]));
      bellTick();
    }
    function bellInput(from, data) {
      if (!data || data.kind !== 'answer' || BH.stage !== 'question' || data.round !== bellRound() || BH.answers[from]) return;
      const p = BH.roster.find((x) => x.id === from);
      if (!p) return;
      const q = BH.qs[BH.index];
      let answer;
      if (q.input === 'choice') {
        const c = Number(data.choice);
        if (!Number.isInteger(c) || c < 0 || c >= q.choices.length) return;
        answer = { choice: c, ok: c === q.ans };
      } else {
        const v = String(data.value || '');
        if (!/^\d{1,7}(\.\d{1,3})?$/.test(v)) return;
        answer = { value: v, ok: sameNum(parseNum(v), q.ans) };
      }
      // 태블릿이 잰 시간을 쓴다(와이파이가 느린 태블릿이 손해 보지 않게). 다만 칠판이 받은 때보다 길게는 세지 않는다.
      const arrived = Math.max(0, Date.now() - BH.openedAt);
      answer.ms = Number.isFinite(data.ms) ? Math.min(arrived, Math.max(0, data.ms)) : arrived;
      BH.answers[from] = answer;
      if (!BH.scores[from]) BH.scores[from] = bellNewScore(p);
      bellSend([from]);
      bellRefreshLive();
    }
    // 들어와 있는 학생이 모두 답하면 잠깐 뒤에 정답을 공개한다.
    function bellCheckAll() {
      if (BH.stage !== 'question') return;
      const answered = Object.keys(BH.answers).length;
      const total = new Set([...bellOnline().map((p) => p.id), ...Object.keys(BH.answers)]).size;
      clearTimeout(BH.revealTimer);
      if (total > 0 && answered >= total) BH.revealTimer = setTimeout(bellReveal, 700);
    }
    function bellReveal() {
      if (BH.stage !== 'question') return;
      bellStopTimers();
      Object.entries(BH.answers).forEach(([id, a]) => {
        const s = BH.scores[id];
        a.gained = a.ok ? bellPoints(a.ms, BH.seconds) : 0;
        if (!s) return;
        s.gained = a.gained;
        s.points += a.gained;
        if (a.ok) s.correct += 1;
      });
      BH.stage = 'reveal';
      bellSend();
      bellRender();
      blip(Object.values(BH.answers).some((a) => a.ok) ? 'ok' : 'no');
      if (bellCfg.auto) {
        BH.autoLeft = bellCfg.auto;
        bellNextBtn();
        BH.autoTimer = setInterval(() => {
          // 학생이 모두 나가 있으면(와이파이가 끊기면) 저절로 넘기지 않고 기다린다.
          if (!bellOnline().length) return;
          BH.autoLeft -= 1;
          bellNextBtn();
          if (BH.autoLeft <= 0) bellNext();
        }, 1000);
      }
    }
    function bellNext() {
      if (BH.stage !== 'reveal') return;
      if (BH.index >= BH.qs.length - 1) { BH.asked = BH.qs.length; bellEnd(); return; }
      bellOpen(BH.index + 1);
    }
    function bellFinish() {
      if (!['question', 'reveal', 'race', 'exam'].includes(BH.stage)) return;
      if (BH.stage === 'exam') {
        if (confirm('단원 평가를 지금 끝낼까요? 학생 태블릿도 함께 끝나요.')) bellEnd();
        return;
      }
      if (!confirm(`지금까지의 점수로 ${BH.kind === 'race' ? '시간 대결' : '골든벨'}을 마칠까요?`)) return;
      BH.asked = BH.stage === 'reveal' ? BH.index + 1 : BH.index;
      bellEnd();
    }
    function bellEnd() {
      bellStopTimers();
      BH.stage = 'end';
      bellSend();
      bellRender();
      blip('fanfare');
    }
    function bellAgain() {
      bellStopTimers();
      Object.assign(BH, { game: BH.game + 1, qs: [], index: -1, stage: 'lobby', answers: {}, scores: {}, asked: 0, examQs: [], examRes: {}, examOpen: false });
      bellSend();
      bellRender();
    }
    function bellStopTimers() {
      clearInterval(BH.tick);
      clearInterval(BH.autoTimer);
      clearTimeout(BH.revealTimer);
      BH.autoLeft = 0;
    }
    function bellKick(id) {
      const p = BH.roster.find((x) => x.id === id);
      if (!p || !BH.sock || !confirm(`${p.name}${eulReul(p.name)} 방에서 내보낼까요?`)) return;
      BH.sock.send({ t: 'kick', playerId: id });
    }
    function bellCloseRoom() {
      bellStopTimers();
      if (BH.sock) {
        const sock = BH.sock;
        sock.send({ t: 'close' });
        // 닫는 말이 서버에 닿을 틈을 준다
        setTimeout(() => sock.close(), 400);
      }
      Object.assign(BH, { sock: null, code: '', key: '', roster: [], online: false, stage: 'lobby', qs: [], index: -1, answers: {}, scores: {}, examQs: [], examRes: {}, examOpen: false });
    }
    function bellQuit() {
      if (BH.stage === 'end' && BH.kind === 'exam' && Object.keys(BH.examRes).length
        && !confirm('평가 결과는 이 화면에만 있어요. CSV로 저장했나요? 닫으면 결과가 사라져요.')) return;
      if (BH.stage !== 'end' && BH.roster.length && !confirm('골든벨을 끝내고 방을 닫을까요? 학생 태블릿도 함께 끝나요.')) return;
      bellCloseRoom();
      showScreen('game-select-screen');
    }

    /* ---------- 시간 대결 (칠판) ---------- */
    // 3초 세고 시작한다. 태블릿이 저마다 문제를 내고 채점해서 점수가 오를 때마다 알려 준다.
    const RACE_READY_MS = 3000;
    // 시간이 끝난 뒤 태블릿의 마지막 점수가 닿을 때까지 기다리는 시간
    const RACE_GRACE_MS = 2500;
    function bellRaceStart() {
      if (!bellCfg.raceSel.length) return;
      bellStopTimers();
      const now = Date.now();
      Object.assign(BH, {
        game: BH.game + 1, qs: [], index: -1, stage: 'race', answers: {}, scores: {}, asked: 0,
        raceSec: bellCfg.race, raceItems: [...bellCfg.raceSel], openedAt: now, raceStart: now + RACE_READY_MS, raceEnd: now + RACE_READY_MS + bellCfg.race * 1000
      });
      bellSend();
      bellRender();
      blip('tick');
      BH.tick = setInterval(bellRaceTick, 250);
      bellRaceTick();
    }
    function bellRaceTick() {
      const now = Date.now();
      const clock = document.getElementById('race-clock');
      if (now < BH.raceStart) {
        if (clock) clock.textContent = String(Math.ceil((BH.raceStart - now) / 1000));
        bellTimerUi(BH.raceSec, BH.raceSec);
        return;
      }
      const left = Math.max(0, Math.ceil((BH.raceEnd - now) / 1000));
      bellTimerUi(left, BH.raceSec);
      if (clock) {
        clock.textContent = left > 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : '끝!';
        clock.classList.toggle('warn', left <= 10);
      }
      if (now >= BH.raceEnd + RACE_GRACE_MS) { BH.asked = 0; bellEnd(); }
    }
    // 점수와 맞힌 수는 줄지 않으니 더 큰 값만 받는다(늦게 닿은 말이 앞의 말을 덮지 않게).
    function bellRaceInput(from, data) {
      if (BH.stage !== 'race' || data.round !== bellRound()) return;
      const p = BH.roster.find((x) => x.id === from);
      const score = Number(data.score);
      const correct = Number(data.correct);
      if (!p || !Number.isInteger(score) || !Number.isInteger(correct) || score < 0 || score > 9999 || correct < 0 || correct > 9999) return;
      const s = BH.scores[from] || (BH.scores[from] = bellNewScore(p));
      if (score > s.points) s.gained = score - s.points;
      s.points = Math.max(s.points, score);
      s.correct = Math.max(s.correct, correct);
      bellRefreshLive();
    }
    function bellRaceRowsHtml() {
      const ranked = bellRanking();
      if (!ranked.length) return '<p class="bell-more">들어온 학생이 없어요.</p>';
      const top = Math.max(1, ranked[0].s.points);
      return ranked.map(({ s, rank }) => `
        <li class="race-row r${s.points > 0 ? rank : 0}">
          <span class="rk">${rank === 1 && s.points > 0 ? '👑' : rank}</span><span class="em">${bellEmoji(s.avatar)}</span>
          <span class="nm">${bellEsc(s.name)}</span>
          <span class="track"><i style="width:${(s.points / top) * 100}%"></i></span>
          <span class="pt">${s.points}점</span><span class="ok">✔ ${s.correct}</span>
        </li>`).join('');
    }
    function bellRaceHtml() {
      return `
        <div class="race-board">
          <div class="race-head">
            <span class="race-clock" id="race-clock"></span>
            <p class="race-info">⏱ 각자 태블릿으로 최대한 많이 맞혀요 · 처음에 맞히면 2점, 다시 풀어 맞히면 1점</p>
          </div>
          <ol class="race-list${BH.roster.length > 10 ? ' two' : ''}" id="race-list">${bellRaceRowsHtml()}</ol>
        </div>`;
    }

    function bellRanking() {
      const list = Object.values(BH.scores).sort((a, b) => b.points - a.points || b.correct - a.correct || a.name.localeCompare(b.name, 'ko'));
      return list.map((s) => ({ s, rank: list.findIndex((o) => o.points === s.points) + 1 }));
    }
    function bellRankOf(id) {
      const r = bellRanking().find((x) => x.s.id === id);
      return r ? r.rank : 0;
    }

    /* ---------- 단원 평가 (칠판) ---------- */
    // 칠판이 20문제를 정해 모든 태블릿에 똑같이 보낸다. 태블릿은 단원 마무리 평가를 맞았는지 알려 주지 않고 풀며,
    // 문제마다 맞음·틀림만 칠판에 알린다. 결과는 이 화면에만 모이고, 이름은 선생님 컴퓨터의 명렬표로만 붙인다.
    const EXAM_GRACE_MS = 3000;
    const EXAM_NAMES_KEY = 'shapemoveman-exam-names';
    const examNo = (name) => { const m = /^(\d{1,2})번$/.exec(name || ''); return m ? Number(m[1]) : 0; };
    const bellByNo = (a, b) => (examNo(a.name) || 999) - (examNo(b.name) || 999) || a.name.localeCompare(b.name, 'ko');
    const examAnswered = (r) => r.res.filter((v) => typeof v === 'boolean').length;
    const examCorrect = (r) => r.res.filter((v) => v === true).length;
    let examNames = [];
    try {
      const saved = JSON.parse(localStorage.getItem(EXAM_NAMES_KEY) || '[]');
      if (Array.isArray(saved)) examNames = saved.map((v) => String(v || ''));
    } catch (err) { /* 명렬표 없이 번호만 쓴다 */ }
    const examNameOf = (name) => { const n = examNo(name); return (n && examNames[n - 1]) || ''; };

    function bellExamEnsure() {
      if (BH.examQs.length !== EXAM_TOTAL) BH.examQs = buildExamQueue();
    }
    function examAnsHtml(q) {
      if (q.ansText) return q.ansText;
      const c = q.choices && q.choices.find((x) => x.v === q.ans);
      return c ? c.html : '';
    }
    // 미리보기: 태블릿과 같은 모양으로 그리되 누를 수는 없게 한다
    function examPreviewBody(q, i) {
      const keep = mode;
      mode = 'exam';
      try {
        const p = setupPlayer(900 + i, q);
        p.locked = true;
        return (BODIES[q.kind] || choiceBody)(p);
      } finally {
        mode = keep;
      }
    }
    function bellExamPreview() {
      bellExamEnsure();
      const box = document.getElementById('bell-overlay');
      const edit = BH.stage === 'lobby';
      box.innerHTML = `
        <div class="result-card exam-pv-card">
          <div class="exam-pv-head">
            <h2>📋 ${edit ? '평가 문제 미리보기' : '평가 문제와 정답'}</h2>
            <p>${edit ? '마음에 들지 않는 문제는 🔄 바꾸기를 눌러요. 학생 태블릿에는 이 문제가 이 차례로 나가요.' : '학생들이 푼 문제예요. 정답률이 낮은 문제를 함께 다시 풀어 보세요.'}</p>
          </div>
          <div class="exam-pv-grid">${BH.examQs.map((q, i) => bellExamCardHtml(q, i, edit)).join('')}</div>
          <div class="mix-btns">
            ${edit ? '<button class="ghost-btn" type="button" onclick="bellExamReroll(-1)">🔄 모두 새로 만들기</button>' : ''}
            <button class="btn-main" type="button" onclick="hideBellSetup()">${edit ? '이대로 할게요' : '닫기'}</button>
          </div>
        </div>`;
      box.classList.remove('hidden');
      document.body.classList.add('modal');
      box.firstElementChild.scrollTop = 0;
    }
    function bellExamCardHtml(q, i, edit) {
      const rate = BH.stage === 'end' ? bellExamRates()[i] : null;
      return `
        <article class="exam-pv" id="exam-pv-${i}">
          <header>
            <b>${i + 1}</b><span>${q.sec}</span>
            ${rate === null ? '' : `<span class="rate${rate < 50 ? ' low' : ''}">정답률 ${rate}%</span>`}
            ${edit ? `<button class="ghost-btn" type="button" onclick="bellExamReroll(${i})">🔄 바꾸기</button>` : ''}
          </header>
          <div class="exam-pv-body">${examPreviewBody(q, i)}</div>
          <footer>정답 <span class="ans">${examAnsHtml(q)}</span></footer>
        </article>`;
    }
    function bellExamReroll(i) {
      if (BH.stage !== 'lobby') return;
      if (i < 0) {
        if (!confirm(`${EXAM_TOTAL}문제를 모두 새로 만들까요?`)) return;
        BH.examQs = buildExamQueue();
        bellExamPreview();
        return;
      }
      const keys = new Set(BH.examQs.map((q) => q.key));
      let q = examMake(i);
      for (let k = 0; k < 8 && keys.has(q.key); k += 1) q = examMake(i);
      BH.examQs[i] = q;
      const card = document.getElementById(`exam-pv-${i}`);
      if (card) card.outerHTML = bellExamCardHtml(q, i, true);
    }

    function bellExamStart() {
      bellExamEnsure();
      bellStopTimers();
      hideBellSetup();
      const now = Date.now();
      Object.assign(BH, {
        game: BH.game + 1, qs: [], index: -1, stage: 'exam', answers: {}, scores: {}, examRes: {}, examOpen: false,
        examSec: bellCfg.examMin * 60, examEnd: bellCfg.examMin ? now + bellCfg.examMin * 60000 : 0
      });
      bellSend();
      bellRender();
      blip('tick');
      BH.tick = setInterval(bellExamTick, 250);
      bellExamTick();
    }
    function bellExamRec(id) {
      if (BH.examRes[id]) return BH.examRes[id];
      const p = BH.roster.find((x) => x.id === id);
      if (!p) return null;
      return (BH.examRes[id] = { id, name: p.name, res: [], away: 0, done: false });
    }
    function bellExamView() {
      return { screen: 'exam', round: bellRound(), qs: BH.examQs, total: BH.examSec, left: BH.examEnd ? Math.max(0, BH.examEnd - Date.now()) : 0 };
    }
    function bellExamTick() {
      const clock = document.getElementById('exam-clock');
      if (!BH.examEnd) {
        if (clock) clock.textContent = '시간 제한 없음';
        return;
      }
      const left = Math.max(0, Math.ceil((BH.examEnd - Date.now()) / 1000));
      if (clock) {
        clock.textContent = left > 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : '끝!';
        clock.classList.toggle('warn', left <= 60);
      }
      if (Date.now() >= BH.examEnd + EXAM_GRACE_MS) bellEnd();
    }
    // 한 문제에는 처음 온 답만 받는다(다시 붙은 태블릿이 같은 답을 또 보내도 괜찮다).
    function bellExamInput(from, data) {
      if (BH.stage !== 'exam' || data.round !== bellRound()) return;
      const r = bellExamRec(from);
      if (!r) return;
      const i = Number(data.i);
      if (Number.isInteger(i) && i >= 0 && i < EXAM_TOTAL && typeof r.res[i] !== 'boolean') r.res[i] = data.ok === true;
      if (data.away === true) r.away += 1;
      if (data.done === true || examAnswered(r) >= EXAM_TOTAL) r.done = true;
      bellRefreshLive();
      // 들어온 학생이 모두 다 풀었으면 잠깐 뒤에 끝낸다
      const allDone = () => BH.stage === 'exam' && Object.values(BH.examRes).every((x) => x.done);
      if (allDone()) setTimeout(() => { if (allDone()) bellEnd(); }, 1500);
    }
    function bellExamHtml() {
      return `
        <div class="race-board">
          <div class="race-head">
            <span class="race-clock" id="exam-clock"></span>
            <p class="race-info">📝 각자 태블릿으로 ${EXAM_TOTAL}문제를 풀어요 · 칠판에는 몇 문제를 풀었는지만 보여요</p>
          </div>
          <ol class="race-list${BH.roster.length > 10 ? ' two' : ''}" id="exam-list">${bellExamRowsHtml()}</ol>
        </div>`;
    }
    function bellExamRowsHtml() {
      const recs = Object.values(BH.examRes).sort(bellByNo);
      if (!recs.length) return '<p class="bell-more">아직 답을 낸 학생이 없어요.</p>';
      return recs.map((r) => {
        const n = examAnswered(r);
        const p = BH.roster.find((x) => x.id === r.id);
        const state = r.done ? '✅ 끝' : p && !p.online ? '📶 끊김' : `${n} / ${EXAM_TOTAL}`;
        return `
        <li class="race-row exam-row${r.done ? ' done' : ''}">
          <span class="nm">${bellEsc(r.name)}</span>
          <span class="track"><i style="width:${(n / EXAM_TOTAL) * 100}%"></i></span>
          <span class="ok">${state}</span>
          <span class="away" title="평가 중에 다른 화면으로 나간 횟수">${r.away ? `👀 ${r.away}` : ''}</span>
        </li>`;
      }).join('');
    }
    function bellExamEndView(id) {
      const r = BH.examRes[id];
      if (!r) return { screen: 'wait', emoji: '📝', title: '단원 평가가 끝났어요', message: '칠판을 봐요' };
      const correct = examCorrect(r);
      return { screen: 'examEnd', show: bellCfg.examShow, correct, total: EXAM_TOTAL, points: correct * EXAM_POINT };
    }

    /* ---------- 단원 평가 결과 (칠판) ---------- */
    // 한 문제라도 답한 학생만 응시한 것으로 센다. 답하지 않은 문제는 틀린 것으로 본다.
    function bellExamTakers() {
      return Object.values(BH.examRes).filter((r) => examAnswered(r) > 0).sort(bellByNo);
    }
    function bellExamRates() {
      const takers = bellExamTakers();
      return BH.examQs.map((_, i) => (takers.length ? Math.round((takers.filter((r) => r.res[i] === true).length / takers.length) * 100) : 0));
    }
    function bellExamAvg() {
      const takers = bellExamTakers();
      return takers.length ? Math.round((takers.reduce((sum, r) => sum + examCorrect(r) * EXAM_POINT, 0) / takers.length) * 10) / 10 : 0;
    }
    function bellExamTableHtml() {
      const names = bellExamTakers().some((r) => examNameOf(r.name));
      return `
        <table class="exam-table">
          <thead><tr><th>번호</th>${names ? '<th>이름</th>' : ''}${BH.examQs.map((_, i) => `<th>${i + 1}</th>`).join('')}<th>맞힌 수</th><th>점수</th><th title="평가 중에 다른 화면으로 나간 횟수">👀</th></tr></thead>
          <tbody>${bellExamTakers().map((r) => `
            <tr>
              <td class="no">${bellEsc(r.name)}</td>${names ? `<td class="nm">${bellEsc(examNameOf(r.name))}</td>` : ''}
              ${BH.examQs.map((_, i) => (r.res[i] === true ? '<td class="o">○</td>' : r.res[i] === false ? '<td class="x">✕</td>' : '<td class="na">–</td>')).join('')}
              <td>${examCorrect(r)}</td><td><b>${examCorrect(r) * EXAM_POINT}</b></td><td>${r.away || ''}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }
    function bellExamEndHtml() {
      const takers = bellExamTakers();
      const rates = bellExamRates();
      return `
        <div class="exam-end">
          <div class="exam-end-head">
            <h2>📝 단원 평가 끝!</h2>
            <p class="sub">${takers.length}명 응시 · 평균 <b>${bellExamAvg()}</b>점</p>
          </div>
          <section class="bell-panel">
            <h3>문항별 정답률</h3>
            <ol class="exam-rates">${BH.examQs.map((q, i) => `
              <li class="${rates[i] < 50 ? 'low' : ''}">
                <span class="no">${i + 1}</span><span class="sec">${q.sec}</span>
                <span class="track"><i style="width:${rates[i]}%"></i></span><b>${rates[i]}%</b>
              </li>`).join('')}
            </ol>
            <p class="bell-more">빨간 문제는 반 친구 절반 넘게 틀렸어요. 📋 문제 다시 보기로 함께 풀어 보세요.</p>
          </section>
          <section class="bell-panel">
            <div class="exam-res-head">
              <h3>학생별 결과</h3>
              <button class="ghost-btn" type="button" onclick="bellExamToggle()">${BH.examOpen ? '🙈 가리기' : '🔒 펼치기'}</button>
            </div>
            ${!takers.length ? '<p class="bell-more">답을 낸 학생이 없어요.</p>'
              : BH.examOpen ? `<div class="exam-table-wrap">${bellExamTableHtml()}</div>`
              : '<p class="bell-more">학생별 점수는 선생님만 보세요. 칠판에 띄운 화면이라면 학생들이 보지 않을 때 펼쳐요.</p>'}
          </section>
          <div class="bell-foot end">
            <button class="ghost-btn" type="button" onclick="bellExamCsv()"${takers.length ? '' : ' disabled'}>📥 CSV 저장</button>
            <button class="ghost-btn" type="button" onclick="bellExamPrint()"${takers.length ? '' : ' disabled'}>🖨 인쇄</button>
            <button class="ghost-btn" type="button" onclick="bellExamNames()">👥 명렬표 넣기</button>
            <button class="ghost-btn" type="button" onclick="bellExamPreview()">📋 문제 다시 보기</button>
            <button class="btn-main" type="button" onclick="bellAgain()">새 평가 준비</button>
          </div>
        </div>`;
    }
    function bellExamToggle() {
      BH.examOpen = !BH.examOpen;
      bellRender();
    }
    const examDate = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    function bellExamCsv() {
      const cell = (v) => (/[",\r\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v));
      const rates = bellExamRates();
      const rows = [
        ['번호', '이름', ...BH.examQs.map((q, i) => `${i + 1}번(${q.sec})`), '맞힌 수', '점수', '화면 나감'],
        ...bellExamTakers().map((r) => [
          examNo(r.name) || r.name, examNameOf(r.name),
          ...BH.examQs.map((_, i) => (r.res[i] === true ? 'O' : r.res[i] === false ? 'X' : '')),
          examCorrect(r), examCorrect(r) * EXAM_POINT, r.away
        ]),
        ['정답률', '', ...rates.map((v) => `${v}%`), '', `평균 ${bellExamAvg()}`, '']
      ];
      // 엑셀이 한글을 바로 읽도록 BOM을 붙인다
      const blob = new Blob([`﻿${rows.map((r) => r.map(cell).join(',')).join('\r\n')}`], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `도형맨-단원평가-${examDate()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    function bellExamPrint() {
      const w = window.open('', '_blank');
      if (!w) { alert('팝업이 막혀 있어요. 팝업을 허용한 뒤 다시 눌러 주세요.'); return; }
      const rates = bellExamRates();
      w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>도형맨 단원 평가 결과 ${examDate()}</title>
        <style>
          body { margin: 24px; color: #1d2838; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
          h1 { margin: 0 0 4px; font-size: 22px; } h2 { margin: 24px 0 8px; font-size: 17px; } p { margin: 0 0 14px; color: #556; }
          table { border-collapse: collapse; width: 100%; font-size: 12px; } th, td { border: 1px solid #c9d3dd; padding: 4px 3px; text-align: center; }
          th { background: #f0f4f7; } .o { color: #12804a; } .x { color: #d64545; font-weight: 700; } .na { color: #aab; } .nm { white-space: nowrap; }
          .low { color: #d64545; font-weight: 700; }
          @page { size: A4 landscape; margin: 12mm; }
        </style></head><body>
        <h1>도형맨 단원 평가 결과</h1>
        <p>${examDate()} · ${bellExamTakers().length}명 응시 · 평균 ${bellExamAvg()}점 · 한 문제 ${EXAM_POINT}점</p>
        ${bellExamTableHtml()}
        <h2>문항별 정답률</h2>
        <table><thead><tr>${BH.examQs.map((_, i) => `<th>${i + 1}</th>`).join('')}</tr></thead>
          <tbody><tr>${rates.map((v) => `<td class="${v < 50 ? 'low' : ''}">${v}%</td>`).join('')}</tr>
          <tr>${BH.examQs.map((q) => `<td>${q.sec}</td>`).join('')}</tr></tbody></table>
        </body></html>`);
      w.document.close();
      w.focus();
      setTimeout(() => w.print(), 300);
    }
    // 명렬표: 번호와 이름을 잇는 표는 이 컴퓨터(브라우저)에만 두고 서버로 보내지 않는다.
    function bellExamNames() {
      const box = document.getElementById('bell-overlay');
      box.innerHTML = `
        <div class="result-card exam-names-card">
          <h2>👥 명렬표 넣기</h2>
          <p>한 줄에 한 명씩 <b>1번부터 차례로</b> 이름을 써요. 엑셀의 이름 칸을 복사해 붙여도 되고, "7 김하늘"처럼 번호를 앞에 써도 돼요.</p>
          <p class="exam-privacy">🔒 이름은 이 컴퓨터에만 저장되고 서버로 가지 않아요.</p>
          <textarea id="exam-names" rows="12" spellcheck="false" placeholder="김하늘&#10;이바다&#10;박구름">${bellEsc(examNames.join('\n'))}</textarea>
          <div class="mix-btns">
            <button class="ghost-btn" type="button" onclick="bellExamSaveNames(true)">모두 지우기</button>
            <button class="ghost-btn" type="button" onclick="hideBellSetup()">닫기</button>
            <button class="btn-main" type="button" onclick="bellExamSaveNames()">저장</button>
          </div>
        </div>`;
      box.classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function bellExamSaveNames(clear) {
      const list = [];
      if (!clear) {
        document.getElementById('exam-names').value.split(/\r?\n/).forEach((line, k) => {
          const m = /^\s*(\d{1,2})\s*(?:번|[.)]|\t|\s)\s*(.*)$/.exec(line);
          const at = m ? Number(m[1]) - 1 : k;
          const name = (m ? m[2] : line).trim().slice(0, 20);
          if (at >= 0 && at < MAX_EXAM_NAMES) list[at] = name;
        });
      }
      examNames = Array.from(list, (v) => v || '');
      while (examNames.length && !examNames[examNames.length - 1]) examNames.pop();
      try { localStorage.setItem(EXAM_NAMES_KEY, JSON.stringify(examNames)); } catch (err) { /* 저장하지 못하면 이번 창에서만 쓴다 */ }
      hideBellSetup();
      bellRender();
    }
    const MAX_EXAM_NAMES = 40;

    /* ---------- 칠판 그리기 ---------- */
    function bellJoinUrl() {
      const base = /^https?:$/.test(location.protocol) ? `${location.origin}${location.pathname}` : BELL_PAGE_URL;
      const u = new URL(base);
      u.searchParams.set('bell', BH.code);
      // 평가 방이면 태블릿이 이름 대신 번호를 묻는다
      if (bellCfg.kind === 'exam') u.searchParams.set('exam', '1');
      if (BELL_LOCAL) u.searchParams.set('bellServer', BELL_LOCAL);
      return u.toString();
    }
    function bellRoomChip() {
      const el = document.getElementById('bell-room');
      if (!el) return;
      el.className = `bell-room${BH.online ? '' : ' off'}`;
      el.innerHTML = `<span class="dot"></span>방 <b>${BH.code}</b> · 👥 ${bellOnline().length}`;
      el.title = BH.online ? '서버에 연결되어 있어요' : '서버에 다시 연결하는 중이에요';
    }
    function bellTimerUi(left, total) {
      const t = document.getElementById('bell-timer');
      if (total === null) { t.classList.add('hidden'); return; }
      t.className = `timer${left <= 5 ? ' warn' : ''}`;
      document.getElementById('bell-time-left').textContent = String(left);
      document.getElementById('bell-timer-bar').style.strokeDashoffset = String(157.08 * (1 - Math.min(1, left / total)));
    }
    function bellScale() {
      const body = document.getElementById('bell-body');
      if (body && body.offsetParent !== null) {
        body.style.setProperty('--s', clamp(Math.min(body.clientWidth / 1000, body.clientHeight / 660), 0.85, 1.6).toFixed(2));
      }
      const pad = document.getElementById('bp-body');
      if (pad && pad.offsetParent !== null) pad.style.setProperty('--s', clamp(pad.clientWidth / 600, 0.75, 1.25).toFixed(2));
    }
    function bellRender() {
      const body = document.getElementById('bell-body');
      bellScale();
      bellRoomChip();
      const kind = BH.stage === 'lobby' ? bellCfg.kind : BH.kind;
      document.getElementById('bell-title').textContent = { race: '⏱ 도형맨 시간 대결', exam: '📝 도형맨 단원 평가' }[kind] || '🔔 도형맨 골든벨';
      const sub = {
        lobby: '학생들이 다 들어오면 시작해요',
        race: '태블릿으로 최대한 많이 풀어요',
        exam: '태블릿으로 평가를 풀어요',
        question: '태블릿으로 답을 내요',
        reveal: '정답을 확인해요',
        end: kind === 'exam' ? '평가 결과' : '골든벨 결과'
      };
      document.getElementById('bell-sub').textContent = sub[BH.stage];
      document.getElementById('bell-finish').classList.toggle('hidden', !['question', 'reveal', 'race', 'exam'].includes(BH.stage));
      if (BH.stage !== 'question' && BH.stage !== 'race') bellTimerUi(0, null);
      if (BH.stage === 'lobby') body.innerHTML = bellLobbyHtml();
      else if (BH.stage === 'race') body.innerHTML = bellRaceHtml();
      else if (BH.stage === 'exam') body.innerHTML = bellExamHtml();
      else if (BH.stage === 'end' && BH.kind === 'exam') body.innerHTML = bellExamEndHtml();
      else if (BH.stage === 'question') body.innerHTML = bellQuestionHtml();
      else if (BH.stage === 'reveal') body.innerHTML = bellRevealHtml();
      else body.innerHTML = bellEndHtml();
      body.scrollTop = 0;
      bellRefreshLive();
    }
    // 답이 들어올 때마다 화면 전체를 다시 그리지 않고 숫자만 바꾼다.
    function bellRefreshLive() {
      bellRoomChip();
      if (BH.stage === 'race') {
        const list = document.getElementById('race-list');
        if (list) list.innerHTML = bellRaceRowsHtml();
        return;
      }
      if (BH.stage === 'exam') {
        const list = document.getElementById('exam-list');
        if (list) list.innerHTML = bellExamRowsHtml();
        return;
      }
      if (BH.stage !== 'question') return;
      const answered = Object.keys(BH.answers).length;
      const total = new Set([...bellOnline().map((p) => p.id), ...Object.keys(BH.answers)]).size;
      const count = document.getElementById('bell-count');
      if (count) count.innerHTML = `<b>${answered}</b> / ${total}명 답했어요`;
      const bar = document.getElementById('bell-bar');
      if (bar) bar.style.width = `${total ? (answered / total) * 100 : 0}%`;
      const faces = document.getElementById('bell-faces');
      if (faces) faces.innerHTML = bellFacesHtml();
      bellCheckAll();
    }
    function bellFacesHtml() {
      return Object.keys(BH.answers).map((id) => {
        const s = BH.scores[id];
        return s ? `<span title="${bellEsc(s.name)}">${bellEmoji(s.avatar)}</span>` : '';
      }).join('');
    }
    function bellLobbyHtml() {
      const on = bellOnline().length;
      const exam = bellCfg.kind === 'exam';
      if (exam) bellExamEnsure();
      // 평가는 번호 차례로 늘어놓고, 번호가 아니거나 겹친 이름(7번2)은 빨갛게 보여 준다
      const list = exam ? [...BH.roster].sort(bellByNo) : BH.roster;
      const chips = list.map((p) => `
        <span class="bell-chip${p.online ? '' : ' off'}${exam && !examNo(p.name) ? ' warn' : ''}">
