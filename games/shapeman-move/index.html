      return `${s}</svg>`;
    }
    // 도형 하나를 작은 모눈 카드에 (보기용)
    function shapeCard(pts, o = {}) {
      const [w, h] = sizeOf(pts);
      const cols = o.cols || Math.max(w, h) + 2;
      const rows = o.rows || Math.max(w, h) + 2;
      const P = shiftPts(normPts(pts), Math.floor((cols - w) / 2), Math.floor((rows - h) / 2));
      return gridSvg({ cols, rows, cell: o.cell || 24, pad: 4, shapes: [{ pts: P, fill: o.fill || '#ffd166', sw: 2.2 }], cls: o.cls || 'card-m' });
    }
    // 이동 전 → 이동 후 를 나란히
    function beforeAfter(a, b, o = {}) {
      const size = Math.max(...sizeOf(a), ...sizeOf(b)) + 2;
      const card = (pts, fill) => shapeCard(pts, { cols: size, rows: size, fill, cls: 'ba-m' });
      return `<div class="ba"><div><span class="ba-tag">${o.l1 || '이동 전'}</span>${card(a, o.f1 || '#ffd166')}</div><div class="ba-arrow">${o.mid || '→'}</div><div><span class="ba-tag after">${o.l2 || '이동 후'}</span>${card(b, o.f2 || o.f1 || '#ffd166')}</div></div>`;
    }

    /* ---------- 무늬 조각 ---------- */
    // 대칭이 없는 무늬 조각: 왼쪽 아래 초록 부채꼴 + 위쪽 가운데 주황 점
    const MOTIFS = [
      (s) => `<rect width="${s}" height="${s}" fill="#fff"/><path d="M0 ${s}V${s * 0.5}A${s * 0.5} ${s * 0.5} 0 0 1 ${s * 0.5} ${s}z" fill="#2fbf71"/><circle cx="${s * 0.5}" cy="${s * 0.2}" r="${s * 0.12}" fill="#ff8a3d"/>`,
      (s) => `<rect width="${s}" height="${s}" fill="#fff"/><path d="M0 0H${s * 0.62}L0 ${s * 0.62}z" fill="#3a7ff2"/><circle cx="${s * 0.74}" cy="${s * 0.74}" r="${s * 0.13}" fill="#ffb12b"/><rect x="${s * 0.62}" y="${s * 0.08}" width="${s * 0.26}" height="${s * 0.14}" rx="2" fill="#e64f95"/>`,
      (s) => `<rect width="${s}" height="${s}" fill="#fff"/><path d="M${s * 0.1} ${s * 0.9}Q${s * 0.1} ${s * 0.2} ${s * 0.8} ${s * 0.2}" fill="none" stroke="#8b5cf0" stroke-width="${s * 0.1}" stroke-linecap="round"/><circle cx="${s * 0.78}" cy="${s * 0.72}" r="${s * 0.12}" fill="#ff5b4f"/>`
    ];
    // pose: [flipH 여부, 시계 방향 90° 횟수]  (뒤집은 다음 돌린다)
    function tileSvgInner(m, pose, s) {
      const [f, r] = pose;
      return `<g transform="rotate(${r * 90} ${s / 2} ${s / 2})${f ? ` translate(${s} 0) scale(-1 1)` : ''}">${MOTIFS[m](s)}</g><rect width="${s}" height="${s}" fill="none" stroke="#1d2838" stroke-width="1.2"/>`;
    }
    function tileSvg(m, pose, o = {}) {
      const s = 60;
      return `<svg class="tile${o.cls ? ` ${o.cls}` : ''}" viewBox="-1 -1 ${s + 2} ${s + 2}" aria-hidden="true">${tileSvgInner(m, pose, s)}</svg>`;
    }
    // 두 pose 를 이어서 하기 (a 다음 b)
    function poseOps(p) { return [...(p[0] ? ['flipH'] : []), ...Array.from({ length: p[1] }, () => 'cw')]; }
    function poseFromOps(ops) {
      // 기준 점 셋의 위치로 pose를 알아낸다
      const probe = [[0, 0], [2, 0], [0, 1]];
      const key = canonPose(applyRaw(probe, ops));
      for (let f = 0; f < 2; f += 1) for (let r = 0; r < 4; r += 1) if (canonPose(applyRaw(probe, poseOps([f, r]))) === key) return [f, r];
      return [0, 0];
    }
    function applyRaw(pts, ops) { let out = pts.map((p) => [...p]); ops.forEach((op) => { out = out.map(OPS[op]); }); return out; }
    const canonPose = (pts) => pts.map(([x, y]) => `${x},${y}`).join(';');
    const poseEq = (a, b) => a[0] === b[0] && a[1] === b[1];
    function patternSvg(m, grid, o = {}) {
      const s = 60;
      const R = grid.length;
      const C = grid[0].length;
      let out = `<svg class="pat${o.cls ? ` ${o.cls}` : ''}" viewBox="-2 -2 ${C * s + 4} ${R * s + 4}" aria-hidden="true"${o.idx != null ? ` data-p="${o.idx}"` : ''}>`;
      grid.forEach((row, r) => row.forEach((pose, c) => {
        out += `<g transform="translate(${c * s} ${r * s})">`;
        if (pose === null || pose === 'blank') {
          const sel = o.sel === r * C + c;
          out += `<rect width="${s}" height="${s}" fill="${sel ? '#ffe7f1' : '#fff4dc'}" stroke="${sel ? '#e64f95' : '#ff8a3d'}" stroke-width="${sel ? 3 : 2}" stroke-dasharray="6 4"/><text x="${s / 2}" y="${s / 2 + 9}" text-anchor="middle" class="qmark">?</text>`;
        } else {
          out += tileSvgInner(m, pose, s);
          if (o.bad && o.bad.includes(r * C + c)) out += `<rect x="2" y="2" width="${s - 4}" height="${s - 4}" fill="none" stroke="#ec5050" stroke-width="4"/>`;
          if (o.sel === r * C + c) out += `<rect x="1.5" y="1.5" width="${s - 3}" height="${s - 3}" fill="none" stroke="#e64f95" stroke-width="3"/>`;
        }
        if (o.hit && o.hit.includes(r * C + c)) out += `<rect width="${s}" height="${s}" fill="transparent" class="hit" data-tc="${r * C + c}" data-p="${o.idx}"/>`;
        out += '</g>';
      }));
      return `${out}</svg>`;
    }

    /* ---------- 글자 뒤집기 ---------- */
    const TEXT_TF = {
      same: '',
      flipH: 'translate(100 0) scale(-1 1)',
      flipV: 'translate(0 60) scale(1 -1)',
      rot: 'rotate(180 50 30)'
    };
    function wordSvg(word, tf, o = {}) {
      const fs = word.length > 3 ? 26 : 32;
      const inner = `<text x="50" y="${30 + fs * 0.36}" text-anchor="middle" font-size="${fs}" class="wd">${word}</text>`;
      if (o.stamp) return `<svg class="word stamp" viewBox="0 0 100 60" aria-hidden="true"><rect x="3" y="3" width="94" height="54" rx="27" fill="#ff6b5b" stroke="#7a2b22" stroke-width="4"/><g transform="${TEXT_TF[tf]}">${inner}</g></svg>`;
      return `<svg class="word" viewBox="0 0 100 60" aria-hidden="true"><rect x="2" y="2" width="96" height="56" rx="10" fill="${o.bg || '#eaf6ff'}" stroke="#8fd0e3" stroke-width="2"/><g transform="${TEXT_TF[tf]}">${inner}</g></svg>`;
    }

    /* =========================================================
       문제 만들기
       ========================================================= */
    const moveTxt = (moves) => moves.map(([d, n]) => `${DIR[d]}으로 ${n} cm`).join(', ');
    const moveSay = (moves) => moves.map(([d, n]) => `${DIR[d]}으로 ${n} 센티미터`).join(', ');
    const offOf = (moves) => moves.reduce(([x, y], [d, n]) => [x + DIR_V[d][0] * n, y + DIR_V[d][1] * n], [0, 0]);
    function offTxt([dx, dy], unit = 'cm') {
      const parts = [];
      if (dx) parts.push(`${dx > 0 ? '오른쪽' : '왼쪽'}으로 ${Math.abs(dx)}${unit === 'cm' ? ' cm' : '칸'}`);
      if (dy) parts.push(`${dy > 0 ? '아래쪽' : '위쪽'}으로 ${Math.abs(dy)}${unit === 'cm' ? ' cm' : '칸'}`);
      return parts.length ? parts.join(', ') : '제자리';
    }
    function randMoves(two) {
      const h = [pick(['R', 'L']), randInt(1, 5)];
      const v = [pick(['U', 'D']), randInt(1, 4)];
      if (!two) return [Math.random() < 0.55 ? h : v];
      return Math.random() < 0.5 ? [h, v] : [v, h];
    }
    const NAMES = ['동연', '하윤', '서준', '지유', '민혜', '도윤', '채원', '소율', '준우', '은서'];

    /* ---------- 1. 점 이동하기 (누르기) ---------- */
    function makePtMove() {
      const two = modeOpt === 'two' ? true : modeOpt === 'one' ? false : Math.random() < 0.55;
      const cols = 8;
      const rows = 6;
      for (let t = 0; t < 200; t += 1) {
        const moves = randMoves(two);
        const [dx, dy] = offOf(moves);
        const x0 = randInt(0, cols);
        const y0 = randInt(0, rows);
        const tx = x0 + dx;
        const ty = y0 + dy;
        if (tx < 0 || tx > cols || ty < 0 || ty > rows) continue;
        const robot = Math.random() < 0.3;
        return {
          kind: 'ptmove', key: `pm${x0}${y0}${moves.flat().join('')}`, cols, rows, start: [x0, y0], target: [tx, ty], moves, robot,
          prompt: robot ? `로봇 로니가 <b>${moveTxt(moves)}</b> 이동했어요. 로니가 도착한 곳을 눌러 보세요.` : `점 ㄱ을 <b>${moveTxt(moves)}</b> 이동했을 때의 위치를 눌러 보세요.`,
          speech: robot ? `로봇 로니가 ${moveSay(moves)} 이동했어요. 도착한 곳을 눌러 보세요.` : `점 기역을 ${moveSay(moves)} 이동했을 때의 위치를 눌러 보세요.`
        };
      }
      return makePtDesc();
    }

    /* ---------- 2. 점의 이동 설명하기 ---------- */
    function ptGrid(start, end, o = {}) {
      const pts = [{ x: start[0], y: start[1], color: '#8a96a6', lab: o.robot ? '' : 'ㄴ', tag: o.home ? '' : '이동 전', emoji: o.home ? '🏠' : '', tagBg: '#fde3c4' }];
      if (end) pts.push({ x: end[0], y: end[1], color: '#1d2838', lab: o.robot ? '' : 'ㄴ', tag: o.home ? '' : '이동 후', emoji: o.home ? '🏫' : '', tagBg: '#cdeef6' });
      return gridSvg({ cols: o.cols || 8, rows: o.rows || 6, cell: 30, cm: !QCTX.narrow, points: pts, extra: o.extra, cls: `${o.cls || 'mg-q'}${QCTX.narrow ? ' big' : ''}` });
    }
    function makePtDesc() {
      const r = Math.random();
      // 좁은 칸(5~6명)에서는 모눈을 줄이고 글씨를 키운다
      const cols = QCTX.narrow ? 6 : 8;
      const rows = QCTX.narrow ? 5 : 6;
      for (let t = 0; t < 300; t += 1) {
        const two = r >= 0.3;
        const moves = randMoves(two);
        const off = offOf(moves);
        const x0 = randInt(0, cols);
        const y0 = randInt(0, rows);
        const end = [x0 + off[0], y0 + off[1]];
        if (end[0] < 0 || end[0] > cols || end[1] < 0 || end[1] > rows) continue;
        if (r < 0.3) {
          const [d, n] = moves[0];
          const opp = { R: 'L', L: 'R', U: 'D', D: 'U' }[d];
          const perp = pick(d === 'R' || d === 'L' ? ['U', 'D'] : ['R', 'L']);
          const ans = `${DIR[d]}으로 ${n} cm 이동했어요.`;
          return {
            kind: 'choice', key: `pd1${x0}${y0}${d}${n}`, ans, txt: true,
            choices: mkChoices(ans, [`${DIR[opp]}으로 ${n} cm 이동했어요.`, `${DIR[d]}으로 ${n + 1} cm 이동했어요.`, n > 1 ? `${DIR[d]}으로 ${n - 1} cm 이동했어요.` : `${DIR[perp]}으로 ${n} cm 이동했어요.`, `${DIR[perp]}으로 ${n} cm 이동했어요.`]),
            prompt: '점 ㄴ을 어떻게 이동했을까요?',
            visual: ptGrid([x0, y0], end, { cols, rows }),
            speech: '점 니은을 어떻게 이동했을까요? 몇 칸 움직였는지 세어 보세요.',
            explain: `${DIR[d]}으로 ${n}칸, 한 칸이 1 cm이므로 ${n} cm`
          };
        }
        if (r < 0.55) {
          // 점이 도착할 곳 고르기 (가~라)
          const cands = [end];
          const tries = [[off[0], -off[1]], [-off[0], off[1]], [off[1], off[0]], [off[0] + 1, off[1]], [off[0], off[1] - 1], [-off[0], -off[1]]];
          shuffle(tries).forEach(([ax, ay]) => {
            const c = [x0 + ax, y0 + ay];
            if (cands.length < 4 && c[0] >= 0 && c[0] <= cols && c[1] >= 0 && c[1] <= rows && !cands.some((q) => q[0] === c[0] && q[1] === c[1]) && !(c[0] === x0 && c[1] === y0)) cands.push(c);
          });
          if (cands.length < 4) continue;
          const order = shuffle(cands);
          const labs = ['가', '나', '다', '라'];
          const ai = order.findIndex((c) => c === end);
          const robot = Math.random() < 0.4;
          const extra = ({ X, Y }) => order.map((c, i) => `<circle cx="${X(c[0])}" cy="${Y(c[1])}" r="5" fill="#3a7ff2"/><text x="${X(c[0]) + 8}" y="${Y(c[1]) - 6}" class="mlab blue">${labs[i]}</text>`).join('');
          return {
            kind: 'choice', key: `pw${x0}${y0}${moves.flat().join('')}`, ans: labs[ai], txt: true, cols: 4,
            choices: labs.map((l) => ({ v: l, html: l })),
            prompt: robot ? `🏠 집에서 <b>${moveTxt(moves)}</b> 이동하면 어디에 도착할까요?` : `점 ㄱ을 <b>${moveTxt(moves)}</b> 이동한 곳은 어디일까요?`,
            visual: gridSvg({ cols, rows, cell: 30, cm: !QCTX.narrow, points: [{ x: x0, y: y0, color: '#8a96a6', lab: robot ? '' : 'ㄱ', emoji: robot ? '🏠' : '' }], extra, cls: `mg-q${QCTX.narrow ? ' big' : ''}` }),
            speech: robot ? `집에서 ${moveSay(moves)} 이동하면 어디에 도착할까요?` : `점 기역을 ${moveSay(moves)} 이동한 곳은 어디일까요?`,
            explain: `${moveTxt(moves)} 이동하면 ${labs[ai]}에 도착해요.`
          };
        }
        if (moves.length < 2) continue;
        const rev = [moves[1], moves[0]];
        const home = Math.random() < 0.35;
        const fakes = shuffle([
          [moves[0], [moves[1][0], moves[1][1] + 1]],
          [[{ R: 'L', L: 'R', U: 'D', D: 'U' }[moves[0][0]], moves[0][1]], moves[1]],
          [moves[0], [{ R: 'L', L: 'R', U: 'D', D: 'U' }[moves[1][0]], moves[1][1]]],
          [[moves[0][0], moves[1][1]], [moves[1][0], moves[0][1]]]
        ]).filter((m) => { const o = offOf(m); return o[0] !== off[0] || o[1] !== off[1]; });
        const say = (m) => `${DIR[m[0][0]]}으로 ${m[0][1]} cm 이동하고, ${DIR[m[1][0]]}으로 ${m[1][1]} cm 이동했어요.`;
        const subj = home ? '로봇 로니가 🏠 집에서 🏫 학교까지' : '점 ㄴ을';
        if (Math.random() < 0.35) {
          const names = shuffle(NAMES);
          const items = shuffle([{ v: 'w', t: say(fakes[0]) }, { v: 'a', t: say(moves) }, { v: 'b', t: say(rev) }]);
          return {
            kind: 'choice', key: `pdw${x0}${y0}${moves.flat().join('')}`, ans: 'w', txt: true, cols: 1,
            choices: items.map((it, i) => ({ v: it.v, html: `<b class="who">${names[i]}</b> ${it.t}` })),
            prompt: `${subj} 어떻게 이동했는지 <b>잘못</b> 설명한 친구를 찾아보세요.`,
            visual: ptGrid([x0, y0], end, { home, cols, rows }),
            speech: `${stripTags(subj)} 어떻게 이동했는지 잘못 설명한 친구를 찾아보세요.`,
            explain: `${moveTxt(moves)} 이동했어요. 순서를 바꿔 이동해도 같은 곳에 도착해요.`
          };
        }
        const ans = say(moves);
        return {
          kind: 'choice', key: `pd2${x0}${y0}${moves.flat().join('')}`, ans, txt: true, cols: 1,
          choices: mkChoices(ans, fakes.map(say)),
          prompt: `${subj} 어떻게 이동했는지 <b>바르게</b> 설명한 것을 찾아보세요.`,
          visual: ptGrid([x0, y0], end, { home }),
          speech: `${stripTags(subj)} 어떻게 이동했는지 바르게 설명한 것을 찾아보세요.`,
          explain: `가로로 ${Math.abs(off[0])}칸, 세로로 ${Math.abs(off[1])}칸 움직였어요.`
        };
      }
      return makePtMove();
    }

    /* ---------- 3. 도형 밀기 (화살표) ---------- */
    function placeShape(S, cols, rows, off) {
      const [w, h] = sizeOf(S.pts);
      const xs = [];
      for (let x = 0; x + w <= cols; x += 1) if (x + off[0] >= 0 && x + off[0] + w <= cols) xs.push(x);
      const ys = [];
      for (let y = 0; y + h <= rows; y += 1) if (y + off[1] >= 0 && y + off[1] + h <= rows) ys.push(y);
      if (!xs.length || !ys.length) return null;
      return shiftPts(S.pts, pick(xs), pick(ys));
    }
    function makeSlide() {
      const cols = 10;
      const rows = 7;
      for (let t = 0; t < 100; t += 1) {
        const S = pickShape();
        const moves = randMoves(Math.random() < 0.35);
        const off = offOf(moves);
        const pts = placeShape(S, cols, rows, off);
        if (!pts) continue;
        return {
          kind: 'slide', key: `sl${S.id}${moves.flat().join('')}`, cols, rows, pts, off, color: S.color, moves,
          prompt: `도형을 <b>${moveTxt(moves)}</b> 밀어 보세요.`,
          speech: `도형을 ${moveSay(moves)} 밀어 보세요. 화살표 버튼을 누르면 한 칸씩 움직여요.`
        };
      }
      return makeSlidePick();
    }

    /* ---------- 4. 밀었을 때의 도형 ---------- */
    function slideCard(base, moved, cols, rows, fill) {
      return gridSvg({ cols, rows, cell: 18, pad: 4, shapes: [{ pts: base, fill: '#e9eef3', stroke: '#8a96a6', sw: 1.6, dash: true }, { pts: moved, fill, sw: 2.2 }], cls: 'card-m' });
    }
    function makeSlidePick() {
      const cols = 9;
      const rows = 6;
      for (let t = 0; t < 200; t += 1) {
        const S = pickShape();
        const moves = randMoves(Math.random() < 0.3);
        const off = offOf(moves);
        const base = placeShape(S, cols, rows, off);
        if (!base) continue;
        const [w, h] = sizeOf(base);
        const ok = (pts) => pts.every(([x, y]) => x >= 0 && x <= cols && y >= 0 && y <= rows);
        const right = shiftPts(base, off[0], off[1]);
        const cands = [];
        // 거리가 틀린 것
        const off2 = off[0] ? [off[0] + (off[0] > 0 ? pick([-1, 1]) : pick([-1, 1])), off[1]] : [off[0], off[1] + pick([-1, 1])];
        if (off2[0] || off2[1]) cands.push({ v: 'dist', pts: shiftPts(base, off2[0], off2[1]), why: '밀어야 하는 거리가 달라요.' });
        // 모양이 바뀐 것 (뒤집기·돌리기)
        const turned = applyOps(base, pick([['flipH'], ['flipV'], ['cw'], ['ccw']]));
        const tb = sizeOf(turned);
        const tx = Math.min(...right.map((p) => p[0]));
        const ty = Math.min(...right.map((p) => p[1]));
        cands.push({ v: 'turn', pts: shiftPts(turned, Math.min(tx, cols - tb[0]), Math.min(ty, rows - tb[1])), why: '밀기를 하면 모양과 방향이 바뀌지 않아요.' });
        // 방향이 틀린 것
        cands.push({ v: 'dir', pts: shiftPts(base, -off[0], -off[1]), why: '미는 방향이 달라요.' });
        cands.push({ v: 'swap', pts: shiftPts(base, off[1], off[0]), why: '미는 방향이 달라요.' });
        const seen = new Set([shapeKey(right)]);
        const ds = cands.filter((c) => ok(c.pts) && !seen.has(shapeKey(c.pts)) && seen.add(shapeKey(c.pts))).slice(0, 3);
        if (ds.length < 3 || !ok(right) || w > cols || h > rows) continue;
        const fill = S.color;
        return {
          kind: 'choice', key: `sp${S.id}${moves.flat().join('')}`, ans: 'ok', figs: true,
          choices: shuffle([{ v: 'ok', html: slideCard(base, right, cols, rows, fill) }, ...ds.map((c) => ({ v: c.v, html: slideCard(base, c.pts, cols, rows, fill) }))]),
          prompt: `점선 도형을 <b>${moveTxt(moves)}</b> 밀었을 때의 도형을 찾아보세요.`,
          speech: `점선 도형을 ${moveSay(moves)} 밀었을 때의 도형을 찾아보세요.`,
          explain: '도형을 밀면 위치만 바뀌고, 모양과 방향은 그대로예요.',
          wrongWhy: Object.fromEntries(ds.map((c) => [c.v, c.why]))
        };
      }
      return makePtDesc();
    }

    /* ---------- 5. 어떻게 밀었을까? ---------- */
    function makeSlideDesc() {
      const cols = QCTX.narrow ? 8 : 10;
      const rows = QCTX.narrow ? 6 : 7;
      for (let t = 0; t < 200; t += 1) {
        const S = pickShape();
        const moves = randMoves(Math.random() < 0.45);
        const off = offOf(moves);
        const base = placeShape(S, cols, rows, off);
        if (!base) continue;
        const after = shiftPts(base, off[0], off[1]);
        const visual = gridSvg({ cols, rows, cell: 27, cm: !QCTX.narrow, shapes: [{ pts: base, fill: '#e9eef3', stroke: '#8a96a6', sw: 1.8, dash: true, lab: '이동 전' }, { pts: after, fill: S.color, sw: 2.4, lab: '이동 후' }], cls: `mg-q${QCTX.narrow ? ' big' : ''}` });
        const ans = `${moveTxt(moves)} 밀었어요.`;
        const alt = [];
        const flipD = { R: 'L', L: 'R', U: 'D', D: 'U' };
        alt.push(moves.map(([d, n]) => [flipD[d], n]));
        alt.push(moves.map(([d, n], i) => [d, i === 0 ? n + 1 : n]));
        if (moves.length === 2) { alt.push([[moves[0][0], moves[1][1]], [moves[1][0], moves[0][1]]]); alt.push([moves[0]]); }
        else { alt.push([[moves[0][0], Math.max(1, moves[0][1] - 1)]]); alt.push([[{ R: 'D', L: 'U', U: 'R', D: 'L' }[moves[0][0]], moves[0][1]]]); }
        const fakes = alt.filter((m) => { const o = offOf(m); return o[0] !== off[0] || o[1] !== off[1]; }).map((m) => `${moveTxt(m)} 밀었어요.`);
        return {
          kind: 'choice', key: `sd${S.id}${moves.flat().join('')}`, ans, txt: true, cols: 1,
          choices: mkChoices(ans, shuffle(fakes)),
          prompt: '도형을 어떻게 밀었는지 바르게 설명한 것을 찾아보세요.',
          visual,
          speech: '도형을 어떻게 밀었는지 바르게 설명한 것을 찾아보세요. 꼭짓점 하나를 정해 몇 칸 움직였는지 세어 보세요.',
          explain: `꼭짓점 하나가 ${offTxt(off, '칸')} 움직였어요. 한 칸은 1 cm예요.`
        };
      }
      return makePtDesc();
    }

    /* ---------- 6. 자동차 탈출 ---------- */
    const CAR_COLORS = [['초록', '#2fbf71'], ['파란', '#3a7ff2'], ['빨간', '#ff5b4f'], ['보라', '#8b5cf0'], ['주황', '#ff8a3d'], ['하늘색', '#5bc8f5']];
    const CAR_N = 6;
    const CAR_ROW = 2;
    function carCells(c) { return Array.from({ length: c.len }, (_, k) => (c.h ? [c.x + k, c.y] : [c.x, c.y + k])); }
    function carFree(cars, i, dx, dy) {
      const c = cars[i];
      const moved = { ...c, x: c.x + dx, y: c.y + dy };
      const cells = carCells(moved);
      if (cells.some(([x, y]) => x < 0 || y < 0 || x >= CAR_N || y >= CAR_N)) return false;
      const occ = new Set();
      cars.forEach((o, j) => { if (j !== i) carCells(o).forEach(([x, y]) => occ.add(`${x},${y}`)); });
      return cells.every(([x, y]) => !occ.has(`${x},${y}`));
    }
    function carSolve(cars, limit = 4000) {
      const key = (cs) => cs.map((c) => `${c.x},${c.y}`).join(';');
      const start = key(cars);
      const seen = new Map([[start, 0]]);
      let frontier = [cars];
      for (let d = 0; d < 40; d += 1) {
        const next = [];
        for (const cs of frontier) {
          if (cs[0].x + cs[0].len === CAR_N) return d;
          cs.forEach((c, i) => {
            const dirs = c.h ? [[1, 0], [-1, 0]] : [[0, 1], [0, -1]];
            dirs.forEach(([dx, dy]) => {
              if (!carFree(cs, i, dx, dy)) return;
              const ns = cs.map((o, j) => (j === i ? { ...o, x: o.x + dx, y: o.y + dy } : o));
              const k = key(ns);
              if (seen.has(k)) return;
              seen.set(k, d + 1);
              next.push(ns);
            });
          });
        }
        if (seen.size > limit || !next.length) return -1;
        frontier = next;
      }
      return -1;
    }
    function makeCar() {
      for (let t = 0; t < 300; t += 1) {
        const cars = [{ x: randInt(0, 1), y: CAR_ROW, len: 2, h: true, name: '노란', color: '#ffc82c' }];
        const want = randInt(3, 5);
        const cols = shuffle(CAR_COLORS);
        let guard = 0;
        // 노란 차 앞을 막는 세로 자동차부터
        while (cars.length < want + 1 && guard < 80) {
          guard += 1;
          const blocker = cars.length <= 2;
          const h = blocker ? false : Math.random() < 0.5;
          const len = Math.random() < 0.7 ? 2 : 3;
          const c = h ? { x: randInt(0, CAR_N - len), y: pick([0, 1, 3, 4, 5]), len, h } : { x: blocker ? randInt(cars[0].x + 2, CAR_N - 1) : randInt(0, CAR_N - 1), y: blocker ? randInt(Math.max(0, CAR_ROW - len + 1), CAR_ROW) : randInt(0, CAR_N - len), len, h };
          const occ = new Set(cars.flatMap(carCells).map(([x, y]) => `${x},${y}`));
          if (carCells(c).some(([x, y]) => occ.has(`${x},${y}`))) continue;
          const [nm, color] = cols[cars.length - 1];
          cars.push({ ...c, name: nm, color });
        }
        if (cars.length < 3) continue;
        const d = carSolve(cars);
        if (d < 4 || d > 11) continue;
        return {
          kind: 'car', key: `car${cars.map((c) => `${c.x}${c.y}${c.len}`).join('')}`, cars, best: d,
          prompt: '자동차를 밀어서 <b>노란색 자동차</b>를 출구로 내보내요.',
          speech: '자동차를 눌러 고르고 화살표로 밀어서 노란색 자동차를 출구로 내보내요. 자동차는 앞뒤로만 움직일 수 있어요.'
        };
      }
      return makeSlide();
    }

    /* ---------- 7. 뒤집었을 때의 도형 ---------- */
    const opChip = (txt, ic = '') => `<span class="op-chip">${ic}${txt}</span>`;
    function poseChoices(S, ansOps, n = 4) {
      const ansKey = canon(applyOps(S.pts, ansOps));
      const seen = new Set([ansKey]);
      const out = [{ v: 'ok', pts: applyOps(S.pts, ansOps) }];
      shuffle(POSES).forEach((ops, i) => {
        if (out.length >= n) return;
        const pts = applyOps(S.pts, ops);
        const k = canon(pts);
        if (seen.has(k)) return;
        seen.add(k);
        out.push({ v: `d${i}`, pts });
      });
      return shuffle(out).map((c) => ({ v: c.v, html: shapeCard(c.pts, { fill: S.color, cols: 5, rows: 5 }) }));
    }
    function makeFlipPick() {
      const S = pickShape();
      const d = pick(['R', 'L', 'U', 'D']);
      const ops = [FLIP_OF[d]];
      return {
        kind: 'choice', key: `fp${S.id}${d}`, ans: 'ok', figs: true,
        choices: poseChoices(S, ops),
        prompt: `도형을 <b>${DIR[d]}으로 뒤집었을 때</b>의 도형을 찾아보세요.`,
        visual: `<div class="ref">${shapeCard(S.pts, { fill: S.color, cls: 'ref-m' })}${opChip(`${DIR[d]}으로 뒤집기`, d === 'R' || d === 'L' ? '⇆ ' : '⇅ ')}</div>`,
        speech: `도형을 ${DIR[d]}으로 뒤집었을 때의 도형을 찾아보세요.`,
        explain: d === 'R' || d === 'L' ? '왼쪽이나 오른쪽으로 뒤집으면 도형의 왼쪽과 오른쪽이 서로 바뀌어요.' : '위쪽이나 아래쪽으로 뒤집으면 도형의 위쪽과 아래쪽이 서로 바뀌어요.'
      };
    }

    /* ---------- 8. 어떻게 뒤집었을까? ---------- */
    function describeChoices(S, ansOps, ansTxt, pool) {
      const ansKey = canon(applyOps(S.pts, ansOps));
      const seen = new Set([ansKey]);
      const ds = [];
      shuffle(pool).forEach(([txt, ops]) => {
        const k = canon(applyOps(S.pts, ops));
        if (ds.length >= 3 || seen.has(k)) return;
        seen.add(k);
        ds.push(txt);
      });
      return mkChoices(ansTxt, ds);
    }
    const FLIP_POOL = () => [
      [`${pick(['오른쪽', '왼쪽'])}으로 뒤집었어요.`, ['flipH']],
      [`${pick(['위쪽', '아래쪽'])}으로 뒤집었어요.`, ['flipV']],
      ['시계 방향으로 90°만큼 돌렸어요.', ['cw']],
      ['시계 방향으로 180°만큼 돌렸어요.', ['cw', 'cw']],
      ['시계 반대 방향으로 90°만큼 돌렸어요.', ['ccw']],
      ['오른쪽으로 밀었어요.', []]
    ];
    function makeFlipDesc() {
      const S = pickShape();
      const d = pick(['R', 'L', 'U', 'D']);
      const ops = [FLIP_OF[d]];
      const pool = FLIP_POOL();
      const ansTxt = pool.find(([, o]) => o[0] === ops[0])[0];
      return {
        kind: 'choice', key: `fd${S.id}${ops[0]}`, ans: ansTxt, txt: true, cols: 1,
        choices: describeChoices(S, ops, ansTxt, pool.filter(([t]) => t !== ansTxt)),
        prompt: '도형을 어떻게 움직였는지 알맞은 것을 찾아보세요.',
        visual: beforeAfter(S.pts, applyOps(S.pts, ops), { f1: S.color }),
        speech: '도형을 어떻게 움직였는지 알맞은 것을 찾아보세요.',
        explain: ops[0] === 'flipH' ? '왼쪽과 오른쪽이 서로 바뀌었어요. 오른쪽으로 뒤집어도, 왼쪽으로 뒤집어도 결과가 같아요.' : '위쪽과 아래쪽이 서로 바뀌었어요. 위쪽으로 뒤집어도, 아래쪽으로 뒤집어도 결과가 같아요.'
      };
    }

    /* ---------- 9·14. 도형 그리기 (뒤집기 · 돌리기) ---------- */
    function makeDraw(kindOp) {
      const S = pickShape({ ids: SHAPES.filter((s) => Math.max(...sizeOf(s.pts)) <= 4).map((s) => s.id) });
      let ops;
      let opTxt;
      let ic;
      if (kindOp === 'flip') {
        const d = pick(['R', 'L', 'U', 'D']);
        ops = [FLIP_OF[d]];
        opTxt = `${DIR[d]}으로 뒤집었을 때`;
        ic = d === 'R' || d === 'L' ? '⇆' : '⇅';
      } else {
        const deg = pick([90, 90, 180, 270]);
        const cw = Math.random() < 0.5;
        ops = rotOps(deg, cw);
        opTxt = `${turnTxt(deg, cw)} 돌렸을 때`;
        ic = cw ? '↻' : '↺';
      }
      const target = applyOps(S.pts, ops);
      return {
        kind: 'draw', key: `dr${S.id}${ops.join('')}`, src: S.pts, color: S.color, target: canon(target), targetPts: target, cols: 6, rows: 6, ic,
        prompt: `도형을 <b>${opTxt}</b>의 도형을 그려 보세요.`,
        speech: `도형을 ${stripTags(opTxt).replace('°', '도')}의 도형을 그려 보세요. 점을 차례로 누르고, 처음 점을 다시 누르면 완성이에요.`
      };
    }

    /* ---------- 10. 글자 뒤집기 · 도장 ---------- */
    const WORDS_W = ['4-3', '2-5', '3-1', '5-2', '1-4', '가나', '수학', '도형', '하늘'];
    const WORDS_S = ['오이', '가지', '수박', '하늘', '도형', '나무', '별', '사과'];
    function makeFlipText() {
      const t = pick(['window', 'stamp', 'stamp', 'print']);
      if (t === 'window') {
        const w = pick(WORDS_W);
        return {
          kind: 'choice', key: `ft${t}${w}`, ans: 'flipH', figs: true, cols: 4,
          choices: shuffle(['flipH', 'same', 'flipV', 'rot'].map((tf) => ({ v: tf, html: wordSvg(w, tf) }))),
          prompt: `교실 밖에서 보았을 때 <b>${w}</b>${roEuro(w)} 보이도록 창문 안쪽에 쓰려고 해요. 어떻게 써야 할까요?`,
          speech: `교실 밖에서 보았을 때 ${w}${roEuro(w)} 보이도록 창문 안쪽에 쓰려고 해요. 어떻게 써야 할까요?`,
          explain: '창문 안쪽에서 쓴 글자는 밖에서 보면 왼쪽과 오른쪽이 바뀌어 보여요. 그래서 오른쪽으로 뒤집은 모양으로 써요.'
        };
      }
      const w = pick(WORDS_S);
      if (t === 'stamp') {
        return {
          kind: 'choice', key: `ft${t}${w}`, ans: 'flipH', figs: true, cols: 4,
          choices: shuffle(['flipH', 'same', 'flipV', 'rot'].map((tf) => ({ v: tf, html: wordSvg(w, tf, { stamp: true }) }))),
          prompt: `도장을 찍었을 때 <b>${w}</b>${iGa(w)} 바르게 찍히는 도장을 찾아보세요.`,
          visual: wordSvg(w, 'same', { bg: '#fff' }),
          speech: `도장을 찍었을 때 ${w}${iGa(w)} 바르게 찍히는 도장을 찾아보세요.`,
          explain: '도장을 찍으면 왼쪽과 오른쪽이 바뀌어요. 그래서 도장에는 글자를 오른쪽으로 뒤집은 모양으로 새겨요.'
        };
      }
      return {
        kind: 'choice', key: `ft${t}${w}`, ans: 'same', figs: true, cols: 4,
        choices: shuffle(['flipH', 'same', 'flipV', 'rot'].map((tf) => ({ v: tf, html: wordSvg(w, tf, { bg: '#fff' }) }))),
        prompt: '이 도장을 종이에 찍으면 어떤 모양이 될까요?',
        visual: wordSvg(w, 'flipH', { stamp: true }),
        speech: '이 도장을 종이에 찍으면 어떤 모양이 될까요?',
        explain: `도장의 글자를 왼쪽과 오른쪽이 바뀌게 찍으니 '${w}'${eunNeun(w)} 바르게 보여요.`
      };
    }

    /* ---------- 11. 돌렸을 때의 도형 ---------- */
    function makeTurnPick() {
      const S = pickShape();
      const deg = pick([90, 90, 180, 270, 270]);
      const cw = Math.random() < 0.5;
      const ops = rotOps(deg, cw);
      return {
        kind: 'choice', key: `tp${S.id}${deg}${cw}`, ans: 'ok', figs: true,
        choices: poseChoices(S, ops),
        prompt: `도형을 <b>${turnTxt(deg, cw)}</b> 돌렸을 때의 도형을 찾아보세요.`,
        visual: `<div class="ref">${shapeCard(S.pts, { fill: S.color, cls: 'ref-m' })}${opChip(turnTxt(deg, cw), cw ? '↻ ' : '↺ ')}</div>`,
        speech: `도형을 ${turnSay(deg, cw)} 돌렸을 때의 도형을 찾아보세요.`,
        explain: deg === 180 ? '180°만큼 돌리면 위쪽은 아래쪽으로, 왼쪽은 오른쪽으로 가요. 방향과 관계없이 결과가 같아요.' : `${cw ? '시계' : '시계 반대'} 방향으로 ${deg}°만큼 돌리면 도형의 위쪽이 ${(cw ? deg : 360 - deg) === 90 ? '오른쪽' : '왼쪽'}으로 가요.`
      };
    }

    /* ---------- 12. 어떻게 돌렸을까? ---------- */
    const TURN_POOL = () => [
      ['시계 방향으로 90°만큼 돌렸어요.', ['cw']],
      ['시계 방향으로 180°만큼 돌렸어요.', ['cw', 'cw']],
      ['시계 방향으로 270°만큼 돌렸어요.', ['cw', 'cw', 'cw']],
      ['시계 반대 방향으로 90°만큼 돌렸어요.', ['ccw']],
      ['시계 반대 방향으로 180°만큼 돌렸어요.', ['ccw', 'ccw']],
      ['시계 반대 방향으로 270°만큼 돌렸어요.', ['ccw', 'ccw', 'ccw']],
      [`${pick(['오른쪽', '왼쪽'])}으로 뒤집었어요.`, ['flipH']],
      [`${pick(['위쪽', '아래쪽'])}으로 뒤집었어요.`, ['flipV']]
    ];
    function makeTurnDesc() {
      const S = pickShape();
      const pool = TURN_POOL();
      const [ansTxt, ops] = pick(pool.slice(0, 6));
      return {
        kind: 'choice', key: `td${S.id}${ops.join('')}`, ans: ansTxt, txt: true, cols: 1,
        choices: describeChoices(S, ops, ansTxt, pool.filter(([t]) => t !== ansTxt)),
        prompt: '돌리기 전과 돌린 후의 도형을 보고 알맞은 것을 찾아보세요.',
        visual: beforeAfter(S.pts, applyOps(S.pts, ops), { f1: S.color, l1: '돌리기 전', l2: '돌린 후' }),
        speech: '돌리기 전과 돌린 후의 도형을 보고 알맞은 것을 찾아보세요. 도형의 위쪽이 어디로 갔는지 살펴보세요.',
        explain: `${ansTxt.replace('돌렸어요.', '돌리면 이렇게 돼요.')}`
      };
    }

    /* ---------- 13. 같은 결과 찾기 ---------- */
    function makeTurnSame() {
      const S = pickShape();
      const opts = [
        ['시계 방향으로 90°', ['cw']], ['시계 방향으로 180°', ['cw', 'cw']], ['시계 방향으로 270°', ['cw', 'cw', 'cw']], ['시계 방향으로 360°', []],
        ['시계 반대 방향으로 90°', ['ccw']], ['시계 반대 방향으로 180°', ['ccw', 'ccw']], ['시계 반대 방향으로 270°', ['ccw', 'ccw', 'ccw']]
      ];
      for (let t = 0; t < 50; t += 1) {
        const [q, ops] = pick(opts.filter(([, o]) => o.length));
        const k = canon(applyOps(S.pts, ops));
        const same = opts.filter(([tx, o]) => tx !== q && canon(applyOps(S.pts, o)) === k);
        if (!same.length) continue;
        const ans = `${pick(same)[0]}만큼 돌린 도형`;
        const ds = shuffle(opts.filter(([tx, o]) => tx !== q && canon(applyOps(S.pts, o)) !== k)).map(([tx]) => `${tx}만큼 돌린 도형`);
        return {
          kind: 'choice', key: `ts${q}`, ans, txt: true, cols: 1,
          choices: mkChoices(ans, ds),
          prompt: `도형을 <b>${q}만큼</b> 돌린 도형과 <b>같은</b> 것은 무엇일까요?`,
          visual: beforeAfter(S.pts, applyOps(S.pts, ops), { f1: S.color, l1: '돌리기 전', l2: `${q.replace('시계 반대 방향으로', '↺').replace('시계 방향으로', '↻')}` }),
          speech: `도형을 ${q.replace('°', '도')}만큼 돌린 도형과 같은 것은 무엇일까요?`,
          explain: `${q}만큼 돌린 것과 ${ans.replace(' 돌린 도형', '')} 돌린 것은 결과가 같아요.`
        };
      }
      return makeTurnPick();
    }

    /* ---------- 15. 퍼즐 조각 돌리기 · 모양 맞추기 ---------- */
    function makePose(all) {
      const S = pickShape({ ids: SHAPES.filter((s) => Math.max(...sizeOf(s.pts)) <= 4).map((s) => s.id) });
      const list = all ? POSES.slice(1) : [['cw'], ['cw', 'cw'], ['ccw']];
      const ops = pick(list);
      const target = applyOps(S.pts, ops);
      return {
        kind: 'pose', key: `po${S.id}${ops.join('')}`, src: S.pts, color: S.color, target: canon(target), targetPts: target,
        ops: all ? ['flipH', 'flipV', 'cw', 'ccw'] : ['ccw', 'cw'], puzzle: !all,
        prompt: all ? '버튼으로 조각을 뒤집고 돌려서 <b>점선 모양</b>과 똑같이 만들어 보세요.' : '마지막 퍼즐 조각을 <b>돌려서</b> 빈 곳에 꼭 맞게 넣어 보세요.',
        speech: all ? '버튼으로 조각을 뒤집고 돌려서 점선 모양과 똑같이 만들어 보세요.' : '마지막 퍼즐 조각을 돌려서 빈 곳에 꼭 맞게 넣어 보세요.'
      };
    }

    /* ---------- 16~18. 무늬 ---------- */
    const PAT_METHODS = {
      slide: { txt: '오른쪽으로 밀기를 반복해서 만들었어요.', grid: (b) => [[0, 1, 2, 3].map(() => b)] },
      flipR: { txt: '오른쪽으로 뒤집기를 반복해서 만들었어요.', grid: (b) => [[0, 1, 2, 3].map((c) => (c % 2 ? poseFromOps([...poseOps(b), 'flipH']) : b))] },
      turn: { txt: '시계 방향으로 90°씩 돌리기를 반복해서 만들었어요.', grid: (b) => [[0, 1, 2, 3].map((c) => poseFromOps([...poseOps(b), ...Array(c).fill('cw')]))] },
      flipRD: { txt: '오른쪽으로 뒤집기를 반복한 다음, 그 줄을 아래쪽으로 뒤집어서 만들었어요.', grid: (b) => { const row = PAT_METHODS.flipR.grid(b)[0]; return [row, row.map((p) => poseFromOps([...poseOps(p), 'flipV']))]; } }
    };
    function makeMHow() {
      const m = randInt(0, MOTIFS.length - 1);
      const base = pick([[0, 0], [0, 1], [1, 0], [0, 2]]);
      const k = pick(Object.keys(PAT_METHODS));
      const grid = PAT_METHODS[k].grid(base);
      return {
        kind: 'choice', key: `mh${m}${k}${base.join('')}`, ans: k, txt: true, cols: 1,
        choices: shuffle(Object.keys(PAT_METHODS).map((v) => ({ v, html: `${tileSvg(m, base, { cls: 'inl' })} 모양을 ${PAT_METHODS[v].txt}` }))),
        prompt: '이 무늬는 어떤 방법으로 만들었을까요?',
        visual: patternSvg(m, grid),
        speech: '이 무늬는 어떤 방법으로 만들었을까요? 모양이 어떻게 바뀌면서 반복되는지 살펴보세요.',
        explain: PAT_METHODS[k].txt
      };
    }
    // 빈칸이 있는 무늬 (2줄 × 4칸)
    function patternGrid() {
      const k = pick(['flipRD', 'flipRD', 'turn2', 'flipR2', 'turnRow']);
      const b = pick([[0, 0], [0, 1], [1, 0], [0, 3]]);
      let grid;
      let txt;
      if (k === 'flipRD') { grid = PAT_METHODS.flipRD.grid(b); txt = '오른쪽으로 뒤집고, 아래쪽으로 뒤집어서 만든 무늬예요.'; }
      else if (k === 'flipR2') { const row = PAT_METHODS.flipR.grid(b)[0]; grid = [row, row]; txt = '오른쪽으로 뒤집기를 반복한 줄을 아래쪽으로 밀어서 만든 무늬예요.'; }
      else if (k === 'turnRow') { const row = PAT_METHODS.turn.grid(b)[0]; grid = [row, row]; txt = '시계 방향으로 90°씩 돌리기를 반복한 무늬예요.'; }
      else {
        // 2×2 묶음: 시계 방향으로 돌려 꽃 모양
        const p = (n) => poseFromOps([...poseOps(b), ...Array(n).fill('cw')]);
        grid = [[p(0), p(1), p(0), p(1)], [p(3), p(2), p(3), p(2)]];
        txt = '2칸씩 시계 방향으로 90°씩 돌려서 만든 묶음을 오른쪽으로 밀어서 만든 무늬예요.';
      }
      return { grid, txt, k };
    }
    function makeMFill() {
      const m = randInt(0, MOTIFS.length - 1);
      const { grid, txt, k } = patternGrid();
      const r = randInt(0, 1);
      const c = randInt(1, 3);
      const ans = grid[r][c];
      const shown = grid.map((row, ri) => row.map((pz, ci) => (ri === r && ci === c ? 'blank' : pz)));
      const others = shuffle([0, 1].flatMap((f) => [0, 1, 2, 3].map((rr) => [f, rr])).filter((pz) => !poseEq(pz, ans))).slice(0, 3);
      const choices = shuffle([{ v: 'ok', pose: ans }, ...others.map((pz, i) => ({ v: `d${i}`, pose: pz }))]);
      return {
        kind: 'choice', key: `mf${m}${k}${r}${c}`, ans: 'ok', figs: true, cols: 4,
        choices: choices.map((ch) => ({ v: ch.v, html: tileSvg(m, ch.pose, { cls: 'choice-t' }) })),
        prompt: '규칙에 맞게 빈칸에 들어갈 모양을 골라 보세요.',
        visual: patternSvg(m, shown),
        speech: '무늬의 규칙을 찾아 빈칸에 들어갈 모양을 골라 보세요.',
        explain: txt
      };
    }
    function makeMMake() {
      const m = randInt(0, MOTIFS.length - 1);
      const { grid, txt, k } = patternGrid();
      const cells = shuffle([1, 2, 3, 5, 6, 7]).slice(0, randInt(2, 3)).sort((a, b) => a - b);
      const need = cells.map((i) => grid[Math.floor(i / 4)][i % 4]);
      const uniq = [];
      need.forEach((pz) => { if (!uniq.some((u) => poseEq(u, pz))) uniq.push(pz); });
      const extra = shuffle([0, 1].flatMap((f) => [0, 1, 2, 3].map((rr) => [f, rr])).filter((pz) => !uniq.some((u) => poseEq(u, pz))));
      const palette = shuffle([...uniq, ...extra].slice(0, 4));
      return {
        kind: 'tiles', key: `mm${m}${k}${cells.join('')}`, m, grid, blanks: cells, palette, txt,
        prompt: '규칙에 맞게 빈칸을 모두 채워 무늬를 완성해 보세요.',
        speech: '규칙에 맞게 빈칸을 모두 채워 무늬를 완성해 보세요. 빈칸을 누르고 아래에서 알맞은 모양을 골라요.'
      };
    }

    /* ---------- 19. 여러 번 움직이면? ---------- */
    const SAME_Q = [
      ['오른쪽으로 2번 뒤집은', ['flipH', 'flipH']], ['왼쪽으로 3번 뒤집은', ['flipH', 'flipH', 'flipH']], ['아래쪽으로 3번 뒤집은', ['flipV', 'flipV', 'flipV']],
      ['위쪽으로 4번 뒤집은', ['flipV', 'flipV', 'flipV', 'flipV']], ['시계 방향으로 90°만큼 4번 돌린', ['cw', 'cw', 'cw', 'cw']], ['시계 방향으로 90°만큼 2번 돌린', ['cw', 'cw']],
      ['시계 방향으로 270°만큼 돌린', ['cw', 'cw', 'cw']], ['시계 반대 방향으로 180°만큼 돌린', ['ccw', 'ccw']], ['시계 반대 방향으로 90°만큼 3번 돌린', ['ccw', 'ccw', 'ccw']],
      ['위쪽으로 뒤집고 다시 아래쪽으로 뒤집은', ['flipV', 'flipV']], ['시계 방향으로 360°만큼 돌린', []]
    ];
    const SAME_A = [
      ['처음 도형과 같아요.', []], ['오른쪽으로 1번 뒤집은 것과 같아요.', ['flipH']], ['아래쪽으로 1번 뒤집은 것과 같아요.', ['flipV']],
      ['시계 방향으로 90°만큼 돌린 것과 같아요.', ['cw']], ['시계 방향으로 180°만큼 돌린 것과 같아요.', ['cw', 'cw']], ['시계 반대 방향으로 90°만큼 돌린 것과 같아요.', ['ccw']]
    ];
    function makeXSame() {
      const S = pickShape();
      for (let t = 0; t < 40; t += 1) {
        const [q, ops] = pick(SAME_Q);
        const k = canon(applyOps(S.pts, ops));
        const hit = SAME_A.filter(([, o]) => canon(applyOps(S.pts, o)) === k);
        if (hit.length !== 1) continue;
        const ans = hit[0][0];
        if (q.startsWith(ans.slice(0, 6)) && ans !== SAME_A[0][0]) continue;
        return {
          kind: 'choice', key: `xs${q}`, ans, txt: true, cols: 1,
          choices: mkChoices(ans, shuffle(SAME_A.map(([a]) => a).filter((a) => a !== ans))),
          prompt: `도형을 <b>${q}</b> 도형은 어떤 도형과 같을까요?`,
          visual: shapeCard(S.pts, { fill: S.color, cls: 'ref-m' }),
          speech: `도형을 ${q.replace('°', '도')} 도형은 어떤 도형과 같을까요?`,
          explain: ops.every((o) => o.startsWith('flip')) ? '같은 쪽으로 2번 뒤집으면 처음 도형과 같아요. 그래서 짝수 번은 처음과 같고, 홀수 번은 1번 뒤집은 것과 같아요.' : '시계 방향으로 360°(90°만큼 4번) 돌리면 처음과 같아요. 시계 방향 270°는 시계 반대 방향 90°와 같아요.'
        };
      }
      return makeTurnSame();
    }

    /* ---------- 20. 설명 탐정 ---------- */
    const FIX_DESC = [
      ['도형을 오른쪽으로 뒤집었어요.', ['flipH']], ['도형을 왼쪽으로 뒤집었어요.', ['flipH']], ['도형을 왼쪽으로 3번 뒤집었어요.', ['flipH', 'flipH', 'flipH']],
      ['도형을 위쪽으로 뒤집었어요.', ['flipV']], ['도형을 아래쪽으로 뒤집었어요.', ['flipV']], ['도형을 아래쪽으로 3번 뒤집었어요.', ['flipV', 'flipV', 'flipV']],
      ['도형을 시계 방향으로 90°만큼 돌렸어요.', ['cw']], ['도형을 시계 반대 방향으로 270°만큼 돌렸어요.', ['ccw', 'ccw', 'ccw']], ['도형을 시계 방향으로 90°만큼 5번 돌렸어요.', ['cw', 'cw', 'cw', 'cw', 'cw']],
      ['도형을 시계 방향으로 180°만큼 돌렸어요.', ['cw', 'cw']], ['도형을 시계 반대 방향으로 180°만큼 돌렸어요.', ['ccw', 'ccw']], ['도형을 시계 방향으로 90°만큼 2번 돌렸어요.', ['cw', 'cw']],
      ['도형을 시계 반대 방향으로 90°만큼 돌렸어요.', ['ccw']], ['도형을 시계 방향으로 270°만큼 돌렸어요.', ['cw', 'cw', 'cw']]
    ];
    function makeXFix() {
      for (let t = 0; t < 60; t += 1) {
        const S = pickShape();
        const ops = pick([['flipH'], ['flipV'], ['cw'], ['cw', 'cw'], ['ccw']]);
        const k = canon(applyOps(S.pts, ops));
        const good = shuffle(FIX_DESC.filter(([, o]) => canon(applyOps(S.pts, o)) === k).map(([tx]) => tx));
        const bad = shuffle(FIX_DESC.filter(([, o]) => canon(applyOps(S.pts, o)) !== k).map(([tx]) => tx));
        if (good.length < 2) continue;
        const askWrong = good.length >= 3 ? Math.random() < 0.7 : true;
        const picks = askWrong ? [...good.slice(0, Math.min(3, good.length)), bad[0]] : [...bad.slice(0, 3), good[0]];
        const ans = picks[picks.length - 1];
        const names = shuffle(NAMES);
        const items = shuffle(picks);
        return {
          kind: 'choice', key: `xf${S.id}${ops.join('')}${ans}`, ans, txt: true, cols: 1,
          choices: items.map((tx, i) => ({ v: tx, html: `<b class="who">${names[i]}</b> ${tx}` })),
          prompt: askWrong ? '도형을 이동한 방법을 <b>잘못</b> 설명한 친구를 찾아보세요.' : '도형을 이동한 방법을 <b>바르게</b> 설명한 친구를 찾아보세요.',
          visual: beforeAfter(S.pts, applyOps(S.pts, ops), { f1: S.color }),
          speech: askWrong ? '도형을 이동한 방법을 잘못 설명한 친구를 찾아보세요.' : '도형을 이동한 방법을 바르게 설명한 친구를 찾아보세요.',
          explain: askWrong ? `"${ans}"는 이동 후의 도형과 달라요.` : `"${ans}"가 맞아요.`
        };
      }
      return makeXSame();
    }

    /* ---------- 단원 마무리 평가 ---------- */
    const EXAM_SECS = ['점의 이동', '밀기', '뒤집기', '돌리기', '무늬 만들기', '실력 다지기'];
    const EXAM_PLAN = [
      [makePtDesc, 0], [makePtDesc, 0], [makePtDesc, 0],
      [makeSlidePick, 1], [makeSlideDesc, 1], [makeSlideDesc, 1],
      [makeFlipPick, 2], [makeFlipPick, 2], [makeFlipDesc, 2], [makeFlipText, 2],
      [makeTurnPick, 3], [makeTurnPick, 3], [makeTurnDesc, 3], [makeTurnSame, 3],
      [makeMHow, 4], [makeMFill, 4],
      [makeXSame, 5], [makeXSame, 5], [makeXFix, 5], [makeXFix, 5]
    ];
    function examMake(i) {
      const [mk, sec] = EXAM_PLAN[i];
      return { ...withOpt('all', mk), sec: EXAM_SECS[sec] };
    }
    function buildExamQueue() { return EXAM_PLAN.map((_, i) => examMake(i)); }
    function examQuestionFor(idx) {
      const queue = examQueues[idx];
      if (!queue) return null;
      return queue[examIndex[idx]] || null;
    }

    const MAKERS = {
      ptMove: makePtMove, ptDesc: makePtDesc,
      slide: makeSlide, slidePick: makeSlidePick, slideDesc: makeSlideDesc, car: makeCar,
      flipPick: makeFlipPick, flipDesc: makeFlipDesc, flipDraw: () => makeDraw('flip'), flipText: makeFlipText,
      turnPick: makeTurnPick, turnDesc: makeTurnDesc, turnSame: makeTurnSame, turnDraw: () => makeDraw('turn'), puzzle: () => makePose(false),
      mHow: makeMHow, mFill: makeMFill, mMake: makeMMake,
      xSame: makeXSame, xFix: makeXFix, xMatch: () => makePose(true)
    };
    function makeQuestion(prevKey, prevMix) {
      if (mode === 'mix') return makeMixQuestion(prevKey, prevMix);
      let q = MAKERS[mode]();
      for (let i = 0; i < 6 && q.key && q.key === prevKey; i += 1) q = MAKERS[mode]();
      return q;
    }

    /* ---------- 차시별 문제 모음 ---------- */
    const TALL_IDS = ['ptMove', 'slide', 'car', 'slidePick', 'flipPick', 'flipDraw', 'flipText', 'turnPick', 'turnDraw', 'puzzle', 'mFill', 'mMake', 'xMatch'];
    const MIX_ITEMS = Object.fromEntries(Object.keys(MAKERS).map((id) => [id, {
      label: MODES[id].title, icon: MODES[id].icon, make: () => withOpt('all', MAKERS[id]),
      tall: TALL_IDS.includes(id), cap: MODES[id].cap
    }]));

    const LESSONS = [
      { id: 'l1', stage: 1, title: '점의 이동', page: '132~135쪽', items: ['ptMove', 'ptDesc'] },
      { id: 'l2', stage: 2, title: '평면도형 밀기', page: '136~139쪽', items: ['slide', 'slidePick', 'slideDesc', 'car'] },
      { id: 'l3', stage: 3, title: '평면도형 뒤집기', page: '140~143쪽', items: ['flipPick', 'flipDesc', 'flipDraw', 'flipText'] },
      { id: 'l4', stage: 4, title: '평면도형 돌리기', page: '144~147쪽', items: ['turnPick', 'turnDesc', 'turnSame', 'turnDraw', 'puzzle'] },
      { id: 'l5', stage: 5, title: '무늬 만들기', page: '148~149쪽', items: ['mHow', 'mFill', 'mMake'] },
      { id: 'l6', stage: 6, title: '여러 번 이동 · 마무리', page: '150~153쪽', items: ['xSame', 'xFix', 'xMatch'] }
    ];

    let mixPool = [];
    let mixTall = false;
    function makeMixQuestion(prevKey, prevMix) {
      const pool = mixPool.length > 1 ? mixPool.filter((id) => id !== prevMix) : mixPool;
      const id = pick(pool);
      let q = MIX_ITEMS[id].make();
      for (let i = 0; i < 6 && q.key && q.key === prevKey; i += 1) q = MIX_ITEMS[id].make();
      return { ...q, mixId: id };
    }

    /* =========================================================
       개념 알아보기
       ========================================================= */
    let conceptRows = [];

    function showConcept(key) {
      const c = CONCEPTS[key];
      conceptRows = c.rows();
      document.getElementById('concept-overlay').innerHTML = `
        <div class="result-card concept-card">
          <div class="concept-head">
            <div class="kid-art"></div>
            <div><h2>${c.title}</h2><p>${c.sub}</p></div>
          </div>
          ${conceptRows.map((r, i) => `
            <div class="crow">
              <div class="fig">${r.fig}</div>
              <div>
                <h3><span>${r.title}</span><button class="spk" type="button" onclick="speak(conceptRows[${i}].say)" aria-label="설명 읽어 주기">${SPK}</button></h3>
                <p>${r.text}</p>
              </div>
            </div>`).join('')}
          <div class="result-btns">
            <button class="btn-main" type="button" onclick="hideConcept(); tryStart('${c.mode}')">문제 풀러 가기 →</button>
            <button class="ghost-btn" type="button" onclick="hideConcept()">닫기</button>
          </div>
        </div>`;
      document.getElementById('concept-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideConcept() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.getElementById('concept-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }


    /* =========================================================
       차시별 문제 모음 고르기
       ========================================================= */
    const MIX_KEY = 'shapemoveman-mix-v1';
    let mixSel = new Set(Object.keys(MIX_ITEMS));
    try {
      const saved = JSON.parse(localStorage.getItem(MIX_KEY) || 'null');
      if (Array.isArray(saved)) mixSel = new Set(saved.filter((id) => MIX_ITEMS[id]));
    } catch (err) { /* 저장소를 쓸 수 없으면 전부 고른 상태로 시작한다 */ }
    function saveMixSel() {
      try { localStorage.setItem(MIX_KEY, JSON.stringify([...mixSel])); } catch (err) { /* 무시 */ }
    }

    let mixScope = 'all';
    function mixLessons() { return mixScope === 'all' ? LESSONS : LESSONS.filter((l) => l.stage === mixScope); }
    function mixChosen() { return mixLessons().flatMap((l) => l.items).filter((id) => mixSel.has(id)); }
    function mixCap(ids) { return ids.reduce((m, id) => Math.min(m, MIX_ITEMS[id].cap || 6), 6); }
    const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

    function mixCardHtml(st) {
      const all = st.no === STAGES.length;
      const names = LESSONS.filter((l) => l.stage === st.no).map((l) => l.title).join(', ');
      return `
        <article class="card mixc${all ? ' wide' : ''}">
          <div class="card-top"><span class="ic">${ICONS.mix}</span><span class="cap">${all ? '단원 전체' : '차시별'}</span></div>
          <h4>${all ? '단원 전체 문제 모음' : '문제 모음'}</h4>
          <p>${all ? '모든 차시의 문제 유형 중에서 원하는 것만 체크해서 섞어 풀어요.' : `${names} 차시의 문제 유형 중 체크한 것만 섞어서 풀어요.`}</p>
          <button class="go" type="button" onclick="openMix(${all ? "'all'" : st.no})">유형 고르기</button>
        </article>`;
    }

    function openMix(scope) {
      mixScope = scope;
      renderMix();
      document.getElementById('mix-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideMix() {
      document.getElementById('mix-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }
    function renderMix() {
      const chosen = mixChosen();
      const cap = mixCap(chosen);
      const st = mixScope === 'all' ? null : STAGES.find((x) => x.no === mixScope);
      const over = playerCount > cap;
      const limiting = [...new Set(chosen.filter((id) => (MIX_ITEMS[id].cap || 6) === cap).map((id) => MIX_ITEMS[id].label))];
      const capNote = chosen.length && cap < 6
        ? `<span class="mix-cap${over ? ' warn' : ''}">${limiting.join(', ')} 게임으로 인해 최대 ${cap}명까지만 가능합니다${over ? ` (지금 ${playerCount}명)` : ''}</span>`
        : `<span class="mix-cap">1~6명이 함께할 수 있어요</span>`;
      const box = document.getElementById('mix-overlay');
      const prevScroll = box.firstElementChild ? box.firstElementChild.scrollTop : 0;
      box.innerHTML = `
        <div class="result-card mix-card">
          <div class="concept-head">
            <div class="kid-art"></div>
            <div><h2>${st ? `${st.title} 문제 모음` : '단원 전체 문제 모음'}</h2><p>체크한 유형의 문제만 골고루 섞여서 나와요.</p></div>
          </div>
          ${mixLessons().map((l) => {
            const full = l.items.every((id) => mixSel.has(id));
            return `
              <section class="mix-lesson">
                <div class="mix-lesson-head">
                  <span class="mix-page">${l.page}</span>
                  <h3>${l.title}</h3>
                  <button class="mix-all${full ? ' on' : ''}" type="button" onclick="toggleLesson('${l.id}')">${full ? '모두 해제' : '모두 선택'}</button>
                </div>
                <div class="mix-items">${l.items.map((id) => `
                  <button class="mix-chip${mixSel.has(id) ? ' on' : ''}" type="button" aria-pressed="${mixSel.has(id)}" onclick="toggleMixItem('${id}')">
                    <span class="ck">${CHECK}</span><span class="mi">${ICONS[MIX_ITEMS[id].icon]}</span>${MIX_ITEMS[id].label}${MIX_ITEMS[id].cap ? `<span class="mcap">최대 ${MIX_ITEMS[id].cap}명</span>` : ''}
                  </button>`).join('')}
                </div>
              </section>`;
          }).join('')}
          <div class="mix-foot">
            <div class="mix-sum"><span><b>${chosen.length}</b>가지 유형을 골랐어요</span>${capNote}</div>
            <div class="mix-btns">
              <button class="ghost-btn" type="button" onclick="hideMix()">닫기</button>
              <button class="btn-main" type="button" onclick="startMix()"${chosen.length ? '' : ' disabled'}>섞어서 시작 →</button>
            </div>
          </div>
        </div>`;
      box.firstElementChild.scrollTop = prevScroll;
    }
    function toggleMixItem(id) {
      if (mixSel.has(id)) mixSel.delete(id);
      else mixSel.add(id);
      saveMixSel();
      renderMix();
    }
    function toggleLesson(lid) {
      const l = LESSONS.find((x) => x.id === lid);
      const full = l.items.every((id) => mixSel.has(id));
      l.items.forEach((id) => { if (full) mixSel.delete(id); else mixSel.add(id); });
      saveMixSel();
      renderMix();
    }
    function startMix() {
      const chosen = mixChosen();
      if (!chosen.length) return;
      mixPool = chosen;
      mixTall = chosen.some((id) => MIX_ITEMS[id].tall);
      const st = mixScope === 'all' ? null : STAGES.find((x) => x.no === mixScope);
      const lessons = mixLessons().filter((l) => l.items.some((id) => mixSel.has(id)));
      MODES.mix = {
        title: st ? `${st.short} 문제 모음` : '단원 전체 문제 모음',
        icon: 'mix',
        sub: `${lessons.length > 3 ? '단원 전체' : lessons.map((l) => l.title).join(' · ')}에서 고른 ${chosen.length}가지 유형을 섞어 풀어요`,
        cap: mixCap(chosen)
      };
      const go = () => { hideMix(); startGame('mix'); };
      if (playerCount > MODES.mix.cap) {
        const names = [...new Set(chosen.filter((id) => (MIX_ITEMS[id].cap || 6) < playerCount).map((id) => MIX_ITEMS[id].label))];
        showCapNotice(names, MODES.mix.cap, VCALC_WHY, go);
        return;
      }
      go();
    }
    function mixTagHtml(q) {
      const it = MIX_ITEMS[q.mixId];
      return it ? `<div class="mix-tag"><span class="mi">${ICONS[it.icon]}</span>${it.label}</div>` : '';
    }


    /* =========================================================
       인원 제한 안내
       ========================================================= */
    const PEOPLE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6z"/><circle cx="17" cy="9" r="2.7" opacity=".55"/><path d="M15.6 13.7c3.2-.4 6 1.6 6 5.8h-4.4c0-2.3-.6-4.3-1.6-5.8z" opacity=".55"/></svg>';
    const VCALC_WHY = '자동차를 직접 밀어 움직이는 게임이라 한 사람의 칸이 넓어야 해요.';
    function capOf(m) { return MODES[m].cap || 6; }
    function capChip(cap, extra = '') {
      return `<span class="cap pc${cap < 6 ? ' lim' : ''}${playerCount > cap ? ' over' : ''}" data-cap="${cap}">${PEOPLE}${cap < 6 ? `최대 ${cap}명` : '1~6명'}${extra}</span>`;
    }
    // 고른 인원이 게임 제한보다 많을 때 시작 전에 알려 준다
    let noticeGo = null;
    function showCapNotice(names, cap, why, go) {
      noticeGo = go;
      document.getElementById('notice-overlay').innerHTML = `
        <div class="result-card notice-card">
          <div class="notice-ic">${PEOPLE}</div>
          <h2>인원 안내</h2>
          <p class="notice-main"><b>${names.join(', ')}</b> 게임으로 인해 <b>최대 ${cap}명</b>까지만 가능합니다.</p>
          <p class="notice-why">${why}</p>
          <p class="notice-now">지금 고른 인원은 ${playerCount}명이에요. ${cap}명으로 줄여서 시작할까요?</p>
          <div class="result-btns">
            <button class="ghost-btn" type="button" onclick="hideNotice()">취소</button>
            <button class="btn-main" type="button" onclick="acceptNotice()">${cap}명으로 시작 →</button>
          </div>
        </div>`;
      document.getElementById('notice-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideNotice() {
      document.getElementById('notice-overlay').classList.add('hidden');
      const others = ['concept-overlay', 'mix-overlay'].some((id) => !document.getElementById(id).classList.contains('hidden'));
      if (!others) document.body.classList.remove('modal');
    }
    function acceptNotice() {
      const go = noticeGo;
      noticeGo = null;
      hideNotice();
      if (go) go();
    }
    function tryStart(m) {
      const cap = capOf(m);
      if (playerCount > cap) {
        showCapNotice([MODES[m].title], cap, MODES[m].capWhy || '', () => startGame(m));
        return;
      }
      startGame(m);
    }
    function renderCapNote() {
      const note = document.getElementById('cap-note');
      if (!note) return;
      const byCap = {};
      Object.entries(MODES).forEach(([k, M]) => {
        if (k === 'mix' || !M.cap || M.cap >= playerCount) return;
        (byCap[M.cap] = byCap[M.cap] || []).push(M.title);
      });
      const lines = Object.entries(byCap).map(([cap, titles]) => `<b>${titles.join(' · ')}</b> 게임은 최대 ${cap}명까지만 가능합니다.`);
      note.innerHTML = lines.length ? `${PEOPLE}<span>${lines.join(' ')} 나머지 게임은 ${playerCount}명이 함께할 수 있어요.</span>` : '';
      document.querySelectorAll('.cap.pc').forEach((el) => el.classList.toggle('over', playerCount > Number(el.dataset.cap)));
    }

    /* =========================================================
       화면 전환 / 설정
       ========================================================= */
    function showScreen(id) {
      document.querySelectorAll('.screen, .game-screen').forEach((el) => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      document.body.classList.toggle('playing', ['game-screen', 'bell-screen', 'bell-join-screen'].includes(id));
      if (id === 'game-select-screen') { renderPlayerSeg(); renderCapNote(); }
      if (id === 'start-screen') animateHero();
    }

    function renderPlayerSeg() {
      document.getElementById('player-seg').innerHTML = [1, 2, 3, 4, 5, 6]
        .map((i) => `<button type="button" class="${i === playerCount ? 'on' : ''}" onclick="setPlayers(${i})">${i}명</button>`)
        .join('');
    }
    function setPlayers(n) { playerCount = n; renderPlayerSeg(); renderCapNote(); }

    function cardHtml(m) {
      const M = MODES[m];
      const capTxt = capChip(capOf(m), m === 'exam' ? ' · 시간 무제한' : '');
      const sel = M.opts
        ? `<select class="card-select" id="opt-${m}" aria-label="문제 유형">${OPT_CHOICES[M.opts].map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`
        : '';
      return `
        <article class="card${M.wide ? ' wide' : ''}" style="--tint:${M.tint}">
          <div class="card-top"><span class="ic">${ICONS[M.icon]}</span>${capTxt}</div>
          <h4>${M.title}</h4>
          <p>${M.desc}</p>
          ${sel}
          <button class="go" type="button" onclick="tryStart('${m}')">${m === 'exam' ? '평가 시작' : '시작'}</button>
        </article>`;
    }
    function renderStages() {
      document.getElementById('stage-nav').innerHTML = STAGES
        .map((st) => `<button class="stage-chip" type="button" style="--sc:${st.color}" onclick="jumpStage(${st.no})"><b>${st.no}</b>${st.short}</button>`)
        .join('');
      document.getElementById('stages').innerHTML = STAGES.map((st) => `
        <section class="stage" id="stage-${st.no}" style="--sc:${st.color}">
          <div class="stage-head">
            <span class="stage-no">${st.no}</span>
            <h3 class="stage-title">${st.title}</h3>
            <span class="stage-page">${st.page}</span>
            <button class="stage-ws" type="button" onclick="openWorksheet(${st.no})">🖨 학습지</button>
          </div>
          <div class="cards">
            ${st.concept ? `
              <article class="card concept" style="--tint:#d6f3ee">
                <div class="card-top"><span class="ic">${ICONS.concept}</span><span class="cap">개념</span></div>
                <h4>개념 알아보기</h4>
                <p>${CONCEPTS[st.concept].desc}</p>
                <button class="go" type="button" onclick="showConcept('${st.concept}')">펼쳐 보기</button>
              </article>` : ''}
            ${st.no === STAGES.length ? mixCardHtml(st) : ''}
            ${st.concept ? mixCardHtml(st) : ''}
            ${st.items.map(cardHtml).join('')}
          </div>
        </section>`).join('');
    }
    function jumpStage(no) {
      document.getElementById(`stage-${no}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* =========================================================
       게임 시작 / 종료
       ========================================================= */
    const START_MSG = {
      choice: '알맞은 답을 골라 보세요.',
      keypad: '키패드로 답을 써 보세요.',
      ox: '알맞은 것을 골라 보세요.',
      ...APP_START_MSG
    };

    function createPlayer(idx) {
      const prevQ = players[idx] && players[idx].q ? players[idx].q : null;
      let q;
      QCTX.narrow = cellMetrics().w < 330;
      try { q = mode === 'exam' ? examQuestionFor(idx) : makeQuestion(prevQ && prevQ.key, prevQ && prevQ.mixId); } finally { QCTX.narrow = false; }
      return setupPlayer(idx, q);
    }
    function setupPlayer(idx, q) {
      const p = { idx, q, tries: 0, state: '', message: '', locked: !q, picked: [], pickedWhy: [], input: '', inputBad: false };
      if (!q) return p;
      if (q.kind === 'keypad' && !q.ansText) q.ansText = withUnit(q.ans, q.unit);
      p.message = START_MSG[q.kind] || START_MSG.choice;
      if (q.kind === 'ox') p.stage = 'ox';
      if (APP_SETUP[q.kind]) APP_SETUP[q.kind](p, q);
      return p;
    }
    function startGame(selectedMode) {
      mode = selectedMode;
      const sel = document.getElementById(`opt-${mode}`);
      modeOpt = sel ? sel.value : 'all';
      const cap = MODES[mode].cap;
      if (cap && playerCount > cap) playerCount = cap;
      scores = Array(playerCount).fill(0);
      combos = Array(playerCount).fill(0);
      if (mode === 'exam') {
        examQueues = Array.from({ length: playerCount }, () => buildExamQueue());
        examIndex = Array(playerCount).fill(0);
        examLog = Array.from({ length: playerCount }, () => []);
      }
      players = [];
      players = Array.from({ length: playerCount }, (_, idx) => createPlayer(idx));
      gameActive = true;
      const M = MODES[mode];
      document.getElementById('mode-title').innerHTML = `<span class="ic">${ICONS[M.icon]}</span>${M.title}`;
      document.getElementById('mode-sub').textContent = M.sub;
      showScreen('game-screen');
      renderPlayers();
      startTimer();
    }

    function setTimerUi(left, total) {
      const t = document.getElementById('timer');
      const bar = document.getElementById('timer-bar');
      const label = document.getElementById('time-left');
      if (total === null) {
        t.className = 'timer inf';
        label.textContent = '∞';
        bar.style.strokeDashoffset = '0';
        return;
      }
      t.className = `timer${left <= 10 ? ' warn' : ''}`;
      label.textContent = String(Math.max(0, left));
      bar.style.strokeDashoffset = String(157.08 * (1 - Math.max(0, left) / total));
    }
    function startTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; }
      const selected = mode === 'exam' ? 'none' : document.getElementById('timer-select').value;
      if (selected === 'none') { setTimerUi(0, null); return; }
      timeTotal = Number.parseInt(selected, 10) || 90;
      timeLeft = timeTotal;
      setTimerUi(timeLeft, timeTotal);
      timerId = setInterval(() => {
        if (!gameActive) return;
        timeLeft -= 1;
        setTimerUi(timeLeft, timeTotal);
        if (timeLeft <= 0) finishGame();
      }, 1000);
    }

    function stopAll() {
      gameActive = false;
      if (timerId) { clearInterval(timerId); timerId = null; }
      Object.values(nextTimers).forEach((t) => clearTimeout(t));
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
    function exitGame() {
      stopAll();
      document.getElementById('result-overlay').classList.add('hidden');
      showScreen('game-select-screen');
    }

    function finishGame() {
      // 시간 대결 중인 태블릿은 결과 창 대신 칠판에 마지막 점수를 보내고 기다린다.
      if (BP.race && BP.race.running) { bellRaceStop(); return; }
      if (BP.exam && BP.exam.running) { bellExamStop(); return; }
      if (!players.length) return;
      stopAll();
      const ranking = scores
        .map((score, idx) => ({ score, idx, animal: ANIMALS[idx % ANIMALS.length] }))
        .sort((a, b) => b.score - a.score);
      let rank = 0;
      let prev = null;
      ranking.forEach((item, pos) => {
        if (item.score !== prev) { rank = pos + 1; prev = item.score; }
        item.rank = rank;
      });
      const exam = mode === 'exam';
      const scoreText = (item) => (exam
        ? `${item.score} / 100점 <small>(${(examLog[item.idx] || []).filter((r) => r.correct).length}/${EXAM_TOTAL})</small>`
        : `${item.score}점`);
      document.getElementById('result-overlay').innerHTML = `
        <div class="result-card">
          <div class="kid-art"></div>
          <h2>${exam ? '마무리 평가 결과' : '결과 발표'}</h2>
          <p class="sub">${MODES[mode].title}</p>
          ${ranking.map((item) => `
            <div class="rank-row r${item.score > 0 ? item.rank : 0}">
              <span class="rk">${item.rank}</span>
              <span>${item.animal.emoji} ${item.animal.name}</span>
              <strong>${scoreText(item)}</strong>
            </div>`).join('')}
          <div class="result-btns">
            ${exam ? '' : '<button class="btn-main" type="button" onclick="hideResult()">계속하기</button>'}
            <button class="${exam ? 'btn-main' : 'ghost-btn'}" type="button" onclick="restartGame()">다시 하기</button>
            <button class="ghost-btn" type="button" onclick="exitGame()">게임 목록</button>
          </div>
        </div>`;
      document.getElementById('result-overlay').classList.remove('hidden');
      blip('fanfare');
    }

    function hideResult() {
      document.getElementById('result-overlay').classList.add('hidden');
      if (mode === 'exam') return;
      gameActive = true;
      players = players.map((p, idx) => (p.locked ? createPlayer(idx) : p));
      renderPlayers();
      startTimer();
    }

    function restartGame() {
      document.getElementById('result-overlay').classList.add('hidden');
      startGame(mode);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    /* =========================================================
       렌더링
       ========================================================= */
    const TALL = Object.keys(MIX_ITEMS).filter((id) => MIX_ITEMS[id].tall).concat(['exam']);
    let narrowCells = false;
    function isTall() { return mode === 'mix' ? mixTall : TALL.includes(mode); }
    function columnCount() {
      const w = window.innerWidth;
      if (w < 760) return isTall() ? 1 : Math.min(playerCount, 2);
      // 태블릿처럼 화면이 좁은데 인원이 많으면 두 줄로 나눈다
      if (playerCount > 3 && w / playerCount < (isTall() ? 330 : 190)) return Math.ceil(playerCount / 2);
      return playerCount;
    }
    function cellMetrics() {
      const cols = columnCount();
      const rows = Math.ceil(playerCount / cols);
      const bar = document.querySelector('.topbar');
      const top = bar && bar.offsetHeight ? bar.offsetHeight : 80;
      return { cols, rows, w: window.innerWidth / cols, h: (window.innerHeight - top) / rows };
    }
    function cellScale(m) {
      const tall = isTall();
      // 좁은 칸은 보기를 한 줄로 쌓고 세로셈·자리판 같은 부품을 따로 줄이므로 글씨를 덜 줄인다
      const narrow = m.w < 330;
      const wBase = tall ? (narrow ? 300 : 400) : (narrow ? 250 : 300);
      const s = Math.min(m.w / wBase, m.h / (tall ? 720 : 740));
      return clamp(Math.round(s * 1000) / 1000, 0.62, 1.3);
    }
    function renderPlayers() {
      const grid = document.getElementById('players');
      const m = cellMetrics();
      narrowCells = m.w < 330;
      grid.classList.toggle('xnarrow', m.w < 240);
      grid.style.gridTemplateColumns = `repeat(${m.cols}, minmax(0, 1fr))`;
      grid.style.gridTemplateRows = `repeat(${m.rows}, minmax(0, 1fr))`;
      grid.style.setProperty('--s', cellScale(m));
      grid.classList.toggle('narrow', narrowCells);
      grid.classList.toggle('short', m.h < 440);
      grid.innerHTML = players.map((p) => `<section class="player-cell theme-${p.idx % 6}" id="cell-${p.idx}">${cellInner(p)}</section>`).join('');
    }
    function renderCell(idx) {
      const cell = document.getElementById(`cell-${idx}`);
      if (cell && players[idx]) cell.innerHTML = cellInner(players[idx]);
    }

    function speakerBtn(idx) {
      return `<button class="spk" type="button" onclick="speakQ(${idx})" aria-label="문제 읽어 주기">${SPK}</button>`;
    }
    function speakQ(idx) {
      const p = players[idx];
      if (p && p.q) speak(p.q.speech);
    }

    function cellInner(p) {
      // 시간 대결·평가 중인 태블릿에는 학생이 고른 이름(번호)과 동물을 보여 준다
      const a = BP.me && ((BP.race && BP.race.running) || (BP.exam && BP.exam.running))
        ? { emoji: BP.exam && BP.exam.running ? '📝' : bellEmoji(BP.me.avatar), name: bellEsc(BP.me.name) }
        : ANIMALS[p.idx % ANIMALS.length];
      const q = p.q;
      const body = !q ? examDoneBody(p) : (BODIES[q.kind] || choiceBody)(p);
      const prog = mode === 'exam'
        ? `<span class="prog-chip">${Math.min(examIndex[p.idx] + (q ? 1 : 0), EXAM_TOTAL)} / ${EXAM_TOTAL}</span>`
        : '';
      const combo = mode === 'speed' && combos[p.idx] >= 2 ? `<span class="combo-chip">🔥 ${combos[p.idx]}연속</span>` : '';
      return `
        <div class="answer-overlay" id="ov-${p.idx}"></div>
        <div class="player-header">
          <span class="pname"><span class="av">${a.emoji}</span><span class="nm">${a.name}</span></span>
          <span class="pscore-wrap">${combo}${prog}<span class="pscore" id="sc-${p.idx}">${STAR}${scores[p.idx]}</span></span>
        </div>
        <div class="cell-body">${mode === 'mix' && q ? mixTagHtml(q) : ''}${body}</div>
        <div class="controls">
          <div class="message ${p.state}" id="msg-${p.idx}"><span>${p.message}</span></div>
          <div class="btns">${q ? controlsHtml(p) : ''}</div>
        </div>`;
    }

    function controlsHtml(p) {
      if (p.locked) return '';
      const k = p.q.kind;
      const skip = mode === 'exam' ? '' : `<button class="btn-sub" type="button" onclick="skipQuestion(${p.idx})">넘기기</button>`;
      const check = (fn, label = '확인') => `<button class="btn-check" type="button" onclick="${fn}(${p.idx})">${label}</button>`;
      const sub = (fn, label) => `<button class="btn-sub" type="button" onclick="${fn}(${p.idx})">${label}</button>`;
      if (k === 'keypad') return `${skip}${check('submitAns')}`;
      if (APP_CONTROLS[k]) return APP_CONTROLS[k](p, { skip, check, sub });
      return skip;
    }

    /* ---------- 문제 본문 ---------- */
    function choiceBtns(p, list, cls, pickedList, ans) {
      return list.map((c, i) => {
        const picked = pickedList.includes(i);
        const isAns = c.v === ans;
        let st = '';
        if (picked && !isAns) st = ' wrong';
        if (p.locked && isAns) st = ' right';
        return `<button class="choice${cls ? ` ${cls}` : ''}${st}" type="button" onclick="choose(${p.idx},${i})">${c.html}</button>`;
      }).join('');
    }
    function qCard(p, prompt, visual) {
      return `<div class="q-card"><div class="q-text"><span>${prompt}</span>${speakerBtn(p.idx)}</div>${visual || ''}</div>`;
    }

    function choiceBody(p) {
      const q = p.q;
      const cols = q.cols || 2;

    /* ---------- 시작 화면: 도형이 밀리고, 뒤집히고, 돌아간다 ---------- */
    let heroTimer = null;
    function animateHero() {
      const g = document.getElementById('hero-fig');
      const tag = document.getElementById('hero-tag');
      if (!g) return;
      clearInterval(heroTimer);
      const P = SHAPES.find((s) => s.id === 'flag') ? SHAPES.find((s) => s.id === 'flag').pts : SHAPES[0].pts;
      const steps = [
        ['처음 모양', [], [1, 2]], ['오른쪽으로 3 cm 밀기', [], [4, 2]], ['오른쪽으로 뒤집기', ['flipH'], [4, 2]],
        ['시계 방향으로 90° 돌리기', ['flipH', 'cw'], [3, 3]], ['아래쪽으로 뒤집기', ['flipH', 'cw', 'flipV'], [3, 3]], ['왼쪽으로 2 cm 밀기', ['flipH', 'cw', 'flipV'], [1, 3]]
      ];
      let k = 0;
      let prev = null;
      const draw = () => {
        const [lab, ops, [ox, oy]] = steps[k];
        const pts = shiftPts(applyOps(P, ops), ox, oy);
        const shapes = [];
        if (prev) shapes.push({ pts: prev, fill: '#e9eef3', stroke: '#8a96a6', sw: 1.8, dash: true });
        shapes.push({ pts, fill: SHAPE_COLORS[k % SHAPE_COLORS.length], sw: 3 });
        g.innerHTML = gridSvg({ cols: 8, rows: 8, cell: 36, pad: 6, shapes, cls: 'hero-m' });
        tag.textContent = lab;
        prev = pts;
      };
      draw();
      heroTimer = setInterval(() => {
        if (document.getElementById('start-screen').classList.contains('hidden')) { clearInterval(heroTimer); return; }
        k = (k + 1) % steps.length;
        if (k === 0) prev = null;
        draw();
      }, 1500);
    }

    /* =========================================================
       직접 움직이는 화면
       ========================================================= */
    const ARROWS = { L: '◀', U: '▲', D: '▼', R: '▶' };
    const arrowPad = (idx, fn) => `<div class="arrow-pad">${['U', 'L', 'D', 'R'].map((d) => `<button class="ap ap-${d}" type="button" onclick="${fn}(${idx},'${d}')" aria-label="${DIR[d]}">${ARROWS[d]}</button>`).join('')}</div>`;

    /* ---------- 점 이동하기 ---------- */
    function ptmoveBody(p) {
      const q = p.q;
      const pts = [{ x: q.start[0], y: q.start[1], color: q.robot ? '#fff' : '#1d2838', lab: q.robot ? '' : 'ㄱ', emoji: q.robot ? '🤖' : '', big: true }];
      if (p.tap) pts.push({ x: p.tap[0], y: p.tap[1], color: p.state === 'ok' ? '#1fae6a' : '#ec5050', big: true, lab: q.robot ? '' : 'ㄱ' });
      const extra = ({ X, Y, c }) => {
        let s = '';
        if (p.locked && p.state === 'ok') {
          let cur = [...q.start];
          q.moves.forEach(([d, n]) => {
            const nx = cur[0] + DIR_V[d][0] * n;
            const ny = cur[1] + DIR_V[d][1] * n;
            s += `<path d="M${X(cur[0])} ${Y(cur[1])}L${X(nx)} ${Y(ny)}" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="6 4"/>`;
            cur = [nx, ny];
          });
        }
        if (!p.locked) for (let x = 0; x <= q.cols; x += 1) for (let y = 0; y <= q.rows; y += 1) s += `<circle cx="${X(x)}" cy="${Y(y)}" r="${r1(c * 0.48)}" fill="transparent" class="hit" data-pt="${x},${y}" data-p="${p.idx}"/>`;
        return s;
      };
      return qCard(p, q.prompt, gridSvg({ cols: q.cols, rows: q.rows, cell: 34, cm: true, points: pts, extra, cls: 'mg-play' }));
    }

    /* ---------- 도형 밀기 ---------- */
    function slideBody(p) {
      const q = p.q;
      const moved = shiftPts(q.pts, p.off[0], p.off[1]);
      const g = gridSvg({ cols: q.cols, rows: q.rows, cell: 30, cm: true, shapes: [{ pts: q.pts, fill: '#e9eef3', stroke: '#8a96a6', sw: 1.8, dash: true, lab: '이동 전' }, { pts: moved, fill: q.color, sw: 2.6, cls: 'mv' }], cls: 'mg-play' });
      return `${qCard(p, q.prompt, g)}${p.locked ? '' : arrowPad(p.idx, 'slideMove')}`;
    }

    /* ---------- 도형 그리기 (점 종이) ---------- */
    function drawDots(q) { const a = []; for (let y = 0; y <= q.rows; y += 1) for (let x = 0; x <= q.cols; x += 1) a.push([x, y]); return a; }
    function drawBody(p) {
      const q = p.q;
      const D = drawDots(q);
      const path = p.path.map((k) => D[k]);
      const extra = ({ X, Y, c }) => {
        let s = '';
        if (path.length >= 2 || (p.closed && path.length >= 3)) s += `<path d="M${path.map(([x, y]) => `${X(x)} ${Y(y)}`).join('L')}${p.closed ? 'Z' : ''}" fill="${p.closed ? 'rgba(58,127,242,.2)' : 'none'}" stroke="#3a7ff2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
        if (p.showAns) s += `<path d="M${p.showAns.map(([x, y]) => `${X(x)} ${Y(y)}`).join('L')}Z" fill="rgba(31,174,106,.18)" stroke="#1fae6a" stroke-width="2.4" stroke-dasharray="6 4"/>`;
        D.forEach(([x, y], k) => {
          const at = p.path.indexOf(k);
          if (at === 0 && !p.closed && p.path.length >= 3) s += `<circle cx="${X(x)}" cy="${Y(y)}" r="10" fill="none" stroke="#ff5b4f" stroke-width="2" class="pulse"/>`;
          s += `<circle cx="${X(x)}" cy="${Y(y)}" r="${at >= 0 ? 5.5 : 3.6}" fill="${at >= 0 ? (at === p.path.length - 1 && !p.closed ? '#ff5b4f' : '#1f5fc0') : '#5b6b7d'}"/>`;
        });
        if (!p.locked) D.forEach(([x, y], k) => { s += `<circle cx="${X(x)}" cy="${Y(y)}" r="${r1(c * 0.48)}" fill="transparent" class="hit" data-gi="${k}" data-p="${p.idx}"/>`; });
        return s;
      };
      const board = gridSvg({ cols: q.cols, rows: q.rows, cell: 34, bg: '#fbfdff', extra, cls: 'mg-play draw' });
      const ref = `<div class="draw-ref"><span class="ba-tag">${q.ic === '⇆' || q.ic === '⇅' ? '뒤집기 전' : '돌리기 전'}</span>${shapeCard(q.src, { fill: q.color, cls: 'ref-m sm' })}<span class="op-big">${q.ic}</span></div>`;
      return qCard(p, q.prompt, `<div class="draw-wrap">${ref}${board}</div><div class="q-sub">이은 점 ${p.path.length}개</div>`);
    }

    /* ---------- 퍼즐 · 모양 맞추기 ---------- */
    const POSE_BTN = { cw: ['↻', '시계 방향 90°'], ccw: ['↺', '시계 반대 90°'], flipH: ['⇆', '좌우 뒤집기'], flipV: ['⇅', '위아래 뒤집기'] };
    function poseBody(p) {
      const q = p.q;
      const cur = applyOps(q.src, p.ops);
      const [tw, th] = sizeOf(q.targetPts);
      const done = p.locked && p.state === 'ok';
      let left;
      if (q.puzzle) {
        const bw = tw + 2;
        const bh = th + 2;
        const hole = shiftPts(q.targetPts, 1, 1);
        const lines = ({ X, Y }) => { let d = ''; for (let i = 1; i < bw; i += 1) d += `M${X(i)} ${Y(0)}V${Y(bh)}`; for (let j = 1; j < bh; j += 1) d += `M${X(0)} ${Y(j)}H${X(bw)}`; return `<path d="${d}" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-dasharray="3 3"/>`; };
        const extra = ({ X, Y }) => `<rect x="${X(0)}" y="${Y(0)}" width="${X(bw) - X(0)}" height="${Y(bh) - Y(0)}" fill="#7fd1c3"/>${lines({ X, Y })}<path d="M${hole.map(([x, y]) => `${X(x)} ${Y(y)}`).join('L')}Z" fill="${done ? q.color : '#fff'}" stroke="#1d2838" stroke-width="2.2" stroke-dasharray="${done ? '0' : '6 4'}"/>`;
        left = gridSvg({ cols: bw, rows: bh, cell: 30, extra, cls: 'pose-board', noGrid: false });
      } else {
        const n = Math.max(tw, th) + 2;
        const tp = shiftPts(q.targetPts, Math.floor((n - tw) / 2), Math.floor((n - th) / 2));
        left = gridSvg({ cols: n, rows: n, cell: 30, shapes: [{ pts: tp, fill: done ? q.color : '#f3f0ff', stroke: '#8b5cf0', sw: 2.4, dash: !done }], cls: 'pose-board' });
      }
      const n2 = Math.max(...sizeOf(q.src)) + 2;
      const [cw2, ch2] = sizeOf(cur);
      const piece = gridSvg({ cols: n2, rows: n2, cell: 30, shapes: [{ pts: shiftPts(cur, Math.floor((n2 - cw2) / 2), Math.floor((n2 - ch2) / 2)), fill: q.color, sw: 2.6 }], cls: 'pose-piece' });
      const btns = p.locked ? '' : `<div class="pose-btns">${q.ops.map((op) => `<button class="pb" type="button" onclick="poseDo(${p.idx},'${op}')"><b>${POSE_BTN[op][0]}</b><span>${POSE_BTN[op][1]}</span></button>`).join('')}</div>`;
      return `${qCard(p, q.prompt, `<div class="pose-wrap"><div class="pose-col"><span class="ba-tag">${q.puzzle ? '빈 곳' : '점선 모양'}</span>${left}</div><div class="pose-col"><span class="ba-tag after">내 조각</span>${piece}</div></div><div class="q-sub">움직인 횟수 <b>${p.ops.length}번</b></div>`)}${btns}`;
    }

    /* ---------- 무늬 완성하기 ---------- */
    function tilesBody(p) {
      const q = p.q;
      const grid = q.grid.map((row, r) => row.map((pz, c) => {
        const i = r * 4 + c;
        if (!q.blanks.includes(i)) return pz;
        return p.fill[i] || null;
      }));
      const pat = patternSvg(q.m, grid, { sel: p.sel, hit: p.locked ? [] : q.blanks, idx: p.idx, bad: p.bad, cls: 'pat-play' });
      const pal = p.locked ? '' : `<div class="tile-pal">${q.palette.map((pz, k) => `<button class="tp" type="button" onclick="tilesPick(${p.idx},${k})">${tileSvg(q.m, pz)}</button>`).join('')}</div>`;
      return `${qCard(p, q.prompt, `${pat}<div class="q-sub">빈칸 ${q.blanks.length - q.blanks.filter((i) => p.fill[i]).length}개 남음</div>`)}${pal}`;
    }

    /* ---------- 자동차 탈출 ---------- */
    function carSvg(p) {
      const s = 46;
      const N = CAR_N;
      let o = `<svg class="carb" viewBox="-6 -6 ${N * s + 34} ${N * s + 12}" aria-hidden="true"><rect x="-4" y="-4" width="${N * s + 8}" height="${N * s + 8}" rx="12" fill="#d9e1ea" stroke="#7f8e9c" stroke-width="2"/>`;
      for (let y = 0; y < N; y += 1) for (let x = 0; x < N; x += 1) o += `<rect x="${x * s + 2}" y="${y * s + 2}" width="${s - 4}" height="${s - 4}" rx="6" fill="#eef2f6"/>`;
      o += `<rect x="${N * s + 2}" y="${CAR_ROW * s + 4}" width="20" height="${s - 8}" rx="4" fill="#ff5b4f"/><text x="${N * s + 12}" y="${CAR_ROW * s + s / 2 + 4}" text-anchor="middle" class="exit">출구</text>`;
      p.cars.forEach((c, i) => {
        const w = c.h ? c.len * s : s;
        const h = c.h ? s : c.len * s;
        const sel = p.sel === i;
        o += `<g${p.locked ? '' : ` data-car="${i}" data-p="${p.idx}" class="car"`}><rect x="${c.x * s + 4}" y="${c.y * s + 4}" width="${w - 8}" height="${h - 8}" rx="10" fill="${c.color}" stroke="${sel ? '#1d2838' : 'rgba(0,0,0,.35)'}" stroke-width="${sel ? 4 : 1.6}"/>`;
        const cx = c.x * s + w / 2;
        const cy = c.y * s + h / 2;
        o += `<rect x="${c.h ? cx + w / 2 - 22 : cx - 12}" y="${c.h ? cy - 12 : cy - h / 2 + 10}" width="${c.h ? 12 : 24}" height="${c.h ? 24 : 12}" rx="3" fill="rgba(255,255,255,.75)"/>`;
        if (i === 0) o += `<text x="${cx - 6}" y="${cy + 6}" text-anchor="middle" font-size="18">⭐</text>`;
        o += '</g>';
      });
      return `${o}</svg>`;
    }
    function carBody(p) {
      return `${qCard(p, p.q.prompt, `${carSvg(p)}<div class="q-sub">움직인 횟수 <b>${p.carMoves}번</b> · 가장 적게 움직이면 ${p.q.best}번</div>`)}${p.locked ? '' : arrowPad(p.idx, 'carMove')}`;
    }

    const APP_BODIES = { ptmove: ptmoveBody, slide: slideBody, draw: drawBody, pose: poseBody, tiles: tilesBody, car: carBody };
    const APP_SETUP = {
      ptmove: (p) => { p.tap = null; },
      slide: (p) => { p.off = [0, 0]; },
      draw: (p) => { p.path = []; p.closed = false; p.showAns = null; },
      pose: (p) => { p.ops = []; },
      tiles: (p) => { p.fill = {}; p.sel = p.q.blanks[0]; p.bad = []; },
      car: (p, q) => { p.cars = q.cars.map((c) => ({ ...c })); p.sel = null; p.carMoves = 0; p.log = []; }
    };
    const APP_CONTROLS = {
      ptmove: (p, { skip }) => skip,
      slide: (p, { skip, check, sub }) => `${sub('slideReset', '처음으로')}${skip}${check('slideCheck')}`,
      draw: (p, { skip, check, sub }) => `${sub('drawUndo', '되돌리기')}${skip}${check('drawDone')}`,
      pose: (p, { skip, sub }) => `${sub('poseReset', '처음으로')}${skip}`,
      tiles: (p, { skip, check }) => `${skip}${check('tilesCheck')}`,
      car: (p, { skip, sub }) => `${sub('carReset', '처음으로')}${skip}`
    };

    function examDoneBody(p) {
      const log = examLog[p.idx] || [];
      const correct = log.filter((r) => r.correct).length;
      const secs = [...new Set(log.map((r) => r.sec))];
      return `
