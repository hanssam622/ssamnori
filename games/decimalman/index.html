          <div class="concept-head">
            <div class="kid-art"></div>
            <div><h2>${st ? `${st.title} 문제 모음` : '단원 전체 문제 모음'}</h2><p>체크한 유형의 문제만 골고루 섞여서 나와요.</p></div>
          </div>
          ${mixLessons().map((l) => {
            const full = l.items.every((id) => mixSel.has(id));
            return `
              <section class="mix-lesson">
                <div class="mix-lesson-head">
                  <span class="mix-page">${l.page}</span>
                  <h3>${l.title}</h3>
                  <button class="mix-all${full ? ' on' : ''}" type="button" onclick="toggleLesson('${l.id}')">${full ? '모두 해제' : '모두 선택'}</button>
                </div>
                <div class="mix-items">${l.items.map((id) => `
                  <button class="mix-chip${mixSel.has(id) ? ' on' : ''}" type="button" aria-pressed="${mixSel.has(id)}" onclick="toggleMixItem('${id}')">
                    <span class="ck">${CHECK}</span><span class="mi">${ICONS[MIX_ITEMS[id].icon]}</span>${MIX_ITEMS[id].label}${MIX_ITEMS[id].cap ? `<span class="mcap">최대 ${MIX_ITEMS[id].cap}명</span>` : ''}
                  </button>`).join('')}
                </div>
              </section>`;
          }).join('')}
          <div class="mix-foot">
            <div class="mix-sum"><span><b>${chosen.length}</b>가지 유형을 골랐어요</span>${capNote}</div>
            <div class="mix-btns">
              <button class="ghost-btn" type="button" onclick="hideMix()">닫기</button>
              <button class="btn-main" type="button" onclick="startMix()"${chosen.length ? '' : ' disabled'}>섞어서 시작 →</button>
            </div>
          </div>
        </div>`;
      box.firstElementChild.scrollTop = prevScroll;
    }
    function toggleMixItem(id) {
      if (mixSel.has(id)) mixSel.delete(id);
      else mixSel.add(id);
      saveMixSel();
      renderMix();
    }
    function toggleLesson(lid) {
      const l = LESSONS.find((x) => x.id === lid);
      const full = l.items.every((id) => mixSel.has(id));
      l.items.forEach((id) => { if (full) mixSel.delete(id); else mixSel.add(id); });
      saveMixSel();
      renderMix();
    }
    function startMix() {
      const chosen = mixChosen();
      if (!chosen.length) return;
      mixPool = chosen;
      mixTall = chosen.some((id) => MIX_ITEMS[id].tall);
      const st = mixScope === 'all' ? null : STAGES.find((x) => x.no === mixScope);
      const lessons = mixLessons().filter((l) => l.items.some((id) => mixSel.has(id)));
      MODES.mix = {
        title: st ? `${st.short} 문제 모음` : '단원 전체 문제 모음',
        icon: 'mix',
        sub: `${lessons.length > 3 ? '단원 전체' : lessons.map((l) => l.title).join(' · ')}에서 고른 ${chosen.length}가지 유형을 섞어 풀어요`,
        cap: mixCap(chosen)
      };
      const go = () => { hideMix(); startGame('mix'); };
      if (playerCount > MODES.mix.cap) {
        const names = [...new Set(chosen.filter((id) => (MIX_ITEMS[id].cap || 6) < playerCount).map((id) => MIX_ITEMS[id].label))];
        showCapNotice(names, MODES.mix.cap, VCALC_WHY, go);
        return;
      }
      go();
    }
    function mixTagHtml(q) {
      const it = MIX_ITEMS[q.mixId];
      return it ? `<div class="mix-tag"><span class="mi">${ICONS[it.icon]}</span>${it.label}</div>` : '';
    }


    /* =========================================================
       인원 제한 안내
       ========================================================= */
    const PEOPLE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6z"/><circle cx="17" cy="9" r="2.7" opacity=".55"/><path d="M15.6 13.7c3.2-.4 6 1.6 6 5.8h-4.4c0-2.3-.6-4.3-1.6-5.8z" opacity=".55"/></svg>';
    const VCALC_WHY = '세로셈은 칸마다 숫자·받아올림·소수점을 직접 눌러 써야 해서 한 사람의 칸이 넓어야 해요.';
    function capOf(m) { return MODES[m].cap || 6; }
    function capChip(cap, extra = '') {
      return `<span class="cap pc${cap < 6 ? ' lim' : ''}${playerCount > cap ? ' over' : ''}" data-cap="${cap}">${PEOPLE}${cap < 6 ? `최대 ${cap}명` : '1~6명'}${extra}</span>`;
    }
    // 고른 인원이 게임 제한보다 많을 때 시작 전에 알려 준다
    let noticeGo = null;
    function showCapNotice(names, cap, why, go) {
      noticeGo = go;
      document.getElementById('notice-overlay').innerHTML = `
        <div class="result-card notice-card">
          <div class="notice-ic">${PEOPLE}</div>
          <h2>인원 안내</h2>
          <p class="notice-main"><b>${names.join(', ')}</b> 게임으로 인해 <b>최대 ${cap}명</b>까지만 가능합니다.</p>
          <p class="notice-why">${why}</p>
          <p class="notice-now">지금 고른 인원은 ${playerCount}명이에요. ${cap}명으로 줄여서 시작할까요?</p>
          <div class="result-btns">
            <button class="ghost-btn" type="button" onclick="hideNotice()">취소</button>
            <button class="btn-main" type="button" onclick="acceptNotice()">${cap}명으로 시작 →</button>
          </div>
        </div>`;
      document.getElementById('notice-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideNotice() {
      document.getElementById('notice-overlay').classList.add('hidden');
      const others = ['concept-overlay', 'mix-overlay'].some((id) => !document.getElementById(id).classList.contains('hidden'));
      if (!others) document.body.classList.remove('modal');
    }
    function acceptNotice() {
      const go = noticeGo;
      noticeGo = null;
      hideNotice();
      if (go) go();
    }
    function tryStart(m) {
      const cap = capOf(m);
      if (playerCount > cap) {
        showCapNotice([MODES[m].title], cap, MODES[m].capWhy || '', () => startGame(m));
        return;
      }
      startGame(m);
    }
    function renderCapNote() {
      const note = document.getElementById('cap-note');
      if (!note) return;
      const byCap = {};
      Object.entries(MODES).forEach(([k, M]) => {
        if (k === 'mix' || !M.cap || M.cap >= playerCount) return;
        (byCap[M.cap] = byCap[M.cap] || []).push(M.title);
      });
      const lines = Object.entries(byCap).map(([cap, titles]) => `<b>${titles.join(' · ')}</b> 게임은 최대 ${cap}명까지만 가능합니다.`);
      note.innerHTML = lines.length ? `${PEOPLE}<span>${lines.join(' ')} 나머지 게임은 ${playerCount}명이 함께할 수 있어요.</span>` : '';
      document.querySelectorAll('.cap.pc').forEach((el) => el.classList.toggle('over', playerCount > Number(el.dataset.cap)));
    }

    /* =========================================================
       화면 전환 / 설정
       ========================================================= */
    let heroTimer = null;
    function animateHero() {
      const g = document.getElementById('hero-grid');
      const tag = document.getElementById('hero-tag');
      if (!g) return;
      if (!g.children.length) g.innerHTML = Array.from({ length: 100 }, () => '<i></i>').join('');
      const cells = [...g.children];
      cells.forEach((c) => { c.className = ''; });
      let i = 0;
      clearInterval(heroTimer);
      heroTimer = setInterval(() => {
        if (i >= 47) { clearInterval(heroTimer); return; }
        cells[i].className = 'a';
        i += 1;
        tag.innerHTML = `0<i class="dp"></i>${String(i).padStart(2, '0')}`;
      }, 30);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen, .game-screen').forEach((el) => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      document.body.classList.toggle('playing', id === 'game-screen');
      if (id === 'game-select-screen') { renderPlayerSeg(); renderCapNote(); }
      if (id === 'start-screen') animateHero();
    }

    function renderPlayerSeg() {
      document.getElementById('player-seg').innerHTML = [1, 2, 3, 4, 5, 6]
        .map((i) => `<button type="button" class="${i === playerCount ? 'on' : ''}" onclick="setPlayers(${i})">${i}명</button>`)
        .join('');
    }
    function setPlayers(n) { playerCount = n; renderPlayerSeg(); renderCapNote(); }

    function cardHtml(m) {
      const M = MODES[m];
      const capTxt = capChip(capOf(m), m === 'exam' ? ' · 시간 무제한' : '');
      const sel = M.opts
        ? `<select class="card-select" id="opt-${m}" aria-label="문제 유형">${OPT_CHOICES[M.opts].map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`
        : '';
      return `
        <article class="card${M.wide ? ' wide' : ''}" style="--tint:${M.tint}">
          <div class="card-top"><span class="ic">${ICONS[M.icon]}</span>${capTxt}</div>
          <h4>${M.title}</h4>
          <p>${M.desc}</p>
          ${sel}
          <button class="go" type="button" onclick="tryStart('${m}')">${m === 'exam' ? '평가 시작' : '시작'}</button>
        </article>`;
    }
    function renderStages() {
      document.getElementById('stage-nav').innerHTML = STAGES
        .map((st) => `<button class="stage-chip" type="button" style="--sc:${st.color}" onclick="jumpStage(${st.no})"><b>${st.no}</b>${st.short}</button>`)
        .join('');
      document.getElementById('stages').innerHTML = STAGES.map((st) => `
        <section class="stage" id="stage-${st.no}" style="--sc:${st.color}">
          <div class="stage-head">
            <span class="stage-no">${st.no}</span>
            <h3 class="stage-title">${st.title}</h3>
            <span class="stage-page">${st.page}</span>
            <button class="stage-ws" type="button" onclick="openWorksheet(${st.no})">🖨 학습지</button>
          </div>
          <div class="cards">
            ${st.concept ? `
              <article class="card concept" style="--tint:#d6f3ee">
                <div class="card-top"><span class="ic">${ICONS.concept}</span><span class="cap">개념</span></div>
                <h4>개념 알아보기</h4>
                <p>${CONCEPTS[st.concept].desc}</p>
                <button class="go" type="button" onclick="showConcept('${st.concept}')">펼쳐 보기</button>
              </article>` : ''}
            ${st.no === 6 ? mixCardHtml(st) : ''}
            ${st.concept ? mixCardHtml(st) : ''}
            ${st.items.map(cardHtml).join('')}
          </div>
        </section>`).join('');
    }
    function jumpStage(no) {
      document.getElementById(`stage-${no}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* =========================================================
       게임 시작 / 종료
       ========================================================= */
    const START_MSG = {
      choice: '알맞은 답을 골라 보세요.',
      keypad: '키패드로 답을 써 보세요.',
      paint: '칸을 누르거나 손가락으로 문질러 색칠해요. 세로 한 줄은 0.1, 한 칸은 0.01!',
      gadd: '더하는 수만큼 노란색으로 이어서 색칠한 뒤 답을 써요.',
      gsub: '빼는 수만큼 뒤에서부터 눌러 ✕표 한 뒤 답을 써요.',
      shift: '◀ ▶ 버튼으로 숫자 카드를 옮겨요. 소수점은 움직이지 않아요.',
      compare: '>, =, < 중 알맞은 것을 골라 보세요.',
      vcalc: '오른쪽 자리부터 숫자를 써요. 답에도 소수점 콕!',
      fix: '세로셈을 꼼꼼히 살펴보세요.',
      word: '문제를 읽고 알맞은 식을 골라 보세요.'
    };

    function createPlayer(idx) {
      const prevQ = players[idx] && players[idx].q ? players[idx].q : null;
      const q = mode === 'exam' ? examQuestionFor(idx) : makeQuestion(prevQ && prevQ.key, prevQ && prevQ.mixId);
      const p = { idx, q, tries: 0, state: '', message: '', locked: !q, picked: [], pickedWhy: [], input: '', inputBad: false };
      if (!q) return p;
      p.message = START_MSG[q.kind] || '알맞은 답을 골라 보세요.';
      if (q.kind === 'keypad' && mode === 'speed') p.message = '식을 보고 빠르게 답을 써요.';
      if (q.kind === 'paint') p.fill = 0;
      if (q.kind === 'gadd') p.add = 0;
      if (q.kind === 'gsub') p.cross = 0;
      if (q.kind === 'shift') p.sh = 0;
      if (q.kind === 'order') { p.done = []; p.message = `${q.desc ? '가장 큰' : '가장 작은'} 수부터 차례로 눌러요.`; }
      if (q.kind === 'vcalc') initVcalc(p);
      if (q.kind === 'word') {
        p.stage = mode === 'exam' ? 'ans' : 'op';
        if (mode === 'exam') p.message = '문제를 읽고 답을 구해 키패드로 써요.';
      }
      if (q.kind === 'fix') p.stage = 'ox';
      return p;
    }

    function startGame(selectedMode) {
      mode = selectedMode;
      const sel = document.getElementById(`opt-${mode}`);
      modeOpt = sel ? sel.value : 'all';
      const cap = MODES[mode].cap;
      if (cap && playerCount > cap) playerCount = cap;
      scores = Array(playerCount).fill(0);
      combos = Array(playerCount).fill(0);
      if (mode === 'exam') {
        examQueues = Array.from({ length: playerCount }, () => buildExamQueue());
        examIndex = Array(playerCount).fill(0);
        examLog = Array.from({ length: playerCount }, () => []);
      }
      players = [];
      players = Array.from({ length: playerCount }, (_, idx) => createPlayer(idx));
      gameActive = true;
      const M = MODES[mode];
      document.getElementById('mode-title').innerHTML = `<span class="ic">${ICONS[M.icon]}</span>${M.title}`;
      document.getElementById('mode-sub').textContent = M.sub;
      showScreen('game-screen');
      renderPlayers();
      startTimer();
    }

    function setTimerUi(left, total) {
      const t = document.getElementById('timer');
      const bar = document.getElementById('timer-bar');
      const label = document.getElementById('time-left');
      if (total === null) {
        t.className = 'timer inf';
        label.textContent = '∞';
        bar.style.strokeDashoffset = '0';
        return;
      }
      t.className = `timer${left <= 10 ? ' warn' : ''}`;
      label.textContent = String(Math.max(0, left));
      bar.style.strokeDashoffset = String(157.08 * (1 - Math.max(0, left) / total));
    }
    function startTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; }
      const selected = mode === 'exam' ? 'none' : document.getElementById('timer-select').value;
      if (selected === 'none') { setTimerUi(0, null); return; }
      timeTotal = Number.parseInt(selected, 10) || 90;
      timeLeft = timeTotal;
      setTimerUi(timeLeft, timeTotal);
      timerId = setInterval(() => {
        if (!gameActive) return;
        timeLeft -= 1;
        setTimerUi(timeLeft, timeTotal);
        if (timeLeft <= 0) finishGame();
      }, 1000);
    }

    function stopAll() {
      gameActive = false;
      if (timerId) { clearInterval(timerId); timerId = null; }
      Object.values(nextTimers).forEach((t) => clearTimeout(t));
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
    function exitGame() {
      stopAll();
      document.getElementById('result-overlay').classList.add('hidden');
      showScreen('game-select-screen');
    }

    function finishGame() {
      if (!players.length) return;
      stopAll();
      const ranking = scores
        .map((score, idx) => ({ score, idx, animal: ANIMALS[idx % ANIMALS.length] }))
        .sort((a, b) => b.score - a.score);
      let rank = 0;
      let prev = null;
      ranking.forEach((item, pos) => {
        if (item.score !== prev) { rank = pos + 1; prev = item.score; }
        item.rank = rank;
      });
      const exam = mode === 'exam';
      const scoreText = (item) => (exam
        ? `${item.score} / 100점 <small>(${(examLog[item.idx] || []).filter((r) => r.correct).length}/${EXAM_TOTAL})</small>`
        : `${item.score}점`);
      document.getElementById('result-overlay').innerHTML = `
        <div class="result-card">
          <div class="kid-art"></div>
          <h2>${exam ? '마무리 평가 결과' : '결과 발표'}</h2>
          <p class="sub">${MODES[mode].title}</p>
          ${ranking.map((item) => `
            <div class="rank-row r${item.score > 0 ? item.rank : 0}">
              <span class="rk">${item.rank}</span>
              <span>${item.animal.emoji} ${item.animal.name}</span>
              <strong>${scoreText(item)}</strong>
            </div>`).join('')}
          <div class="result-btns">
            ${exam ? '' : '<button class="btn-main" type="button" onclick="hideResult()">계속하기</button>'}
            <button class="${exam ? 'btn-main' : 'ghost-btn'}" type="button" onclick="restartGame()">다시 하기</button>
            <button class="ghost-btn" type="button" onclick="exitGame()">게임 목록</button>
          </div>
        </div>`;
      document.getElementById('result-overlay').classList.remove('hidden');
      blip('fanfare');
    }

    function hideResult() {
      document.getElementById('result-overlay').classList.add('hidden');
      if (mode === 'exam') return;
      gameActive = true;
      players = players.map((p, idx) => (p.locked ? createPlayer(idx) : p));
      renderPlayers();
      startTimer();
    }

    function restartGame() {
      document.getElementById('result-overlay').classList.add('hidden');
      startGame(mode);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    /* =========================================================
       렌더링
       ========================================================= */
    const TALL = ['gadd', 'gsub', 'vadd', 'vsub', 'word', 'exam', 'fix', 'shift', 'paint'];
    let narrowCells = false;
    function isTall() { return mode === 'mix' ? mixTall : TALL.includes(mode); }
    function columnCount() {
      const w = window.innerWidth;
      if (w < 760) return isTall() ? 1 : Math.min(playerCount, 2);
      // 태블릿처럼 화면이 좁은데 인원이 많으면 두 줄로 나눈다
      if (playerCount > 3 && w / playerCount < 190) return Math.ceil(playerCount / 2);
      return playerCount;
    }
    function cellMetrics() {
      const cols = columnCount();
      const rows = Math.ceil(playerCount / cols);
      const bar = document.querySelector('.topbar');
      const top = bar && bar.offsetHeight ? bar.offsetHeight : 80;
      return { cols, rows, w: window.innerWidth / cols, h: (window.innerHeight - top) / rows };
    }
    function cellScale(m) {
      const tall = isTall();
      // 좁은 칸은 보기를 한 줄로 쌓고 세로셈·자리판 같은 부품을 따로 줄이므로 글씨를 덜 줄인다
      const narrow = m.w < 330;
      const wBase = tall ? (narrow ? 300 : 400) : (narrow ? 250 : 300);
      const s = Math.min(m.w / wBase, m.h / (tall ? 690 : 600));
      return clamp(Math.round(s * 1000) / 1000, 0.62, 1.3);
    }
    function renderPlayers() {
      const grid = document.getElementById('players');
      const m = cellMetrics();
      narrowCells = m.w < 330;
      grid.classList.toggle('xnarrow', m.w < 240);
      grid.style.gridTemplateColumns = `repeat(${m.cols}, minmax(0, 1fr))`;
      grid.style.gridTemplateRows = `repeat(${m.rows}, minmax(0, 1fr))`;
      grid.style.setProperty('--s', cellScale(m));
      grid.classList.toggle('narrow', narrowCells);
      grid.innerHTML = players.map((p) => `<section class="player-cell theme-${p.idx % 6}" id="cell-${p.idx}">${cellInner(p)}</section>`).join('');
    }
    function renderCell(idx) {
      const cell = document.getElementById(`cell-${idx}`);
      if (cell && players[idx]) cell.innerHTML = cellInner(players[idx]);
    }

    function speakerBtn(idx) {
      return `<button class="spk" type="button" onclick="speakQ(${idx})" aria-label="문제 읽어 주기">${SPK}</button>`;
    }
    function speakQ(idx) {
      const p = players[idx];
      if (p && p.q) speak(p.q.speech);
    }

    function cellInner(p) {
      const a = ANIMALS[p.idx % ANIMALS.length];
      const q = p.q;
      const body = !q ? examDoneBody(p) : (BODIES[q.kind] || choiceBody)(p);
      const prog = mode === 'exam'
        ? `<span class="prog-chip">${Math.min(examIndex[p.idx] + (q ? 1 : 0), EXAM_TOTAL)} / ${EXAM_TOTAL}</span>`
        : '';
      const combo = mode === 'speed' && combos[p.idx] >= 2 ? `<span class="combo-chip">🔥 ${combos[p.idx]}연속</span>` : '';
      return `
        <div class="answer-overlay" id="ov-${p.idx}"></div>
        <div class="player-header">
          <span class="pname"><span class="av">${a.emoji}</span><span class="nm">${a.name}</span></span>
          <span class="pscore-wrap">${combo}${prog}<span class="pscore" id="sc-${p.idx}">${STAR}${scores[p.idx]}</span></span>
        </div>
        <div class="cell-body">${mode === 'mix' && q ? mixTagHtml(q) : ''}${body}</div>
        <div class="controls">
          <div class="message ${p.state}" id="msg-${p.idx}"><span>${p.message}</span></div>
          <div class="btns">${q ? controlsHtml(p) : ''}</div>
        </div>`;
    }

    function controlsHtml(p) {
      if (p.locked) return '';
      const k = p.q.kind;
      const skip = mode === 'exam' ? '' : `<button class="btn-sub" type="button" onclick="skipQuestion(${p.idx})">넘기기</button>`;
      const check = (fn) => `<button class="btn-check" type="button" onclick="${fn}(${p.idx})">확인</button>`;
      if (k === 'keypad' || k === 'gadd' || k === 'gsub' || (k === 'word' && p.stage === 'ans')) return `${skip}${check('submitAns')}`;
      if (k === 'paint') return `<button class="btn-sub" type="button" onclick="paintClear(${p.idx})">지우기</button>${check('paintCheck')}`;
      if (k === 'shift') return `<button class="btn-sub" type="button" onclick="shiftReset(${p.idx})">처음으로</button>${check('shiftCheck')}`;
      if (k === 'vcalc') return `<button class="btn-sub" type="button" onclick="vReset(${p.idx})">되돌리기</button>${check('vCheck')}`;
      return skip;
    }

    /* ---------- 문제 본문 ---------- */
    function choiceBtns(p, list, cls, pickedList, ans) {
      return list.map((c, i) => {
        const picked = pickedList.includes(i);
        const isAns = c.v === ans;
        let st = '';
        if (picked && !isAns) st = ' wrong';
        if (p.locked && isAns) st = ' right';
        return `<button class="choice${cls ? ` ${cls}` : ''}${st}" type="button" onclick="choose(${p.idx},${i})">${c.html}</button>`;
      }).join('');
    }
    function qCard(p, prompt, visual) {
      return `<div class="q-card"><div class="q-text"><span>${prompt}</span>${speakerBtn(p.idx)}</div>${visual || ''}</div>`;
    }

    function choiceBody(p) {
      const q = p.q;
      const cols = q.cols || 2;
      return `${qCard(p, q.prompt, q.visual)}
        <div class="choices c${cols}${q.txt ? ' txtc' : ''}">${choiceBtns(p, q.choices, q.txt ? 'txt' : '', p.picked, q.ans)}</div>`;
    }

    function compareBody(p) {
      const q = p.q;
      const visual = `<div class="cmp">${numHtml(q.a)}<span class="cmp-slot${p.locked ? ' f' : ''}">${p.locked ? q.ans : '?'}</span>${numHtml(q.b)}</div>
        ${p.showTable ? ptableHtml([{ s: q.a, zeroFill: true }, { s: q.b, zeroFill: true }], q.place) : ''}`;
      return `${qCard(p, '두 소수의 크기를 비교해 보세요.', visual)}
        <div class="choices c3">${choiceBtns(p, q.choices, 'sign', p.picked, q.ans)}</div>`;
    }

    function ansBoxHtml(p) {
      return `<span class="ans-box${p.inputBad ? ' bad' : ''}" id="ans-${p.idx}">${p.input ? numHtml(p.input) : '<span class="ph">?</span>'}${p.locked ? '' : '<span class="caret"></span>'}</span>`;
    }
    function keypadHtml(idx, noDot) {
      const keys = narrowCells
        ? ['7', '8', '9', 'del', '4', '5', '6', noDot ? '' : '.', '1', '2', '3', '0']
        : ['1', '2', '3', '4', '5', 'del', '6', '7', '8', '9', '0', noDot ? '' : '.'];
      return `<div class="keypad${narrowCells ? ' k4' : ''}">${keys.map((k) => {
        if (k === '') return '<span></span>';
        if (k === 'del') return `<button class="key fn" type="button" onclick="kp(${idx},'del')" aria-label="지우기">⌫</button>`;
        if (k === '.') return `<button class="key dotk" type="button" onclick="kp(${idx},'.')" aria-label="소수점"><i></i></button>`;
        return `<button class="key" type="button" onclick="kp(${idx},'${k}')">${k}</button>`;
      }).join('')}</div>`;
    }

    function keypadBody(p) {
      const q = p.q;
      const prompt = q.prompt || '계산해 보세요.';
      const line = `<div class="ans-line"${q.big ? ' style="font-size:calc(var(--s) * 38px)"' : ''}>${q.lhs}${ansBoxHtml(p)}${q.unit ? `<span class="unit-txt">${q.unit}</span>` : ''}</div>`;
      return `${qCard(p, prompt, line)}${p.locked ? '' : keypadHtml(p.idx)}`;
    }

    function gridClassFn(p) {
      const q = p.q;
      if (q.kind === 'paint') return (k) => (k < p.fill ? 'a' : '');
      if (q.kind === 'gadd') return (k) => (k < q.a ? 'a' : k < q.a + p.add ? 'b' : '');
      return (k) => (k < q.a ? (k >= q.a - p.cross ? 'x' : 'a') : '');
    }
    function unitCount(q, cells) {
      return q.unit === 10 ? `${numHtml('0.1')}이 ${cells / 10}개` : `${numHtml('0.01')}이 ${cells}개`;
    }
    function paintCount(p) { return `색칠한 칸: <b>${numHtml('0.01')}이 ${p.fill}개</b>`; }

    function paintBody(p) {
      const q = p.q;
      const grids = hgridHtml(q.grids, gridClassFn(p), { tap: true, idx: p.idx, size: 'xl', id: `hg-${p.idx}` });
      return qCard(p, `<b>${N(q.n)}</b>만큼 색칠해 보세요.`, `${grids}<div class="gcount" id="gc-${p.idx}">${paintCount(p)}</div>`);
    }

    function gcalcBody(p) {
      const q = p.q;
      const add = q.kind === 'gadd';
      const grids = hgridHtml(q.grids, gridClassFn(p), { tap: true, idx: p.idx, size: q.grids === 1 ? '' : 'sm', id: `hg-${p.idx}` });
      const legend = add
        ? `<div class="legend"><span><i class="sw"></i>${N(q.a * 10)}</span><span><i class="sw b"></i>더한 부분: <b id="gc-${p.idx}">${unitCount(q, p.add)}</b></span></div>`
        : `<div class="legend"><span><i class="sw"></i>${N(q.a * 10)}</span><span><i class="sw x"></i>뺀 부분: <b id="gc-${p.idx}">${unitCount(q, p.cross)}</b></span></div>`;
      const line = `<div class="ans-line">${N(q.a * 10)} <span class="op-sym">${add ? '+' : '−'}</span> ${N(q.b * 10)} <span class="op-sym">=</span> ${ansBoxHtml(p)}</div>`;
      return `${qCard(p, add ? '이어서 색칠하고 합을 구해요' : '✕표 하고 남은 부분을 구해요', `${grids}${legend}`)}${line}${p.locked ? '' : keypadHtml(p.idx)}`;
    }

    function shiftValue(p) {
      const q = p.q;
      return p.sh >= 0 ? q.base * Math.pow(10, p.sh) : q.base / Math.pow(10, -p.sh);
    }
    function shiftZeros(p) {
      const q = p.q;
      const lo = q.s - p.sh;
      const hi = q.s + q.digits.length - 1 - p.sh;
      const cols = [];
      if (hi < 2) for (let c = hi + 1; c <= 2; c += 1) cols.push(c);
      if (lo > 2) for (let c = 2; c < lo; c += 1) cols.push(c);
      return cols.map((c) => `<div class="szero" style="--c:${c};--after:${c >= 3 ? 1 : 0}">0</div>`).join('');
    }
    function shiftReadout(p) {
      return `지금 수 <span class="num" style="margin-left:6px">${N(shiftValue(p))}</span>${p.q.unit ? ` <span class="unit-txt">${p.q.unit}</span>` : ''}`;
    }
    function shiftBody(p) {
      const q = p.q;
      const heads = [2, 1, 0, null, -1, -2, -3]
        .map((pl) => (pl === null ? '<span class="dh"></span>' : `<span class="${bgClass(pl)}">${PLACE_UNIT[pl]}</span>`))
        .join('');
      const tiles = q.digits.map((d, i) => {
        const c = q.s + i - p.sh;
        return `<div class="stile" id="st-${p.idx}-${i}" style="--c:${c};--after:${c >= 3 ? 1 : 0}"><span>${d}</span></div>`;
      }).join('');
      const prompt = `${N(q.base)}${q.unit ? ` ${q.unit}` : ''}의 <b>${timesHtml(q.k)}</b>${q.k > 0 ? '는' : '은'}?`;
      const board = `
        <div class="sboard">
          <div class="heads">${heads}</div>
          <div class="lane"><span class="sdot"></span><div id="sz-${p.idx}">${shiftZeros(p)}</div>${tiles}</div>
        </div>
        <div class="readout" id="sr-${p.idx}">${shiftReadout(p)}</div>`;
      return `${qCard(p, prompt, board)}
        <div class="shift-ctrl">
          <button class="shift-btn" type="button" onclick="shiftMove(${p.idx}, 1)">${ARROW_L}왼쪽으로</button>
          <button class="shift-btn" type="button" onclick="shiftMove(${p.idx}, -1)">오른쪽으로${ARROW_R}</button>
        </div>`;
    }

    function orderBody(p) {
      const q = p.q;
      const slots = q.items.map((_, i) => {
        const has = p.done[i] !== undefined;
        return `<span class="oslot${has ? ' f' : ''}">${has ? N(q.items[p.done[i]]) : ''}</span>`;
      }).join(`<span class="osign">${q.desc ? '&gt;' : '&lt;'}</span>`);
      const cards = q.items.map((v, i) => `<button class="choice ocard${p.done.includes(i) ? ' used' : ''}${p.wrongPick === i ? ' wrong shake' : ''}" type="button" onclick="orderTap(${p.idx},${i})">${N(v)}</button>`).join('');
      return `${qCard(p, `<b>${q.desc ? '큰 수부터' : '작은 수부터'}</b> 차례대로 눌러 보세요.`, `<div class="oslots">${slots}</div>`)}
        <div class="ocards">${cards}</div>`;
    }

    function initVcalc(p) {
      const q = p.q;
      p.lay = vLayout(q.a, q.b, q.r);
      const n = p.lay.I + p.lay.F;
      p.stage = p.lay.decA !== p.lay.decB ? 'align' : 'calc';
      p.off = 0;
      p.ans = Array(n).fill('');
      p.sel = n - 1;
      p.dot = false;
      p.needDot = false;
      p.carry = Array(n).fill(false);
      p.give = Array(n).fill(0);
      p.recv = Array(n).fill(0);
      p.bad = [];
      if (p.stage === 'align') p.message = '자릿수가 달라요! 빨간 소수점이 위아래로 나란히 오게 옮겨요.';
    }
    function vcalcBody(p) {
      const q = p.q;
      if (p.stage === 'align') {
        const L = p.lay;
        const target = L.decA - L.decB;
        const row = (s, cls, sign) => {
          let h = `<div class="arow ${cls}"${cls === 'b' ? ` id="ab-${p.idx}" style="--off:${p.off}"` : ''}><span class="ch">${sign}</span>`;
          [...s].forEach((ch) => { h += ch === '.' ? '<span class="dt"><i></i></span>' : `<span class="ch">${ch}</span>`; });
          return `${h}</div>`;
        };
        const board = `
          <div class="aboard${p.off === target ? ' ok' : ''}" id="abd-${p.idx}" style="--fa:${L.decA}">
            <span class="guide"></span>${row(q.a, 'a', '')}${row(q.b, 'b', OPS[q.op])}
          </div>`;
        return `${qCard(p, `${numHtml(q.a)} ${OPS[q.op]} ${numHtml(q.b)} · 먼저 소수점 맞추기`, board)}
          <div class="shift-ctrl">
            <button class="shift-btn" type="button" onclick="alignMove(${p.idx}, 1)">${ARROW_L}왼쪽</button>
            <button class="shift-btn" type="button" onclick="alignMove(${p.idx}, -1)">오른쪽${ARROW_R}</button>
          </div>`;
      }
      const grid = vGridHtml({
        idx: p.idx, lay: p.lay, op: q.op, interactive: true, locked: p.locked,
        ans: p.ans, sel: p.sel, bad: p.bad, dot: p.dot, needDot: p.needDot,
        carry: p.carry, give: p.give, recv: p.recv, good: p.locked && p.state === 'ok'
      });
      return `<div class="vwrap">${grid}</div>${p.locked ? '' : keypadHtml(p.idx, true)}`;
    }

    function fixBody(p) {
      const q = p.q;
      const why = p.stage === 'why';
      const list = why
        ? q.reasons.map((r) => ({ v: r, html: FIX_REASON[r] }))
        : [{ v: 'o', html: '⭕ 맞았어요' }, { v: 'x', html: '❌ 틀렸어요' }];
      const ans = why ? q.err : (q.err === 'ok' ? 'o' : 'x');
      const after = p.locked && q.err !== 'ok' ? `<div class="q-sub">바른 답: <b>${numHtml(q.correct)}</b></div>` : '';
      return `${qCard(p, why ? '어디가 잘못되었을까요?' : '이 계산이 맞았을까요?', `${vCharHtml(q.a, q.b, q.op, q.shown, q.layout)}${after}`)}
        <div class="choices ${why ? 'c1' : 'c2'}">${choiceBtns(p, list, why ? 'txt' : '', why ? p.pickedWhy : p.picked, ans)}</div>`;
    }

    function wordBody(p) {
      const q = p.q;
      const story = `<div class="story"><span class="em">${q.em}</span><p>${q.text}</p>${speakerBtn(p.idx)}</div>`;
      if (p.stage === 'op') {
        return `${story}<div class="q-text"><span>알맞은 식을 골라 보세요.</span></div>
          <div class="choices c1">${choiceBtns(p, q.choices, '', p.picked, q.op)}</div>`;
      }
      const expr = mode === 'exam' ? '' : `${N(q.a)} <span class="op-sym">${OPS[q.op]}</span> ${N(q.b)} <span class="op-sym">=</span>`;
      return `${story}<div class="ans-line">${expr}${ansBoxHtml(p)}<span class="unit-txt">${q.unit}</span></div>${p.locked ? '' : keypadHtml(p.idx)}`;
    }

    function examDoneBody(p) {
      const log = examLog[p.idx] || [];
      const correct = log.filter((r) => r.correct).length;
      const secs = [...new Set(log.map((r) => r.sec))];
      return `
        <div class="done-card">
          <div class="kid-art"></div>
          <div class="done-score">${scores[p.idx]}점</div>
          <div class="done-sub">${EXAM_TOTAL}문제 중 ${correct}문제를 맞혔어요!<br />친구들이 끝날 때까지 기다려요.</div>
          <div class="done-list">${secs.map((s) => {
            const rs = log.filter((r) => r.sec === s);
            return `<div class="done-row"><span>${s}</span><span>${rs.filter((r) => r.correct).length} / ${rs.length}</span></div>`;
          }).join('')}</div>
        </div>`;
    }

    const BODIES = {
      choice: choiceBody, compare: compareBody, keypad: keypadBody, paint: paintBody,
      gadd: gcalcBody, gsub: gcalcBody, shift: shiftBody, order: orderBody,
      vcalc: vcalcBody, fix: fixBody, word: wordBody
    };

    /* =========================================================
       정답 처리
       ========================================================= */
    function setMsg(idx, html, state = '') {
      const p = players[idx];
      if (!p) return;
      p.message = html;
      p.state = state;
      const el = document.getElementById(`msg-${idx}`);
      if (el) { el.innerHTML = `<span>${html}</span>`; el.className = `message ${state}`; }
    }

    function queueNext(idx, p, ms) {
      clearTimeout(nextTimers[idx]);
      nextTimers[idx] = setTimeout(() => {
        if (!gameActive || players[idx] !== p) return;
        players[idx] = createPlayer(idx);
        renderCell(idx);
      }, ms);
    }

    function award(idx, msg, speechText) {
      const p = players[idx];
      if (!p || p.locked) return;
      let gain = p.tries === 0 ? 2 : 1;
      if (mode === 'speed') {
        combos[idx] += 1;
        if (combos[idx] >= 3) gain += 1;
      }
      scores[idx] += gain;
      p.state = 'ok';
      p.locked = true;
      p.message = `${msg} <b>+${gain}점</b>`;
      renderCell(idx);
      const sc = document.getElementById(`sc-${idx}`);
      if (sc) sc.classList.add('bump');
      showAnswerOverlay(idx, true);
      blip('ok');
      if (speechText) speak(speechText);
      queueNext(idx, p, mode === 'speed' ? 1000 : 1800);
    }

    function miss(idx, msg) {
      const p = players[idx];
      if (!p) return;
      p.tries += 1;
      p.state = 'no';
      p.message = msg;
      if (mode === 'speed') combos[idx] = 0;
      renderCell(idx);
      showAnswerOverlay(idx, false);
      blip('no');
    }

    function resolve(idx, ok, okMsg, noMsg, speechText) {
      if (mode === 'exam') { examAdvance(idx, ok); return; }
      if (ok) award(idx, okMsg, speechText);
      else miss(idx, noMsg);
    }

    function examAdvance(idx, correct) {
      const p = players[idx];
      const q = p.q;
      examLog[idx].push({ sec: q.sec, correct });
      if (correct) scores[idx] += EXAM_POINT;
      examIndex[idx] += 1;
      p.locked = true;
      p.state = correct ? 'ok' : 'no';
      const ansText = q.ansText || (q.choices ? (q.choices.find((c) => c.v === q.ans) || {}).html : '');
      p.message = correct ? `정답! <b>+${EXAM_POINT}점</b>` : `아쉬워요. 정답: <b>${ansText}</b>`;
      renderCell(idx);
      showAnswerOverlay(idx, correct);
      blip(correct ? 'ok' : 'no');
      clearTimeout(nextTimers[idx]);
      nextTimers[idx] = setTimeout(() => {
        if (players[idx] !== p) return;
        players[idx] = createPlayer(idx);
        renderCell(idx);
        if (examIndex.every((v) => v >= EXAM_TOTAL)) finishGame();
      }, correct ? 1100 : 2400);
    }

    function skipQuestion(idx) {
      if (!gameActive || !players[idx]) return;
      if (mode === 'speed') combos[idx] = 0;
      players[idx] = createPlayer(idx);
      renderCell(idx);
    }

    const CONF_COLORS = ['#ff5b4f', '#12b3a3', '#ffb12b', '#3a7ff2', '#e64f95', '#8b5cf0'];
    function showAnswerOverlay(idx, correct) {
      const ov = document.getElementById(`ov-${idx}`);
      if (!ov) return;
      let conf = '';
      if (correct) {
        conf = `<div class="confetti">${Array.from({ length: 16 }, (_, i) => {
          const ang = (i / 16) * Math.PI * 2 + Math.random() * 0.4;
          const dist = 90 + Math.random() * 80;
          return `<i style="--c:${CONF_COLORS[i % CONF_COLORS.length]};--dx:${Math.round(Math.cos(ang) * dist)}px;--dy:${Math.round(Math.sin(ang) * dist)}px"></i>`;
        }).join('')}</div>`;
      }
      ov.className = `answer-overlay ${correct ? 'correct' : 'wrong'}`;
      ov.innerHTML = `${conf}<div class="answer-mark">${correct ? '○' : '✕'}</div>`;
      clearTimeout(overlayTimers[idx]);
      overlayTimers[idx] = setTimeout(() => {
        const live = document.getElementById(`ov-${idx}`);
        if (!live) return;
        live.className = 'answer-overlay';
        live.innerHTML = '';
      }, correct ? 950 : 800);
    }

    /* ---------- 고르기 ---------- */
    function choose(idx, i) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q) return;
      const q = p.q;
      if (q.kind === 'fix') { fixChoose(idx, i); return; }
      if (q.kind === 'word') { wordChoose(idx, i); return; }
      if (p.picked.includes(i)) return;
      p.picked.push(i);
      const ok = q.choices[i].v === q.ans;
      if (q.kind === 'compare') p.showTable = true;
      if (mode === 'exam') { examAdvance(idx, ok); return; }
      if (ok) award(idx, `정답! ${q.explain || ''}`, q.okSpeech);
      else miss(idx, q.kind === 'compare' ? '아쉬워요. 자릿값 표를 보고 높은 자리부터 비교해 보세요.' : '아쉬워요. 다시 골라 보세요.');
    }

    function fixChoose(idx, i) {
      const p = players[idx];
      const q = p.q;
      if (p.stage === 'ox') {
        if (p.picked.includes(i)) return;
        const saidOk = i === 0;
        if (saidOk && q.err === 'ok') { award(idx, '맞아요! 소수점을 맞추어 바르게 계산했어요.', '맞았어요'); return; }
        if (!saidOk && q.err !== 'ok') {
          p.stage = 'why';
          p.state = 'ok';
          p.message = '맞아요, 틀린 계산이에요! 어디가 잘못되었는지 골라요.';
          renderCell(idx);
          blip('tick');
          return;
        }
        p.picked.push(i);
        miss(idx, saidOk ? '다시 살펴보세요. 소수점 위치와 받아올림·받아내림을 직접 확인해요.' : '직접 계산해 보세요. 이 계산에는 틀린 곳이 없어요!');
        return;
      }
      if (p.pickedWhy.includes(i)) return;
      if (q.reasons[i] === q.err) { award(idx, `정답! 바른 답은 ${numHtml(q.correct)}예요.`, '정답입니다'); return; }
      p.pickedWhy.push(i);
      miss(idx, '다시 골라 보세요. 소수점의 자리와 받아올림·받아내림을 살펴봐요.');
    }

    function wordChoose(idx, i) {
      const p = players[idx];
      const q = p.q;
      if (p.stage !== 'op' || p.picked.includes(i)) return;
      if (q.choices[i].v === q.op) {
        p.stage = 'ans';
        p.state = 'ok';
        p.message = '좋아요! 식을 계산해서 답을 써요.';
        renderCell(idx);
        blip('tick');
        return;
      }
      p.picked.push(i);
      miss(idx, q.op === '+' ? '두 양을 합치면 모두 얼마인지 구하는 문제예요.' : '두 양의 차이나 남은 양을 구하는 문제예요.');
    }

    /* ---------- 키패드 ---------- */
    function kp(idx, key) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q) return;
      if (p.q.kind === 'vcalc') { vKey(idx, key); return; }
      if (key === 'del') p.input = p.input.slice(0, -1);
      else if (key === '.') {
        if (p.input.includes('.')) return;
        p.input = `${p.input || '0'}.`;
      } else {
        if (p.input.replace('.', '').length >= 7) return;
        p.input = p.input === '0' ? key : p.input + key;
      }
      p.inputBad = false;
      const el = document.getElementById(`ans-${idx}`);
      if (el) el.outerHTML = ansBoxHtml(p);
    }

    function gridExplain(q) {
      const u = q.unit === 10 ? '0.1' : '0.01';
      const cnt = (c) => (q.unit === 10 ? c / 10 : c);
      const r = q.kind === 'gadd' ? q.a + q.b : q.a - q.b;
      return `${numHtml(u)}이 ${cnt(q.a)}개 ${q.kind === 'gadd' ? '+' : '−'} ${cnt(q.b)}개 = ${cnt(r)}개 → ${N(r * 10)}`;
    }

    function submitAns(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q) return;
      const q = p.q;
      if (q.kind === 'gadd' && p.add !== q.b) {
        setMsg(idx, `먼저 더하는 수 ${N(q.b * 10)}만큼 이어서 색칠해요. (지금 ${unitCount(q, p.add)})`, 'hint');
        return;
      }
      if (q.kind === 'gsub' && p.cross !== q.b) {
        setMsg(idx, `먼저 빼는 수 ${N(q.b * 10)}만큼 ✕표 해요. (지금 ${unitCount(q, p.cross)})`, 'hint');
        return;
      }
      if (!p.input || p.input.endsWith('.')) { setMsg(idx, '답을 끝까지 써 주세요.', 'hint'); return; }
      const target = q.kind === 'word' ? q.r : q.ans;
      const ok = parseNum(p.input) === target;
      p.inputBad = !ok;
      let okMsg = `정답! ${q.explain || ''}`;
      let noMsg = q.hint ? `다시 생각해 봐요. ${q.hint}` : '다시 계산해 보세요.';
      if (q.kind === 'word') {
        okMsg = `정답! ${N(q.a)} ${OPS[q.op]} ${N(q.b)} = ${N(q.r)}, 답은 ${N(q.r)} ${q.unit}`;
        noMsg = '다시 계산해 보세요. 소수점을 맞추어 세로로 계산하면 쉬워요.';
      } else if (q.kind === 'gadd' || q.kind === 'gsub') {
        okMsg = `정답! ${gridExplain(q)}`;
        noMsg = `색칠한 칸을 다시 세어 보세요. ${q.unit === 10 ? numHtml('0.1') : numHtml('0.01')}이 모두 몇 개인가요?`;
      }
      const unitSay = q.unit ? ` ${UNIT_KO[q.unit] || ''}` : '';
      resolve(idx, ok, okMsg, noMsg, `${nKo(target)}${unitSay}`);
    }

    /* ---------- 모눈종이 칠하기 ---------- */
    function refreshGrid(idx) {
      const p = players[idx];
      const box = document.getElementById(`hg-${idx}`);
      if (!box) return;
      const fn = gridClassFn(p);
      box.querySelectorAll('i').forEach((el) => {
        const c = fn(Number(el.dataset.i));
        if (el.className !== c) el.className = c;
      });
      const gc = document.getElementById(`gc-${idx}`);
      if (gc) gc.innerHTML = p.q.kind === 'paint' ? paintCount(p) : unitCount(p.q, p.q.kind === 'gadd' ? p.add : p.cross);
    }

    function gridTouch(idx, i, isDown) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q) return;
      const q = p.q;
      const max = q.grids * 100;
      if (q.kind === 'paint') {
        let next = i + 1;
        if (isDown && next === p.fill) next = i;
        p.fill = clamp(next, 0, max);
      } else if (q.kind === 'gadd') {
        if (i < q.a) {
          if (!isDown) return;
          p.add = 0;
        } else {
          let end = q.unit === 10 ? (Math.floor(i / 10) + 1) * 10 : i + 1;
          if (isDown && end === q.a + p.add) end -= q.unit;
          p.add = Math.max(0, Math.min(end, max) - q.a);
        }
      } else if (q.kind === 'gsub') {
        if (i >= q.a) return;
        let start = q.unit === 10 ? Math.floor(i / 10) * 10 : i;
        if (isDown && start === q.a - p.cross) start += q.unit;
        p.cross = clamp(q.a - start, 0, q.a);
      } else return;
      if (p.state === 'hint' || p.state === 'no') setMsg(idx, START_MSG[q.kind], '');
      refreshGrid(idx);
    }

    const gridDrags = {};
    function tapCellAt(x, y) {
      const el = document.elementFromPoint(x, y);
      return el && el.closest ? el.closest('.hgrid.tap i') : null;
    }
    document.addEventListener('pointerdown', (e) => {
      const cell = e.target && e.target.closest ? e.target.closest('.hgrid.tap i') : null;
      if (!cell) return;
      const idx = Number(cell.parentElement.dataset.p);
      const i = Number(cell.dataset.i);
      gridDrags[e.pointerId] = { idx, last: i };
      gridTouch(idx, i, true);
      e.preventDefault();
    });
    document.addEventListener('pointermove', (e) => {
      const d = gridDrags[e.pointerId];
      if (!d) return;
      const cell = tapCellAt(e.clientX, e.clientY);
      if (!cell || Number(cell.parentElement.dataset.p) !== d.idx) return;
      const i = Number(cell.dataset.i);
      if (i === d.last) return;
      d.last = i;
      gridTouch(d.idx, i, false);
    });
    const endDrag = (e) => { delete gridDrags[e.pointerId]; };
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);

    function paintClear(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      p.fill = 0;
      refreshGrid(idx);
    }
    function paintCheck(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      const q = p.q;
      if (p.fill === 0) { setMsg(idx, '칸을 눌러 색칠해 보세요.', 'hint'); return; }
      if (p.fill === q.target) {
        award(idx, `정답! ${N(q.n)}${eunNeun(nKo(q.n))} ${numHtml('0.01')}이 ${q.target}개예요.`, nKo(q.n));
      } else {
        miss(idx, `${N(q.n)}${eunNeun(nKo(q.n))} ${numHtml('0.01')}이 몇 개일까요? 지금은 ${p.fill}칸을 칠했어요.`);
      }
    }

    /* ---------- 10배 · 1/10 자리 이동 ---------- */
    function shiftMove(idx, dir) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q || p.q.kind !== 'shift') return;
      const q = p.q;
      const next = p.sh + dir;
      const lo = q.s - next;
      const hi = q.s + q.digits.length - 1 - next;
      if (lo < 0 || hi > 5) { setMsg(idx, '더 옮길 자리가 없어요.', 'hint'); blip('no'); return; }
      p.sh = next;
      q.digits.forEach((_, i) => {
        const el = document.getElementById(`st-${idx}-${i}`);
        if (!el) return;
        const c = q.s + i - p.sh;
        el.style.setProperty('--c', c);
        el.style.setProperty('--after', c >= 3 ? 1 : 0);
      });
      const z = document.getElementById(`sz-${idx}`);
      if (z) z.innerHTML = shiftZeros(p);
      const r = document.getElementById(`sr-${idx}`);
      if (r) r.innerHTML = shiftReadout(p);
      if (p.state === 'hint' || p.state === 'no') setMsg(idx, START_MSG.shift, '');
      blip('tick');
    }
    function shiftReset(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      p.sh = 0;
      renderCell(idx);
    }
    function shiftCheck(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      const q = p.q;
      if (p.sh === 0) { setMsg(idx, '숫자 카드를 옮겨서 답을 만들어 보세요.', 'hint'); return; }
      const ok = p.sh === q.k;
      let noMsg = `${Math.abs(q.k)}자리 옮겨야 해요. ${q.k > 0 ? '10배는 1자리, 100배는 2자리, 1000배는 3자리!' : '1/10은 1자리, 1/100은 2자리, 1/1000은 3자리!'}`;
      if (p.sh === -q.k || Math.sign(p.sh) !== Math.sign(q.k)) {
        noMsg = `방향이 반대예요! ${q.k > 0 ? '10배 하면 수가 왼쪽으로' : '1/10을 하면 수가 오른쪽으로'} 움직여요.`;
      }
      resolve(idx, ok, `${N(q.base)}의 ${timesHtml(q.k)}${q.k > 0 ? '는' : '은'} ${N(q.result)}! 수가 ${q.k > 0 ? '왼쪽' : '오른쪽'}으로 ${Math.abs(q.k)}자리 움직였어요.`, noMsg, `${nKo(q.result)}입니다`);
    }

    /* ---------- 줄 세우기 ---------- */
    function orderTap(idx, i) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      const q = p.q;
      if (p.done.includes(i)) return;
      const remain = q.items.map((v, j) => ({ v, j })).filter((o) => !p.done.includes(o.j));
      const target = remain.reduce((best, o) => ((q.desc ? o.v > best.v : o.v < best.v) ? o : best));
      if (target.j === i) {
        p.done.push(i);
        p.wrongPick = null;
        if (p.done.length === q.items.length) {
          award(idx, `정답! ${p.done.map((j) => N(q.items[j])).join(q.desc ? ' &gt; ' : ' &lt; ')}`, '');
          return;
        }
        p.state = '';
        p.message = `좋아요! 다음으로 ${q.desc ? '큰' : '작은'} 수는?`;
        renderCell(idx);
        blip('tick');
      } else {
        p.wrongPick = i;
        miss(idx, `${N(q.items[i])}보다 더 ${q.desc ? '큰' : '작은'} 수가 남아 있어요. 높은 자리부터 비교해요.`);
        p.wrongPick = null;
      }
    }

    /* ---------- 세로셈 ---------- */
    function alignMove(idx, dir) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.stage !== 'align' || p.aligning) return;
      p.off = clamp(p.off + dir, -3, 3);
      const L = p.lay;
      const target = L.decA - L.decB;
      const rowEl = document.getElementById(`ab-${idx}`);
      if (rowEl) rowEl.style.setProperty('--off', p.off);
      const ok = p.off === target;
      const board = document.getElementById(`abd-${idx}`);
      if (board) board.classList.toggle('ok', ok);
      if (!ok) {
        blip('tick');
        setMsg(idx, '빨간 소수점이 위아래로 나란히 오게 옮겨요.', '');
        return;
      }
      p.aligning = true;
      setMsg(idx, '소수점이 나란히 맞았어요! 이제 같은 자리끼리 계산해요.', 'ok');
      blip('ok');
      setTimeout(() => {
        if (players[idx] !== p) return;
        p.aligning = false;
        p.stage = 'calc';
        p.state = '';
        p.message = START_MSG.vcalc;
        renderCell(idx);
      }, 850);
    }

    function vSel(idx, c) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      p.sel = c;
      renderCell(idx);
    }
    function vKey(idx, key) {
      const p = players[idx];
      if (p.stage !== 'calc') return;
      const n = p.lay.I + p.lay.F;
      if (key === '.') { vDot(idx); return; }
      if (key === 'del') {
        if (p.ans[p.sel] === '' && p.sel < n - 1) p.sel += 1;
        p.ans[p.sel] = '';
      } else {
        p.ans[p.sel] = key;
        p.bad = p.bad.filter((c) => c !== p.sel);
        if (p.sel > 0) p.sel -= 1;
      }
      renderCell(idx);
    }
    function vDot(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.stage !== 'calc') return;
      p.dot = !p.dot;
      p.needDot = false;
      renderCell(idx);
    }
    function vCarry(idx, c) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      p.carry[c] = !p.carry[c];
      renderCell(idx);
    }
    function vBorrow(idx, c) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.stage !== 'calc') return;
      const L = p.lay;
      const to = c + 1;
      if (to >= L.I + L.F) return;
      if (p.recv[to]) { setMsg(idx, '그 자리는 이미 10을 받아내렸어요.', 'hint'); return; }
      const cur = Number(L.A[c] || 0) + 10 * p.recv[c] - p.give[c];
      if (cur <= 0) { setMsg(idx, '0에서는 받아내릴 수 없어요. 더 높은 자리에서 먼저 받아내려요.', 'hint'); return; }
      p.give[c] += 1;
      p.recv[to] = 1;
      p.state = '';
      p.message = '받아내림! 받아내려 준 자리는 1 작아지고, 오른쪽 자리는 10이 더해져요.';
      renderCell(idx);
      blip('tick');
    }
    function vReset(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      const n = p.lay.I + p.lay.F;
      p.ans = Array(n).fill('');
      p.carry = Array(n).fill(false);
      p.give = Array(n).fill(0);
      p.recv = Array(n).fill(0);
      p.dot = false;
      p.needDot = false;
      p.bad = [];
      p.sel = n - 1;
      if (p.lay.decA !== p.lay.decB && p.stage === 'calc') { /* 맞춘 소수점은 그대로 둔다 */ }
      renderCell(idx);
    }
    function vCheck(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked) return;
      if (p.stage !== 'calc') { setMsg(idx, '먼저 두 수의 소수점을 나란히 맞춰요.', 'hint'); return; }
      const L = p.lay;
      const n = L.I + L.F;
      const trailingOk = (c) => c >= L.I && L.R.slice(c).every((d) => d === '0' || d === '');
      for (let c = 0; c < n; c += 1) {
        if (L.R[c] !== '' && p.ans[c] === '' && !(L.R[c] === '0' && trailingOk(c))) {
          setMsg(idx, '빈칸을 모두 채워 주세요. 일의 자리에 0이 들어가는지도 살펴봐요.', 'hint');
          return;
        }
      }
      if (!p.dot) {
        p.needDot = true;
        p.state = 'hint';
        p.message = '답에도 소수점을 찍어야 해요! 반짝이는 동그라미를 눌러요.';
        renderCell(idx);
        return;
      }
      const bad = [];
      for (let c = 0; c < n; c += 1) {
        const exp = L.R[c];
        const got = p.ans[c];
        if (exp === '') { if (got !== '' && got !== '0') bad.push(c); continue; }
        if (got === exp) continue;
        if (got === '' && exp === '0' && trailingOk(c)) continue;
        bad.push(c);
      }
      const ok = bad.length === 0;
      const q = p.q;
      if (mode === 'exam') { p.bad = bad; examAdvance(idx, ok); return; }
      if (ok) {
        award(idx, `정답! ${numHtml(q.a)} ${OPS[q.op]} ${numHtml(q.b)} = ${numHtml(q.r)}`, `${decKo(q.r)}입니다`);
        return;
      }
      p.bad = bad;
      const tip = q.op === '+' ? '받아올림한 1을 더했나요?' : '받아내림한 수를 생각했나요?';
      miss(idx, p.tries >= 2 ? `빨간 칸을 고쳐 보세요. 정답은 ${numHtml(q.r)}예요.` : `빨간 칸을 다시 계산해요. ${tip}`);
    }

    /* =========================================================
       학습지 만들기 (A4 인쇄) — 누를 때마다 새 문제
       ========================================================= */
    // per: 한 장의 문제 수, cols: 칸 수, flat: 테두리 없이 줄로 늘어놓기, left: 글이 긴 문제
    const WS_TYPES = [
      { id: 'grid', st: 1, title: '모눈종이 읽기', guide: '전체 크기가 1인 모눈종이예요. 색칠한 부분을 소수로 나타내세요.', per: 9, cols: 3 },
      { id: 'paint', st: 1, title: '모눈종이에 색칠하기', guide: '주어진 소수만큼 색칠하세요. 세로 한 줄은 0.1, 한 칸은 0.01이에요.', per: 6, cols: 2 },
      { id: 'place', st: 1, title: '자릿값 알아보기', guide: '□ 안에 알맞은 수나 말을 쓰세요.', per: 12, cols: 1, flat: true, opts: 'digits' },
      { id: 'read', st: 1, title: '소수 읽고 쓰기', guide: '소수를 읽거나, 읽은 말과 분수를 소수로 쓰세요. 소수점 아래는 숫자를 하나씩 읽어요.', per: 16, cols: 2, flat: true, opts: 'digits' },
      { id: 'line', st: 1, title: '수직선 읽기', guide: '작은 눈금 한 칸의 크기를 먼저 알아보고, 화살표가 가리키는 수를 쓰세요.', per: 8, cols: 2, opts: 'digits' },
      { id: 'unit', st: 1, title: '단위 바꾸기', guide: '1 cm = 0.01 m, 1 m = 0.001 km예요. □ 안에 알맞은 수를 쓰세요.', per: 20, cols: 2, flat: true, opts: 'digits' },
      { id: 'shift', st: 2, title: '10배 · 1/10 한 수 쓰기', guide: '소수점을 기준으로 수가 몇 자리 움직이는지 생각하며 □ 안에 알맞은 수를 쓰세요.', per: 20, cols: 2, flat: true },
      { id: 'times', st: 2, title: '몇 배일까?', guide: '□ 안에 10배, 100배, 1000배, 1/10, 1/100, 1/1000 중 알맞은 것을 쓰세요.', per: 20, cols: 2, flat: true },
      { id: 'compare', st: 3, title: '크기 비교 >, =, <', guide: '○ 안에 >, =, < 를 알맞게 쓰세요. 높은 자리부터 차례로 비교해요.', per: 24, cols: 2, flat: true },
      { id: 'order', st: 3, title: '크기 순서대로 쓰기', guide: '네 소수를 크기 순서대로 □ 안에 쓰세요.', per: 10, cols: 2 },
      { id: 'gadd', st: 4, title: '모눈종이로 더하기', guide: '더하는 수만큼 이어서 색칠하고, □ 안에 알맞은 수를 쓰세요.', per: 6, cols: 2, opts: 'grid' },
      { id: 'vadd', st: 4, title: '세로셈 덧셈', guide: '같은 자리끼리 오른쪽부터 더하세요. 답에도 소수점을 꼭 찍어요.', per: 12, cols: 3, opts: 'calc' },
      { id: 'eadd', st: 4, title: '덧셈 식 계산하기', guide: '소수점을 맞추어 계산하세요.', per: 24, cols: 2, flat: true, opts: 'calc' },
      { id: 'gsub', st: 5, title: '모눈종이로 빼기', guide: '빼는 수만큼 뒤에서부터 ✕표 하고, □ 안에 알맞은 수를 쓰세요.', per: 6, cols: 2, opts: 'grid' },
      { id: 'vsub', st: 5, title: '세로셈 뺄셈', guide: '같은 자리끼리 오른쪽부터 빼요. 모자라면 받아내림! 빈 자리는 0이 있다고 생각해요.', per: 12, cols: 3, opts: 'calc' },
      { id: 'esub', st: 5, title: '뺄셈 식 계산하기', guide: '소수점을 맞추어 계산하세요.', per: 24, cols: 2, flat: true, opts: 'calc' },
      { id: 'fix', st: 5, title: '틀린 계산 찾기', guide: '계산이 맞으면 ○, 틀리면 ✕ 하고, 오른쪽에 바르게 계산하세요.', per: 5, cols: 1 },
      { id: 'word', st: 6, title: '생활 속 문제', guide: '문제에 알맞은 식을 쓰고 답을 구하세요.', per: 5, cols: 1, left: true },
      { id: 'speed', st: 6, title: '덧셈 · 뺄셈 섞어 계산하기', guide: '+인지 −인지 잘 보고 계산하세요.', per: 24, cols: 2, flat: true, opts: 'speed' }
    ];
    const WS_OPTS = { ...OPT_CHOICES, digits: [['all', '두 자리 · 세 자리 섞기'], ['two', '소수 두 자리 수'], ['three', '소수 세 자리 수']] };
    const ws = { type: 'grid', opt: {}, pages: 1, key: true, data: [] };
    function wsType() { return WS_TYPES.find((t) => t.id === ws.type) || WS_TYPES[0]; }
    function wsOpt(T) {
      if (!T.opts) return 'all';
      const v = ws.opt[T.id];
      return WS_OPTS[T.opts].some(([k]) => k === v) ? v : 'all';
    }
    function wsDigits(o, fn) { return withDigits(o === 'all' ? 'any' : o, fn); }

    function wsPlace() {
      const t = pick(['value', 'value', 'compose', 'count', 'countOf', 'expand']);
      const three = wantThree(0.5);
      if (t === 'value' || t === 'expand') {
        const places = three ? 3 : 2;
        const ds = distinctDigits(places + 1);
        const s = `${ds[0]}.${ds.slice(1).join('')}`;
        const pos = randInt(0, places);
        return { key: `${t}${s}${pos}`, t, s, ds, place: -pos, d: ds[pos] };
      }
      if (t === 'compose') {
        const ds = [randInt(1, 9), randInt(1, 9), randInt(1, 9), three ? randInt(1, 9) : 0];
        return { key: `c${ds.join('')}`, t, ds, n: ds[0] * 1000 + ds[1] * 100 + ds[2] * 10 + ds[3] };
      }
      let k;
      if (three) do { k = randInt(1001, 9999); } while (k % 10 === 0);
      else do { k = randInt(101, 999); } while (k % 10 === 0);
      return { key: `${t}${k}${three}`, t, k, unit: three ? '0.001' : '0.01', n: three ? k : k * 10 };
    }
    function wsRead() {
      const t = pick(['toKo', 'toKo', 'toNum', 'frac', 'frac']);
      const three = wantThree(0.35);
      const n = three ? rndThou(pick([0, 1, 4])) : rndHund(pick([0, 0, 1, 3, 7, 12]));
      const den = three ? 1000 : 100;
      return { key: `${t}${n}`, t, s: fmt(n), den, whole: Math.floor(n / 1000), num: three ? n % 1000 : (n % 1000) / 10 };
    }
    function wsExpr(op, type) {
      const { a, b, r } = genPair(op, type);
      return { key: `e${a}${op}${b}`, op, a, b, r };
    }
    function wsCalcType(o) { return o === 'all' ? pick(['1', '2', 'm', 'm']) : o; }
    function wsItem(T) {
      const o = wsOpt(T);
      switch (T.id) {
        case 'grid': { const q = makeGrid(); return { key: q.key, ans: q.ans, cells: parseNum(q.ans) / 10 }; }
        case 'paint': return makePaint();
        case 'place': return wsDigits(o, wsPlace);
        case 'read': return wsDigits(o, wsRead);
        case 'line': return wsDigits(o, makeLine);
        case 'unit': return wsDigits(o, makeUnit);
        case 'shift': return { ...makeTimes(), blankBase: Math.random() < 0.25 };
        case 'times': return makeTimes();
        case 'compare': return makeCompare();
        case 'order': return makeOrder();
        case 'gadd': return withOpt(o, makeGAdd);
        case 'gsub': return withOpt(o, makeGSub);
        case 'vadd': return makeVcalc('+', wsCalcType(o));
        case 'vsub': return makeVcalc('-', wsCalcType(o));
        case 'eadd': return wsExpr('+', wsCalcType(o));
        case 'esub': return wsExpr('-', wsCalcType(o));
        case 'fix': return makeFix();
        case 'word': return makeWord();
        case 'speed': {
          const t = o === 'all' ? pick(['a1', 'a2', 's1', 's2', 'mx']) : o;
          const map = { a1: ['+', '1'], a2: ['+', '2'], s1: ['-', '1'], s2: ['-', '2'], mx: [pick(['+', '-']), 'm'] };
          return wsExpr(...map[t]);
        }
        default: return null;
      }
    }
    function wsGen() {
      const T = wsType();
      const pages = [];
      for (let pg = 0; pg < ws.pages; pg += 1) {
        const items = [];
        const seen = new Set();
        let guard = 0;
        while (items.length < T.per && guard < T.per * 20) {
          const q = wsItem(T);
          guard += 1;
          if (seen.has(q.key) && guard < T.per * 12) continue;
          seen.add(q.key);
          items.push(q);
        }
        pages.push({ items });
      }
      ws.data = pages;
    }

    // 학습지용 세로셈 칸. 답 칸은 비워 두고, 정답지에만 답과 받아올림을 적는다
    function wsVgridHtml(a, b, op, r, ans, cls = '') {
      const L = vLayout(a, b, r);
      const n = L.I + L.F;
      const sub = op === '-';
      const help = Array(n).fill('');
      if (ans && !sub) {
        let carry = 0;
        for (let c = n - 1; c > 0; c -= 1) {
          carry = (Number(L.A[c]) || 0) + (Number(L.B[c]) || 0) + carry >= 10 ? 1 : 0;
          if (carry && (L.A[c - 1] !== '' || L.B[c - 1] !== '')) help[c - 1] = '1';
        }
      }
      const row = (first, fn, dot) => {
        let h = first;
        for (let c = 0; c < n; c += 1) {
          if (c === L.I) h += dot;
          h += fn(c);
        }
        return h;
      };
      const dotCell = (on) => `<span class="dt">${on ? '<i></i>' : ''}</span>`;
      const tmpl = `var(--w) repeat(${L.I}, var(--w)) var(--d) repeat(${L.F}, var(--w))`;
      let h = `<div class="wv${cls ? ` ${cls}` : ''}" style="grid-template-columns:${tmpl}">`;
      h += row('<span class="hp"></span>', (c) => `<span class="hp">${help[c]}</span>`, '<span class="hp"></span>');
      h += row('<span></span>', (c) => `<span>${L.A[c] || (ans && sub && c >= L.I ? '<b class="gh">0</b>' : '')}</span>`, dotCell(L.decA > 0));
      h += row(`<span>${OPS[op]}</span>`, (c) => `<span>${L.B[c]}</span>`, dotCell(L.decB > 0));
      h += '<span class="ln"></span>';
      h += row('<span></span>', (c) => `<span><b class="ab">${ans ? L.R[c] : ''}</b></span>`, dotCell(ans));
      return `${h}</div>`;
    }

    function wsItemHtml(T, q, ans) {
      const box = (html, cls = '') => `<span class="wbox${cls ? ` ${cls}` : ''}">${ans ? `<span>${html}</span>` : ''}</span>`;
      const nbox = (s) => box(numHtml(s), s.length > 4 ? 'w2' : '');
      // lead를 주면 수와 조사를 띄우지 않고 붙여 쓴다 (0.01이, 3.5의)
      const t = (s, lead = '') => (lead ? `<span>${lead}<span class="t">${s}</span></span>` : `<span class="t">${s}</span>`);
      const line = (html) => `<div class="ws-line">${html}</div>`;
      const eq = (a, op, b, r) => line(`${N(a)} <span class="op-sym">${OPS[op]}</span> ${N(b)} <span class="op-sym">=</span> ${nbox(fmt(r))}`);
      switch (T.id) {
        case 'grid':
          return `${hgridHtml(q.cells > 100 ? 2 : 1, (k) => (k < q.cells ? 'a' : ''))}${line(nbox(q.ans))}`;
        case 'paint':
          return `${line(`${N(q.n)}${t('만큼 색칠하기')}`)}${hgridHtml(q.grids, (k) => (ans && k < q.target ? 'a' : ''), { size: 'big' })}`;
        case 'place': {
          if (q.t === 'value') {
            const dk = KD[q.d];
            return line(`${t(`에서 숫자 ${q.d}${eunNeun(dk)}`, numHtml(q.s))}${box(PLACE_NAME[q.place].replace(/ 자리$/, ''), 'mid')}${t('자리 숫자이고, 나타내는 수는')}${nbox(fmt(q.d * Math.pow(10, q.place + 3)))}${t('입니다.')}`);
          }
          if (q.t === 'expand') {
            const parts = q.ds.map((d, i) => (i === Math.abs(q.place) ? nbox(fmt(d * Math.pow(10, 3 - i))) : N(d * Math.pow(10, 3 - i))));
            return line(`${numHtml(q.s)} <span class="op-sym">=</span> ${parts.join(' <span class="op-sym">+</span> ')}`);
          }
          if (q.t === 'compose') {
            const parts = [`1이 ${q.ds[0]}개`, `${numHtml('0.1')}이 ${q.ds[1]}개`, `${numHtml('0.01')}이 ${q.ds[2]}개`];
            if (q.ds[3]) parts.push(`${numHtml('0.001')}이 ${q.ds[3]}개`);
            return line(`${t(`${parts.join(', ')}인 수는`)}${nbox(fmt(q.n))}${t('입니다.')}`);
          }
          if (q.t === 'count') return line(`${t(`이 ${q.k}개인 수는`, numHtml(q.unit))}${nbox(fmt(q.n))}${t('입니다.')}`);
          return line(`${t(eunNeun(nKo(q.n)), N(q.n))}${t('이', numHtml(q.unit))}${box(String(q.k), 'w2')}${t('개인 수입니다.')}`);
        }
        case 'read':
          if (q.t === 'toKo') return line(`${numHtml(q.s)}${t('읽기')}${box(decKo(q.s), 'wide')}`);
          if (q.t === 'toNum') return line(`${t(`"${decKo(q.s)}"`)}${t('쓰기')}${nbox(q.s)}`);
          return line(`${frHtml(q.num, q.den, q.whole || '')} <span class="op-sym">=</span> ${nbox(q.s)}`);
        case 'line':
          return `${lineSvg(...q.ln)}${line(`${t('화살표가 가리키는 수')}${nbox(q.ans)}`)}`;
        case 'unit':
          return line(`${q.lhs} ${nbox(fmt(q.ans))}<span class="unit-txt">${q.unit}</span>`);
        case 'shift': {
          const lab = t(q.k > 0 ? '는' : '은', timesHtml(q.k));
          return q.blankBase
            ? line(`${nbox(fmt(q.base))}${t('의')}${lab}${N(q.result)}`)
            : line(`${t('의', N(q.base))}${lab}${nbox(fmt(q.result))}`);
        }
        case 'times':
          return line(`${t('의', N(q.base))}${box(timesHtml(q.k), 'w3')}${t('은(는)')}${N(q.result)}`);
        case 'compare':
          return line(`${numHtml(q.a)}<span class="wcir">${ans ? q.ans : ''}</span>${numHtml(q.b)}`);
        case 'order': {
          const sorted = [...q.items].sort((x, y) => (q.desc ? y - x : x - y));
          const chain = sorted.map((v) => `<span class="wbox">${ans ? N(v) : ''}</span>`).join(`<span>${q.desc ? '&gt;' : '&lt;'}</span>`);
          return `<div class="ws-chips">${q.items.map((v) => `<span>${N(v)}</span>`).join('')}</div><div class="ws-sub">${q.desc ? '큰 수부터' : '작은 수부터'} 차례대로</div><div class="ws-chain">${chain}</div>`;
        }
        case 'gadd':
          return `${hgridHtml(q.grids, (k) => (k < q.a ? 'a' : ans && k < q.a + q.b ? 'b' : ''), { size: 'big' })}${eq(q.a * 10, '+', q.b * 10, q.ans)}`;
        case 'gsub':
          return `${hgridHtml(q.grids, (k) => (k < q.a ? (ans && k >= q.a - q.b ? 'x' : 'a') : ''), { size: 'big' })}${eq(q.a * 10, '-', q.b * 10, q.ans)}`;
        case 'vadd':
        case 'vsub':
          return wsVgridHtml(q.a, q.b, q.op, q.r, ans);
        case 'eadd':
        case 'esub':
        case 'speed':
          return eq(q.a, q.op, q.b, q.r);
        case 'fix': {
          const mark = q.err === 'ok' ? '○' : '✕';
          return `<div class="ws-fix">
            ${vCharHtml(q.a, q.b, q.op, q.shown, q.layout)}
            <div class="to">맞으면 ○, 틀리면 ✕<span class="wcir">${ans ? mark : ''}</span></div>
            <div class="to">바르게 계산하기${wsVgridHtml(q.a, q.b, q.op, q.correct, ans, 'sm')}</div>
            <div class="ws-why">${ans ? (q.err === 'ok' ? '바르게 계산했어요.' : FIX_REASON[q.err]) : ''}</div>
          </div>`;
        }
        case 'word':
          return `<div class="ws-story"><span class="em">${q.em}</span><p>${q.text}</p></div>
            <div class="ws-word">
              ${line(`${t('식')}${box(`${N(q.a)} <span class="op-sym">${OPS[q.op]}</span> ${N(q.b)}`, 'wide')}`)}
              ${line(`${t('답')}${nbox(fmt(q.r))}<span class="unit-txt">${q.unit}</span>`)}
            </div>`;
        default: return '';
      }
    }
    function wsPageHtml(T, page, pi, total, ans) {
      const count = page.items.length;
      const rows = Math.ceil(count / T.cols);
      const cls = `ws-item${T.flat ? ' flat' : ''}${T.left ? ' left' : ''}`;
      const body = `<div class="ws-grid" style="grid-template-columns:repeat(${T.cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr))">${page.items.map((q, i) => `<div class="${cls}"><span class="ws-no">${T.flat ? `(${i + 1})` : i + 1}</span>${wsItemHtml(T, q, ans)}</div>`).join('')}</div>`;
      return `<div class="ws-page">
        ${ans ? '<span class="ws-key">정답</span>' : ''}
        <div class="ws-head">
          <div class="tt"><div class="kid-art"></div><div><span class="lv">소수맨 학습지 · ${T.st}단계 ${STAGES[T.st - 1].title}</span><h1>${T.title}</h1></div></div>
          <div class="who"><span>날짜 <u class="s"></u>월 <u class="s"></u>일</span><span>이름 <u></u></span><span>맞힌 수 <u class="s"></u>/ ${count}</span></div>
        </div>
        <p class="ws-guide">${T.guide}</p>
        ${body}
        <div class="ws-foot"><span>소수맨 · 쌤노리 · 문제는 만들 때마다 새로 바뀌어요</span><span>${pi + 1} / ${total}</span></div>
      </div>`;
    }
    function wsAllPagesHtml() {
      const T = wsType();
      const total = ws.data.length * (ws.key ? 2 : 1);
      const qs = ws.data.map((pg, i) => wsPageHtml(T, pg, i, total, false));
      const ks = ws.key ? ws.data.map((pg, i) => wsPageHtml(T, pg, ws.data.length + i, total, true)) : [];
      return [...qs, ...ks].join('');
    }
    function openWorksheet(stageNo) {
      if (stageNo) ws.type = WS_TYPES.find((t) => t.st === stageNo).id;
      wsGen();
      document.getElementById('ws-overlay').innerHTML = '';
      document.getElementById('ws-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
      renderWs();
    }
    function hideWorksheet() {
      document.getElementById('ws-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }
    function wsSet(k, v) {
      if (k === 'type') ws.type = v;
      if (k === 'opt') ws.opt[ws.type] = v;
      if (k === 'pages') ws.pages = v;
      if (k === 'key') ws.key = v;
      if (k !== 'key') wsGen();
      renderWs();
    }
    function renderWs() {
      const T = wsType();
      const opts = T.opts ? WS_OPTS[T.opts] : null;
      const groups = STAGES.map((s) => `<optgroup label="${s.no}단계 · ${s.title}">${WS_TYPES.filter((t) => t.st === s.no).map((t) => `<option value="${t.id}"${t.id === T.id ? ' selected' : ''}>${t.title}</option>`).join('')}</optgroup>`).join('');
      const box = document.getElementById('ws-overlay');
      const again = !!box.firstElementChild;
      const mainScroll = again ? box.querySelector('.ws-main').scrollTop : 0;
      const sideScroll = again ? box.querySelector('.ws-side').scrollTop : 0;
      box.innerHTML = `
        <div class="result-card ws-card"${again ? ' style="animation:none"' : ''}>
          <div class="ws-side">
            <h2>🖨 학습지 만들기</h2>
            <p>누를 때마다 새 문제로 만들어져요. 앱에서 익힌 것을 종이로 한 번 더 연습해요.</p>
            <div class="ws-field"><label for="ws-type">학습지 종류</label><select id="ws-type" class="select" onchange="wsSet('type', this.value)">${groups}</select></div>
            ${opts ? `<div class="ws-field"><label for="ws-opt">문제 범위</label><select id="ws-opt" class="select" onchange="wsSet('opt', this.value)">${opts.map(([v, t]) => `<option value="${v}"${v === wsOpt(T) ? ' selected' : ''}>${t}</option>`).join('')}</select></div>` : ''}
            <div class="ws-field"><span class="lab">장 수</span><div class="seg">${[1, 2, 3, 5].map((n) => `<button type="button" class="${ws.pages === n ? 'on' : ''}" onclick="wsSet('pages', ${n})">${n}장</button>`).join('')}</div></div>
            <div class="ws-field"><label class="ws-check"><input type="checkbox" ${ws.key ? 'checked' : ''} onchange="wsSet('key', this.checked)" /> 정답지도 함께 뽑기</label></div>
            <div class="ws-actions">
              <button class="btn-main" type="button" onclick="wsPrint()">🖨 인쇄하기</button>
              <button class="ghost-btn" type="button" onclick="wsSet('regen')">🔄 새 문제로 바꾸기</button>
              <button class="ghost-btn" type="button" onclick="hideWorksheet()">닫기</button>
            </div>
          </div>
          <div class="ws-main">
            <div class="ws-pages" id="ws-pages">${wsAllPagesHtml()}</div>
          </div>
        </div>`;
      fitWs();
      box.querySelector('.ws-main').scrollTop = mainScroll;
      box.querySelector('.ws-side').scrollTop = sideScroll;
    }
    function fitWs() {
      const main = document.querySelector('#ws-overlay .ws-main');
      const pages = document.getElementById('ws-pages');
      if (!main || !pages) return;
      const k = Math.min(1, (main.clientWidth - 28) / 720);
      pages.style.zoom = String(Math.max(0.3, k));
    }
    function wsPrint() {
      document.getElementById('print-root').innerHTML = wsAllPagesHtml();
      setTimeout(() => window.print(), 60);
    }
    window.addEventListener('afterprint', () => { document.getElementById('print-root').innerHTML = ''; });
    window.addEventListener('resize', fitWs);

    /* =========================================================
       키보드 (혼자 할 때)
       ========================================================= */
    document.addEventListener('keydown', (e) => {
      if (!gameActive || playerCount !== 1 || !players[0]) return;
      const p = players[0];
      if (!p.q || p.locked) return;
      const k = p.q.kind;
      const pad = k === 'keypad' || k === 'gadd' || k === 'gsub' || (k === 'word' && p.stage === 'ans') || (k === 'vcalc' && p.stage === 'calc');
      if (pad && /^[0-9]$/.test(e.key)) { kp(0, e.key); e.preventDefault(); return; }
      if (pad && e.key === '.') { kp(0, '.'); e.preventDefault(); return; }
      if (pad && e.key === 'Backspace') { kp(0, 'del'); e.preventDefault(); return; }
      if (e.key === 'Enter') {
        const btn = document.querySelector('#cell-0 .btn-check');
        if (btn) { btn.click(); e.preventDefault(); }
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        const dir = e.key === 'ArrowLeft' ? 1 : -1;
        if (k === 'vcalc' && p.stage === 'align') alignMove(0, dir);
        if (k === 'shift') shiftMove(0, dir);
      }
    });

    window.addEventListener('resize', () => {
      if (!players.length || document.getElementById('game-screen').classList.contains('hidden')) return;
      renderPlayers();
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    renderStages();
    renderPlayerSeg();
    animateHero();
  </script>
</body>
</html>
