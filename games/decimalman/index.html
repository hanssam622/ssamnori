<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="canonical" href="https://hanssam622.github.io/ssamnori/games/decimalman/index.html" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --ink: #1d2838;
      --ink-2: #3b4759;
      --muted: #6b7687;
      --line: #e1e8ef;
      --soft: #f3f7fa;
      --teal: #12b3a3;
      --teal-d: #0b8f83;
      --teal-s: #e2f7f4;
      --coral: #ff5b4f;
      --coral-d: #e2443a;
      --coral-s: #ffece9;
      --amber: #ffb12b;
      --amber-s: #fff4dc;
      --good: #1fae6a;
      --bad: #ec5050;
      /* 자리별 색 (교과서 자릿값 표와 같은 계열) */
      --p2: #8a6be0;
      --p1: #f08a24;
      --p0: #22a565;
      --pm1: #3a7ff2;
      --pm2: #e64f95;
      --pm3: #8b5cf0;
      --s: 1;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: #f3faf8;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; padding: 0; }
    .hidden { display: none !important; }

    .samnori-home-float {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 80;
      display: grid;
      place-items: center;
      width: 78px;
      height: 54px;
      border-radius: 18px;
      background: rgba(255,255,255,.94);
      border: 2px solid #ffe3a5;
      color: #8a5b00;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 10px 26px rgba(29, 40, 56, .16);
    }
    body.playing .samnori-home-float,
    body.modal .samnori-home-float { display: none; }

    /* ---------- 숫자 표기 ---------- */
    .num {
      display: inline-flex;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: .01em;
    }
    .dp {
      display: inline-block;
      width: .21em;
      height: .21em;
      margin: 0 .07em;
      border-radius: 50%;
      background: var(--coral);
      flex: 0 0 auto;
    }
    .pl2 { color: var(--p2); }
    .pl1 { color: var(--p1); }
    .pl0 { color: var(--p0); }
    .plm1 { color: var(--pm1); }
    .plm2 { color: var(--pm2); }
    .plm3 { color: var(--pm3); }
    .dg.hi {
      color: #fff;
      background: var(--coral);
      border-radius: .16em;
      padding: 0 .08em;
      margin: 0 .04em;
      box-shadow: 0 .06em 0 var(--coral-d);
    }
    .fr {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      line-height: 1.02;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      margin: 0 .08em;
    }
    .fr > b { font-weight: inherit; padding: 0 .12em; border-bottom: .08em solid currentColor; }
    .fr > i { font-style: normal; padding: 0 .12em; }
    .fr-wrap { display: inline-flex; align-items: center; gap: .12em; font-weight: 900; }

    /* ---------- 공통 배경: 모눈종이 ---------- */
    .screen {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background:
        linear-gradient(rgba(18,179,163,.11) 1.5px, transparent 1.5px) -1px -1px / 240px 240px,
        linear-gradient(90deg, rgba(18,179,163,.11) 1.5px, transparent 1.5px) -1px -1px / 240px 240px,
        linear-gradient(rgba(18,179,163,.06) 1px, transparent 1px) -1px -1px / 24px 24px,
        linear-gradient(90deg, rgba(18,179,163,.06) 1px, transparent 1px) -1px -1px / 24px 24px,
        radial-gradient(circle at 10% 8%, rgba(18,179,163,.16), transparent 36%),
        radial-gradient(circle at 92% 14%, rgba(255,91,79,.11), transparent 34%),
        radial-gradient(circle at 72% 96%, rgba(255,177,43,.14), transparent 40%),
        linear-gradient(180deg, #fbfefd 0%, #eef8f6 100%);
    }

    /* ---------- 시작 화면 ---------- */
    .start-wrap {
      min-height: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 48px;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
      align-items: center;
      gap: 28px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 8px 8px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--ink-2);
      font-size: 16px;
      font-weight: 750;
      box-shadow: 0 8px 20px rgba(29,40,56,.06);
    }
    .hero-badge b {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--teal);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }
    .hero-title {
      margin: 22px 0 12px;
      font-size: clamp(68px, 9.6vw, 138px);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -.045em;
      color: var(--ink);
    }
    .hero-title .tdot {
      display: inline-block;
      width: .2em;
      height: .2em;
      margin-left: .05em;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 .05em 0 var(--coral-d);
      animation: dotHop 2.6s ease-in-out infinite;
    }
    @keyframes dotHop {
      0%, 62%, 100% { transform: translateY(0); }
      70% { transform: translateY(-.42em) scale(.92, 1.08); }
      78% { transform: translateY(0) scale(1.12, .88); }
      86% { transform: translateY(-.1em); }
    }
    .hero-sub {
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 1.7vw, 21px);
      font-weight: 600;
      line-height: 1.65;
      word-break: keep-all;
    }
    .hero-sub strong { color: var(--ink); font-weight: 800; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 30px; }
    .start-btn {
      height: 66px;
      padding: 0 36px;
      border-radius: 22px;
      background: linear-gradient(180deg, #1cc6b5, #0ea193);
      color: #fff;
      font-size: 23px;
      font-weight: 850;
      letter-spacing: -.01em;
      box-shadow: 0 16px 32px rgba(14,161,147,.32), inset 0 -4px 0 rgba(0,0,0,.12);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 38px rgba(14,161,147,.38), inset 0 -4px 0 rgba(0,0,0,.12); }
    .start-btn:active { transform: translateY(1px); }
    .hero-note { color: var(--muted); font-size: 15px; font-weight: 650; }
    .topic-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 30px;
      max-width: 560px;
    }
    .topic-list span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 1.5px solid var(--line);
      font-size: 14.5px;
      font-weight: 750;
      color: var(--ink-2);
    }
    .topic-list span::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c, var(--teal));
    }

    .hero-art { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; justify-self: center; }
    .art-card {
      position: absolute;
      left: 9%;
      top: 13%;
      width: 64%;
      aspect-ratio: 1;
      padding: 14px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 30px 60px rgba(29,61,72,.14);
      transform: rotate(-7deg);
    }
    .art-card .hgrid { width: 100%; height: 100%; --gs: 100%; border-radius: 10px; }
    .art-tag {
      position: absolute;
      left: -20px;
      bottom: 30px;
      z-index: 4;
      padding: 8px 16px;
      border-radius: 16px;
      background: var(--ink);
      color: #fff;
      font-size: 30px;
      box-shadow: 0 12px 24px rgba(29,40,56,.25);
      transform: rotate(7deg);
    }
    .art-tag .dp { background: var(--coral); }
    .hero-art .kid-art {
      position: absolute;
      right: -2%;
      bottom: -2%;
      width: 66%;
      height: 66%;
      z-index: 2;
      animation: floaty 4.2s ease-in-out infinite;
      filter: drop-shadow(0 18px 22px rgba(29,61,72,.18));
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .bubble {
      position: absolute;
      z-index: 3;
      padding: 8px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 24px rgba(29,40,56,.1);
      font-size: 22px;
      font-weight: 900;
      animation: floaty 5s ease-in-out infinite;
    }
    .bubble.b1 { left: 0; top: 2%; animation-delay: -1s; }
    .bubble.b2 { right: 4%; top: 4%; animation-delay: -2.4s; color: var(--teal-d); }
    .bubble.b3 { left: 6%; bottom: 2%; animation-delay: -3.3s; }
    .bubble.b4 { right: 0; top: 36%; animation-delay: -.6s; font-size: 18px; color: var(--coral-d); }

    .kid-art { background-position: center bottom; background-size: contain; background-repeat: no-repeat; }

    /* ---------- 게임 선택 화면 ---------- */
    .select-wrap { max-width: 1180px; margin: 0 auto; padding: 22px 30px 70px; }
    .select-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .brand-mini { display: flex; align-items: center; gap: 12px; }
    .brand-mini .kid-art {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      background-color: #fff;
      background-size: 120%;
      background-position: center 12%;
      border: 1.5px solid var(--line);
      box-shadow: 0 8px 18px rgba(29,40,56,.08);
    }
    .brand-mini h2 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
    .brand-mini h2 .tdot {
      display: inline-block;
      width: .2em;
      height: .2em;
      margin-left: .04em;
      border-radius: 50%;
      background: var(--coral);
    }
    .brand-mini p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; font-weight: 650; }
    .ghost-btn {
      height: 46px;
      padding: 0 16px;
      border-radius: 15px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--ink-2);
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(29,40,56,.05);
    }
    .ghost-btn:hover { background: #f8fbfc; }

    .settings-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 26px;
      padding: 14px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,.9);
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 30px rgba(29,61,72,.06);
    }
    .setting-row { display: flex; align-items: center; gap: 10px; }
    .setting-label { font-size: 15px; font-weight: 800; color: var(--ink-2); white-space: nowrap; }
    .seg {
      display: inline-flex;
      padding: 4px;
      gap: 2px;
      border-radius: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
    }
    .seg button {
      min-width: 46px;
      height: 40px;
      padding: 0 10px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 800;
      color: var(--muted);
      transition: background .15s, color .15s;
    }
    .seg button.on { background: #fff; color: var(--teal-d); box-shadow: 0 2px 8px rgba(29,40,56,.12); }
    .select, .card-select {
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
    }
    .select:focus, .card-select:focus { outline: none; border-color: var(--teal); }
    .toggle-btn {
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #fff;
      font-size: 15px;
      font-weight: 800;
    }
    .toggle-btn.on { background: var(--teal-s); border-color: #9fdcd3; color: var(--teal-d); }
    .toggle-btn.off { background: var(--soft); color: #98a2b0; }

    .stage-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      margin: 16px -30px 0;
      padding: 12px 30px;
      overflow-x: auto;
      scrollbar-width: none;
      background: linear-gradient(180deg, rgba(246,251,250,.97) 72%, rgba(246,251,250,0));
    }
    .stage-nav::-webkit-scrollbar { display: none; }
    .stage-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px 0 6px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--line);
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .stage-chip b {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--sc, var(--teal));
      color: #fff;
      font-size: 14px;
    }
    .stage-chip:hover { border-color: var(--sc, var(--teal)); }

    .stage { margin-top: 30px; scroll-margin-top: 70px; }
    .stage-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 14px; }
    .stage-no {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--sc, var(--teal));
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 8px 16px color-mix(in srgb, var(--sc, var(--teal)) 30%, transparent);
    }
    .stage-title { margin: 0; font-size: 25px; font-weight: 900; letter-spacing: -.02em; }
    .stage-page {
      padding: 5px 11px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
      gap: 16px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border-radius: 24px;
      background: #fff;
      border: 1.5px solid var(--line);
      box-shadow: 0 8px 22px rgba(29,61,72,.06);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--tb, #bfe5df); box-shadow: 0 18px 36px rgba(29,61,72,.12); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card .ic {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--tint, var(--teal-s));
    }
    .card .ic svg { width: 40px; height: 40px; }
    .card .cap {
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .card h4 { margin: 4px 0 0; font-size: 19px; font-weight: 850; letter-spacing: -.02em; }
    .card p { flex: 1; margin: 0; color: var(--muted); font-size: 14.5px; font-weight: 560; line-height: 1.55; word-break: keep-all; }
    .card .card-select { width: 100%; height: 42px; font-size: 14px; }
    .card .go {
      height: 46px;
      border-radius: 15px;
      background: var(--ink);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      transition: background .15s;
    }
    .card .go:hover { background: #2b3a50; }
    .card.concept { background: linear-gradient(165deg, #edfaf7 0%, #fff 62%); border-color: #c7ece5; }
    .card.concept .go { background: #fff; color: var(--teal-d); border: 1.5px solid #9edfd5; }
    .card.concept .go:hover { background: var(--teal-s); }
    .card.wide { grid-column: span 2; }
    .card .cap.pc { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 4px 7px; background: var(--teal-s); color: var(--teal-d); }
    .card .cap.pc svg { width: 15px; height: 15px; flex: 0 0 auto; }
    .card .cap.pc.lim { background: var(--amber-s); color: #a46a00; }
    .card .cap.pc.over { background: #ffe9e6; color: var(--coral-d); box-shadow: inset 0 0 0 1.5px #ffbdb6; }
    .cap-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 12px 0 0;
      padding: 10px 14px;
      border-radius: 14px;
      background: #fff7e6;
      border: 1px solid #ffe0a3;
      color: #8a5b00;
      font-size: 14.5px;
      font-weight: 650;
      line-height: 1.55;
      word-break: keep-all;
    }
    .cap-note:empty { display: none; }
    .cap-note b { font-weight: 850; }
    .cap-note svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px; color: #e09a0b; }
    .mix-chip .mcap { margin-left: 2px; padding: 2px 7px; border-radius: 999px; background: var(--amber-s); color: #a46a00; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
    .notice-card { width: min(470px, 92vw); }
    .notice-card h2 { font-size: 28px; }
    .notice-ic { width: 66px; height: 66px; margin: 4px auto 4px; display: grid; place-items: center; border-radius: 22px; background: var(--amber-s); color: #e09a0b; }
    .notice-ic svg { width: 38px; height: 38px; }
    .notice-main { margin: 6px 0 8px; font-size: 19px; font-weight: 750; line-height: 1.55; word-break: keep-all; }
    .notice-main b { color: var(--coral-d); font-weight: 900; }
    .notice-why { margin: 0; color: var(--muted); font-size: 15px; font-weight: 600; line-height: 1.6; word-break: keep-all; }
    .notice-now { margin: 14px 0 0; padding: 9px 12px; border-radius: 12px; background: var(--soft); color: var(--ink-2); font-size: 15px; font-weight: 750; }

    /* ---------- 게임 화면 ---------- */
    .game-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .topbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.97);
      z-index: 5;
    }
    .top-title { min-width: 0; text-align: center; }
    .top-title h1 {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      font-size: clamp(20px, 2.5vw, 31px);
      font-weight: 900;
      letter-spacing: -.03em;
      white-space: nowrap;
    }
    .top-title h1 .ic { width: 1.25em; height: 1.25em; flex: 0 0 auto; display: grid; place-items: center; }
    .top-title h1 .ic svg { width: 100%; height: 100%; }
    .top-title p {
      margin: 3px 0 0;
      color: var(--muted);

      left: calc(var(--W) * var(--c) + var(--D) * var(--after));
    }
    .stile { transition: left .38s cubic-bezier(.34, 1.36, .55, 1); }
    .stile span {
      width: 84%;
      height: 80%;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 4px 0 #0e1621;
    }
    .szero { color: #b6c2ce; animation: fadeIn .3s ease both; }
    .shift-ctrl { display: flex; justify-content: center; align-items: center; gap: calc(var(--s) * 10px); flex-wrap: wrap; }
    .shift-btn {
      height: calc(var(--s) * 50px);
      padding: 0 calc(var(--s) * 16px);
      border-radius: 15px;
      background: #fff;
      border: 2px solid #dbe4ec;
      box-shadow: 0 3px 0 #dbe4ec;
      font-size: calc(var(--s) * 16px);
      font-weight: 850;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .shift-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #dbe4ec; }
    .shift-btn svg { width: 1.1em; height: 1.1em; }
    .readout { font-size: calc(var(--s) * 15px); font-weight: 750; color: var(--muted); text-align: center; }
    .readout .num { font-size: calc(var(--s) * 26px); color: var(--ink); vertical-align: middle; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(.7); } }

    /* ---------- 크기 비교 / 순서 ---------- */
    .cmp { display: flex; align-items: center; justify-content: center; gap: calc(var(--s) * 10px); font-size: calc(var(--s) * 34px); white-space: nowrap; }
    .cmp-slot {
      width: calc(var(--s) * 50px);
      height: calc(var(--s) * 50px);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 3px dashed #c8d4df;
      color: var(--teal-d);
      font-size: calc(var(--s) * 34px);
      font-weight: 900;
    }
    .cmp-slot.f { border-style: solid; border-color: var(--teal); background: var(--teal-s); animation: pop .4s ease both; }
    .oslots { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: calc(var(--s) * 3px); }
    .oslot {
      min-width: calc(var(--s) * 56px);
      height: calc(var(--s) * 44px);
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      border: 2px dashed #c8d4df;
      background: rgba(255,255,255,.6);
      font-size: calc(var(--s) * 17px);
    }
    .oslot.f { border-style: solid; border-color: var(--teal); background: #fff; animation: pop .35s ease both; }
    .osign { color: var(--muted); font-size: calc(var(--s) * 17px); font-weight: 900; }
    .ocards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--s) * 8px); }
    .ocard.used { visibility: hidden; }

    /* ---------- 세로셈 ---------- */
    .vwrap { display: flex; flex-direction: column; align-items: center; gap: calc(var(--s) * 8px); }
    .vcalc {
      --W: calc(var(--s) * 56px);
      --D: calc(var(--s) * 18px);
      --H: calc(var(--s) * 60px);
      display: grid;
      justify-content: center;
      align-items: center;
      padding: calc(var(--s) * 8px) calc(var(--s) * 10px);
      border-radius: calc(var(--s) * 18px);
      background: #fff;
      box-shadow: 0 6px 18px rgba(29,40,56,.07);
      font-size: calc(var(--s) * 40px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .vcalc > * { min-width: 0; }
    .vc-h {
      margin: 0 2px;
      padding: 2px 0;
      border-radius: 6px;
      color: #fff;
      font-size: calc(var(--s) * 11.5px);
      font-weight: 850;
      text-align: center;
      white-space: nowrap;
      align-self: end;
    }
    .vc-h.e { background: none; }
    .vc-help { height: calc(var(--s) * 30px); display: grid; place-items: center; }
    .carry {
      width: 72%;
      height: 88%;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1.5px dashed #c4d0dc;
      color: var(--coral-d);
      font-size: calc(var(--s) * 17px);
      font-weight: 900;
    }
    .carry.on { border-style: solid; border-color: #ffb3ad; background: var(--coral-s); }
    .bnote { color: var(--coral-d); font-size: calc(var(--s) * 17px); font-weight: 900; letter-spacing: -.02em; }
    .vc-d { height: var(--H); display: grid; place-items: center; position: relative; }
    .vc-d.tap { cursor: pointer; border-radius: 12px; }
    .vc-d.tap:hover { background: #fff6e6; }
    .vc-d.struck::after {
      content: "";
      position: absolute;
      left: 22%;
      right: 22%;
      top: 50%;
      height: 3px;
      border-radius: 2px;
      background: var(--coral);
      transform: rotate(-24deg);
    }
    .vc-d.struck { color: #9aa6b3; }
    .vc-d.ghost { color: #c9d3dd; }
    .vc-dot { height: var(--H); display: grid; place-items: end center; padding-bottom: calc(var(--H) * .2); }
    .vc-dot i { width: calc(var(--s) * 11px); height: calc(var(--s) * 11px); border-radius: 50%; background: var(--coral); }
    .vc-sign { height: var(--H); display: grid; place-items: center; color: var(--ink-2); }
    .vc-line { grid-column: 1 / -1; height: 3px; margin: 2px 0 6px; border-radius: 2px; background: var(--ink); }
    .abox {
      width: 88%;
      height: 88%;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 2px solid #ccd7e2;
      background: #fbfdfe;
      cursor: pointer;
    }
    .abox.sel { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 4px rgba(18,179,163,.18); }
    .abox.bad { border-color: var(--bad); background: #fff0f0; color: var(--bad); animation: shake .4s ease; }
    .abox.good { border-color: #84d8ae; background: #effcf5; color: #12804a; }
    .dslot { height: var(--H); display: grid; place-items: end center; padding-bottom: calc(var(--H) * .16); cursor: pointer; }
    .dslot i {
      width: calc(var(--s) * 15px);
      height: calc(var(--s) * 15px);
      border-radius: 50%;
      border: 2px dashed #f2a199;
      background: #fff;
    }
    .dslot.on i { border: 0; background: var(--coral); box-shadow: 0 0 0 4px rgba(255,91,79,.18); animation: pop .3s ease both; }
    .dslot.need i { animation: pulseRing 1s ease infinite; }
    @keyframes pulseRing { 50% { box-shadow: 0 0 0 7px rgba(255,91,79,.22); } }

    .aboard {
      --W: calc(var(--s) * 56px);
      --D: calc(var(--s) * 18px);
      --H: calc(var(--s) * 60px);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      padding: calc(var(--s) * 10px) calc(var(--W) * 1.5);
      border-radius: calc(var(--s) * 18px);
      background: #fff;
      box-shadow: 0 6px 18px rgba(29,40,56,.07);
      font-size: calc(var(--s) * 40px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      max-width: 100%;
    }
    .arow { display: flex; align-items: center; height: var(--H); }
    .arow.b { transition: transform .32s cubic-bezier(.34, 1.36, .55, 1); transform: translateX(calc(var(--W) * var(--off) * -1)); }
    .arow .ch { width: var(--W); text-align: center; }
    .arow .dt { width: var(--D); height: var(--H); display: grid; place-items: end center; padding-bottom: calc(var(--H) * .2); }
    .arow .dt i { width: calc(var(--s) * 11px); height: calc(var(--s) * 11px); border-radius: 50%; background: var(--coral); transition: box-shadow .2s; }
    .aboard.ok .arow .dt i { box-shadow: 0 0 0 6px rgba(31,174,106,.3); }
    .aboard .rule { position: absolute; left: 12px; right: 12px; bottom: calc(var(--s) * 10px); height: 3px; border-radius: 2px; background: var(--ink); opacity: .9; }
    .aboard .guide {
      position: absolute;
      top: 6px;
      bottom: 6px;
      right: calc(var(--W) * 1.5 + var(--W) * var(--fa) + var(--D) / 2);
      border-left: 2px dashed rgba(255,91,79,.4);
    }

    .vchar {
      --W: calc(var(--s) * 30px);
      --D: calc(var(--s) * 11px);
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      padding: calc(var(--s) * 10px) calc(var(--s) * 16px);
      border-radius: 14px;
      background: #fff;
      border: 1.5px solid var(--line);
      font-size: calc(var(--s) * 26px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .vchar .r { display: flex; align-items: center; height: calc(var(--s) * 38px); }
    .vchar .r .ch { width: var(--W); text-align: center; }
    .vchar .r .dt { width: var(--D); align-self: stretch; display: grid; place-items: end center; padding-bottom: calc(var(--s) * 8px); }
    .vchar .r .dt i { width: calc(var(--s) * 8px); height: calc(var(--s) * 8px); border-radius: 50%; background: var(--coral); }
    .vchar .ln { align-self: stretch; height: 2.5px; margin: 3px 0; border-radius: 2px; background: var(--ink); }
    .vchar .r.ans { color: var(--pm1); }
    .vchar .r .sg { width: var(--W); text-align: left; color: var(--ink-2); }

    /* ---------- 생활 속 문제 ---------- */
    .story {
      display: flex;
      align-items: flex-start;
      gap: calc(var(--s) * 10px);
      padding: calc(var(--s) * 12px) calc(var(--s) * 14px);
      border-radius: calc(var(--s) * 18px);
      background: #fff;
      box-shadow: 0 6px 18px rgba(29,40,56,.07);
    }
    .story .em {
      flex: 0 0 auto;
      width: calc(var(--s) * 50px);
      height: calc(var(--s) * 50px);
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--amber-s);
      font-size: calc(var(--s) * 30px);
    }
    .story p { margin: 0; font-size: calc(var(--s) * 17px); font-weight: 650; line-height: 1.6; word-break: keep-all; }
    .story p .num { color: var(--teal-d); font-size: 1.08em; }
    .story .spk { margin-left: auto; }
    .expr-line { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: calc(var(--s) * 8px); font-size: calc(var(--s) * 28px); font-weight: 900; }
    .op-sym { color: var(--ink-2); }

    /* ---------- 정답 표시 ---------- */
    .answer-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .answer-mark {
      width: min(40%, 160px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.93);
      border: 10px solid currentColor;
      font-size: clamp(56px, 7vw, 110px);
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 22px 50px rgba(29,40,56,.22);
      animation: markPop .55s cubic-bezier(.3, 1.5, .5, 1) both;
    }
    .answer-overlay.correct { color: var(--good); }
    .answer-overlay.wrong { color: var(--bad); }
    .answer-overlay.fade { opacity: 0; transition: opacity .2s ease; }
    @keyframes markPop { 0% { transform: scale(.4) rotate(-8deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    .confetti i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 13px;
      height: 13px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      background: var(--c);
      animation: burst .85s cubic-bezier(.2, .7, .4, 1) forwards;
    }
    @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
    @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
    .shake { animation: shake .4s ease; }

    /* ---------- 오버레이 ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(20,32,44,.5);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .result-card {
      width: min(560px, 94vw);
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px 26px 26px;
      border-radius: 30px;
      background: #fff;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      animation: rise .35s cubic-bezier(.3, 1.3, .5, 1) both;
    }
    @keyframes rise { from { transform: translateY(24px) scale(.96); opacity: 0; } }
    .result-card .kid-art { width: 150px; height: 150px; margin: -4px auto 0; }
    .result-card h2 { margin: 6px 0 4px; font-size: 34px; font-weight: 900; letter-spacing: -.03em; }
    .result-card .sub { margin: 0 0 14px; color: var(--muted); font-weight: 650; }
    .rank-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--soft);
      font-size: 19px;
      font-weight: 850;
      text-align: left;
    }
    .rank-row .rk {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: var(--muted);
      font-size: 17px;
      font-weight: 900;
    }
    .rank-row.r1 { background: #fff5d6; }
    .rank-row.r1 .rk { background: #ffc531; color: #fff; }
    .rank-row.r2 .rk { background: #b9c4d0; color: #fff; }
    .rank-row.r3 .rk { background: #e0a26a; color: #fff; }
    .rank-row strong { font-variant-numeric: tabular-nums; }
    .rank-row small { color: var(--muted); font-weight: 700; }
    .result-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
    .btn-main {
      height: 52px;
      padding: 0 24px;
      border-radius: 16px;
      background: linear-gradient(180deg, #1cc6b5, #0ea193);
      color: #fff;
      font-size: 17px;
      font-weight: 850;
      box-shadow: 0 10px 22px rgba(14,161,147,.28);
    }
    .result-btns .ghost-btn { height: 52px; }

    .concept-card { width: min(900px, 96vw); text-align: left; padding: 24px; }
    .concept-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .concept-head .kid-art { width: 84px; height: 84px; margin: 0; flex: 0 0 auto; }
    .concept-head h2 { margin: 0; font-size: 30px; }
    .concept-head p { margin: 4px 0 0; color: var(--muted); font-weight: 650; }
    .crow {
      --s: .92;
      display: grid;
      grid-template-columns: minmax(0, 290px) minmax(0, 1fr);
      gap: 20px;
      align-items: center;
      margin-top: 12px;
      padding: 16px 18px;
      border-radius: 22px;
      background: var(--soft);
    }
    .crow .fig { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
    .crow h3 { margin: 0 0 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 21px; font-weight: 900; letter-spacing: -.02em; }
    .crow h3 .num { font-size: 1.15em; }
    .crow p { margin: 0; color: var(--ink-2); font-size: 16px; font-weight: 550; line-height: 1.7; word-break: keep-all; }
    .crow p b { color: var(--coral-d); font-weight: 800; }
    .crow .spk { width: 34px; height: 34px; background: #fff; }
    .ladder { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 24px; }
    .ladder .arr { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 850; color: var(--muted); line-height: 1.2; }
    .ladder .arr .up { color: var(--teal-d); }
    .ladder .arr .dn { color: var(--coral-d); }

    .done-card { display: flex; flex-direction: column; align-items: center; gap: calc(var(--s) * 8px); padding: calc(var(--s) * 18px); border-radius: 22px; background: #fff; box-shadow: 0 6px 18px rgba(29,40,56,.07); text-align: center; }
    .done-card .kid-art { width: calc(var(--s) * 110px); height: calc(var(--s) * 110px); }
    .done-score { font-size: calc(var(--s) * 46px); font-weight: 900; color: var(--teal-d); }
    .done-sub { color: var(--muted); font-size: calc(var(--s) * 15px); font-weight: 700; }
    .done-list { display: grid; gap: 6px; width: 100%; }
    .done-row { display: flex; justify-content: space-between; padding: 7px 12px; border-radius: 10px; background: var(--soft); font-size: calc(var(--s) * 14.5px); font-weight: 750; }


    /* ---------- 문제 모음 ---------- */
    .card.mixc { background: linear-gradient(165deg, #fff5dd 0%, #fff 62%); border-color: #ffdf9e; --tint: #ffefc7; }
    .card.mixc .go { background: linear-gradient(180deg, #ffb52e, #f29a0c); color: #fff; box-shadow: 0 8px 18px rgba(242,154,12,.26); }
    .card.mixc .go:hover { background: linear-gradient(180deg, #ffbd45, #f5a21c); }
    .mix-card { width: min(840px, 96vw); text-align: left; padding: 24px 24px 0; }
    .mix-lesson { margin-top: 12px; padding: 14px 16px; border-radius: 20px; background: var(--soft); }
    .mix-lesson-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 10px; }
    .mix-lesson-head h3 { flex: 1; min-width: 150px; margin: 0; font-size: 19px; font-weight: 900; letter-spacing: -.02em; }
    .mix-page {
      padding: 4px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
    }
    .mix-all {
      height: 34px;
      padding: 0 12px;
      border-radius: 11px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 800;
      white-space: nowrap;
    }
    .mix-all.on { color: var(--teal-d); border-color: #9edfd5; }
    .mix-items { display: flex; flex-wrap: wrap; gap: 8px; }
    .mix-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 6px 14px 6px 8px;
      border-radius: 15px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
      text-align: left;
      transition: border-color .15s, background .15s, color .15s;
    }
    .mix-chip .ck {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 2px solid #c8d4df;
      color: transparent;
      background: #fff;
    }
    .mix-chip .ck svg { width: 16px; height: 16px; }
    .mix-chip .mi { width: 28px; height: 28px; flex: 0 0 auto; display: grid; place-items: center; opacity: .4; filter: grayscale(.6); }
    .mix-chip .mi svg { width: 100%; height: 100%; }
    .mix-chip.on { border-color: var(--teal); background: var(--teal-s); color: var(--ink); }
    .mix-chip.on .ck { background: var(--teal); border-color: var(--teal); color: #fff; }
    .mix-chip.on .mi { opacity: 1; filter: none; }
    .mix-foot {
      position: sticky;
      bottom: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 16px;

      border-top: 1px solid var(--line);
    }
    .mix-sum { display: flex; flex-direction: column; gap: 3px; color: var(--ink-2); font-size: 16px; font-weight: 800; }
    .mix-sum b { color: var(--teal-d); font-size: 1.25em; margin-right: 2px; }
    .mix-cap { color: var(--muted); font-size: 13px; font-weight: 700; }
    .mix-cap.warn { color: #b8760a; }
    .mix-btns { display: flex; gap: 10px; }
    .mix-btns .ghost-btn { height: 52px; }
    .btn-main:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .cell-body > .mix-tag { width: auto; max-width: 100%; align-self: center; }
    .mix-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: calc(var(--s) * 4px) calc(var(--s) * 12px) calc(var(--s) * 4px) calc(var(--s) * 6px);
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      border: 1.5px solid rgba(29,40,56,.08);
      color: var(--ink-2);
      font-size: calc(var(--s) * 14px);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mix-tag .mi { width: calc(var(--s) * 22px); height: calc(var(--s) * 22px); flex: 0 0 auto; display: grid; place-items: center; }

    /* ---------- 학습지 ---------- */

<body>
  <a class="samnori-home-float" href="https://hanssam622.github.io/ssamnori/" aria-label="쌤노리 홈화면으로 가기">쌤노리 홈</a>

  <section id="start-screen" class="screen">
    <div class="start-wrap">
      <div class="hero-text">
        <span class="hero-badge"><b>4-2</b>3단원 · 소수의 덧셈과 뺄셈</span>
        <h1 class="hero-title">소수맨<span class="tdot"></span></h1>
        <p class="hero-sub">0.01과 0.001부터 크기 비교, 덧셈과 뺄셈까지 <br /><strong>모눈종이 · 수직선 · 세로셈</strong>으로 차근차근 익혀요</p>
        <div class="hero-actions">
          <button class="start-btn" type="button" onclick="showScreen('game-select-screen')">시작하기 →</button>
          <span class="hero-note">1~6명이 한 화면에서 함께 겨뤄요</span>
        </div>
        <div class="topic-list" aria-hidden="true">
          <span style="--c:var(--p0)">소수 두 자리 수</span>
          <span style="--c:var(--pm1)">소수 세 자리 수</span>
          <span style="--c:var(--p1)">10배와 1/10</span>
          <span style="--c:var(--pm2)">크기 비교</span>
          <span style="--c:var(--teal)">소수의 덧셈</span>
          <span style="--c:var(--coral)">소수의 뺄셈</span>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="art-card">
          <div class="hgrid" id="hero-grid"></div>
          <span class="art-tag num" id="hero-tag">0<i class="dp"></i>00</span>
        </div>
        <div class="kid-art"></div>
        <span class="bubble b1 num">0<i class="dp"></i>01</span>
        <span class="bubble b2 num">1<i class="dp"></i>32</span>
        <span class="bubble b3 num">0<i class="dp"></i>001</span>
        <span class="bubble b4">×10 · 1/10</span>
      </div>
    </div>
  </section>

  <section id="game-select-screen" class="screen hidden">
    <div class="select-wrap">
      <div class="select-head">
        <div class="brand-mini">
          <div class="kid-art"></div>
          <div>
            <h2>소수맨<span class="tdot"></span></h2>
            <p>4학년 2학기 · 3. 소수의 덧셈과 뺄셈</p>
          </div>
        </div>
        <div class="head-btns">
          <button class="ghost-btn hl" type="button" onclick="openWorksheet()">🖨 학습지 만들기</button>
          <button class="ghost-btn" type="button" onclick="showScreen('start-screen')">← 처음으로</button>
        </div>
      </div>

      <div class="settings-bar">
        <div class="setting-row">
          <span class="setting-label">참가 인원</span>
          <div class="seg" id="player-seg"></div>
        </div>
        <div class="setting-row">
          <span class="setting-label">제한 시간</span>
          <select id="timer-select" class="select" aria-label="제한 시간">
            <option value="60">1분</option>
            <option value="90" selected>1분 30초</option>
            <option value="180">3분</option>
            <option value="300">5분</option>
            <option value="none">무제한</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-label">읽어 주기</span>
          <button id="voice-toggle" class="toggle-btn on" type="button" onclick="toggleVoice()">🔊 켜짐</button>
        </div>
      </div>

      <p class="cap-note" id="cap-note"></p>
      <nav class="stage-nav" id="stage-nav" aria-label="단계 바로 가기"></nav>
      <div id="stages"></div>
    </div>
  </section>

  <section id="game-screen" class="game-screen hidden">
    <div class="topbar">
      <button class="ghost-btn" type="button" onclick="exitGame()">← 목록</button>
      <div class="top-title">
        <h1 id="mode-title">소수맨</h1>
        <p id="mode-sub"></p>
      </div>
      <div class="timer" id="timer">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle class="track" cx="30" cy="30" r="25" />
          <circle class="bar" id="timer-bar" cx="30" cy="30" r="25" stroke-dasharray="157.08" stroke-dashoffset="0" />
        </svg>
        <span id="time-left">∞</span>
      </div>
      <div class="top-actions">
        <button class="ghost-btn opt" id="voice-toggle-2" type="button" onclick="toggleVoice()">🔊 소리</button>
        <button class="ghost-btn opt" type="button" onclick="toggleFullscreen()">⛶ 전체화면</button>
        <button class="ghost-btn" type="button" onclick="finishGame()">🏁 결과</button>
      </div>
    </div>
    <div class="players" id="players"></div>
  </section>

  <div id="result-overlay" class="overlay hidden"></div>
  <div id="concept-overlay" class="overlay hidden" onclick="if (event.target === this) hideConcept()"></div>
  <div id="mix-overlay" class="overlay hidden" onclick="if (event.target === this) hideMix()"></div>
  <div id="notice-overlay" class="overlay hidden" onclick="if (event.target === this) hideNotice()"></div>
  <div id="ws-overlay" class="overlay hidden" onclick="if (event.target === this) hideWorksheet()"></div>
  <div id="print-root"></div>

  <script>
    /* =========================================================
       소수맨 - 공통 데이터
       ========================================================= */
    const ANIMALS = [
      { emoji: '🐶', name: '강아지' },
      { emoji: '🐱', name: '고양이' },
      { emoji: '🐰', name: '토끼' },
      { emoji: '🦊', name: '여우' },
      { emoji: '🐻', name: '곰' },
      { emoji: '🐼', name: '판다' }
    ];

    const GL = (x, y, s, n) => {
      let d = '';
      for (let i = 1; i < n; i += 1) d += `M${x + s * i} ${y}v${s * n}M${x} ${y + s * i}h${s * n}`;
      return d;
