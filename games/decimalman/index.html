      calc: [['all', '전부 섞기'], ['1', '소수 한 자리 수끼리'], ['2', '소수 두 자리 수끼리'], ['m', '자릿수가 다른 수']],
      speed: [['all', '전부 섞기'], ['a1', '소수 한 자리 수의 덧셈'], ['a2', '소수 두 자리 수의 덧셈'], ['s1', '소수 한 자리 수의 뺄셈'], ['s2', '소수 두 자리 수의 뺄셈'], ['mx', '자릿수가 다른 수의 계산']]
    };

    const EXAM_TOTAL = 20;
    const EXAM_POINT = 5;

    let playerCount = 2;
    let players = [];
    let scores = [];
    let mode = 'grid';
    let modeOpt = 'all';
    let timerId = null;
    let timeLeft = 0;
    let timeTotal = 0;
    let gameActive = false;
    let voiceOn = true;
    let combos = [];
    let examQueues = [];
    let examIndex = [];
    let examLog = [];
    const overlayTimers = {};
    const nextTimers = {};

    // 차시별 문제 모음에서 소수 두 자리 수 / 세 자리 수 문제를 나눠 내기 위한 설정
    let digitMode = 'any';
    function wantThree(p) {
      if (digitMode === 'three') return true;
      if (digitMode === 'two') return false;
      return Math.random() < p;
    }
    function withDigits(dm, fn) {
      const prev = digitMode;
      digitMode = dm;
      try { return fn(); } finally { digitMode = prev; }
    }
    function withOpt(o, fn) {
      const prev = modeOpt;
      modeOpt = o;
      try { return fn(); } finally { modeOpt = prev; }
    }

    /* =========================================================
       작은 도우미
       ========================================================= */
    function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    /* ---------- 소수는 1000배 한 정수로 다룬다 (부동소수 오차 방지) ---------- */
    function fmt(n) {
      const w = Math.floor(n / 1000);
      const f = String(n % 1000).padStart(3, '0').replace(/0+$/, '');
      return f ? `${w}.${f}` : String(w);
    }
    function fmtP(n, places) {
      const w = Math.floor(n / 1000);
      if (!places) return String(w);
      return `${w}.${String(n % 1000).padStart(3, '0').slice(0, places)}`;
    }
    function decPlaces(n) {
      const f = n % 1000;
      if (!f) return 0;
      if (f % 100 === 0) return 1;
      if (f % 10 === 0) return 2;
      return 3;
    }
    function parseNum(s) {
      if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
      const [w, f = ''] = s.split('.');
      if (/[1-9]/.test(f.slice(3))) return NaN;
      return Number(w) * 1000 + Number((f + '000').slice(0, 3));
    }
    function digitAt(n, place) { return Math.floor(n / Math.pow(10, place + 3)) % 10; }

    const PLACE_NAME = { 2: '백의 자리', 1: '십의 자리', 0: '일의 자리', '-1': '소수 첫째 자리', '-2': '소수 둘째 자리', '-3': '소수 셋째 자리' };
    const PLACE_UNIT = { 2: '100', 1: '10', 0: '1', '-1': '0.1', '-2': '0.01', '-3': '0.001' };
    function plClass(place) { return place >= 0 ? `pl${place}` : `plm${-place}`; }
    function bgClass(place) { return place >= 0 ? `bg${place}` : `bgm${-place}`; }

    // 숫자를 그린다. 소수점은 빨간 점, color를 주면 자리별로 색을 입힌다
    function numHtml(str, opts = {}) {
      const s = String(str);
      const dot = s.indexOf('.');
      const w = dot < 0 ? s : s.slice(0, dot);
      const f = dot < 0 ? '' : s.slice(dot + 1);
      const dg = (d, place) => `<span class="dg${opts.color ? ` ${plClass(place)}` : ''}${opts.hi === place ? ' hi' : ''}">${d}</span>`;
      let html = '';
      [...w].forEach((d, i) => { html += dg(d, w.length - 1 - i); });
      if (dot >= 0) html += '<i class="dp"></i>';
      [...f].forEach((d, i) => { html += dg(d, -(i + 1)); });
      return `<span class="num${opts.cls ? ` ${opts.cls}` : ''}">${html}</span>`;
    }
    function N(n, opts) { return numHtml(fmt(n), opts); }
    function frHtml(num, den, whole) {
      const f = `<span class="fr"><b>${num}</b><i>${den}</i></span>`;
      return whole ? `<span class="fr-wrap">${whole}${f}</span>` : f;
    }

    /* ---------- 한글 읽기 ---------- */
    const KD = ['영', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
    function sinoInt(n) {
      if (n === 0) return '영';
      let s = '';
      let r = n;
      [['만', 10000], ['천', 1000], ['백', 100], ['십', 10]].forEach(([u, v]) => {
        const d = Math.floor(r / v);
        if (d) { s += (d === 1 ? '' : KD[d]) + u; r %= v; }
      });
      if (r) s += KD[r];
      return s;
    }
    function decKo(str) {
      const [w, f] = String(str).split('.');
      return sinoInt(Number(w)) + (f ? ` 점 ${[...f].map((d) => KD[+d]).join('')}` : '');
    }
    function nKo(n) { return decKo(fmt(n)); }
    function hasBatchim(text) {
      const code = text.charCodeAt(text.length - 1);
      if (Number.isNaN(code) || code < 0xac00 || code > 0xd7a3) return false;
      return (code - 0xac00) % 28 !== 0;
    }
    function eunNeun(t) { return hasBatchim(t) ? '은' : '는'; }
    function iGa(t) { return hasBatchim(t) ? '이' : '가'; }
    function eulReul(t) { return hasBatchim(t) ? '을' : '를'; }
    function gwaWa(t) { return hasBatchim(t) ? '과' : '와'; }
    const UNIT_KO = { cm: '센티미터', m: '미터', km: '킬로미터', g: '그램', kg: '킬로그램', mL: '밀리리터', L: '리터', mm: '밀리미터', '초': '초' };

    /* =========================================================
       소리 (읽어 주기 + 효과음)
       ========================================================= */
    function speak(text) {
      if (!voiceOn || !text || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        u.rate = 0.88;
        u.pitch = 1.05;
        const ko = window.speechSynthesis.getVoices().find((v) => (v.lang || '').toLowerCase().startsWith('ko'));
        if (ko) u.voice = ko;
        window.speechSynthesis.speak(u);
      } catch (err) { /* 음성 미지원 브라우저는 조용히 넘어간다 */ }
    }

    let audioCtx = null;
    function blip(kind) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const notes = kind === 'ok' ? [660, 880] : kind === 'tick' ? [520] : kind === 'fanfare' ? [523, 659, 784, 1047] : [320, 240];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = kind === 'fanfare' ? 'triangle' : 'sine';
          osc.frequency.value = freq;
          const t0 = audioCtx.currentTime + i * (kind === 'fanfare' ? 0.12 : 0.09);
          const vol = kind === 'tick' ? 0.06 : 0.14;
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (kind === 'fanfare' ? 0.3 : 0.16));
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.32);
        });
      } catch (err) { /* 무시 */ }
    }

    function toggleVoice() {
      voiceOn = !voiceOn;
      if (!voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
      const a = document.getElementById('voice-toggle');
      a.textContent = voiceOn ? '🔊 켜짐' : '🔈 꺼짐';
      a.className = `toggle-btn ${voiceOn ? 'on' : 'off'}`;
      document.getElementById('voice-toggle-2').textContent = voiceOn ? '🔊 소리' : '🔈 소리';
    }

    /* =========================================================
       그림 조각: 모눈종이 · 수직선 · 자릿값 표 · 세로셈
       ========================================================= */
    // 전체 크기가 1인 모눈종이. 세로줄부터 채운다 (세로 한 줄 = 0.1, 한 칸 = 0.01)
    function hgridHtml(count, cellCls, opts = {}) {
      let html = '';
      for (let g = 0; g < count; g += 1) {
        let cells = '';
        for (let i = 0; i < 100; i += 1) {
          const k = g * 100 + i;
          cells += `<i class="${cellCls(k)}" data-i="${k}"></i>`;
        }
        html += `<div class="hgrid${opts.tap ? ' tap' : ''}"${opts.tap ? ` data-p="${opts.idx}"` : ''}>${cells}</div>`;
      }
      return `<div class="hgrids n${count}${opts.size ? ` ${opts.size}` : ''}"${opts.id ? ` id="${opts.id}"` : ''}>${html}</div>`;
    }

    function lineSvg(start, step, k, mark) {
      const x0 = 24;
      const x1 = 316;
      const y = 62;
      const dx = (x1 - x0) / 10;
      let ticks = '';
      for (let i = 0; i <= 10; i += 1) {
        const x = x0 + dx * i;
        const big = i === 0 || i === 10 || i === 5;
        ticks += `<line x1="${x}" y1="${y - (big ? 12 : 7)}" x2="${x}" y2="${y + (big ? 12 : 7)}" stroke="#1d2838" stroke-width="${big ? 2.6 : 1.7}" stroke-linecap="round"/>`;
      }
      const lab = (i, v) => `<text x="${x0 + dx * i}" y="${y + 40}" text-anchor="middle" font-size="25" font-weight="900" fill="#1d2838" font-family="inherit">${fmt(v)}</text>`;
      const ax = x0 + dx * k;
      return `<svg class="nline" viewBox="0 -4 340 112" aria-hidden="true">
        <line x1="10" y1="${y}" x2="330" y2="${y}" stroke="#1d2838" stroke-width="2.6" stroke-linecap="round"/>
        ${ticks}${lab(0, start)}${lab(10, start + step * 10)}
        <g transform="translate(${ax} 0)">
          <rect x="-22" y="-2" width="44" height="32" rx="10" fill="#ff5b4f"/>
          <text x="0" y="22" text-anchor="middle" font-size="23" font-weight="900" fill="#fff" font-family="inherit">${mark || '?'}</text>
          <path d="M0 30v12m-6-6 6 7 6-7" fill="none" stroke="#ff5b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>`;
    }

    // 자릿값 표. rows: [{ label, s }] / key: 강조할 자리
    function ptableHtml(rows, key) {
      const ws = rows.map((r) => r.s.split('.')[0].length);
      const fs = rows.map((r) => (r.s.split('.')[1] || '').length);
      const I = Math.max(1, ...ws);
      const F = Math.max(1, ...fs);
      const places = [];
      for (let p = I - 1; p >= 0; p -= 1) places.push(p);
      const fracPlaces = [];
      for (let p = 1; p <= F; p += 1) fracPlaces.push(-p);
      const hasLabel = rows.some((r) => r.label);
      const tmpl = `${hasLabel ? 'auto ' : ''}repeat(${I}, minmax(calc(var(--s) * 44px), auto)) calc(var(--s) * 14px) repeat(${F}, minmax(calc(var(--s) * 44px), auto))`;
      let h = `<div class="ptable" style="grid-template-columns:${tmpl}">`;
      if (hasLabel) h += '<span></span>';
      places.forEach((p) => { h += `<span class="h ${bgClass(p)}">${PLACE_UNIT[p]}</span>`; });
      h += '<span></span>';
      fracPlaces.forEach((p) => { h += `<span class="h ${bgClass(p)}">${PLACE_UNIT[p]}</span>`; });
      rows.forEach((r) => {
        const [w, f = ''] = r.s.split('.');
        if (hasLabel) h += `<span class="rl">${r.label || ''}</span>`;
        places.forEach((p) => {
          const d = w.length - 1 - p >= 0 ? w[w.length - 1 - p] : '';
          h += `<span class="c ${plClass(p)}${key === p ? ' key' : ''}${d === '' ? ' e' : ''}">${d}</span>`;
        });
        h += `<span class="d">${r.s.includes('.') ? '<i></i>' : ''}</span>`;
        fracPlaces.forEach((p) => {
          const d = f[-p - 1] || '';
          h += `<span class="c ${plClass(p)}${key === p ? ' key' : ''}${d === '' ? ' e' : ''}">${d || (r.zeroFill ? '0' : '')}</span>`;
        });
      });
      return `${h}</div>`;
    }

    // 세로셈의 칸 배치 (소수점 기준으로 맞춘다)
    function vLayout(a, b, r) {
      const [aw, af = ''] = a.split('.');
      const [bw, bf = ''] = b.split('.');
      const F = Math.max(af.length, bf.length);
      const rs = fmtP(parseNum(r), F);
      const [rw, rf = ''] = rs.split('.');
      const I = Math.max(aw.length, bw.length, rw.length);
      const cols = (w, f) => [...w.padStart(I, ' '), ...f.padEnd(F, ' ')].map((ch) => (ch === ' ' ? '' : ch));
      return { I, F, A: cols(aw, af), B: cols(bw, bf), R: cols(rw, rf), decA: af.length, decB: bf.length };
    }
    function colPlaceOf(L, c) { return c < L.I ? L.I - 1 - c : -(c - L.I + 1); }
    const OPS = { '+': '+', '-': '−' };

    // 세로셈 판 (게임용과 개념 설명용을 같이 쓴다)
    function vGridHtml(o) {
      const L = o.lay;
      const n = L.I + L.F;
      const sub = o.op === '-';
      const give = o.give || [];
      const recv = o.recv || [];
      const carry = o.carry || [];
      const tv = (c) => Number(L.A[c] || 0) + 10 * (recv[c] || 0) - (give[c] || 0);
      const row = (first, fn, dotHtml) => {
        let h = first;
        for (let c = 0; c < n; c += 1) {
          if (c === L.I) h += dotHtml;
          h += fn(c);
        }
        return h;
      };
      const tmpl = `var(--W) repeat(${L.I}, var(--W)) var(--D) repeat(${L.F}, var(--W))`;
      let h = `<div class="vcalc" style="grid-template-columns:${tmpl}">`;
      // 자리 이름
      h += row('<span></span>', (c) => {
        const pl = colPlaceOf(L, c);
        return `<span class="vc-h ${bgClass(pl)}">${PLACE_UNIT[pl]}</span>`;
      }, '<span></span>');
      // 받아올림 · 받아내림 칸
      h += row('<span class="vc-help"></span>', (c) => {
        let inner = '';
        if (!sub) {
          if (o.interactive && c < n - 1) {
            inner = `<button class="carry${carry[c] ? ' on' : ''}" type="button" onclick="vCarry(${o.idx},${c})" aria-label="받아올림 표시">${carry[c] ? '1' : ''}</button>`;
          } else if (carry[c]) inner = '<span class="bnote">1</span>';
        } else if (give[c]) inner = `<span class="bnote">${tv(c)}</span>`;
        else if (recv[c]) inner = '<span class="bnote">10</span>';
        return `<span class="vc-help">${inner}</span>`;
      }, '<span class="vc-help"></span>');
      // 빼어지는 수 / 더해지는 수
      h += row('<span class="vc-sign"></span>', (c) => {
        const d = L.A[c];
        const ghost = sub && d === '' && c >= L.I;
        const shown = ghost ? '0' : d;
        const tap = o.interactive && sub && !o.locked && shown !== '' && c < n - 1;
        const cls = `vc-d${ghost ? ' ghost' : ''}${give[c] ? ' struck' : ''}${tap ? ' tap' : ''}`;
        return `<span class="${cls}"${tap ? ` onclick="vBorrow(${o.idx},${c})"` : ''}>${shown}</span>`;
      }, '<span class="vc-dot"><i></i></span>');
      // 더하는 수 / 빼는 수
      h += row(`<span class="vc-sign">${OPS[o.op]}</span>`, (c) => `<span class="vc-d">${L.B[c]}</span>`, '<span class="vc-dot"><i></i></span>');
      h += '<span class="vc-line"></span>';
      // 답
      if (o.interactive) {
        h += row('<span></span>', (c) => {
          const cls = `abox${o.sel === c && !o.locked ? ' sel' : ''}${(o.bad || []).includes(c) ? ' bad' : ''}${o.good ? ' good' : ''}`;
          return `<span class="vc-d"><span class="${cls}" onclick="vSel(${o.idx},${c})">${o.ans[c]}</span></span>`;
        }, `<span class="dslot${o.dot ? ' on' : ''}${o.needDot ? ' need' : ''}" onclick="vDot(${o.idx})" aria-label="소수점 찍기"><i></i></span>`);
      } else {
        h += row('<span></span>', (c) => `<span class="vc-d plm1" style="color:var(--teal-d)">${L.R[c]}</span>`, '<span class="vc-dot"><i></i></span>');
      }
      return `${h}</div>`;
    }

    // 글자 단위 세로셈 (틀린 계산 보여 주기). layout: 'dot' 소수점 맞춤 / 'right' 끝자리 맞춤
    function vCharHtml(a, b, op, ans, layout) {
      const dec = (s) => (s.split('.')[1] || '').length;
      const F = layout === 'dot' ? Math.max(dec(a), dec(b), dec(ans)) : 0;
      const row = (s, cls, sign) => {
        let h = `<div class="r${cls ? ` ${cls}` : ''}">`;
        if (sign) h += `<span class="sg">${sign}</span>`;
        [...s].forEach((ch) => { h += ch === '.' ? '<span class="dt"><i></i></span>' : `<span class="ch">${ch}</span>`; });
        if (layout === 'dot') {
          const pad = F - dec(s);
          if (pad > 0 && !s.includes('.')) h += '<span class="dt"></span>';
          for (let i = 0; i < pad; i += 1) h += '<span class="ch"></span>';
        }
        return `${h}</div>`;
      };
      return `<div class="vchar">${row(a)}${row(b, '', OPS[op])}<div class="ln"></div>${row(ans, 'ans')}</div>`;
    }

    /* =========================================================
       문제 만들기
       ========================================================= */
    function rndHund(maxWhole, minWhole = 0) {
      let f;
      do { f = randInt(1, 99); } while (f % 10 === 0);
      return randInt(minWhole, maxWhole) * 1000 + f * 10;
    }
    function rndTenth(maxWhole, minWhole = 0) { return randInt(minWhole, maxWhole) * 1000 + randInt(1, 9) * 100; }
    function rndThou(maxWhole, minWhole = 0) {
      let f;
      do { f = randInt(1, 999); } while (f % 10 === 0);
      return randInt(minWhole, maxWhole) * 1000 + f;
    }

    function mkChoices(answer, distractors, n = 4, render = (v) => numHtml(v)) {
      const vals = [answer];
      distractors.forEach((d) => {
        if (vals.length < n && d !== null && d !== undefined && d !== '' && !vals.includes(d)) vals.push(d);
      });
      return shuffle(vals).map((v) => ({ v, html: render(v) }));
    }

    /* ---------- 1. 모눈종이 읽기 ---------- */
    function makeGrid() {
      const tenthOnly = Math.random() < 0.3;
      const whole = Math.random() < 0.4 ? 1 : 0;
      let frac;
      if (tenthOnly) frac = randInt(1, 9) * 10;
      else do { frac = randInt(1, 99); } while (frac % 10 === 0);
      const cells = whole * 100 + frac;
      const n = cells * 10;
      const ans = fmt(n);
      const t = Math.floor(frac / 10);
      const o = frac % 10;
      const ds = [];
      if (o && t && t !== o) ds.push(fmt(whole * 1000 + (o * 10 + t) * 10));
      if (tenthOnly) ds.push(fmt(whole * 1000 + t * 10));
      ds.push(fmt(n / 10), fmt(n * 10), whole ? fmt(n - 1000) : fmt(n + 1000), fmt(n + 100));
      return {
        kind: 'choice', key: `grid${n}`, ans,
        choices: mkChoices(ans, ds),
        prompt: '색칠한 부분을 소수로 나타내면?',
        visual: `${hgridHtml(whole ? 2 : 1, (k) => (k < cells ? 'a' : ''), { size: whole ? '' : 'lg' })}<div class="q-sub">전체 크기가 <b>1</b>인 모눈종이예요</div>`,
        speech: '전체 크기가 1인 모눈종이예요. 색칠한 부분을 소수로 나타내면 얼마일까요?',
        explain: `0.01이 ${cells}개 → ${numHtml(ans)}`,
        okSpeech: `${decKo(ans)}입니다`
      };
    }

    /* ---------- 2. 모눈종이에 색칠하기 ---------- */
    function makePaint() {
      const whole = Math.random() < 0.35 ? 1 : 0;
      let frac;
      if (Math.random() < 0.25) frac = randInt(1, 9) * 10;
      else do { frac = randInt(1, 99); } while (frac % 10 === 0);
      const target = whole * 100 + frac;
      const grids = whole || Math.random() < 0.3 ? 2 : 1;
      return {
        kind: 'paint', key: `paint${target}`, target, grids, n: target * 10,
        speech: `${nKo(target * 10)}만큼 색칠해 보세요. 세로 한 줄은 영 점 일, 한 칸은 영 점 영일이에요.`
      };
    }

    /* ---------- 3. 자릿값 탐정 ---------- */
    function distinctDigits(k) { return shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, k); }
    function makePlace() {
      const t = pick(['which', 'which', 'value', 'value', 'compose', 'count', 'countOf']);
      if (t === 'which' || t === 'value') {
        const places = wantThree(0.6) ? 3 : 2;
        const ds = distinctDigits(places + 1);
        const s = `${ds[0]}.${ds.slice(1).join('')}`;
        const pos = randInt(0, places);
        const place = -pos;
        const d = ds[pos];
        const dk = KD[d];
        if (t === 'which') {
          const names = [0, -1, -2, -3].map((p) => PLACE_NAME[p]);
          return {
            kind: 'choice', key: `w${s}${d}`, ans: PLACE_NAME[place], txt: true,
            choices: names.map((v) => ({ v, html: v })),
            prompt: `${numHtml(s)}에서 숫자 <b>${d}</b>${eunNeun(dk)} 어느 자리 숫자일까요?`,
            visual: `<div class="big-num">${numHtml(s, { hi: place })}</div>`,
            speech: `${decKo(s)}에서 숫자 ${dk}${eunNeun(dk)} 어느 자리 숫자일까요?`,
            explain: `${d}${eunNeun(dk)} ${PLACE_NAME[place]} 숫자예요.`,
            okSpeech: PLACE_NAME[place]
          };
        }
        const val = d * Math.pow(10, place + 3);
        const opts = [0, -1, -2, -3].map((p) => fmt(d * Math.pow(10, p + 3)));
        return {
          kind: 'choice', key: `v${s}${d}`, ans: fmt(val),
          choices: shuffle(opts).map((v) => ({ v, html: numHtml(v) })),
          prompt: `${numHtml(s)}에서 숫자 <b>${d}</b>${iGa(dk)} 나타내는 수는?`,
          visual: `<div class="big-num">${numHtml(s, { hi: place })}</div>`,
          speech: `${decKo(s)}에서 숫자 ${dk}${iGa(dk)} 나타내는 수는 얼마일까요?`,
          explain: `${d}${eunNeun(dk)} ${PLACE_NAME[place]} 숫자라서 ${numHtml(fmt(val))}${eulReul(nKo(val))} 나타내요.`,
          okSpeech: `${nKo(val)}`
        };
      }
      if (t === 'compose') {
        const three = wantThree(0.45);
        const a = randInt(1, 9);
        const b = randInt(1, 9);
        const c = randInt(1, 9);
        const d = three ? randInt(1, 9) : 0;
        const n = a * 1000 + b * 100 + c * 10 + d;
        const parts = [`1이 ${a}개`, `${numHtml('0.1')}이 ${b}개`, `${numHtml('0.01')}이 ${c}개`];
        if (three) parts.push(`${numHtml('0.001')}이 ${d}개`);
        const ds = [fmt(n * 10), three ? fmt(d * 1000 + c * 100 + b * 10 + a) : fmt(c * 1000 + b * 100 + a * 10), fmt(a * 1000 + c * 100 + b * 10 + d)];
        if (n % 10 === 0) ds.push(fmt(n / 10));
        ds.push(fmt(n + 1000));
        return {
          kind: 'choice', key: `c${n}`, ans: fmt(n),
          choices: mkChoices(fmt(n), ds),
          prompt: `${parts.join(', ')}인 수는?`,
          speech: `1이 ${KD[a]}개, 영 점 일이 ${KD[b]}개, 영 점 영일이 ${KD[c]}개${three ? `, 영 점 영영일이 ${KD[d]}개` : ''}인 수는 얼마일까요?`,
          explain: `${[a, `0.${b}`, `0.0${c}`].concat(three ? [`0.00${d}`] : []).map((v) => numHtml(String(v))).join(' + ')} = ${N(n)}`,
          okSpeech: nKo(n)
        };
      }
      if (t === 'count') {
        const thou = wantThree(0.4);
        let k;
        if (thou) do { k = randInt(1001, 9999); } while (k % 10 === 0);
        else do { k = randInt(101, 999); } while (k % 10 === 0);
        const n = thou ? k : k * 10;
        const unit = thou ? '0.001' : '0.01';
        const ds = thou ? [fmt(k * 10), fmt(k * 100), fmt(k * 1000)] : [fmt(k * 100), fmt(k), fmt(k * 1000)];
        return {
          kind: 'choice', key: `n${n}`, ans: fmt(n),
          choices: mkChoices(fmt(n), ds),
          prompt: `${numHtml(unit)}이 <b>${k}</b>개인 수는?`,
          speech: `${decKo(unit)}이 ${sinoInt(k)}개인 수는 얼마일까요?`,
          explain: `${numHtml(unit)}이 ${k}개이면 ${N(n)}이에요.`,
          okSpeech: nKo(n)
        };
      }
      const thr = wantThree(0.3);
      const n = thr ? rndThou(9, 1) : rndHund(9, 1);
      const unitS = thr ? '0.001' : '0.01';
      const cnt = thr ? n : n / 10;
      const vals = [cnt, cnt * 10, Math.floor(cnt / 10), cnt % (thr ? 1000 : 100)];
      const uniq = [...new Set(vals.map(String))];
      return {
        kind: 'choice', key: `o${n}`, ans: String(cnt), txt: false,
        choices: shuffle(uniq).map((v) => ({ v, html: `${v}개` })),
        prompt: `${N(n)}${eunNeun(nKo(n))} ${numHtml(unitS)}이 몇 개인 수일까요?`,
        speech: `${nKo(n)}${eunNeun(nKo(n))} ${decKo(unitS)}이 몇 개인 수일까요?`,
        explain: `${N(n)}${eunNeun(nKo(n))} ${numHtml(unitS)}이 ${cnt}개인 수예요.`,
        okSpeech: `${sinoInt(cnt)}개`
      };
    }

    /* ---------- 4. 소수 읽고 쓰기 ---------- */
    function swapLast(s) {
      const [w, f] = s.split('.');
      if (!f || f.length < 2) return null;
      const a = [...f];
      [a[a.length - 1], a[a.length - 2]] = [a[a.length - 2], a[a.length - 1]];
      if (a[a.length - 1] === '0') return null;
      return `${w}.${a.join('')}`;
    }
    function makeRead() {
      const t = pick(['toKo', 'toKo', 'toNum', 'frac', 'frac']);
      const three = wantThree(0.35);
      const n = three ? rndThou(pick([0, 1, 4])) : rndHund(pick([0, 0, 1, 3, 7, 12]));
      const s = fmt(n);
      if (t === 'toKo') {
        const [w, f] = s.split('.');
        const ds = [`${sinoInt(+w)} 점 ${sinoInt(+f)}`, swapLast(s) && decKo(swapLast(s)), sinoInt(Number(w + f)), `${sinoInt(+w)} 점 ${[...f].reverse().map((d) => KD[+d]).join('')}`];
        const ans = decKo(s);
        return {
          kind: 'choice', key: `k${s}`, ans, txt: true, cols: 1,
          choices: mkChoices(ans, ds, 4, (v) => v),
          prompt: `${numHtml(s)}${eulReul(ans)} 바르게 읽은 것은?`,
          visual: `<div class="big-num">${numHtml(s)}</div>`,
          speech: '이 소수를 바르게 읽은 것을 골라 보세요.',
          explain: `소수점 아래는 숫자를 하나씩 읽어요. "${ans}"`,
          okSpeech: ans
        };
      }
      if (t === 'toNum') {
        const ds = [swapLast(s), fmt(n * 10), n % 10 === 0 ? fmt(n / 10) : null, fmt(n + 1000)];
        return {
          kind: 'choice', key: `t${s}`, ans: s,
          choices: mkChoices(s, ds),
          prompt: `<b>"${decKo(s)}"</b>${eulReul(decKo(s))} 소수로 쓰면?`,
          speech: `${decKo(s)}${eulReul(decKo(s))} 소수로 쓰면 무엇일까요?`,
          explain: `"${decKo(s)}" → ${numHtml(s)}`,
          okSpeech: decKo(s)
        };
      }
      const den = three ? 1000 : 100;
      const whole = Math.floor(n / 1000);
      const num = three ? n % 1000 : (n % 1000) / 10;
      // 분자를 한 자리 밀려 쓴 실수 (1 32/100 → 1.032)
      const ds = [fmt(n * 10), n % 10 === 0 ? fmt(n / 10) : null, swapLast(s), three ? fmt(n + 100) : fmt(whole * 1000 + num)];
      const fk = `${whole ? `${sinoInt(whole)}${gwaWa(sinoInt(whole))} ` : ''}${sinoInt(den)}분의 ${sinoInt(num)}`;
      return {
        kind: 'choice', key: `f${s}`, ans: s,
        choices: mkChoices(s, ds),
        prompt: '분수를 소수로 나타내면?',
        visual: `<div class="big-num">${frHtml(num, den, whole || '')}</div>`,
        speech: `${fk}${eulReul(fk)} 소수로 나타내면 얼마일까요?`,
        explain: `${frHtml(num, den, whole || '')} = ${numHtml(s)}`,
        okSpeech: decKo(s)
      };
    }

    /* ---------- 5. 수직선 읽기 ---------- */
    function makeLine() {
      const step = digitMode === 'three' ? 1 : pick(digitMode === 'two' ? [100, 10, 10] : [100, 10, 10, 1]);
      let start;
      if (step === 100) start = randInt(0, 8) * 1000;
      else if (step === 10) start = randInt(1, 59) * 100;
      else start = randInt(100, 699) * 10;
      const k = randInt(1, 9);
      const v = start + k * step;
      const ans = fmt(v);
      const ds = [fmt(start + (k < 9 ? k + 1 : k - 2) * step), fmt(start + (k > 1 ? k - 1 : k + 2) * step)];
      if (step >= 10) ds.push(fmt(start + k * step * 10), fmt(start + (k * step) / 10));
      else ds.push(fmt(start + k * 10), fmt(v + 100));
      return {
        kind: 'choice', key: `l${v}${step}`, ans, ln: [start, step, k],
        choices: mkChoices(ans, shuffle(ds)),
        prompt: '화살표가 가리키는 수는?',
        visual: `${lineSvg(start, step, k)}<div class="q-sub">작은 눈금 한 칸의 크기를 먼저 알아봐요</div>`,
        speech: '수직선에서 화살표가 가리키는 수는 얼마일까요? 작은 눈금 한 칸의 크기를 먼저 알아보세요.',
        explain: `작은 눈금 한 칸은 ${numHtml(fmt(step))}이에요. → ${numHtml(ans)}`,
        okSpeech: decKo(ans)
      };
    }

    /* ---------- 6. 단위 바꾸기 ---------- */
    const UNITS = [
      { a: 'cm', b: 'm', f: 100, ctx: ['🐧 펭귄의 키', '🌱 새싹의 키', '🧶 털실의 길이'] },
      { a: 'm', b: 'km', f: 1000, ctx: ['🐕 안내견과 훈련한 거리', '🏃 달린 거리', '🚲 자전거로 간 거리'] },
      { a: 'g', b: 'kg', f: 1000, ctx: ['💊 영양제의 무게', '🍎 사과의 무게', '🐹 햄스터 먹이의 무게'] },
      { a: 'mL', b: 'L', f: 1000, ctx: ['🥛 우유의 양', '🧃 주스의 양', '💧 계량컵에 든 물의 양'] },
      { a: 'mm', b: 'cm', f: 10, ctx: ['🔋 건전지의 길이', '🐜 개미의 몸길이', '✏️ 연필심의 길이'] }
    ];
    function makeUnit() {
      const u = pick(UNITS.filter((x) => (digitMode === 'two' ? x.f <= 100 : digitMode === 'three' ? x.f === 1000 : true)));
      const rev = Math.random() < 0.3;
      let small;
      if (u.f === 10) do { small = randInt(11, 199); } while (small % 10 === 0);
      else if (u.f === 100) do { small = randInt(3, 399); } while (small % 100 === 0);
      // 세 자리 수 차시에서는 814 m → 0.814 km처럼 언제나 소수 세 자리 수가 나오게 한다
      else do { small = randInt(5, 2999); } while (small % 1000 === 0 || (digitMode === 'three' && small % 10 === 0));
      const big = (small * 1000) / u.f;
      const ctx = pick(u.ctx);
      const one = fmt(1000 / u.f);
      if (!rev) {
        return {
          kind: 'keypad', key: `u${u.a}${small}`, ans: big, unit: u.b,
          lhs: `${numHtml(String(small))} <span class="unit-txt">${u.a}</span> <span class="op-sym">=</span>`,
          prompt: `${ctx}${iGa(ctx)} ${small} ${u.a}${hasBatchim(UNIT_KO[u.a]) ? '이에요' : '예요'}. 몇 ${u.b}일까요?`,
          speech: `${sinoInt(small)} ${UNIT_KO[u.a]}${eunNeun(UNIT_KO[u.a])} 몇 ${UNIT_KO[u.b]}일까요?`,
          explain: `1 ${u.a} = ${numHtml(one)} ${u.b}이니까 ${small} ${u.a} = ${N(big)} ${u.b}`,
          hint: `1 ${u.a} = ${numHtml(one)} ${u.b}${hasBatchim(UNIT_KO[u.b]) ? '이에요' : '예요'}. ${small} ${u.a}${eunNeun(UNIT_KO[u.a])} ${numHtml(one)}이 ${small}개!`,
          ansText: `${N(big)} ${u.b}`
        };
      }
      return {
        kind: 'keypad', key: `r${u.a}${small}`, ans: small * 1000, unit: u.a,
        lhs: `${N(big)} <span class="unit-txt">${u.b}</span> <span class="op-sym">=</span>`,
        prompt: `${ctx}${iGa(ctx)} ${fmt(big)} ${u.b}${hasBatchim(UNIT_KO[u.b]) ? '이에요' : '예요'}. 몇 ${u.a}일까요?`,
        speech: `${nKo(big)} ${UNIT_KO[u.b]}${eunNeun(UNIT_KO[u.b])} 몇 ${UNIT_KO[u.a]}일까요?`,
        explain: `1 ${u.b} = ${u.f} ${u.a}이니까 ${N(big)} ${u.b} = ${small} ${u.a}`,
        hint: `1 ${u.b} = ${u.f} ${u.a}${hasBatchim(UNIT_KO[u.a]) ? '이에요' : '예요'}. 1 ${u.a} = ${numHtml(one)} ${u.b}${eulReul(UNIT_KO[u.b])} 생각해요.`,
        ansText: `${small} ${u.a}`
      };
    }

    /* ---------- 7. 10배 · 1/10 자리 이동 ---------- */
    const TIMES_LABEL = { 1: '10배', 2: '100배', 3: '1000배', '-1': '1/10', '-2': '1/100', '-3': '1/1000' };
    const TIMES_KO = { 1: '십 배', 2: '백 배', 3: '천 배', '-1': '십분의 일', '-2': '백분의 일', '-3': '천분의 일' };
    function timesHtml(k) {
      return k > 0 ? TIMES_LABEL[k] : frHtml(1, Math.pow(10, -k));
    }
    function makeShift() {
      for (let tries = 0; tries < 200; tries += 1) {
        const k = pick([1, 1, 2, 3, -1, -1, -2, -3]);
        const len = randInt(2, 3);
        const digits = [randInt(1, 9)];
        for (let i = 1; i < len - 1; i += 1) digits.push(randInt(0, 9));
        digits.push(randInt(1, 9));
        const s = randInt(0, 6 - len);
        const e = s + len - 1;
        if (s - k < 0 || e - k > 5) continue;
        if (e < 3 && e - k < 3) continue;
        const base = digits.reduce((acc, d, i) => acc + d * Math.pow(10, 5 - (s + i)), 0);
        const result = k > 0 ? base * Math.pow(10, k) : base / Math.pow(10, -k);
        const unit = pick(['', '', 'cm', 'L', 'kg', '초']);
        const label = TIMES_KO[k];
        return {
          kind: 'shift', key: `s${base}${k}`, digits, s, k, base, result, unit,
          speech: `${nKo(base)}${unit ? ` ${UNIT_KO[unit]}` : ''}의 ${label}${eunNeun(label)} 얼마일까요? 숫자 카드를 옮겨 보세요.`,
          ansText: `${N(result)}${unit ? ` ${unit}` : ''}`
        };
      }
      return makeShift();
    }

    function makeTimes() {
      for (;;) {
        const k = pick([1, 2, 3, -1, -2, -3]);
        const base = pick([rndHund(20), rndTenth(99, 1), rndThou(9), randInt(11, 999) * 1000]);
        const result = k > 0 ? base * Math.pow(10, k) : base / Math.pow(10, -k);
        if (!Number.isInteger(result) || result < 1 || result >= 1000000) continue;
        const opposite = -k;
        const others = shuffle([1, 2, 3, -1, -2, -3].filter((v) => v !== k && v !== opposite)).slice(0, 2);
        const opts = shuffle([k, opposite, ...others]);
        const label = TIMES_KO[k];
        return {
          kind: 'choice', key: `x${base}${k}`, ans: String(k), base, k, result,
          choices: opts.map((v) => ({ v: String(v), html: timesHtml(v) })),
          prompt: `${N(base)}의 <b>□</b>${k > 0 ? '는' : '은'} ${N(result)}입니다.`,
          visual: `<div class="mid-num">${N(base)} <span class="op-sym">→</span> ${N(result)}</div>`,
          speech: `${nKo(base)}의 몇 배가 ${nKo(result)}일까요?`,
          explain: `${N(base)}의 ${timesHtml(k)}${k > 0 ? '는' : '은'} ${N(result)}! 수가 ${k > 0 ? '왼쪽' : '오른쪽'}으로 ${Math.abs(k)}자리 움직였어요.`,
          okSpeech: label
        };
      }
    }

    /* ---------- 8. 크기 비교 ---------- */
    function rdigits(p) {
      const ds = Array.from({ length: p }, () => randInt(0, 9));
      ds[p - 1] = randInt(1, 9);
      return ds;
    }
    function makeCompare() {
      const t = pick(['same', 'same', 'len', 'trap', 'trap', 'eq', 'whole']);
      const w = randInt(0, 9);
      let a;
      let b;
      if (t === 'same') {
        const p = pick([2, 3]);
        let da;
        let db;
        do {
          da = rdigits(p);
          db = rdigits(p);
          const pos = randInt(0, p - 1);
          for (let i = 0; i < pos; i += 1) db[i] = da[i];
        } while (da.join('') === db.join(''));
        a = `${w}.${da.join('')}`;
        b = `${w}.${db.join('')}`;
      } else if (t === 'len') {
        const da = rdigits(2);
        const db = rdigits(3);
        db[0] = da[0];
        if (Math.random() < 0.5) db[1] = da[1];
        a = `${w}.${da.join('')}`;
        b = `${w}.${db.join('')}`;
      } else if (t === 'trap') {
        if (Math.random() < 0.5) {
          const x = randInt(2, 9);
          const db = rdigits(2);
          db[0] = randInt(0, x - 1);
          a = `${w}.${x}`;
          b = `${w}.${db.join('')}`;
        } else {
          const da = rdigits(2);
          da[0] = randInt(2, 9);
          const db = rdigits(3);
          db[0] = randInt(0, da[0] - 1);
          a = `${w}.${da.join('')}`;
          b = `${w}.${db.join('')}`;
        }
      } else if (t === 'eq') {
        const da = rdigits(pick([1, 2]));
        a = `${w}.${da.join('')}`;
        b = `${a}0`;
      } else {
        const wb = w === 9 ? 8 : w + pick([1, 1, 2]);
        a = `${w}.${rdigits(pick([2, 3])).join('')}`;
        b = `${wb}.${rdigits(pick([1, 2])).join('')}`;
      }
      if (Math.random() < 0.5) [a, b] = [b, a];
      const va = parseNum(a);
      const vb = parseNum(b);
      const ans = va > vb ? '>' : va < vb ? '<' : '=';
      let key = null;
      for (let p = 3; p >= -3; p -= 1) {
        if (digitAt(va, p) !== digitAt(vb, p)) { key = p; break; }
      }
      const signKo = { '>': '왼쪽 수가 더 커요', '<': '오른쪽 수가 더 커요', '=': '두 수는 같아요' };
      const explain = ans === '='
        ? `${numHtml(a)}${gwaWa(decKo(a))} ${numHtml(b)}는 같은 수예요. 소수 끝자리의 0은 생략할 수 있어요.`
        : `${PLACE_NAME[key]}에서 ${digitAt(va, key)}${gwaWa(KD[digitAt(va, key)])} ${digitAt(vb, key)}${eulReul(KD[digitAt(vb, key)])} 비교하면 ${signKo[ans]}.`;
      return {
        kind: 'compare', key: `m${a}${b}`, a, b, ans, place: key,
        choices: ['>', '=', '<'].map((v) => ({ v, html: v })),
        speech: `${decKo(a)}${gwaWa(decKo(a))} ${decKo(b)}의 크기를 비교해 보세요.`,
        explain,
        okSpeech: `${decKo(a)} ${ans === '>' ? '는 더 큽니다' : ans === '<' ? '는 더 작습니다' : '는 같습니다'}`,
        ansText: `${numHtml(a)} ${ans} ${numHtml(b)}`
      };
    }

    /* ---------- 9. 크기 순서대로 ---------- */
    function makeOrder() {
      const desc = Math.random() < 0.65;
      for (;;) {
        const w = randInt(0, 8);
        const base = w * 1000 + randInt(150, 850);
        const vals = new Set();
        let guard = 0;
        while (vals.size < 4 && guard < 80) {
          guard += 1;
          let v = base + randInt(-140, 140);
          const r = Math.random();
          if (r < 0.3) v = Math.round(v / 100) * 100;
          else if (r < 0.65) v = Math.round(v / 10) * 10;
          if (v % 1000 === 0 || v <= 0) continue;
          vals.add(v);
        }
        if (vals.size < 4) continue;
        const arr = [...vals];
        if (new Set(arr.map(decPlaces)).size < 2) continue;
        return { kind: 'order', key: `r${arr.join()}`, items: shuffle(arr), desc, speech: `네 소수를 ${desc ? '큰 수부터' : '작은 수부터'} 차례대로 눌러 보세요.` };
      }
    }

    /* ---------- 10. 덧셈 · 뺄셈 공통 ---------- */
    function hasRegroup(a, b, op) {
      for (let p = -3; p <= 3; p += 1) {
        const x = digitAt(a, p);
        const y = digitAt(b, p);
        if (op === '+' && x + y >= 10) return true;
        if (op === '-' && x < y) return true;
      }
      return false;
    }
    // type: '1' 소수 한 자리 수끼리, '2' 소수 두 자리 수끼리, 'm' 자릿수가 다른 수
    function genPair(op, type) {
      for (;;) {
        const maxW = pick([0, 1, 2, 3, 5, 9]);
        const small = () => pick([0, 0, 1, 2, 5]);
        let a;
        let b;
        if (type === '1') { a = rndTenth(maxW); b = rndTenth(small()); }
        else if (type === '2') { a = rndHund(maxW); b = rndHund(small()); }
        else if (Math.random() < 0.5) { a = rndTenth(maxW); b = rndHund(small()); }
        else { a = rndHund(maxW); b = rndTenth(small()); }
        if (op === '-') {
          if (a === b) continue;
          if (a < b) [a, b] = [b, a];
        }
        const r = op === '+' ? a + b : a - b;
        if (r <= 0 || r >= 20000) continue;
        if (!hasRegroup(a, b, op) && Math.random() < 0.6) continue;
        return { a, b, r };
      }
    }
    function calcType() {
      if (modeOpt === '1' || modeOpt === '2' || modeOpt === 'm') return modeOpt;
      return pick(['1', '2', 'm', 'm']);
    }

    function makeGAdd() {
      const one = modeOpt === '1' ? true : modeOpt === '2' ? false : Math.random() < 0.45;
      for (;;) {
        let a;
        let b;
        if (one) { a = randInt(1, 15) * 10; b = randInt(1, 9) * 10; }
        else { a = randInt(5, 150); b = randInt(5, 99); if (a % 10 === 0 && b % 10 === 0) continue; }
        if (a % 100 === 0 || a + b > 200) continue;
        return {
          kind: 'gadd', key: `ga${a}${b}`, a, b, unit: one ? 10 : 1, grids: a + b > 100 ? 2 : 1, ans: (a + b) * 10,
          speech: `${nKo(a * 10)} 더하기 ${nKo(b * 10)}${eunNeun(nKo(b * 10))} 얼마일까요? 더하는 수만큼 이어서 색칠해 보세요.`,
          ansText: N((a + b) * 10)
        };
      }
    }
    function makeGSub() {
      const one = modeOpt === '1' ? true : modeOpt === '2' ? false : Math.random() < 0.45;
      for (;;) {
        let a;
        let b;
        if (one) { a = randInt(2, 19) * 10; b = randInt(1, 9) * 10; }
        else { a = randInt(20, 199); b = randInt(5, 99); if (a % 10 === 0 && b % 10 === 0) continue; }
        if (a % 100 === 0 || b >= a) continue;
        return {
          kind: 'gsub', key: `gs${a}${b}`, a, b, unit: one ? 10 : 1, grids: a > 100 ? 2 : 1, ans: (a - b) * 10,
          speech: `${nKo(a * 10)} 빼기 ${nKo(b * 10)}${eunNeun(nKo(b * 10))} 얼마일까요? 빼는 수만큼 ✕표 해 보세요.`,
          ansText: N((a - b) * 10)
        };
      }
    }

    function makeVcalc(op, type) {
      const { a, b, r } = genPair(op, type || calcType());
      const sa = fmt(a);
      const sb = fmt(b);
      const sr = fmt(r);
      return {
        kind: 'vcalc', key: `v${sa}${op}${sb}`, op, a: sa, b: sb, r: sr, rn: r,
        speech: `${decKo(sa)} ${op === '+' ? '더하기' : '빼기'} ${decKo(sb)}${eulReul(decKo(sb))} 세로로 계산해 보세요.`,
        ansText: numHtml(sr)
      };
    }

    function exprQ(op, type) {
      const { a, b, r } = genPair(op, type || pick(['1', '2', 'm']));
      return {
        kind: 'keypad', key: `e${a}${op}${b}`, ans: r, unit: '', big: true,
        lhs: `${N(a)} <span class="op-sym">${OPS[op]}</span> ${N(b)} <span class="op-sym">=</span>`,
        speech: `${nKo(a)} ${op === '+' ? '더하기' : '빼기'} ${nKo(b)}${eunNeun(nKo(b))} 얼마일까요?`,
        explain: `${N(a)} ${OPS[op]} ${N(b)} = ${N(r)}`,
        hint: op === '+' ? '소수점을 맞추고 같은 자리끼리 더해요. 받아올림도 잊지 마세요!' : '소수점을 맞추고 같은 자리끼리 빼요. 모자라면 받아내림!',
        ansText: N(r)
      };
    }

    /* ---------- 11. 틀린 계산 찾기 ---------- */
    function placeDot(intVal, dm) {
      const s = String(intVal).padStart(dm + 1, '0');
      return dm ? `${s.slice(0, s.length - dm)}.${s.slice(s.length - dm)}` : s;
    }
    function digitwise(a, b, dm, fn) {
      let v = 0;
      for (let p = 3; p >= -dm; p -= 1) v = v * 10 + fn(digitAt(a, p), digitAt(b, p));
      return placeDot(v, dm);
    }
    const FIX_REASON = {
      align: '소수점을 맞추지 않고 끝자리를 맞춰서 계산했어요.',
      carry: '받아올림한 수를 윗자리에 더하지 않았어요.',
      borrow: '받아내림을 하지 않고 큰 수에서 작은 수를 뺐어요.',
      dot: '계산은 맞는데 답의 소수점 위치가 틀렸어요.'
    };
    function makeFix(forceOp) {
      for (;;) {
        const op = forceOp || pick(['+', '-']);
        const { a, b, r } = genPair(op, pick(['1', '2', 'm', 'm']));
        const sa = fmt(a);
        const sb = fmt(b);
        const sr = fmt(r);
        const decA = decPlaces(a);
        const decB = decPlaces(b);
        const dm = Math.max(decA, decB);
        const errs = ['dot'];
        if (decA !== decB) errs.push('align', 'align');
        if (hasRegroup(a, b, op)) errs.push(op === '+' ? 'carry' : 'borrow', op === '+' ? 'carry' : 'borrow');
        const err = Math.random() < 0.35 ? 'ok' : pick(errs);
        let shown = sr;
        let layout = 'dot';
        if (err === 'align') {
          const A = Number(sa.replace('.', ''));
          const B = Number(sb.replace('.', ''));
          const R = op === '+' ? A + B : A - B;
          if (R <= 0) continue;
          shown = placeDot(R, dm);
          layout = 'right';
        } else if (err === 'carry') {
          shown = digitwise(a, b, dm, (x, y) => (x + y) % 10);
        } else if (err === 'borrow') {
          shown = digitwise(a, b, dm, (x, y) => Math.abs(x - y));
        } else if (err === 'dot') {
          const digits = Number(fmtP(r, dm).replace('.', ''));
          const nd = dm === 1 ? 2 : pick([dm - 1, dm + 1]);
          shown = placeDot(digits, nd);
        }
        shown = shown.replace(/^0+(?=\d)/, '');
        if (err !== 'ok' && parseNum(shown) === r) continue;
        const reasons = shuffle(['align', op === '+' ? 'carry' : 'borrow', 'dot']);
        return {
          kind: 'fix', key: `x${sa}${op}${sb}${err}`, op, a: sa, b: sb, correct: sr, shown, err, layout, reasons,
          speech: '이 계산이 맞았는지 살펴보세요. 틀렸다면 이유도 찾아보세요.'
        };
      }
    }

    /* ---------- 12. 생활 속 문제 ---------- */
    const STORIES = [
      { op: '+', em: '🐱', unit: 'kg', w: [0, 1], t: (a, b) => `동물 보건사가 고양이들에게 사료를 오전에 ${a} kg, 오후에 ${b} kg 주었어요. 오전과 오후에 준 사료는 모두 몇 kg일까요?` },

      { op: '-', em: '🩺', unit: 'L', w: [1, 3], t: (a, b) => `수의사가 소독약 ${a} L 중에서 ${b} L를 사용했어요. 남은 소독약은 몇 L일까요?` },
      { op: '-', em: '🦅', unit: 'm', w: [0, 2], t: (a, b) => `날개를 다친 참수리가 어제는 ${b} m, 오늘은 ${a} m를 날아올랐어요. 오늘은 어제보다 몇 m 더 날아올랐을까요?` },
      { op: '+', em: '🐿️', unit: 'kg', w: [0, 0], t: (a, b) => `지난달 ${a} kg이었던 다람쥐의 몸무게가 이번 달에 ${b} kg만큼 더 늘었어요. 다람쥐의 몸무게는 몇 kg일까요?` },
      { op: '-', em: '🐻', unit: 'kg', w: [128, 140], t: (a, b) => `곰의 몸무게가 지난달은 ${a} kg이었고, 이번 달은 ${b} kg이에요. 지난달보다 몇 kg 줄었을까요?` },
      { op: '+', em: '🏦', unit: 'km', w: [0, 3], t: (a, b) => `집에서 서점까지는 ${a} km, 서점에서 은행까지는 ${b} km예요. 집에서 서점을 지나 은행까지 간 거리는 몇 km일까요?` },
      { op: '-', em: '🍈', unit: 'kg', w: [1, 5], t: (a, b) => `참외가 들어 있는 바구니의 무게는 ${a} kg이에요. 빈 바구니의 무게가 ${b} kg이라면 참외의 무게는 몇 kg일까요?` },
      { op: '+', em: '🎒', unit: 'kg', w: [1, 3], t: (a, b) => `채원이의 가방 무게는 ${a} kg이고, 은비의 가방은 채원이 가방보다 ${b} kg 더 무거워요. 은비의 가방 무게는 몇 kg일까요?` },
      { op: '-', em: '🏃', unit: '초', w: [9, 12], t: (a, b) => `50 m 달리기에서 서준이는 ${b}초, 도윤이는 ${a}초를 기록했어요. 서준이는 도윤이보다 몇 초 더 빨리 달렸을까요?` },
      { op: '+', em: '📦', unit: 'kg', w: [1, 6], t: (a, b) => `재활용 종이를 모았더니 신문지는 ${a} kg, 종이 상자는 ${b} kg이었어요. 모은 종이는 모두 몇 kg일까요?` },
      { op: '-', em: '🎀', unit: 'm', w: [2, 5], t: (a, b) => `리본 ${a} m 중에서 선물 포장에 ${b} m를 사용했어요. 남은 리본은 몇 m일까요?` },
      { op: '+', em: '🌳', unit: 'm', w: [1, 3], t: (a, b) => `작년에 ${a} m였던 나무가 올해 ${b} m 더 자랐어요. 올해 나무의 키는 몇 m일까요?` }
    ];
    function makeWord() {
      const st = pick(STORIES);
      for (;;) {
        const a = (Math.random() < 0.5 ? rndTenth : rndHund)(st.w[1], st.w[0]);
        let b;
        if (st.op === '+') b = (Math.random() < 0.5 ? rndTenth : rndHund)(2);
        else {
          const aw = Math.floor(a / 1000);
          b = (Math.random() < 0.5 ? rndTenth : rndHund)(aw, Math.max(0, aw - 3));
        }
        if (st.op === '-' && b >= a) continue;
        const r = st.op === '+' ? a + b : a - b;
        // 숫자와 단위가 줄바꿈으로 떨어지지 않게 한다
        const text = st.t(numHtml(fmt(a)), numHtml(fmt(b))).replace(/<\/span> (kg|km|mL|L|m|초)/g, '</span>&nbsp;$1');
        const say = st.t(nKo(a), nKo(b));
        // 빼기 식은 언제나 큰 수에서 작은 수를 빼는 모양으로 보여 준다
        const big = Math.max(a, b);
        const small = Math.min(a, b);
        const opts = shuffle(['+', '-']).map((op) => ({
          v: op,
          html: op === '+' ? `${N(a)} <span class="op-sym">+</span> ${N(b)}` : `${N(big)} <span class="op-sym">−</span> ${N(small)}`
        }));
        return {
          kind: 'word', key: `w${a}${b}`, op: st.op, a, b, r, em: st.em, unit: st.unit, text, choices: opts,
          speech: say,
          ansText: `${N(r)} ${st.unit}`
        };
      }
    }

    /* ---------- 13. 빠른 계산 ---------- */
    function makeSpeed() {
      const t = modeOpt === 'all' ? pick(['a1', 'a2', 's1', 's2', 'mx']) : modeOpt;
      const map = { a1: ['+', '1'], a2: ['+', '2'], s1: ['-', '1'], s2: ['-', '2'], mx: [pick(['+', '-']), 'm'] };
      const [op, type] = map[t];
      return exprQ(op, type);
    }

    /* ---------- 14. 단원 마무리 평가 ---------- */
    function buildExamQueue() {
      const S = ['소수 두·세 자리 수', '소수 사이의 관계', '크기 비교', '소수의 덧셈', '소수의 뺄셈', '생활 속 문제'];
      const plan = [
        [makeGrid, 0], [makePlace, 0], [makePlace, 0], [makeRead, 0], [makeLine, 0], [makeUnit, 0],
        [makeTimes, 1], [makeShift, 1],
        [makeCompare, 2], [makeCompare, 2],
        [() => exprQ('+'), 3], [() => exprQ('+'), 3], [() => makeVcalc('+', 'm'), 3], [() => makeVcalc('+', '2'), 3],
        [() => exprQ('-'), 4], [() => exprQ('-'), 4], [() => makeVcalc('-', 'm'), 4], [() => makeVcalc('-', '1'), 4],
        [makeWord, 5], [makeWord, 5]
      ];
      return plan.map(([mk, sec]) => ({ ...mk(), sec: S[sec] }));
    }
    function examQuestionFor(idx) {
      const queue = examQueues[idx];
      if (!queue) return null;
      return queue[examIndex[idx]] || null;
    }

    const MAKERS = {
      grid: makeGrid, paint: makePaint, place: makePlace, read: makeRead, line: makeLine, unit: makeUnit,

    function makeQuestion(prevKey, prevMix) {
      if (mode === 'mix') return makeMixQuestion(prevKey, prevMix);
      let q = MAKERS[mode]();
      for (let i = 0; i < 6 && q.key && q.key === prevKey; i += 1) q = MAKERS[mode]();

    /* ---------- 15. 차시별 문제 모음 ---------- */

    // 교과서 차시 순서 (stage: 게임 목록의 단계 번호)

    let mixPool = [];
    let mixTall = false;
    function makeMixQuestion(prevKey, prevMix) {
      // 유형이 여러 개면 바로 앞과 다른 유형이 나오게 한다
      const pool = mixPool.length > 1 ? mixPool.filter((id) => id !== prevMix) : mixPool;

    /* =========================================================

    function mixLessons() { return mixScope === 'all' ? LESSONS : LESSONS.filter((l) => l.stage === mixScope); }
    function mixChosen() { return mixLessons().flatMap((l) => l.items).filter((id) => mixSel.has(id)); }
    function mixCap(ids) { return ids.reduce((m, id) => Math.min(m, MIX_ITEMS[id].cap || 6), 6); }

      const chosen = mixChosen();
      const cap = mixCap(chosen);
      const st = mixScope === 'all' ? null : STAGES.find((x) => x.no === mixScope);
      const over = playerCount > cap;
      const limiting = [...new Set(chosen.filter((id) => (MIX_ITEMS[id].cap || 6) === cap).map((id) => MIX_ITEMS[id].label))];
      const capNote = chosen.length && cap < 6
        ? `<span class="mix-cap${over ? ' warn' : ''}">${limiting.join(', ')} 게임으로 인해 최대 ${cap}명까지만 가능합니다${over ? ` (지금 ${playerCount}명)` : ''}</span>`

      box.innerHTML = `
