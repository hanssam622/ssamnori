      const sel = bellCfg[bellSelKey()];
      const n = exam ? EXAM_TOTAL : sel.length;
      const seg = (key, list) => `<div class="seg">${list.map(([v, t]) => `<button type="button" class="${String(bellCfg[key]) === String(v).replace(/'/g, '') ? 'on' : ''}" onclick="bellSet('${key}', ${v})">${t}</button>`).join('')}</div>`;
      box.innerHTML = `
        <div class="result-card mix-card bell-card">
          <div class="concept-head">
            <div class="kid-art"></div>
            <div>
              <h2>${exam ? '📝 다각형맨 단원 평가' : race ? '⏱ 다각형맨 시간 대결' : '🔔 다각형맨 골든벨'}</h2>
              <p>${exam
                ? '단원 마무리 평가 20문제를 반 전체 태블릿에 한꺼번에 보내요. 칠판에서 문제를 미리 보고 바꿀 수 있고, 시간이 끝나면 학생별·문항별 결과가 선생님 화면에 모여요.'
                : race
                ? '반 친구들이 각자 태블릿으로 제한 시간 안에 최대한 많은 문제를 풀어요. 처음에 맞히면 2점, 다시 풀어 맞히면 1점! 칠판에 순위가 바로바로 보여요.'
                : '반 친구들이 각자 태블릿으로 같은 문제를 한꺼번에 풀어요. 맞히면 500~1000점, 빨리 맞힐수록 점수가 높아요.'}</p>
            </div>
          </div>
          <div class="bell-opts">
            <div class="setting-row"><span class="setting-label">게임 방식</span>${seg('kind', [["'bell'", '🔔 골든벨 · 같은 문제 동시에'], ["'race'", '⏱ 시간 대결 · 많이 풀기'], ["'exam'", '📝 단원 평가 · 결과 받기']])}</div>
            ${exam ? `
            <div class="setting-row"><span class="setting-label">제한 시간</span>${seg('examMin', EXAM_MINS.map((v) => [v, v ? `${v}분` : '없음']))}</div>
            <div class="setting-row"><span class="setting-label">끝나면 태블릿에</span>${seg('examShow', [[true, '점수 보여 주기'], [false, '점수 숨기기']])}</div>` : race ? `
            <div class="setting-row"><span class="setting-label">제한 시간</span>${seg('race', BELL_RACES.map((v) => [v, bellTimeText(v)]))}</div>` : `
            <div class="setting-row"><span class="setting-label">문제 수</span>${seg('count', BELL_COUNTS.map((v) => [v, `${v}문제`]))}</div>
            <div class="setting-row"><span class="setting-label">한 문제 시간</span>${seg('seconds', BELL_SECONDS.map((v) => [v, `${v}초`]))}</div>
            <div class="setting-row"><span class="setting-label">정답 공개 뒤</span>${seg('auto', [[0, '선생님이 넘기기'], [5, '5초 뒤 다음'], [10, '10초 뒤 다음']])}</div>`}
          </div>
          ${exam ? `
          <section class="exam-note">
            <p>📋 <b>문제 구성</b> · ${EXAM_SECS.map((t) => `${t} ${EXAM_PLAN.filter(([, k]) => EXAM_SECS[k] === t).length}`).join(' · ')}문제 (한 문제 ${EXAM_POINT}점)</p>
            <p>🔢 학생은 이름 대신 <b>번호</b>로 들어와요. 문제마다 한 번만 답하고, 푸는 동안에는 맞았는지 보여 주지 않아요.</p>
            <p>🔒 이름은 서버로 보내지 않아요. 결과는 이 화면에만 모이고 창을 닫으면 사라지니, 끝나면 <b>CSV로 저장</b>하거나 인쇄해 두세요.</p>
          </section>` : bellLessons().map((l) => {
            const full = l.items.every((id) => sel.includes(id));
            return `
              <section class="mix-lesson">
                <div class="mix-lesson-head">
                  <span class="mix-page">${l.page}</span>
                  <h3>${l.title}</h3>
                  <button class="mix-all${full ? ' on' : ''}" type="button" onclick="bellToggleLesson('${l.id}')">${full ? '모두 해제' : '모두 선택'}</button>
                </div>
                <div class="mix-items">${l.items.map((id) => {
                  const on = sel.includes(id);
                  return `
                  <button class="mix-chip${on ? ' on' : ''}" type="button" aria-pressed="${on}" onclick="bellToggleItem('${id}')">
                    <span class="ck">${CHECK}</span><span class="mi">${ICONS[MIX_ITEMS[id].icon]}</span>${bellItemLabel(id)}
                  </button>`;
                }).join('')}
                </div>
              </section>`;
          }).join('')}
          <div class="mix-foot">
            <div class="mix-sum">
              <span>${exam ? `단원 전체 <b>${n}</b>문제` : `<b>${n}</b>가지 유형을 골랐어요`}</span>
              <span class="mix-cap">학생은 태블릿·스마트폰으로 QR을 찍어 ${exam ? '번호로 ' : ''}들어와요 (최대 40명)</span>
              <span class="bell-err" id="bell-setup-err"></span>
              <button class="bell-pad-link" type="button" onclick="hideBellSetup(); openBellPad()">📱 학생 태블릿으로 참여 →</button>
            </div>
            <div class="mix-btns">
              <button class="ghost-btn" type="button" onclick="hideBellSetup()">닫기</button>
              <button class="btn-main" id="bell-setup-go" type="button" onclick="bellSetupGo()"${n ? '' : ' disabled'}>${BH.code ? '바꾸기' : '방 만들기 →'}</button>
            </div>
          </div>
        </div>`;
      box.firstElementChild.scrollTop = prevScroll;
    }
    function bellSet(key, v) {
      bellCfg[key] = v;
      saveBellCfg();
      renderBellSetup();
    }
    function bellToggleItem(id) {
      const key = bellSelKey();
      bellCfg[key] = bellCfg[key].includes(id) ? bellCfg[key].filter((x) => x !== id) : [...bellCfg[key], id];
      saveBellCfg();
      renderBellSetup();
    }
    function bellToggleLesson(lid) {
      const key = bellSelKey();
      const l = bellLessons().find((x) => x.id === lid);
      const full = l.items.every((id) => bellCfg[key].includes(id));
      bellCfg[key] = full ? bellCfg[key].filter((id) => !l.items.includes(id)) : [...new Set([...bellCfg[key], ...l.items])];
      saveBellCfg();
      renderBellSetup();
    }
    async function bellSetupGo() {
      if (bellCfg.kind !== 'exam' && !bellCfg[bellSelKey()].length) return;
      if (BH.code) { hideBellSetup(); bellRender(); bellSend(); return; }
      const btn = document.getElementById('bell-setup-go');
      const err = document.getElementById('bell-setup-err');
      btn.disabled = true;
      btn.textContent = '방 만드는 중…';
      err.textContent = '';
      try {
        const res = await fetch(`${BELL_SERVER}/api/rooms`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.code) throw new Error(data.error);
        hideBellSetup();
        bellHostStart(data.code, data.hostKey);
      } catch (e) {
        err.textContent = navigator.onLine === false
          ? '인터넷에 연결되어 있지 않아요. 골든벨은 인터넷이 있어야 해요.'
          : '방을 만들지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
        btn.disabled = false;
        btn.textContent = '방 만들기 →';
      }
    }

    /* ---------- 칠판(선생님) ---------- */
    const BH = {
      code: '', key: '', sock: null, online: false, roster: [], game: 0,
      qs: [], index: -1, stage: 'lobby', openedAt: 0, seconds: 20, asked: 0,
      // 시간 대결: 게임 방식, 제한 시간(초), 시작·끝 시각
      kind: 'bell', raceSec: 0, raceStart: 0, raceEnd: 0, raceItems: [],
      // 단원 평가: 칠판에서 정한 20문제, 제한 시간(초, 0은 무제한), 끝 시각, 학생별 답(맞음·틀림), 결과표를 펼쳤는지
      examQs: [], examSec: 0, examEnd: 0, examRes: {}, examOpen: false,
      answers: {}, scores: {}, tick: null, autoTimer: null, revealTimer: null, autoLeft: 0
    };
    const bellRound = () => `${BH.code}-${BH.game}-${BH.index}`;
    const bellOnline = () => BH.roster.filter((p) => p.online);

    function bellHostStart(code, key) {
      Object.assign(BH, { code, key, online: false, roster: [], game: 0, qs: [], index: -1, stage: 'lobby', answers: {}, scores: {} });
      BH.sock = new BellSocket(() => `${bellWs()}/api/rooms/${code}/ws?role=host&key=${key}`, {
        status: (st) => { BH.online = st === 'open'; bellRoomChip(); },
        message: bellHostMessage
      });
      showScreen('bell-screen');
      bellRender();
    }
    function bellHostMessage(m) {
      if (m.t === 'ready' || m.t === 'players') bellRoster(m.players || [], m.t === 'ready');
      else if (m.t === 'input' && m.data && m.data.kind === 'race') bellRaceInput(m.from, m.data);
      else if (m.t === 'input' && m.data && m.data.kind === 'exam') bellExamInput(m.from, m.data);
      else if (m.t === 'input') bellInput(m.from, m.data);
      else if (m.t === 'error' && (m.code === 'closed' || m.code === 'not-found')) {
        BH.online = false;
        bellRoomChip();
        alert('골든벨 방이 닫혔어요. 끝내기를 누른 뒤 새로 만들어 주세요.');
      } else if (m.t === 'error' && m.message) console.warn('골든벨:', m.message);
    }
    function bellRoster(list, all) {
      const before = new Set(bellOnline().map((p) => p.id));
      BH.roster = list;
      list.forEach((p) => { if (BH.scores[p.id]) Object.assign(BH.scores[p.id], { name: p.name, avatar: p.avatar }); });
      // 칠판이 다시 붙었거나 학생이 새로 들어오면 지금 화면을 보내 준다(방이 잠들었다 깨면 서버는 화면을 잊는다).
      const fresh = all ? list.map((p) => p.id) : bellOnline().filter((p) => !before.has(p.id)).map((p) => p.id);
      if (fresh.length) bellSend(fresh);
      if (BH.stage === 'lobby') bellRender();
      else bellRefreshLive();
    }
    function bellNewScore(p) {
      return { id: p.id, name: p.name, avatar: p.avatar, points: 0, correct: 0, gained: 0 };
    }

    // 학생마다 지금 보여 줄 태블릿 화면
    function bellViewFor(id) {
      if (BH.stage === 'lobby') {
        if (bellCfg.kind === 'race') return { screen: 'wait', emoji: '⏱', title: '곧 시간 대결을 시작해요', message: `${bellTimeText(bellCfg.race)} 안에 최대한 많이 맞혀요` };
        if (bellCfg.kind === 'exam') return { screen: 'wait', emoji: '📝', title: '곧 단원 평가를 시작해요', message: `${EXAM_TOTAL}문제 · ${bellCfg.examMin ? `제한 시간 ${bellCfg.examMin}분` : '시간 제한 없음'} · 문제마다 한 번만 답할 수 있어요` };
        return { screen: 'wait', emoji: '🔔', title: '곧 골든벨을 시작해요', message: `모두 ${bellCfg.count}문제 · 한 문제 ${bellCfg.seconds}초 · 빨리 맞힐수록 점수가 높아요` };
      }
      if (BH.stage === 'race') {
        const s = BH.scores[id];
        const now = Date.now();
        return {
          screen: 'race', round: bellRound(), items: BH.raceItems, total: BH.raceSec,
          wait: Math.max(0, BH.raceStart - now), seconds: Math.max(0, (BH.raceEnd - Math.max(now, BH.raceStart)) / 1000),
          // 태블릿을 새로 불러와도 이어서 하도록 지금까지의 점수를 함께 보낸다
          score: s ? s.points : 0, correct: s ? s.correct : 0
        };
      }
      const q = BH.qs[BH.index];
      const a = BH.answers[id];
      const s = BH.scores[id];
      if (BH.stage === 'question') {
        if (a) return { screen: 'wait', emoji: '✋', title: '답을 냈어요!', message: '정답 공개를 기다려요', round: bellRound() };
        const left = Math.max(1, (BH.openedAt + BH.seconds * 1000 - Date.now()) / 1000);
        return {
          // elapsed: 문제를 낸 뒤 지난 시간. 중간에 다시 들어온 태블릿도 처음부터 잰 시간으로 점수를 받는다.
          screen: 'q', round: bellRound(), no: BH.index + 1, total: BH.qs.length, seconds: left, elapsed: Date.now() - BH.openedAt,
          q: { input: q.input, prompt: q.prompt, visual: q.visual, choices: q.choices, cols: q.cols, txt: q.txt, sign: q.sign, lhs: q.lhs, unit: q.unit, big: q.big }
        };
      }
      if (BH.stage === 'reveal') {
        if (!s) return { screen: 'wait', emoji: '🔔', title: '다음 문제부터 함께 풀어요', message: '칠판을 봐요' };
        const standing = `지금 ${bellRankOf(id)}등 · ${s.points.toLocaleString()}점`;
        if (a && a.ok) return { screen: 'result', good: true, title: `정답! +${a.gained}점`, message: standing };
        return { screen: 'result', good: false, title: a ? '아쉬워요' : '시간이 다 됐어요', answer: q.ansHtml, message: standing };
      }
      if (BH.kind === 'exam') return bellExamEndView(id);
      const ranked = bellRanking();
      const mine = ranked.find((r) => r.s.id === id);
      if (!mine) return { screen: 'wait', emoji: '🏆', title: '골든벨 끝!', message: '칠판을 봐요' };
      return { screen: 'end', kind: BH.kind, rank: mine.rank, count: ranked.length, points: mine.s.points, correct: mine.s.correct, asked: BH.asked };
    }
    // 화면을 보낸다. 문제는 모두 같으니 한 번에, 결과는 학생마다 따로.
    function bellSend(ids) {
      if (!BH.sock) return;
      const targets = ids || BH.roster.map((p) => p.id);
      if (!targets.length) return;
      // 시간 대결에 늦게 들어온 학생도 순위표에 0점으로 올린다
      if (BH.stage === 'race') targets.forEach((id) => {
        const p = BH.roster.find((x) => x.id === id);
        if (p && p.online && !BH.scores[id]) BH.scores[id] = bellNewScore(p);
      });
      // 평가 문제는 모두 같으니 한 번에 보낸다(학생마다 따로 보내면 말이 너무 커진다)
      if (BH.stage === 'exam') {
        // 늦게 들어온 학생도 진행표에 0문제로 올린다
        targets.forEach((id) => { if (BH.roster.some((p) => p.id === id && p.online)) bellExamRec(id); });
        BH.sock.send({ t: 'view', to: targets, view: bellExamView() });
        return;
      }
      if (BH.stage === 'question') {
        const fresh = targets.filter((id) => !BH.answers[id]);
        if (fresh.length) BH.sock.send({ t: 'view', to: fresh, view: bellViewFor(fresh[0]) });
        const done = targets.filter((id) => BH.answers[id]);
        if (done.length) BH.sock.send({ t: 'view', to: done, view: bellViewFor(done[0]) });
        return;
      }
      const views = {};
      targets.forEach((id) => { views[id] = bellViewFor(id); });
      BH.sock.send({ t: 'views', views });
    }

    function bellStart() {
      if (!bellOnline().length) return;
      BH.kind = bellCfg.kind;
      if (BH.kind === 'race') { bellRaceStart(); return; }
      if (BH.kind === 'exam') { bellExamStart(); return; }
      BH.qs = bellMakeSet();
      if (!BH.qs.length) return;
      BH.scores = {};
      BH.asked = 0;
      bellOpen(0);
    }
    function bellOpen(i) {
      bellStopTimers();
      Object.assign(BH, { index: i, stage: 'question', openedAt: Date.now(), seconds: bellCfg.seconds, answers: {} });
      bellOnline().forEach((p) => { if (!BH.scores[p.id]) BH.scores[p.id] = bellNewScore(p); });
      Object.values(BH.scores).forEach((s) => { s.gained = 0; });
      bellSend();
      bellRender();
      blip('tick');
      speak(BH.qs[i].speech);
      BH.tick = setInterval(bellTick, 200);
      bellTick();
    }
    function bellTick() {
      const left = BH.openedAt + BH.seconds * 1000 - Date.now();
      bellTimerUi(Math.ceil(Math.max(0, left) / 1000), BH.seconds);
      if (left <= -BELL_GRACE_MS) bellReveal();
    }
    function bellMore() {
      if (BH.stage !== 'question') return;
      BH.seconds += BELL_EXTEND;
      bellSend(BH.roster.map((p) => p.id).filter((id) => !BH.answers[id]));
      bellTick();
    }
    function bellInput(from, data) {
      if (!data || data.kind !== 'answer' || BH.stage !== 'question' || data.round !== bellRound() || BH.answers[from]) return;
      const p = BH.roster.find((x) => x.id === from);
      if (!p) return;
      const q = BH.qs[BH.index];
      let answer;
      if (q.input === 'choice') {
        const c = Number(data.choice);
        if (!Number.isInteger(c) || c < 0 || c >= q.choices.length) return;
        answer = { choice: c, ok: c === q.ans };
      } else {
        const v = String(data.value || '');
        if (!/^\d{1,7}(\.\d{1,3})?$/.test(v)) return;
        answer = { value: v, ok: parseNum(v) === q.ans };
      }
      // 태블릿이 잰 시간을 쓴다(와이파이가 느린 태블릿이 손해 보지 않게). 다만 칠판이 받은 때보다 길게는 세지 않는다.
      const arrived = Math.max(0, Date.now() - BH.openedAt);
      answer.ms = Number.isFinite(data.ms) ? Math.min(arrived, Math.max(0, data.ms)) : arrived;
      BH.answers[from] = answer;
      if (!BH.scores[from]) BH.scores[from] = bellNewScore(p);
      bellSend([from]);
      bellRefreshLive();
    }
    // 들어와 있는 학생이 모두 답하면 잠깐 뒤에 정답을 공개한다.
    function bellCheckAll() {
      if (BH.stage !== 'question') return;
      const answered = Object.keys(BH.answers).length;
      const total = new Set([...bellOnline().map((p) => p.id), ...Object.keys(BH.answers)]).size;
      clearTimeout(BH.revealTimer);
      if (total > 0 && answered >= total) BH.revealTimer = setTimeout(bellReveal, 700);
    }
    function bellReveal() {
      if (BH.stage !== 'question') return;
      bellStopTimers();
      Object.entries(BH.answers).forEach(([id, a]) => {
        const s = BH.scores[id];
        a.gained = a.ok ? bellPoints(a.ms, BH.seconds) : 0;
        if (!s) return;
        s.gained = a.gained;
        s.points += a.gained;
        if (a.ok) s.correct += 1;
      });
      BH.stage = 'reveal';
      bellSend();
      bellRender();
      blip(Object.values(BH.answers).some((a) => a.ok) ? 'ok' : 'no');
      if (bellCfg.auto) {
        BH.autoLeft = bellCfg.auto;
        bellNextBtn();
        BH.autoTimer = setInterval(() => {
          // 학생이 모두 나가 있으면(와이파이가 끊기면) 저절로 넘기지 않고 기다린다.
          if (!bellOnline().length) return;
          BH.autoLeft -= 1;
          bellNextBtn();
          if (BH.autoLeft <= 0) bellNext();
        }, 1000);
      }
    }
    function bellNext() {
      if (BH.stage !== 'reveal') return;
      if (BH.index >= BH.qs.length - 1) { BH.asked = BH.qs.length; bellEnd(); return; }
      bellOpen(BH.index + 1);
    }
    function bellFinish() {
      if (!['question', 'reveal', 'race', 'exam'].includes(BH.stage)) return;
      if (BH.stage === 'exam') {
        if (confirm('단원 평가를 지금 끝낼까요? 학생 태블릿도 함께 끝나요.')) bellEnd();
        return;
      }
      if (!confirm(`지금까지의 점수로 ${BH.kind === 'race' ? '시간 대결' : '골든벨'}을 마칠까요?`)) return;
      BH.asked = BH.stage === 'reveal' ? BH.index + 1 : BH.index;
      bellEnd();
    }
    function bellEnd() {
      bellStopTimers();
      BH.stage = 'end';
      bellSend();
      bellRender();
      blip('fanfare');
    }
    function bellAgain() {
      bellStopTimers();
      Object.assign(BH, { game: BH.game + 1, qs: [], index: -1, stage: 'lobby', answers: {}, scores: {}, asked: 0, examQs: [], examRes: {}, examOpen: false });
      bellSend();
      bellRender();
    }
    function bellStopTimers() {
      clearInterval(BH.tick);
      clearInterval(BH.autoTimer);
      clearTimeout(BH.revealTimer);
      BH.autoLeft = 0;
    }
    function bellKick(id) {
      const p = BH.roster.find((x) => x.id === id);
      if (!p || !BH.sock || !confirm(`${p.name}${eulReul(p.name)} 방에서 내보낼까요?`)) return;
      BH.sock.send({ t: 'kick', playerId: id });
    }
    function bellCloseRoom() {
      bellStopTimers();
      if (BH.sock) {
        const sock = BH.sock;
        sock.send({ t: 'close' });
        // 닫는 말이 서버에 닿을 틈을 준다
        setTimeout(() => sock.close(), 400);
      }
      Object.assign(BH, { sock: null, code: '', key: '', roster: [], online: false, stage: 'lobby', qs: [], index: -1, answers: {}, scores: {}, examQs: [], examRes: {}, examOpen: false });
    }
    function bellQuit() {
      if (BH.stage === 'end' && BH.kind === 'exam' && Object.keys(BH.examRes).length
        && !confirm('평가 결과는 이 화면에만 있어요. CSV로 저장했나요? 닫으면 결과가 사라져요.')) return;
      if (BH.stage !== 'end' && BH.roster.length && !confirm('골든벨을 끝내고 방을 닫을까요? 학생 태블릿도 함께 끝나요.')) return;
      bellCloseRoom();
      showScreen('game-select-screen');
    }

    /* ---------- 시간 대결 (칠판) ---------- */
    // 3초 세고 시작한다. 태블릿이 저마다 문제를 내고 채점해서 점수가 오를 때마다 알려 준다.
    const RACE_READY_MS = 3000;
    // 시간이 끝난 뒤 태블릿의 마지막 점수가 닿을 때까지 기다리는 시간
    const RACE_GRACE_MS = 2500;
    function bellRaceStart() {
      if (!bellCfg.raceSel.length) return;
      bellStopTimers();
      const now = Date.now();
      Object.assign(BH, {
        game: BH.game + 1, qs: [], index: -1, stage: 'race', answers: {}, scores: {}, asked: 0,
        raceSec: bellCfg.race, raceItems: [...bellCfg.raceSel], openedAt: now, raceStart: now + RACE_READY_MS, raceEnd: now + RACE_READY_MS + bellCfg.race * 1000
      });
      bellSend();
      bellRender();
      blip('tick');
      BH.tick = setInterval(bellRaceTick, 250);
      bellRaceTick();
    }
    function bellRaceTick() {
      const now = Date.now();
      const clock = document.getElementById('race-clock');
      if (now < BH.raceStart) {
        if (clock) clock.textContent = String(Math.ceil((BH.raceStart - now) / 1000));
        bellTimerUi(BH.raceSec, BH.raceSec);
        return;
      }
      const left = Math.max(0, Math.ceil((BH.raceEnd - now) / 1000));
      bellTimerUi(left, BH.raceSec);
      if (clock) {
        clock.textContent = left > 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : '끝!';
        clock.classList.toggle('warn', left <= 10);
      }
      if (now >= BH.raceEnd + RACE_GRACE_MS) { BH.asked = 0; bellEnd(); }
    }
    // 점수와 맞힌 수는 줄지 않으니 더 큰 값만 받는다(늦게 닿은 말이 앞의 말을 덮지 않게).
    function bellRaceInput(from, data) {
      if (BH.stage !== 'race' || data.round !== bellRound()) return;
      const p = BH.roster.find((x) => x.id === from);
      const score = Number(data.score);
      const correct = Number(data.correct);
      if (!p || !Number.isInteger(score) || !Number.isInteger(correct) || score < 0 || score > 9999 || correct < 0 || correct > 9999) return;
      const s = BH.scores[from] || (BH.scores[from] = bellNewScore(p));
      if (score > s.points) s.gained = score - s.points;
      s.points = Math.max(s.points, score);
      s.correct = Math.max(s.correct, correct);
      bellRefreshLive();
    }
    function bellRaceRowsHtml() {
      const ranked = bellRanking();
      if (!ranked.length) return '<p class="bell-more">들어온 학생이 없어요.</p>';
      const top = Math.max(1, ranked[0].s.points);
      return ranked.map(({ s, rank }) => `
        <li class="race-row r${s.points > 0 ? rank : 0}">
          <span class="rk">${rank === 1 && s.points > 0 ? '👑' : rank}</span><span class="em">${bellEmoji(s.avatar)}</span>
          <span class="nm">${bellEsc(s.name)}</span>
          <span class="track"><i style="width:${(s.points / top) * 100}%"></i></span>
          <span class="pt">${s.points}점</span><span class="ok">✔ ${s.correct}</span>
        </li>`).join('');
    }
    function bellRaceHtml() {
      return `
        <div class="race-board">
          <div class="race-head">
            <span class="race-clock" id="race-clock"></span>
            <p class="race-info">⏱ 각자 태블릿으로 최대한 많이 맞혀요 · 처음에 맞히면 2점, 다시 풀어 맞히면 1점</p>
          </div>
          <ol class="race-list${BH.roster.length > 10 ? ' two' : ''}" id="race-list">${bellRaceRowsHtml()}</ol>
        </div>`;
    }

    function bellRanking() {
      const list = Object.values(BH.scores).sort((a, b) => b.points - a.points || b.correct - a.correct || a.name.localeCompare(b.name, 'ko'));
      return list.map((s) => ({ s, rank: list.findIndex((o) => o.points === s.points) + 1 }));
    }
    function bellRankOf(id) {
      const r = bellRanking().find((x) => x.s.id === id);
      return r ? r.rank : 0;
    }

    /* ---------- 단원 평가 (칠판) ---------- */
    // 칠판이 20문제를 정해 모든 태블릿에 똑같이 보낸다. 태블릿은 단원 마무리 평가를 맞았는지 알려 주지 않고 풀며,
    // 문제마다 맞음·틀림만 칠판에 알린다. 결과는 이 화면에만 모이고, 이름은 선생님 컴퓨터의 명렬표로만 붙인다.
    const EXAM_GRACE_MS = 3000;
    const EXAM_NAMES_KEY = 'polyman-exam-names';
    const examNo = (name) => { const m = /^(\d{1,2})번$/.exec(name || ''); return m ? Number(m[1]) : 0; };
    const bellByNo = (a, b) => (examNo(a.name) || 999) - (examNo(b.name) || 999) || a.name.localeCompare(b.name, 'ko');
    const examAnswered = (r) => r.res.filter((v) => typeof v === 'boolean').length;
    const examCorrect = (r) => r.res.filter((v) => v === true).length;
    let examNames = [];
    try {
      const saved = JSON.parse(localStorage.getItem(EXAM_NAMES_KEY) || '[]');
      if (Array.isArray(saved)) examNames = saved.map((v) => String(v || ''));
    } catch (err) { /* 명렬표 없이 번호만 쓴다 */ }
    const examNameOf = (name) => { const n = examNo(name); return (n && examNames[n - 1]) || ''; };

    function bellExamEnsure() {
      if (BH.examQs.length !== EXAM_TOTAL) BH.examQs = buildExamQueue();
    }
    function examAnsHtml(q) {
      if (q.ansText) return q.ansText;
      const c = q.choices && q.choices.find((x) => x.v === q.ans);
      return c ? c.html : '';
    }
    // 미리보기: 태블릿과 같은 모양으로 그리되 누를 수는 없게 한다
    function examPreviewBody(q, i) {
      const keep = mode;
      mode = 'exam';
      try {
        const p = setupPlayer(900 + i, q);
        p.locked = true;
        return (BODIES[q.kind] || choiceBody)(p);
      } finally {
        mode = keep;
      }
    }
    function bellExamPreview() {
      bellExamEnsure();
      const box = document.getElementById('bell-overlay');
      const edit = BH.stage === 'lobby';
      box.innerHTML = `
        <div class="result-card exam-pv-card">
          <div class="exam-pv-head">
            <h2>📋 ${edit ? '평가 문제 미리보기' : '평가 문제와 정답'}</h2>
            <p>${edit ? '마음에 들지 않는 문제는 🔄 바꾸기를 눌러요. 학생 태블릿에는 이 문제가 이 차례로 나가요.' : '학생들이 푼 문제예요. 정답률이 낮은 문제를 함께 다시 풀어 보세요.'}</p>
          </div>
          <div class="exam-pv-grid">${BH.examQs.map((q, i) => bellExamCardHtml(q, i, edit)).join('')}</div>
          <div class="mix-btns">
            ${edit ? '<button class="ghost-btn" type="button" onclick="bellExamReroll(-1)">🔄 모두 새로 만들기</button>' : ''}
            <button class="btn-main" type="button" onclick="hideBellSetup()">${edit ? '이대로 할게요' : '닫기'}</button>
          </div>
        </div>`;
      box.classList.remove('hidden');
      document.body.classList.add('modal');
      box.firstElementChild.scrollTop = 0;
    }
    function bellExamCardHtml(q, i, edit) {
      const rate = BH.stage === 'end' ? bellExamRates()[i] : null;
      return `
        <article class="exam-pv" id="exam-pv-${i}">
          <header>
            <b>${i + 1}</b><span>${q.sec}</span>
            ${rate === null ? '' : `<span class="rate${rate < 50 ? ' low' : ''}">정답률 ${rate}%</span>`}
            ${edit ? `<button class="ghost-btn" type="button" onclick="bellExamReroll(${i})">🔄 바꾸기</button>` : ''}
          </header>
          <div class="exam-pv-body">${examPreviewBody(q, i)}</div>
          <footer>정답 <span class="ans">${examAnsHtml(q)}</span></footer>
        </article>`;
    }
    function bellExamReroll(i) {
      if (BH.stage !== 'lobby') return;
      if (i < 0) {
        if (!confirm(`${EXAM_TOTAL}문제를 모두 새로 만들까요?`)) return;
        BH.examQs = buildExamQueue();
        bellExamPreview();
        return;
      }
      const keys = new Set(BH.examQs.map((q) => q.key));
      let q = examMake(i);
      for (let k = 0; k < 8 && keys.has(q.key); k += 1) q = examMake(i);
      BH.examQs[i] = q;
      const card = document.getElementById(`exam-pv-${i}`);
      if (card) card.outerHTML = bellExamCardHtml(q, i, true);
    }

    function bellExamStart() {
      bellExamEnsure();
      bellStopTimers();
      hideBellSetup();
      const now = Date.now();
      Object.assign(BH, {
        game: BH.game + 1, qs: [], index: -1, stage: 'exam', answers: {}, scores: {}, examRes: {}, examOpen: false,
        examSec: bellCfg.examMin * 60, examEnd: bellCfg.examMin ? now + bellCfg.examMin * 60000 : 0
      });
      bellSend();
      bellRender();
      blip('tick');
      BH.tick = setInterval(bellExamTick, 250);
      bellExamTick();
    }
    function bellExamRec(id) {
      if (BH.examRes[id]) return BH.examRes[id];
      const p = BH.roster.find((x) => x.id === id);
      if (!p) return null;
      return (BH.examRes[id] = { id, name: p.name, res: [], away: 0, done: false });
    }
    function bellExamView() {
      return { screen: 'exam', round: bellRound(), qs: BH.examQs, total: BH.examSec, left: BH.examEnd ? Math.max(0, BH.examEnd - Date.now()) : 0 };
    }
    function bellExamTick() {
      const clock = document.getElementById('exam-clock');
      if (!BH.examEnd) {
        if (clock) clock.textContent = '시간 제한 없음';
        return;
      }
      const left = Math.max(0, Math.ceil((BH.examEnd - Date.now()) / 1000));
      if (clock) {
        clock.textContent = left > 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : '끝!';
        clock.classList.toggle('warn', left <= 60);
      }
      if (Date.now() >= BH.examEnd + EXAM_GRACE_MS) bellEnd();
    }
    // 한 문제에는 처음 온 답만 받는다(다시 붙은 태블릿이 같은 답을 또 보내도 괜찮다).
    function bellExamInput(from, data) {
      if (BH.stage !== 'exam' || data.round !== bellRound()) return;
      const r = bellExamRec(from);
      if (!r) return;
      const i = Number(data.i);
      if (Number.isInteger(i) && i >= 0 && i < EXAM_TOTAL && typeof r.res[i] !== 'boolean') r.res[i] = data.ok === true;
      if (data.away === true) r.away += 1;
      if (data.done === true || examAnswered(r) >= EXAM_TOTAL) r.done = true;
      bellRefreshLive();
      // 들어온 학생이 모두 다 풀었으면 잠깐 뒤에 끝낸다
      const allDone = () => BH.stage === 'exam' && Object.values(BH.examRes).every((x) => x.done);
      if (allDone()) setTimeout(() => { if (allDone()) bellEnd(); }, 1500);
    }
    function bellExamHtml() {
      return `
        <div class="race-board">
          <div class="race-head">
            <span class="race-clock" id="exam-clock"></span>
            <p class="race-info">📝 각자 태블릿으로 ${EXAM_TOTAL}문제를 풀어요 · 칠판에는 몇 문제를 풀었는지만 보여요</p>
          </div>
          <ol class="race-list${BH.roster.length > 10 ? ' two' : ''}" id="exam-list">${bellExamRowsHtml()}</ol>
        </div>`;
    }
    function bellExamRowsHtml() {
      const recs = Object.values(BH.examRes).sort(bellByNo);
      if (!recs.length) return '<p class="bell-more">아직 답을 낸 학생이 없어요.</p>';
      return recs.map((r) => {
        const n = examAnswered(r);
        const p = BH.roster.find((x) => x.id === r.id);
        const state = r.done ? '✅ 끝' : p && !p.online ? '📶 끊김' : `${n} / ${EXAM_TOTAL}`;
        return `
        <li class="race-row exam-row${r.done ? ' done' : ''}">
          <span class="nm">${bellEsc(r.name)}</span>
          <span class="track"><i style="width:${(n / EXAM_TOTAL) * 100}%"></i></span>
          <span class="ok">${state}</span>
          <span class="away" title="평가 중에 다른 화면으로 나간 횟수">${r.away ? `👀 ${r.away}` : ''}</span>
        </li>`;
      }).join('');
    }
    function bellExamEndView(id) {
      const r = BH.examRes[id];
      if (!r) return { screen: 'wait', emoji: '📝', title: '단원 평가가 끝났어요', message: '칠판을 봐요' };
      const correct = examCorrect(r);
      return { screen: 'examEnd', show: bellCfg.examShow, correct, total: EXAM_TOTAL, points: correct * EXAM_POINT };
    }

    /* ---------- 단원 평가 결과 (칠판) ---------- */
    // 한 문제라도 답한 학생만 응시한 것으로 센다. 답하지 않은 문제는 틀린 것으로 본다.
    function bellExamTakers() {
      return Object.values(BH.examRes).filter((r) => examAnswered(r) > 0).sort(bellByNo);
    }
    function bellExamRates() {
      const takers = bellExamTakers();
      return BH.examQs.map((_, i) => (takers.length ? Math.round((takers.filter((r) => r.res[i] === true).length / takers.length) * 100) : 0));
    }
    function bellExamAvg() {
      const takers = bellExamTakers();
      return takers.length ? Math.round((takers.reduce((sum, r) => sum + examCorrect(r) * EXAM_POINT, 0) / takers.length) * 10) / 10 : 0;
    }
    function bellExamTableHtml() {
      const names = bellExamTakers().some((r) => examNameOf(r.name));
      return `
        <table class="exam-table">
          <thead><tr><th>번호</th>${names ? '<th>이름</th>' : ''}${BH.examQs.map((_, i) => `<th>${i + 1}</th>`).join('')}<th>맞힌 수</th><th>점수</th><th title="평가 중에 다른 화면으로 나간 횟수">👀</th></tr></thead>
          <tbody>${bellExamTakers().map((r) => `
            <tr>
              <td class="no">${bellEsc(r.name)}</td>${names ? `<td class="nm">${bellEsc(examNameOf(r.name))}</td>` : ''}
              ${BH.examQs.map((_, i) => (r.res[i] === true ? '<td class="o">○</td>' : r.res[i] === false ? '<td class="x">✕</td>' : '<td class="na">–</td>')).join('')}
              <td>${examCorrect(r)}</td><td><b>${examCorrect(r) * EXAM_POINT}</b></td><td>${r.away || ''}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }
    function bellExamEndHtml() {
      const takers = bellExamTakers();
      const rates = bellExamRates();
      return `
        <div class="exam-end">
          <div class="exam-end-head">
            <h2>📝 단원 평가 끝!</h2>
            <p class="sub">${takers.length}명 응시 · 평균 <b>${bellExamAvg()}</b>점</p>
          </div>
          <section class="bell-panel">
            <h3>문항별 정답률</h3>
            <ol class="exam-rates">${BH.examQs.map((q, i) => `
              <li class="${rates[i] < 50 ? 'low' : ''}">
                <span class="no">${i + 1}</span><span class="sec">${q.sec}</span>
                <span class="track"><i style="width:${rates[i]}%"></i></span><b>${rates[i]}%</b>
              </li>`).join('')}
            </ol>
            <p class="bell-more">빨간 문제는 반 친구 절반 넘게 틀렸어요. 📋 문제 다시 보기로 함께 풀어 보세요.</p>
          </section>
          <section class="bell-panel">
            <div class="exam-res-head">
              <h3>학생별 결과</h3>
              <button class="ghost-btn" type="button" onclick="bellExamToggle()">${BH.examOpen ? '🙈 가리기' : '🔒 펼치기'}</button>
            </div>
            ${!takers.length ? '<p class="bell-more">답을 낸 학생이 없어요.</p>'
              : BH.examOpen ? `<div class="exam-table-wrap">${bellExamTableHtml()}</div>`
              : '<p class="bell-more">학생별 점수는 선생님만 보세요. 칠판에 띄운 화면이라면 학생들이 보지 않을 때 펼쳐요.</p>'}
          </section>
          <div class="bell-foot end">
            <button class="ghost-btn" type="button" onclick="bellExamCsv()"${takers.length ? '' : ' disabled'}>📥 CSV 저장</button>
            <button class="ghost-btn" type="button" onclick="bellExamPrint()"${takers.length ? '' : ' disabled'}>🖨 인쇄</button>
            <button class="ghost-btn" type="button" onclick="bellExamNames()">👥 명렬표 넣기</button>
            <button class="ghost-btn" type="button" onclick="bellExamPreview()">📋 문제 다시 보기</button>
            <button class="btn-main" type="button" onclick="bellAgain()">새 평가 준비</button>
          </div>
        </div>`;
    }
    function bellExamToggle() {
      BH.examOpen = !BH.examOpen;
      bellRender();
    }
    const examDate = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    function bellExamCsv() {
      const cell = (v) => (/[",\r\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v));
      const rates = bellExamRates();
      const rows = [
        ['번호', '이름', ...BH.examQs.map((q, i) => `${i + 1}번(${q.sec})`), '맞힌 수', '점수', '화면 나감'],
        ...bellExamTakers().map((r) => [
          examNo(r.name) || r.name, examNameOf(r.name),
          ...BH.examQs.map((_, i) => (r.res[i] === true ? 'O' : r.res[i] === false ? 'X' : '')),
          examCorrect(r), examCorrect(r) * EXAM_POINT, r.away
        ]),
        ['정답률', '', ...rates.map((v) => `${v}%`), '', `평균 ${bellExamAvg()}`, '']
      ];
      // 엑셀이 한글을 바로 읽도록 BOM을 붙인다
      const blob = new Blob([`﻿${rows.map((r) => r.map(cell).join(',')).join('\r\n')}`], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `다각형맨-단원평가-${examDate()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    function bellExamPrint() {
      const w = window.open('', '_blank');
      if (!w) { alert('팝업이 막혀 있어요. 팝업을 허용한 뒤 다시 눌러 주세요.'); return; }
      const rates = bellExamRates();
      w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>다각형맨 단원 평가 결과 ${examDate()}</title>
        <style>
          body { margin: 24px; color: #1d2838; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
          h1 { margin: 0 0 4px; font-size: 22px; } h2 { margin: 24px 0 8px; font-size: 17px; } p { margin: 0 0 14px; color: #556; }
          table { border-collapse: collapse; width: 100%; font-size: 12px; } th, td { border: 1px solid #c9d3dd; padding: 4px 3px; text-align: center; }
          th { background: #f0f4f7; } .o { color: #12804a; } .x { color: #d64545; font-weight: 700; } .na { color: #aab; } .nm { white-space: nowrap; }
          .low { color: #d64545; font-weight: 700; }
          @page { size: A4 landscape; margin: 12mm; }
        </style></head><body>
        <h1>다각형맨 단원 평가 결과</h1>
        <p>${examDate()} · ${bellExamTakers().length}명 응시 · 평균 ${bellExamAvg()}점 · 한 문제 ${EXAM_POINT}점</p>
        ${bellExamTableHtml()}
        <h2>문항별 정답률</h2>
        <table><thead><tr>${BH.examQs.map((_, i) => `<th>${i + 1}</th>`).join('')}</tr></thead>
          <tbody><tr>${rates.map((v) => `<td class="${v < 50 ? 'low' : ''}">${v}%</td>`).join('')}</tr>
          <tr>${BH.examQs.map((q) => `<td>${q.sec}</td>`).join('')}</tr></tbody></table>
        </body></html>`);
      w.document.close();
      w.focus();
      setTimeout(() => w.print(), 300);
    }
    // 명렬표: 번호와 이름을 잇는 표는 이 컴퓨터(브라우저)에만 두고 서버로 보내지 않는다.
    function bellExamNames() {
      const box = document.getElementById('bell-overlay');
      box.innerHTML = `
        <div class="result-card exam-names-card">
          <h2>👥 명렬표 넣기</h2>
          <p>한 줄에 한 명씩 <b>1번부터 차례로</b> 이름을 써요. 엑셀의 이름 칸을 복사해 붙여도 되고, "7 김하늘"처럼 번호를 앞에 써도 돼요.</p>
          <p class="exam-privacy">🔒 이름은 이 컴퓨터에만 저장되고 서버로 가지 않아요.</p>
          <textarea id="exam-names" rows="12" spellcheck="false" placeholder="김하늘&#10;이바다&#10;박구름">${bellEsc(examNames.join('\n'))}</textarea>
          <div class="mix-btns">
            <button class="ghost-btn" type="button" onclick="bellExamSaveNames(true)">모두 지우기</button>
            <button class="ghost-btn" type="button" onclick="hideBellSetup()">닫기</button>
            <button class="btn-main" type="button" onclick="bellExamSaveNames()">저장</button>
          </div>
        </div>`;
      box.classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function bellExamSaveNames(clear) {
      const list = [];
      if (!clear) {
        document.getElementById('exam-names').value.split(/\r?\n/).forEach((line, k) => {
          const m = /^\s*(\d{1,2})\s*(?:번|[.)]|\t|\s)\s*(.*)$/.exec(line);
          const at = m ? Number(m[1]) - 1 : k;
          const name = (m ? m[2] : line).trim().slice(0, 20);
          if (at >= 0 && at < MAX_EXAM_NAMES) list[at] = name;
        });
      }
      examNames = Array.from(list, (v) => v || '');
      while (examNames.length && !examNames[examNames.length - 1]) examNames.pop();
      try { localStorage.setItem(EXAM_NAMES_KEY, JSON.stringify(examNames)); } catch (err) { /* 저장하지 못하면 이번 창에서만 쓴다 */ }
      hideBellSetup();
      bellRender();
    }
    const MAX_EXAM_NAMES = 40;

    /* ---------- 칠판 그리기 ---------- */
    function bellJoinUrl() {
      const base = /^https?:$/.test(location.protocol) ? `${location.origin}${location.pathname}` : BELL_PAGE_URL;
      const u = new URL(base);
      u.searchParams.set('bell', BH.code);
      // 평가 방이면 태블릿이 이름 대신 번호를 묻는다
      if (bellCfg.kind === 'exam') u.searchParams.set('exam', '1');
      if (BELL_LOCAL) u.searchParams.set('bellServer', BELL_LOCAL);
      return u.toString();
    }
    function bellRoomChip() {
      const el = document.getElementById('bell-room');
      if (!el) return;
      el.className = `bell-room${BH.online ? '' : ' off'}`;
      el.innerHTML = `<span class="dot"></span>방 <b>${BH.code}</b> · 👥 ${bellOnline().length}`;
      el.title = BH.online ? '서버에 연결되어 있어요' : '서버에 다시 연결하는 중이에요';
    }
    function bellTimerUi(left, total) {
      const t = document.getElementById('bell-timer');
      if (total === null) { t.classList.add('hidden'); return; }
      t.className = `timer${left <= 5 ? ' warn' : ''}`;
      document.getElementById('bell-time-left').textContent = String(left);
      document.getElementById('bell-timer-bar').style.strokeDashoffset = String(157.08 * (1 - Math.min(1, left / total)));
    }
    function bellScale() {
      const body = document.getElementById('bell-body');
      if (body && body.offsetParent !== null) {
        body.style.setProperty('--s', clamp(Math.min(body.clientWidth / 1000, body.clientHeight / 660), 0.85, 1.6).toFixed(2));
      }
      const pad = document.getElementById('bp-body');
      if (pad && pad.offsetParent !== null) pad.style.setProperty('--s', clamp(pad.clientWidth / 600, 0.75, 1.25).toFixed(2));
    }
    function bellRender() {
      const body = document.getElementById('bell-body');
      bellScale();
      bellRoomChip();
      const kind = BH.stage === 'lobby' ? bellCfg.kind : BH.kind;
      document.getElementById('bell-title').textContent = { race: '⏱ 다각형맨 시간 대결', exam: '📝 다각형맨 단원 평가' }[kind] || '🔔 다각형맨 골든벨';
      const sub = {
        lobby: '학생들이 다 들어오면 시작해요',
        race: '태블릿으로 최대한 많이 풀어요',
        exam: '태블릿으로 평가를 풀어요',
        question: '태블릿으로 답을 내요',
        reveal: '정답을 확인해요',
        end: kind === 'exam' ? '평가 결과' : '골든벨 결과'
      };
      document.getElementById('bell-sub').textContent = sub[BH.stage];
      document.getElementById('bell-finish').classList.toggle('hidden', !['question', 'reveal', 'race', 'exam'].includes(BH.stage));
      if (BH.stage !== 'question' && BH.stage !== 'race') bellTimerUi(0, null);
      if (BH.stage === 'lobby') body.innerHTML = bellLobbyHtml();
      else if (BH.stage === 'race') body.innerHTML = bellRaceHtml();
      else if (BH.stage === 'exam') body.innerHTML = bellExamHtml();
      else if (BH.stage === 'end' && BH.kind === 'exam') body.innerHTML = bellExamEndHtml();
      else if (BH.stage === 'question') body.innerHTML = bellQuestionHtml();
      else if (BH.stage === 'reveal') body.innerHTML = bellRevealHtml();
      else body.innerHTML = bellEndHtml();
      body.scrollTop = 0;
      bellRefreshLive();
    }
    // 답이 들어올 때마다 화면 전체를 다시 그리지 않고 숫자만 바꾼다.
    function bellRefreshLive() {
      bellRoomChip();
      if (BH.stage === 'race') {
        const list = document.getElementById('race-list');
        if (list) list.innerHTML = bellRaceRowsHtml();
        return;
      }
      if (BH.stage === 'exam') {
        const list = document.getElementById('exam-list');
        if (list) list.innerHTML = bellExamRowsHtml();
        return;
      }
      if (BH.stage !== 'question') return;
      const answered = Object.keys(BH.answers).length;
      const total = new Set([...bellOnline().map((p) => p.id), ...Object.keys(BH.answers)]).size;
      const count = document.getElementById('bell-count');
      if (count) count.innerHTML = `<b>${answered}</b> / ${total}명 답했어요`;
      const bar = document.getElementById('bell-bar');
      if (bar) bar.style.width = `${total ? (answered / total) * 100 : 0}%`;
      const faces = document.getElementById('bell-faces');
      if (faces) faces.innerHTML = bellFacesHtml();
      bellCheckAll();
    }
    function bellFacesHtml() {
      return Object.keys(BH.answers).map((id) => {
        const s = BH.scores[id];
        return s ? `<span title="${bellEsc(s.name)}">${bellEmoji(s.avatar)}</span>` : '';
      }).join('');
    }
    function bellLobbyHtml() {
      const on = bellOnline().length;
      const exam = bellCfg.kind === 'exam';
      if (exam) bellExamEnsure();
      // 평가는 번호 차례로 늘어놓고, 번호가 아니거나 겹친 이름(7번2)은 빨갛게 보여 준다
      const list = exam ? [...BH.roster].sort(bellByNo) : BH.roster;
      const chips = list.map((p) => `
        <span class="bell-chip${p.online ? '' : ' off'}${exam && !examNo(p.name) ? ' warn' : ''}">
          <span class="em">${exam ? '📝' : bellEmoji(p.avatar)}</span>${bellEsc(p.name)}
          <button class="x" type="button" onclick="bellKick('${bellEsc(p.id)}')" aria-label="${bellEsc(p.name)} 내보내기" title="내보내기">✕</button>
        </span>`).join('');
      return `
        <div class="bell-lobby">
          <section class="bell-panel bell-joinbox">
            <img class="bell-qr" src="${BELL_SERVER}/api/qr?text=${encodeURIComponent(bellJoinUrl())}" alt="골든벨 들어가는 QR 코드" />
            <span class="bell-code-label">방 번호</span>
            <span class="bell-code">${BH.code}</span>
            <p class="bell-hint">태블릿 카메라로 <b>QR</b>을 찍거나<br />QR이 안 되면 다각형맨 → 🔔 골든벨 → <b>학생 태블릿으로 참여</b>에서 방 번호를 넣어요</p>
            ${exam ? '<p class="exam-privacy">🔒 학생은 번호로만 들어와요. 이름은 서버로 가지 않아요.</p>' : ''}
          </section>
          <section class="bell-panel bell-rosterbox">
            <h3>들어온 친구 <b>${on}</b>명</h3>
            <div class="bell-chips">${chips || `<p class="bell-empty">아직 아무도 없어요.<br />QR을 찍고 ${exam ? '번호를 고르면' : '이름을 쓰면'} 여기에 나타나요.</p>`}</div>
            <div class="bell-sum">
              ${exam
                ? `<span>📝 ${EXAM_TOTAL}문제</span><span>⏱ ${bellCfg.examMin ? `${bellCfg.examMin}분` : '시간 제한 없음'}</span><span>${bellCfg.examShow ? '🙂 끝나면 점수 보여 줌' : '🙈 점수 숨김'}</span>
                   <button class="ghost-btn" type="button" onclick="bellExamPreview()">📋 문제 미리보기</button>`
                : bellCfg.kind === 'race'
                ? `<span>⏱ 시간 대결 ${bellTimeText(bellCfg.race)}</span><span>🧩 유형 ${bellCfg.raceSel.length}가지</span>`
                : `<span>📝 ${bellCfg.count}문제</span><span>⏱ 한 문제 ${bellCfg.seconds}초</span><span>🧩 유형 ${bellCfg.sel.length}가지</span>`}
              <button class="ghost-btn" type="button" onclick="openBellSetup()">설정 바꾸기</button>
            </div>
            <button class="btn-main bell-go" type="button" onclick="bellStart()"${on ? '' : ' disabled'}>▶ ${{ race: '시간 대결', exam: '평가' }[bellCfg.kind] || '골든벨'} 시작</button>
          </section>
        </div>`;
    }
    function bellQHeadHtml(q) {
      return `<div class="bell-qhead"><span class="bell-tag no">문제 ${BH.index + 1} / ${BH.qs.length}</span><span class="bell-tag">${ICONS[MIX_ITEMS[q.id].icon]}${q.label}</span></div>`;
    }
    function bellCardHtml(q, reveal) {
      let body = reveal && q.ansVisual ? q.ansVisual : q.visual || '';
      if (q.input === 'keypad') {
        const box = reveal ? `<span class="ans-box bell-ans">${N(q.ans)}</span>` : '<span class="ans-box"><span class="ph">?</span></span>';
        body += `<div class="ans-line"${q.big ? ' style="font-size:calc(var(--s) * 38px)"' : ''}>${q.lhs || ''}${box}${q.unit ? `<span class="unit-txt">${q.unit}</span>` : ''}</div>`;
      }
      return `<div class="q-card">${q.prompt ? `<div class="q-text"><span>${q.prompt}</span></div>` : ''}${body}</div>`;
    }
    function bellChoicesHtml(q, counts) {
      if (q.input !== 'choice') return '';
      return `<div class="choices c${q.cols || 2}${q.txt ? ' txtc' : ''}${q.figs ? ' figs' : ''} bell-show">${q.choices.map((html, i) => {
        const st = !counts ? '' : i === q.ans ? ' right' : counts[i] ? ' wrong' : ' dim';
        return `<div class="choice${q.txt ? ' txt' : ''}${q.figs ? ' figc' : ''}${st}"><span class="mk">${i + 1}</span>${html}${counts ? `<span class="ct">${counts[i]}명</span>` : ''}</div>`;
      }).join('')}</div>`;
    }
    function bellLeadersHtml(showGained) {
      const ranked = bellRanking().filter((r) => showGained || r.s.points > 0);
      if (!ranked.length) return '<p class="bell-more">첫 문제의 정답이 나오면 순위가 보여요.</p>';
      return `<ol class="bell-leaders">${ranked.slice(0, BELL_LEADERS).map(({ s, rank }) => `
        <li class="bell-leader r${rank}">
          <span class="rk">${rank === 1 ? '👑' : rank}</span><span class="em">${bellEmoji(s.avatar)}</span>
          <span class="nm">${bellEsc(s.name)}</span>
          <span class="pt">${s.points.toLocaleString()}${showGained && s.gained ? `<small>+${s.gained}</small>` : ''}</span>
        </li>`).join('')}</ol>${ranked.length > BELL_LEADERS ? `<p class="bell-more">외 ${ranked.length - BELL_LEADERS}명</p>` : ''}`;
    }
    function bellQuestionHtml() {
      const q = BH.qs[BH.index];
      return `
        <div class="bell-play">
          <div class="bell-main">
            ${bellQHeadHtml(q)}
            ${bellCardHtml(q, false)}
            ${q.input === 'choice' ? bellChoicesHtml(q) : '<p class="bell-padnote">📝 태블릿 키패드로 답을 써요</p>'}
            <div class="bell-faces" id="bell-faces">${bellFacesHtml()}</div>
            <div class="bell-foot">
              <span class="bell-count" id="bell-count"></span>
              <span class="bell-bar"><i id="bell-bar"></i></span>
              <button class="ghost-btn" type="button" onclick="bellMore()">+${BELL_EXTEND}초</button>
              <button class="btn-main" type="button" onclick="bellReveal()">정답 공개</button>
            </div>
          </div>
          <aside class="bell-panel bell-side"><h3>👑 지금 순위</h3>${bellLeadersHtml(false)}</aside>
        </div>`;
    }
    function bellNextLabel() {
      const last = BH.index >= BH.qs.length - 1;
      return `${last ? '🏆 결과 보기' : '다음 문제 ▶'}${BH.autoLeft > 0 ? `<small>${BH.autoLeft}</small>` : ''}`;
    }
    function bellNextBtn() {
      const b = document.getElementById('bell-next');
      if (b) b.innerHTML = bellNextLabel();
    }
    function bellRevealHtml() {
      const q = BH.qs[BH.index];
      const answers = Object.values(BH.answers);
      const right = answers.filter((a) => a.ok).length;
      let counts = null;
      if (q.input === 'choice') {
        counts = q.choices.map(() => 0);
        answers.forEach((a) => { counts[a.choice] += 1; });
      }
      return `
        <div class="bell-play">
          <div class="bell-main">
            ${bellQHeadHtml(q)}
            <p class="bell-result-head">${answers.length}명 중 <b>${right}명</b> 정답!</p>
            ${bellCardHtml(q, true)}
            ${bellChoicesHtml(q, counts)}
            ${q.explain ? `<p class="bell-explain">💡 ${q.explain}</p>` : ''}
            <div class="bell-foot end"><button class="btn-main bell-next" id="bell-next" type="button" onclick="bellNext()">${bellNextLabel()}</button></div>
          </div>
          <aside class="bell-panel bell-side"><h3>👑 지금 순위</h3>${bellLeadersHtml(true)}</aside>
        </div>`;
    }
    function bellEndHtml() {
      const ranked = bellRanking();
      const race = BH.kind === 'race';
      const pods = [1, 0, 2].map((i) => (ranked[i] ? { ...ranked[i], pos: i + 1 } : null)).filter(Boolean);
      return `
        <div class="bell-end">
          <h2>🏆 ${race ? '시간 대결' : '골든벨'} 결과</h2>
          <p class="sub">${race ? `${bellTimeText(BH.raceSec)} 대결` : `${BH.asked}문제`} · ${ranked.length}명 참가</p>
          ${pods.length ? `<div class="bell-podium">${pods.map(({ s, rank, pos }) => `
            <div class="bell-pod p${pos}">
              <span class="em">${bellEmoji(s.avatar)}</span>
              <span class="nm">${bellEsc(s.name)}</span>
              <span class="pt">${s.points.toLocaleString()}점 · ${s.correct}문제</span>
              <div class="block">${rank}</div>
            </div>`).join('')}</div>` : '<p class="bell-more">참가한 학생이 없어요.</p>'}
          <div class="bell-rest">${ranked.slice(3).map(({ s, rank }) => `
            <div class="rank-row r0"><span class="rk">${rank}</span><span>${bellEmoji(s.avatar)} ${bellEsc(s.name)}</span><strong>${s.points.toLocaleString()}점 <small>(${race ? `${s.correct}문제 맞힘` : `${s.correct}/${BH.asked}`})</small></strong></div>`).join('')}
          </div>
          <div class="result-btns">
            <button class="btn-main" type="button" onclick="bellAgain()">🔁 같은 방에서 한 번 더</button>
            <button class="ghost-btn" type="button" onclick="bellQuit()">끝내기</button>
          </div>
        </div>`;
    }

    /* ---------- 학생 태블릿 ---------- */
    // race: 시간 대결 중이면 { round, score, correct, end, total, items, running, done }
    const BP = { code: '', sock: null, me: null, status: 'closed', view: null, round: '', shownAt: 0, deadline: 0, total: 0, input: '', picked: -1, sent: false, expired: false, timer: null, ended: false, race: null, exam: null,
      // 평가 방(QR에 exam=1)이면 이름 대신 번호로 들어간다
      byNo: PAGE_PARAMS.get('exam') === '1' };
    let bellMe = { name: '', avatar: '' };
    try { bellMe = { ...bellMe, ...JSON.parse(localStorage.getItem(BELL_ME_KEY) || '{}') }; } catch (err) { /* 무시 */ }
    const bellResumeKey = (code) => `polyman-bell-room:${code}`;
    function bellResume(code) {
      try {
        const v = JSON.parse(localStorage.getItem(bellResumeKey(code)) || 'null');
        return v && v.pid && v.token ? v : null;
      } catch (err) { return null; }
    }
    function bellSaveResume(code, v) {
      try {
        if (v) localStorage.setItem(bellResumeKey(code), JSON.stringify(v));
        else localStorage.removeItem(bellResumeKey(code));
      } catch (err) { /* 저장소를 못 쓰면 새로 불러올 때 다시 입장한다 */ }
    }
    function bellSetUrl(code) {
      try {
        const u = new URL(location.href);
        if (code) u.searchParams.set('bell', code);
        else u.searchParams.delete('bell');
        history.replaceState(null, '', u);
      } catch (err) { /* 주소를 못 바꾸는 환경이면 그대로 둔다 */ }
    }

    function openBellPad(code) {
      BP.code = code || '';
      showScreen('bell-join-screen');
      bellPadTop();
      if (BP.code && bellResume(BP.code)) bellConnect();
      else bellPadForm();
      bellScale();
    }
    function bellPadTop() {
      document.getElementById('bp-me').innerHTML = BP.me
        ? `<span class="em">${bellEmoji(BP.me.avatar)}</span>${bellEsc(BP.me.name)}`
        : '🔔 골든벨';
      document.getElementById('bp-room').textContent = BP.code && BP.sock ? `방 ${BP.code}` : '';
      document.getElementById('bp-dot').className = `bp-dot ${BP.sock ? BP.status : ''}`;
    }
    function bellPadForm(errMsg) {
      clearInterval(BP.timer);
      BP.view = null;
      BP.me = null;
      bellPadTop();
      if (!bellMe.avatar) bellMe.avatar = pick(BELL_ANIMALS)[0];
      const byNo = BP.byNo;
      document.getElementById('bp-body').innerHTML = `
        <div class="bp-form">
          <div class="kid-art"></div>
          <h2>${byNo ? '📝 단원 평가 참여' : '🔔 골든벨 참여'}</h2>
          <label class="bp-field">방 번호<input id="bp-code" class="code" inputmode="numeric" autocomplete="off" maxlength="5" value="${bellEsc(BP.code)}" placeholder="칠판의 다섯 자리" /></label>
          ${byNo ? `
          <div class="bp-field">내 번호
            <div class="bp-nos" id="bp-nos">${Array.from({ length: MAX_EXAM_NAMES }, (_, k) => `<button type="button" class="${k + 1 === bellMe.no ? 'on' : ''}" data-no="${k + 1}" onclick="bellPickNo(${k + 1})">${k + 1}</button>`).join('')}</div>
          </div>` : `
          <label class="bp-field">내 이름<input id="bp-name" maxlength="12" autocomplete="off" value="${bellEsc(bellMe.name)}" placeholder="이름을 써요" /></label>
          <div class="bp-field">내 동물
            <div class="bp-animals" id="bp-animals">${BELL_ANIMALS.map(([id, em]) => `<button type="button" class="${id === bellMe.avatar ? 'on' : ''}" data-id="${id}" onclick="bellPickAnimal('${id}')">${em}</button>`).join('')}</div>
          </div>`}
          <p class="bp-err" id="bp-err">${bellEsc(errMsg || '')}</p>
          <button class="btn-main" type="button" onclick="bellJoin()">들어가기 →</button>
          <button class="bell-pad-link" type="button" onclick="BP.byNo = ${!byNo}; bellPadForm()">${byNo ? '🔔 골든벨은 이름으로 들어가요' : '📝 단원 평가는 번호로 들어가요'}</button>
        </div>`;
      const focus = document.getElementById(BP.code ? 'bp-name' : 'bp-code');
      if (focus && !focus.value) focus.focus();
    }
    function bellPickNo(n) {
      bellMe.no = n;
      document.querySelectorAll('#bp-nos button').forEach((b) => b.classList.toggle('on', Number(b.dataset.no) === n));
    }
    // 평가 방에는 이름 대신 "7번"만 보낸다
    const bellJoinMsg = () => (BP.byNo
      ? { t: 'join', name: `${bellMe.no}번`, avatar: 'owl' }
      : { t: 'join', name: bellMe.name, avatar: bellMe.avatar });
    function bellPickAnimal(id) {
      bellMe.avatar = id;
      document.querySelectorAll('#bp-animals button').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
    }
    async function bellJoin() {
      const code = document.getElementById('bp-code').value.replace(/\D/g, '');
      const err = document.getElementById('bp-err');
      if (code.length !== 5) { err.textContent = '칠판에 있는 방 번호 다섯 자리를 써 주세요.'; return; }
      if (BP.byNo) {
        if (!bellMe.no) { err.textContent = '내 번호를 골라 주세요.'; return; }
      } else {
        const name = document.getElementById('bp-name').value.trim().slice(0, 12);
        if (!name) { err.textContent = '이름을 써 주세요.'; return; }
        bellMe.name = name;
      }
      try { localStorage.setItem(BELL_ME_KEY, JSON.stringify(bellMe)); } catch (e) { /* 무시 */ }
      err.textContent = '방을 찾는 중…';
      try {
        const res = await fetch(`${BELL_SERVER}/api/rooms/${code}`);
        const info = await res.json();
        if (!info.open) { err.textContent = '그 번호의 방이 없어요. 칠판의 방 번호를 다시 봐요.'; return; }
      } catch (e) {
        err.textContent = '서버에 연결하지 못했어요. 와이파이를 확인해 주세요.';
        return;
      }
      BP.code = code;
      bellSetUrl(code);
      bellConnect();
    }
    function bellConnect() {
      if (BP.sock) BP.sock.close();
      Object.assign(BP, { ended: false, view: null, round: '', sent: false });
      bellPadBig('🔌', '연결하는 중…', '잠깐만 기다려요');
      const sock = new BellSocket(() => {
        const r = bellResume(BP.code);
        return `${bellWs()}/api/rooms/${BP.code}/ws?role=player${r ? `&pid=${encodeURIComponent(r.pid)}&token=${encodeURIComponent(r.token)}` : ''}`;
      }, {
        status: (st) => {
          if (BP.sock !== sock) return;
          BP.status = st;
          bellPadTop();
          if (st === 'open' && !bellResume(BP.code)) sock.send(bellJoinMsg());
        },
        message: (m) => { if (BP.sock === sock) bellPadMessage(m); }
      });
      BP.sock = sock;
      bellPadTop();
    }
    function bellPadMessage(m) {
      if (m.t === 'welcome') {
        bellSaveResume(BP.code, { pid: m.player.id, token: m.token });
        BP.me = m.player;
        bellPadTop();
        if (!BP.view) bellPadBig('🔔', '들어왔어요!', '칠판을 보며 기다려요');
      } else if (m.t === 'view') {
        bellPadView(m.view);
      } else if (m.t === 'error' && m.code === 'bad-token') {
        // 내보냈거나 지난 방의 입장 정보다. 이름이 있으면 바로 새로 들어간다.
        bellSaveResume(BP.code, null);
        if (BP.byNo ? bellMe.no : bellMe.name) BP.sock.send(bellJoinMsg());
        else { BP.sock.close(); BP.sock = null; bellPadForm(); }
      } else if (m.t === 'error' && m.code === 'bad-name') {
        BP.sock.close();
        BP.sock = null;
        bellPadForm(m.message);
      } else if (m.t === 'closed' || m.t === 'error') {
        if (m.t === 'closed' || ['kicked', 'not-found', 'closed'].includes(m.code)) bellSaveResume(BP.code, null);
        bellPadEnded(m.t === 'closed' ? '골든벨이 끝났어요' : m.message);
      }
    }
    function bellPadEnded(message) {
      if (BP.race && BP.race.running) bellRaceStop();
      if (BP.exam && BP.exam.running) bellExamStop();
      clearInterval(BP.timer);
      BP.ended = true;
      const btns = `<div class="bp-btns"><button class="btn-main" type="button" onclick="bellPadForm()">다른 방 들어가기</button><button class="ghost-btn" type="button" onclick="bellLeave(true)">처음으로</button></div>`;
      // 최종 등수를 보고 있었다면 그대로 두고 아래에 버튼만 붙인다.
      if (BP.view && (BP.view.screen === 'end' || BP.view.screen === 'examEnd')) {
        const card = document.querySelector('#bp-body .bp-big');
        if (card && !card.querySelector('.bp-btns')) card.insertAdjacentHTML('beforeend', btns);
      } else {
        bellPadBig('🔔', message || '골든벨이 끝났어요', '선생님이 새 방을 열면 방 번호로 다시 들어와요', '', btns);
      }
      BP.sock = null;
      bellPadTop();
    }
    function bellLeave(force) {
      if (!force && BP.sock && !BP.ended && !confirm('골든벨에서 나갈까요?')) return;
      clearInterval(BP.timer);
      if (BP.sock) BP.sock.close();
      Object.assign(BP, { sock: null, me: null, view: null, ended: false });
      bellSetUrl('');
      showScreen('start-screen');
    }
    function bellPadBig(emoji, title, message, cls = '', extra = '') {
      clearInterval(BP.timer);
      document.getElementById('bp-body').innerHTML = `
        <div class="bp-big${cls ? ` ${cls}` : ''}">
          <span class="emo">${emoji}</span>
          <h2>${bellEsc(title || '')}</h2>
          ${message ? `<p>${bellEsc(message)}</p>` : ''}
          ${extra}
        </div>`;
    }
    function bellPadView(v) {
      if (!v || typeof v !== 'object') return;
      // 답을 낸 뒤 오는 '답을 냈어요'는 고른 답이 보이는 지금 화면을 그대로 둔다.
      if (v.screen === 'wait' && v.round && v.round === BP.round && BP.sent && document.querySelector('#bp-body .bp-q')) {
        BP.view = v;
        return;
      }
      // 칠판이 시간 대결을 끝냈으면(일찍 마쳤거나 결과가 나왔으면) 하던 게임을 멈춘다.
      if (BP.race && BP.race.running && v.screen !== 'race') bellRaceStop();
      if (BP.exam && BP.exam.running && v.screen !== 'exam') bellExamStop();
      BP.view = v;
      if (v.screen === 'race') { bellRaceView(v); return; }
      if (v.screen === 'exam') { bellPadExam(v); return; }
      if (v.screen === 'examEnd') {
        blip('fanfare');
        if (v.show) bellPadBig('📝', `${Number(v.points)}점`, `${Number(v.total)}문제 중 ${Number(v.correct)}문제를 맞혔어요. 수고했어요!`, 'good');
        else bellPadBig('📝', '단원 평가 끝!', '수고했어요! 결과는 선생님이 알려 줄 거예요');
        return;
      }
      if (v.screen === 'q') { bellPadQuestion(v); return; }
      if (v.screen === 'wait') { bellPadBig(v.emoji || '🔔', v.title, v.message); return; }
      if (v.screen === 'result') {
        blip(v.good ? 'ok' : 'no');
        bellPadBig(v.good ? '🎉' : '💪', v.title, v.message, v.good ? 'good' : 'bad', v.answer ? `<span class="ans">정답: ${v.answer}</span>` : '');
        return;
      }
      if (v.screen === 'end') {
        blip('fanfare');
        const medal = ['🥇', '🥈', '🥉'][v.rank - 1] || '🏅';
        const detail = v.kind === 'race' ? `${v.correct}문제 맞힘` : `${v.asked}문제 중 ${v.correct}문제 정답`;
        bellPadBig(medal, `최종 ${v.rank}등!`, `${v.count}명 중 ${v.rank}등 · ${Number(v.points).toLocaleString()}점 · ${detail}`, v.rank <= 3 ? 'good' : '');
      }
    }
    function bellPadQuestion(v) {
      clearInterval(BP.timer);
      if (BP.round !== v.round) Object.assign(BP, { round: v.round, input: '', picked: -1, sent: false, expired: false, shownAt: Date.now() - (Number(v.elapsed) || 0) });
      BP.deadline = Date.now() + v.seconds * 1000;
      BP.total = v.seconds * 1000;
      BP.expired = false;
      const q = v.q;
      let card = q.visual || '';
      let controls;
      if (q.input === 'choice') {
        controls = `<div class="choices c${q.cols || 2}${q.txt ? ' txtc' : ''}${q.figs ? ' figs' : ''}">${q.choices.map((html, i) => `
          <button class="choice${q.txt ? ' txt' : ''}${q.figs ? ' figc' : ''}${i === BP.picked ? ' picked' : ''}" type="button" onclick="bellPadPick(${i})">${html}</button>`).join('')}</div>`;
      } else {
        card += `<div class="ans-line"${q.big ? ' style="font-size:calc(var(--s) * 38px)"' : ''}>${q.lhs || ''}<span class="ans-box" id="bp-ans">${bellPadAnsHtml()}</span>${q.unit ? `<span class="unit-txt">${q.unit}</span>` : ''}</div>`;
        const keys = ['7', '8', '9', 'del', '4', '5', '6', '', '1', '2', '3', '0'];
        controls = `<div class="keypad k4">${keys.map((k) => {
          if (k === '') return '<span></span>';
          if (k === 'del') return '<button class="key fn" type="button" onclick="bellPadKey(\'del\')" aria-label="지우기">⌫</button>';
          return `<button class="key" type="button" onclick="bellPadKey('${k}')">${k}</button>`;
        }).join('')}</div>
          <button class="btn-main bp-submit" type="button" onclick="bellPadSubmit()">답 내기</button>`;
      }
      document.getElementById('bp-body').innerHTML = `
        <div class="bp-q${BP.sent ? ' locked' : ''}" id="bp-q">
          <div class="bp-qhead"><span>${Number(v.no)} / ${Number(v.total)}</span><span class="bp-time" id="bp-time"><i id="bp-tbar"></i></span><span class="bp-left" id="bp-left"></span></div>
          <div class="q-card">${q.prompt ? `<div class="q-text"><span>${q.prompt}</span></div>` : ''}${card}</div>
          ${controls}
          <div class="bp-msg" id="bp-msg">${BP.sent ? '✋ 답을 냈어요! 정답 공개를 기다려요' : ''}</div>
        </div>`;
      bellScale();
      if (!BP.sent) {
        BP.timer = setInterval(bellPadTick, 200);
        bellPadTick();
      }

    function bellPadTick() {
      const left = BP.deadline - Date.now();
      const bar = document.getElementById('bp-tbar');
      if (!bar) { clearInterval(BP.timer); return; }
      bar.style.transform = `scaleX(${Math.max(0, left) / Math.max(1, BP.total)})`;
      document.getElementById('bp-time').classList.toggle('warn', left <= 5000);
      document.getElementById('bp-left').textContent = `${Math.ceil(Math.max(0, left) / 1000)}초`;
      if (left <= 0) {
        clearInterval(BP.timer);
        BP.expired = true;
        document.getElementById('bp-q').classList.add('locked');

      }

    function bellPadMsg(text, cls) {

    }
    function bellPadAnsHtml() {
      return BP.input ? numHtml(BP.input) : '<span class="ph">?</span>';
    }
    function bellPadCanAnswer() {
      return BP.view && BP.view.screen === 'q' && !BP.sent && !BP.expired && BP.sock;
    }
    function bellPadSend(data) {
      BP.sent = true;
      clearInterval(BP.timer);
      BP.sock.send({ t: 'input', data: { kind: 'answer', round: BP.round, ms: Date.now() - BP.shownAt, ...data } });
      document.getElementById('bp-q').classList.add('locked');
      bellPadMsg('✋ 답을 냈어요! 정답 공개를 기다려요', '');
    }
    function bellPadPick(i) {
      if (!bellPadCanAnswer()) return;
      BP.picked = i;

    function bellPadKey(key) {
      if (!bellPadCanAnswer()) return;

    function bellPadSubmit() {

    /* ---------- 시간 대결 (태블릿) ---------- */
    // 칠판이 정한 유형과 시간으로 기존 다각형맨 게임(1명)을 그대로 돌린다. 채점은 태블릿이 하고, 점수가 오를 때마다 칠판에 알린다.
    function bellRaceView(v) {
      const r = BP.race;
      if (r && r.round === v.round && (r.running || r.done)) {
        if (r.done) bellPadBig('🏁', '시간 끝!', '칠판에서 순위를 봐요');
        return;
      }
      clearInterval(BP.timer);
      const now = Date.now();
      BP.race = {
        round: v.round, score: Math.max(0, Number(v.score) || 0), correct: Math.max(0, Number(v.correct) || 0),
        items: Array.isArray(v.items) ? v.items : [], total: Number(v.total) || 60,
        start: now + (Number(v.wait) || 0), end: now + (Number(v.wait) || 0) + (Number(v.seconds) || 0) * 1000,
        running: false, done: false
      };
      if (BP.race.end - now < 1000) { BP.race.done = true; bellPadBig('🏁', '시간 끝!', '칠판에서 순위를 봐요'); return; }
      document.getElementById('bp-body').innerHTML = `
        <div class="bp-big">
          <span class="emo">⏱</span>
          <h2>시간 대결</h2>
          <p>${bellTimeText(BP.race.total)} 안에 최대한 많이 맞혀요!<br />처음에 맞히면 2점, 다시 풀어 맞히면 1점</p>
          <span class="race-count" id="race-count"></span>

      const tick = () => {

          if (el) el.textContent = String(Math.ceil(left / 1000));

        clearInterval(BP.timer);
        bellRaceGo();
      };
      BP.timer = setInterval(tick, 100);
      tick();
    }
    function bellRaceGo() {
      const r = BP.race;
      r.running = true;
      // 여러 태블릿이 한꺼번에 읽어 주면 교실이 시끄러우니 대결 중에는 읽어 주기를 끈다(효과음은 난다).
      r.voice = voiceOn;
      if (voiceOn) toggleVoice();
      mixPool = r.items.filter((id) => MIX_ITEMS[id]);

      mixTall = mixPool.some((id) => MIX_ITEMS[id].tall);

      playerCount = 1;
      document.body.classList.add('racing');

      // 시간은 칠판이 정한 끝 시각으로 센다(늦게 들어오거나 새로 불러온 태블릿도 같이 끝난다).
      clearInterval(timerId);
      timeTotal = r.total;
      const tick = () => {
        timeLeft = Math.max(0, Math.ceil((r.end - Date.now()) / 1000));

    function bellRaceReport() {
      const r = BP.race;
      if (!r || !BP.sock) return;
      r.score = scores[0];

    }
    function bellRaceStop() {

      r.running = false;

      bellPadBig('🏁', '시간 끝!', `${scores[0]}점 · ${r.correct}문제 맞혔어요. 칠판에서 순위를 봐요`, 'good');

    /* ---------- 단원 평가 (태블릿) ---------- */
    // 칠판이 보낸 20문제로 기존 단원 마무리 평가(1명)를 돌린다. 맞았는지는 보여 주지 않고 칠판에만 알린다.
    // 태블릿을 새로 불러와도 이어 풀도록 낸 답(맞음·틀림)을 이 기기에 적어 둔다.
    const EXAM_SAVE_PREFIX = 'polyman-exam:';
    function bellExamLoad(round) {
      try {
        const v = JSON.parse(localStorage.getItem(EXAM_SAVE_PREFIX + round) || 'null');
        return Array.isArray(v) ? v.filter((x) => typeof x === 'boolean').slice(0, EXAM_TOTAL) : [];
      } catch (err) { return []; }
    }
    function bellExamSave() {
      try { localStorage.setItem(EXAM_SAVE_PREFIX + BP.exam.round, JSON.stringify(examLog[0].map((r) => r.correct))); } catch (err) { /* 무시 */ }
    }
    function bellExamForget(keep) {
      try {
        Object.keys(localStorage).filter((k) => k.startsWith(EXAM_SAVE_PREFIX) && k !== EXAM_SAVE_PREFIX + keep).forEach((k) => localStorage.removeItem(k));
      } catch (err) { /* 무시 */ }
    }
    function bellPadExam(v) {
      const left = Math.max(0, Number(v.left) || 0);
      const e = BP.exam;
      if (e && e.round === v.round) {
        // 칠판이 다시 보낸 남은 시간으로 맞춘다
        if (e.end && left) e.end = Date.now() + left;
        if (e.done) bellExamDoneScreen();
        return;
      }
      if (!Array.isArray(v.qs) || v.qs.length !== EXAM_TOTAL) return;
      clearInterval(BP.timer);
      bellExamForget(v.round);
      const log = bellExamLoad(v.round);
      const total = Number(v.total) || 0;
      BP.exam = { round: v.round, qs: v.qs, total, end: total ? Date.now() + left : 0, running: false, done: false, timeUp: false };
      if (log.length >= EXAM_TOTAL || (total && left < 1000)) {
        BP.exam.done = true;
        BP.exam.timeUp = log.length < EXAM_TOTAL;
        bellExamDoneScreen();
        return;
      }
      bellExamGo(log);
    }
    function bellExamGo(log) {
      const e = BP.exam;
      e.running = true;
      // 여러 태블릿이 한꺼번에 읽어 주면 교실이 시끄러우니 평가 중에는 읽어 주기를 끈다
      e.voice = voiceOn;
      if (voiceOn) toggleVoice();
      mode = 'exam';
      playerCount = 1;
      combos = [0];
      examQueues = [e.qs];
      examIndex = [log.length];
      examLog = [log.map((ok, i) => ({ sec: e.qs[i].sec, correct: ok }))];
      scores = [log.filter(Boolean).length * EXAM_POINT];
      players = [createPlayer(0)];
      gameActive = true;
      document.getElementById('mode-title').innerHTML = `<span class="ic">${ICONS.exam}</span>단원 평가`;
      document.getElementById('mode-sub').textContent = `방 ${BP.code} · 문제마다 한 번만 답할 수 있어요`;
      document.body.classList.add('racing', 'exam-quiet');
      showScreen('game-screen');
      renderPlayers();
      // 새로 불러온 태블릿이면 앞서 낸 답을 칠판에 다시 알린다(칠판은 겹친 답을 버린다)
      if (BP.sock) log.forEach((ok, i) => BP.sock.send({ t: 'input', data: { kind: 'exam', round: e.round, i, ok } }));
      clearInterval(timerId);
      if (!e.end) { setTimerUi(0, null); return; }
      timeTotal = e.total;
      const tick = () => {
        timeLeft = Math.max(0, Math.ceil((e.end - Date.now()) / 1000));
        setTimerUi(timeLeft, timeTotal);
        document.getElementById('time-left').textContent = timeLeft > 60 ? `${Math.ceil(timeLeft / 60)}분` : String(timeLeft);
        if (timeLeft <= 0) { e.timeUp = true; finishGame(); }
      };
      timerId = setInterval(() => { if (gameActive) tick(); }, 250);
      tick();
    }
    function bellExamAnswered(p, correct) {
      const e = BP.exam;
      bellExamSave();
      if (BP.sock) BP.sock.send({ t: 'input', data: { kind: 'exam', round: e.round, i: examIndex[0] - 1, ok: correct } });
      // 칸을 다시 그리면 정답·오답 색이 드러나므로 말만 바꾸고 누르지 못하게 막는다
      const cell = document.getElementById('cell-0');
      if (cell) cell.classList.add('exam-sent');
      setMsg(0, '✋ 답을 냈어요');
      blip('tick');
      clearTimeout(nextTimers[0]);
      nextTimers[0] = setTimeout(() => {
        if (!e.running || players[0] !== p) return;
        if (examIndex[0] >= EXAM_TOTAL) { finishGame(); return; }
        const live = document.getElementById('cell-0');
        if (live) live.classList.remove('exam-sent');
        players[0] = createPlayer(0);
        renderCell(0);
      }, 600);
    }
    function bellExamStop() {
      const e = BP.exam;
      if (!e || !e.running) return;
      e.running = false;
      e.done = true;
      stopAll();
      if (e.voice && !voiceOn) toggleVoice();
      document.body.classList.remove('racing', 'exam-quiet');
      if (BP.sock) BP.sock.send({ t: 'input', data: { kind: 'exam', round: e.round, done: true } });
      showScreen('bell-join-screen');
      bellExamDoneScreen();
    }
    function bellExamDoneScreen() {
      const e = BP.exam;
      bellPadBig('📝', e && e.timeUp ? '⏰ 시간이 끝났어요' : '평가를 마쳤어요', '수고했어요! 친구들이 끝날 때까지 조용히 기다려요', 'good');
    }
    // 평가 중에 다른 앱이나 탭으로 나가면 칠판에 알린다(몇 번 나갔는지만 센다)
    document.addEventListener('visibilitychange', () => {
      const e = BP.exam;
      if (document.visibilityState === 'hidden' && e && e.running && BP.sock) BP.sock.send({ t: 'input', data: { kind: 'exam', round: e.round, away: true } });
    });

    // 태블릿에 키보드가 있으면 숫자·지우기·엔터로도 답한다.
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('bell-join-screen').classList.contains('hidden') || !bellPadCanAnswer()) return;
      if (e.target && e.target.tagName === 'INPUT') return;
      const q = BP.view.q;
      if (q.input === 'choice') {
        const i = Number(e.key) - 1;
        if (Number.isInteger(i) && i >= 0 && i < q.choices.length) { bellPadPick(i); e.preventDefault(); }
        return;
      }
      if (/^[0-9]$/.test(e.key)) bellPadKey(e.key);
      else if (e.key === 'Backspace') bellPadKey('del');
      else if (e.key === 'Enter') bellPadSubmit();
      else return;
      e.preventDefault();
    });

    // 골든벨을 하는 중에 칠판 창을 닫거나 새로 불러오면 학생 태블릿이 멈춘 채로 남으니 한 번 묻고, 떠나면 방을 닫는다.
    window.addEventListener('beforeunload', (e) => {
      if (BH.sock && BH.stage !== 'end' && BH.stage !== 'lobby') { e.preventDefault(); e.returnValue = ''; }
    });
    window.addEventListener('pagehide', () => { if (BH.sock) BH.sock.send({ t: 'close' }); });
    window.addEventListener('resize', bellScale);

    function bellBoot() {
      const code = PAGE_PARAMS.get('bell');
      if (code && /^\d{5}$/.test(code)) openBellPad(code);
    }

    /* =========================================================
       키보드 (혼자 할 때)
       ========================================================= */
    document.addEventListener('keydown', (e) => {
      if (!gameActive || playerCount !== 1 || !players[0]) return;
      const p = players[0];
      if (!p.q || p.locked) return;
      const k = p.q.kind;
      if (e.target && e.target.tagName === 'SELECT') return;
      if (k === 'keypad' && /^[0-9]$/.test(e.key)) { kp(0, e.key); e.preventDefault(); return; }
      if (k === 'keypad' && e.key === 'Backspace') { kp(0, 'del'); e.preventDefault(); return; }
      if ((k === 'choice' || k === 'ox') && /^[1-9]$/.test(e.key)) {
        const btn = document.querySelectorAll('#cell-0 .choice')[Number(e.key) - 1];
        if (btn) { btn.click(); e.preventDefault(); }
        return;
      }
      if (e.key === 'Enter') {
        const btn = document.querySelector('#cell-0 .btn-check');
        if (btn) { btn.click(); e.preventDefault(); }
      }
    });

    window.addEventListener('resize', () => {
      if (!players.length || document.getElementById('game-screen').classList.contains('hidden')) return;
      renderPlayers();
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    renderStages();
    renderPlayerSeg();
    animateHero();
    bellBoot();
  </script>
</body>
</html>
