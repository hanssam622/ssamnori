<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --ink: #1d2838;
      --ink-2: #3b4759;
      --muted: #6b7687;
      --line: #e1e8ef;
      --soft: #f3f7fa;
      --teal: #12b3a3;
      --teal-d: #0b8f83;
      --teal-s: #e2f7f4;
      --coral: #ff5b4f;
      --coral-d: #e2443a;
      --coral-s: #ffece9;
      --amber: #ffb12b;
      --amber-s: #fff4dc;
      --good: #1fae6a;
      --bad: #ec5050;
      /* 자리별 색 (교과서 자릿값 표와 같은 계열) */
      --p2: #8a6be0;
      --p1: #f08a24;
      --p0: #22a565;
      --pm1: #3a7ff2;
      --pm2: #e64f95;
      --pm3: #8b5cf0;
      --s: 1;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: #f3faf8;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; padding: 0; }
    .hidden { display: none !important; }

    .samnori-home-float {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 80;
      display: grid;
      place-items: center;
      width: 78px;
      height: 54px;
      border-radius: 18px;
      background: rgba(255,255,255,.94);
      border: 2px solid #ffe3a5;
      color: #8a5b00;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 10px 26px rgba(29, 40, 56, .16);
    }
    body.playing .samnori-home-float,
    body.modal .samnori-home-float { display: none; }

    /* ---------- 숫자 표기 ---------- */
    .num {
      display: inline-flex;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: .01em;
    }
    .dp {
      display: inline-block;
      width: .21em;
      height: .21em;
      margin: 0 .07em;
      border-radius: 50%;
      background: var(--coral);
      flex: 0 0 auto;
    }
    .pl2 { color: var(--p2); }
    .pl1 { color: var(--p1); }
    .pl0 { color: var(--p0); }
    .plm1 { color: var(--pm1); }
    .plm2 { color: var(--pm2); }
    .plm3 { color: var(--pm3); }
    .dg.hi {
      color: #fff;
      background: var(--coral);
      border-radius: .16em;
      padding: 0 .08em;
      margin: 0 .04em;
      box-shadow: 0 .06em 0 var(--coral-d);
    }
    .fr {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      line-height: 1.02;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      margin: 0 .08em;
    }
    .fr > b { font-weight: inherit; padding: 0 .12em; border-bottom: .08em solid currentColor; }
    .fr > i { font-style: normal; padding: 0 .12em; }
    .fr-wrap { display: inline-flex; align-items: center; gap: .12em; font-weight: 900; }

    /* ---------- 공통 배경: 도형판 점 ---------- */
    .screen {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background:
        radial-gradient(circle, rgba(18,179,163,.24) 1.6px, transparent 2.2px) 0 0 / 32px 55.43px,
        radial-gradient(circle, rgba(18,179,163,.24) 1.6px, transparent 2.2px) 16px 27.71px / 32px 55.43px,
        radial-gradient(circle at 10% 8%, rgba(18,179,163,.16), transparent 36%),
        radial-gradient(circle at 92% 14%, rgba(255,91,79,.11), transparent 34%),
        radial-gradient(circle at 72% 96%, rgba(255,177,43,.14), transparent 40%),
        linear-gradient(180deg, #fbfefd 0%, #eef8f6 100%);
    }

    /* ---------- 시작 화면 ---------- */
    .start-wrap {
      min-height: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 48px;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
      align-items: center;
      gap: 28px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 8px 8px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--ink-2);
      font-size: 16px;
      font-weight: 750;
      box-shadow: 0 8px 20px rgba(29,40,56,.06);
    }
    .hero-badge b {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--teal);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }
    .hero-title {
      margin: 22px 0 12px;
      font-size: clamp(58px, 7.8vw, 116px);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -.045em;
      color: var(--ink);
    }
    .hero-title .tdot {
      display: inline-block;
      width: .24em;
      height: .21em;
      margin-left: .05em;
      background: var(--amber);
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      animation: dotHop 2.6s ease-in-out infinite;
    }
    @keyframes dotHop {
      0%, 62%, 100% { transform: translateY(0); }
      70% { transform: translateY(-.42em) scale(.92, 1.08); }
      78% { transform: translateY(0) scale(1.12, .88); }
      86% { transform: translateY(-.1em); }
    }
    .hero-sub {
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 1.7vw, 21px);
      font-weight: 600;
      line-height: 1.65;
      word-break: keep-all;
    }
    .hero-sub strong { color: var(--ink); font-weight: 800; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 30px; }
    .start-btn {
      height: 66px;
      padding: 0 36px;
      border-radius: 22px;
      background: linear-gradient(180deg, #1cc6b5, #0ea193);
      color: #fff;
      font-size: 23px;
      font-weight: 850;
      letter-spacing: -.01em;
      box-shadow: 0 16px 32px rgba(14,161,147,.32), inset 0 -4px 0 rgba(0,0,0,.12);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 38px rgba(14,161,147,.38), inset 0 -4px 0 rgba(0,0,0,.12); }
    .start-btn:active { transform: translateY(1px); }
    .hero-note { color: var(--muted); font-size: 15px; font-weight: 650; }
    .topic-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 30px;
      max-width: 560px;
    }
    .topic-list span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 1.5px solid var(--line);
      font-size: 14.5px;
      font-weight: 750;
      color: var(--ink-2);
    }
    .topic-list span::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c, var(--teal));
    }

    .hero-art { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; justify-self: center; }
    .art-card {
      position: absolute;
      left: 9%;
      top: 13%;
      width: 64%;
      aspect-ratio: 1;
      padding: 14px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 30px 60px rgba(29,61,72,.14);
      transform: rotate(-7deg);
    }
    #hero-fig, #hero-fig .pfig { width: 100%; height: 100%; max-width: none; max-height: none; }
    .art-tag {
      position: absolute;
      left: -20px;
      bottom: 30px;
      z-index: 4;
      padding: 8px 16px;
      border-radius: 16px;
      background: var(--ink);
      color: #fff;
      font-size: 21px;
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 12px 24px rgba(29,40,56,.25);
      transform: rotate(7deg);
    }
    .art-tag .dp { background: var(--coral); }
    .hero-art .kid-art {
      position: absolute;
      right: -2%;
      bottom: -2%;
      width: 66%;
      height: 66%;
      z-index: 2;
      animation: floaty 4.2s ease-in-out infinite;
      filter: drop-shadow(0 18px 22px rgba(29,61,72,.18));
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .bubble {
      position: absolute;
      z-index: 3;
      padding: 8px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 24px rgba(29,40,56,.1);
      font-size: 22px;
      font-weight: 900;
      animation: floaty 5s ease-in-out infinite;
    }
    .bubble.b1 { left: 0; top: 2%; animation-delay: -1s; }
    .bubble.b2 { right: 4%; top: 4%; animation-delay: -2.4s; color: var(--teal-d); }
    .bubble.b3 { left: 6%; bottom: 2%; animation-delay: -3.3s; }
    .bubble.b4 { right: 0; top: 36%; animation-delay: -.6s; font-size: 18px; color: var(--coral-d); }

    .kid-art { background-position: center bottom; background-size: contain; background-repeat: no-repeat; }

    /* ---------- 게임 선택 화면 ---------- */
    .select-wrap { max-width: 1180px; margin: 0 auto; padding: 22px 30px 70px; }
    .select-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .brand-mini { display: flex; align-items: center; gap: 12px; }
    .brand-mini .kid-art {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      background-color: #fff;
      background-size: 120%;
      background-position: center 12%;
      border: 1.5px solid var(--line);
      box-shadow: 0 8px 18px rgba(29,40,56,.08);
    }
    .brand-mini h2 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
    .brand-mini h2 .tdot { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); border-radius: 0 !important; background: var(--amber) !important;
      display: inline-block;
      width: .2em;
      height: .2em;
      margin-left: .04em;
      border-radius: 50%;
      background: var(--coral);
    }
    .brand-mini p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; font-weight: 650; }
    .ghost-btn {
      height: 46px;
      padding: 0 16px;
      border-radius: 15px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--ink-2);
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(29,40,56,.05);
    }
    .ghost-btn:hover { background: #f8fbfc; }

    .settings-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 26px;
      padding: 14px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,.9);
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 30px rgba(29,61,72,.06);
    }
    .setting-row { display: flex; align-items: center; gap: 10px; }
    .setting-label { font-size: 15px; font-weight: 800; color: var(--ink-2); white-space: nowrap; }
    .seg {
      display: inline-flex;
      padding: 4px;
      gap: 2px;
      border-radius: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
    }
    .seg button {
      min-width: 46px;
      height: 40px;
      padding: 0 10px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 800;
      color: var(--muted);
      transition: background .15s, color .15s;
    }
    .seg button.on { background: #fff; color: var(--teal-d); box-shadow: 0 2px 8px rgba(29,40,56,.12); }
    .select, .card-select {
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
    }
    .select:focus, .card-select:focus { outline: none; border-color: var(--teal); }
    .toggle-btn {
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #fff;
      font-size: 15px;
      font-weight: 800;
    }
    .toggle-btn.on { background: var(--teal-s); border-color: #9fdcd3; color: var(--teal-d); }
    .toggle-btn.off { background: var(--soft); color: #98a2b0; }

    .stage-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      margin: 16px -30px 0;
      padding: 12px 30px;
      overflow-x: auto;
      scrollbar-width: none;
      background: linear-gradient(180deg, rgba(246,251,250,.97) 72%, rgba(246,251,250,0));
    }
    .stage-nav::-webkit-scrollbar { display: none; }
    .stage-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px 0 6px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--line);
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .stage-chip b {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--sc, var(--teal));
      color: #fff;
      font-size: 14px;
    }
    .stage-chip:hover { border-color: var(--sc, var(--teal)); }

    .stage { margin-top: 30px; scroll-margin-top: 70px; }
    .stage-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 14px; }
    .stage-no {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--sc, var(--teal));
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 8px 16px color-mix(in srgb, var(--sc, var(--teal)) 30%, transparent);
    }
    .stage-title { margin: 0; font-size: 25px; font-weight: 900; letter-spacing: -.02em; }
    .stage-page {
      padding: 5px 11px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
      gap: 16px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border-radius: 24px;
      background: #fff;
      border: 1.5px solid var(--line);
      box-shadow: 0 8px 22px rgba(29,61,72,.06);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--tb, #bfe5df); box-shadow: 0 18px 36px rgba(29,61,72,.12); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card .ic {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--tint, var(--teal-s));
    }
    .card .ic svg { width: 40px; height: 40px; }
    .card .cap {
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .card h4 { margin: 4px 0 0; font-size: 19px; font-weight: 850; letter-spacing: -.02em; }
    .card p { flex: 1; margin: 0; color: var(--muted); font-size: 14.5px; font-weight: 560; line-height: 1.55; word-break: keep-all; }
    .card .card-select { width: 100%; height: 42px; font-size: 14px; }
    .card .go {
      height: 46px;
      border-radius: 15px;
      background: var(--ink);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      transition: background .15s;
    }
    .card .go:hover { background: #2b3a50; }
    .card.concept { background: linear-gradient(165deg, #edfaf7 0%, #fff 62%); border-color: #c7ece5; }
    .card.concept .go { background: #fff; color: var(--teal-d); border: 1.5px solid #9edfd5; }
    .card.concept .go:hover { background: var(--teal-s); }
    .card.wide { grid-column: span 2; }
    .card .cap.pc { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 4px 7px; background: var(--teal-s); color: var(--teal-d); }
    .card .cap.pc svg { width: 15px; height: 15px; flex: 0 0 auto; }
    .card .cap.pc.lim { background: var(--amber-s); color: #a46a00; }
    .card .cap.pc.over { background: #ffe9e6; color: var(--coral-d); box-shadow: inset 0 0 0 1.5px #ffbdb6; }
    .cap-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 12px 0 0;
      padding: 10px 14px;
      border-radius: 14px;
      background: #fff7e6;
      border: 1px solid #ffe0a3;
      color: #8a5b00;
      font-size: 14.5px;
      font-weight: 650;
      line-height: 1.55;
      word-break: keep-all;
    }
    .cap-note:empty { display: none; }
    .cap-note b { font-weight: 850; }
    .cap-note svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px; color: #e09a0b; }
    .mix-chip .mcap { margin-left: 2px; padding: 2px 7px; border-radius: 999px; background: var(--amber-s); color: #a46a00; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
    .notice-card { width: min(470px, 92vw); }
    .notice-card h2 { font-size: 28px; }
    .notice-ic { width: 66px; height: 66px; margin: 4px auto 4px; display: grid; place-items: center; border-radius: 22px; background: var(--amber-s); color: #e09a0b; }
    .notice-ic svg { width: 38px; height: 38px; }
    .notice-main { margin: 6px 0 8px; font-size: 19px; font-weight: 750; line-height: 1.55; word-break: keep-all; }
    .notice-main b { color: var(--coral-d); font-weight: 900; }
    .notice-why { margin: 0; color: var(--muted); font-size: 15px; font-weight: 600; line-height: 1.6; word-break: keep-all; }
    .notice-now { margin: 14px 0 0; padding: 9px 12px; border-radius: 12px; background: var(--soft); color: var(--ink-2); font-size: 15px; font-weight: 750; }

    /* ---------- 게임 화면 ---------- */
    .game-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .topbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.97);
      z-index: 5;
    }
    .top-title { min-width: 0; text-align: center; }
    .top-title h1 {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      font-size: clamp(20px, 2.5vw, 31px);
      font-weight: 900;
      letter-spacing: -.03em;
      white-space: nowrap;
    }
    .top-title h1 .ic { width: 1.25em; height: 1.25em; flex: 0 0 auto; display: grid; place-items: center; }
    .top-title h1 .ic svg { width: 100%; height: 100%; }
    .top-title p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .timer { position: relative; width: 58px; height: 58px; flex: 0 0 auto; }
    .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer circle { fill: none; stroke-width: 6; }
    .timer .track { stroke: #e8eef3; }
    .timer .bar { stroke: var(--teal); stroke-linecap: round; transition: stroke-dashoffset .95s linear, stroke .3s; }
    .timer span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 19px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .timer.inf span { font-size: 26px; color: var(--teal-d); }
    .timer.warn .bar { stroke: var(--coral); }
    .timer.warn span { color: var(--coral); }
    .top-actions { display: flex; gap: 8px; }
    .top-actions .ghost-btn { height: 44px; padding: 0 12px; font-size: 14px; }

    .players {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      width: 100%;
      overflow: hidden;
    }
    .player-cell {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--cell-bg, #f6fafc);
      border-right: 1px solid rgba(29,40,56,.1);
      border-bottom: 1px solid rgba(29,40,56,.1);
      overflow: hidden;
    }
    .theme-0 { --cell-bg: #fff4f5; --theme: #ec5f7d; }
    .theme-1 { --cell-bg: #f0f7ff; --theme: #3f8be6; }
    .theme-2 { --cell-bg: #f7f2ff; --theme: #8f62e3; }
    .theme-3 { --cell-bg: #effaf3; --theme: #2ea35e; }
    .theme-4 { --cell-bg: #fff8e8; --theme: #e09a0b; }
    .theme-5 { --cell-bg: #ecfaf8; --theme: #129d8f; }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: calc(var(--s) * 9px) calc(var(--s) * 14px) calc(var(--s) * 3px);
    }
    .pname {
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 8px);
      min-width: 0;
      font-size: calc(var(--s) * 19px);
      font-weight: 900;
      white-space: nowrap;
    }
    .pname .av {
      width: calc(var(--s) * 34px);
      height: calc(var(--s) * 34px);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 2px var(--theme);
      font-size: calc(var(--s) * 19px);
    }
    .pname .nm { overflow: hidden; text-overflow: ellipsis; }
    .pscore-wrap { display: flex; align-items: center; gap: 6px; }
    .prog-chip {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      color: var(--muted);
      font-size: calc(var(--s) * 14px);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .combo-chip {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--amber);
      color: #fff;
      font-size: calc(var(--s) * 14px);
      font-weight: 900;
      white-space: nowrap;
      animation: pop .4s ease both;
    }
    .pscore {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px 4px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--theme);
      font-size: calc(var(--s) * 18px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(29,40,56,.07);
    }
    .pscore svg { width: 1em; height: 1em; }
    .pscore.bump { animation: bump .5s ease; }
    @keyframes bump { 40% { transform: scale(1.25); } }

    .cell-body {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      gap: calc(var(--s) * 10px);
      padding: calc(var(--s) * 6px) calc(var(--s) * 14px);
      overflow-y: auto;
      overflow-x: hidden;
    }
    /* 혼자 할 때 넓은 화면에서 내용이 끝까지 늘어나지 않게 한다 */
    .cell-body > * { width: 100%; max-width: calc(var(--s) * 620px); align-self: center; }
    .controls { width: 100%; max-width: calc(var(--s) * 760px); justify-self: center; }
    .q-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--s) * 10px);
      padding: calc(var(--s) * 12px);
      border-radius: calc(var(--s) * 20px);
      background: #fff;
      box-shadow: 0 6px 18px rgba(29,40,56,.07);
    }
    .q-text {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--s) * 8px);
      width: 100%;
      font-size: calc(var(--s) * 18px);
      font-weight: 800;
      line-height: 1.42;
      text-align: center;
      word-break: keep-all;
    }
    .q-text .num { font-size: 1.1em; }
    .spk {
      flex: 0 0 auto;
      width: calc(var(--s) * 34px);
      height: calc(var(--s) * 34px);
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--soft);
      color: var(--muted);
    }
    .spk svg { width: 58%; height: 58%; }
    .spk:hover { background: #e9f0f5; color: var(--ink-2); }
    .big-num { font-size: calc(var(--s) * 50px); line-height: 1.1; }
    .mid-num { font-size: calc(var(--s) * 34px); line-height: 1.15; }
    .q-sub { color: var(--muted); font-size: calc(var(--s) * 14px); font-weight: 700; text-align: center; word-break: keep-all; }
    .q-sub b { color: var(--ink); }

    .choices { display: grid; gap: calc(var(--s) * 8px); grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choices.c1 { grid-template-columns: minmax(0, 1fr); }
    .choices.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .choices.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .choice {
      min-height: calc(var(--s) * 58px);
      padding: calc(var(--s) * 6px) calc(var(--s) * 8px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: calc(var(--s) * 16px);
      background: #fff;
      border: 2px solid #e2e9f0;
      box-shadow: 0 4px 0 #e2e9f0;
      font-size: calc(var(--s) * 23px);
      font-weight: 850;
      line-height: 1.25;
      text-align: center;
      word-break: keep-all;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .choice:active { transform: translateY(3px); box-shadow: 0 1px 0 #e2e9f0; }
    .choice.txt { font-size: calc(var(--s) * 17px); }
    .choice.sign { font-size: calc(var(--s) * 36px); min-height: calc(var(--s) * 64px); }
    .choice.wrong { background: #fff2f2; border-color: #f5b9b9; box-shadow: 0 4px 0 #f5b9b9; color: #c13b3b; opacity: .72; }
    .choice.right { background: #e9faf1; border-color: #84d8ae; box-shadow: 0 4px 0 #84d8ae; color: #12804a; }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: calc(var(--s) * 7px) calc(var(--s) * 14px) calc(var(--s) * 12px);
    }
    .players.narrow .controls { grid-template-columns: minmax(0, 1fr); }
    /* 좁은 칸(5~6명)에서는 폭이 고정된 부품을 따로 줄인다 */
    .players.narrow .cell-body { padding-left: 10px; padding-right: 10px; }
    .players.narrow .q-card { padding: calc(var(--s) * 10px) 8px; }
    .players.narrow .vcalc { --W: calc(var(--s) * 44px); --D: calc(var(--s) * 13px); --H: calc(var(--s) * 54px); padding: 6px; font-size: calc(var(--s) * 33px); }
    .players.narrow .vc-h { margin: 0 1px; font-size: max(9px, calc(var(--s) * 10.5px)); letter-spacing: -.03em; }
    .players.narrow .vc-help { height: calc(var(--s) * 26px); }
    .players.narrow .aboard { --W: calc(var(--s) * 44px); --D: calc(var(--s) * 13px); padding: 8px calc(var(--W) * .5); font-size: calc(var(--s) * 33px); }
    .players.narrow .aboard .guide { right: calc(var(--W) * .5 + var(--W) * var(--fa) + var(--D) / 2); }
    .players.narrow .sboard { --W: calc(var(--s) * 40px); --D: calc(var(--s) * 13px); --H: calc(var(--s) * 56px); }
    .players.narrow .sboard .heads span { margin: 0 1px; font-size: max(9px, calc(var(--s) * 10.5px)); letter-spacing: -.04em; }
    .players.narrow .stile, .players.narrow .szero { font-size: calc(var(--s) * 30px); }
    .players.narrow .shift-btn { padding: 0 calc(var(--s) * 10px); font-size: calc(var(--s) * 14px); }
    .players.narrow .hgrids { width: 100%; flex-wrap: nowrap; }
    .players.narrow .hgrids .hgrid { width: min(100%, calc(var(--s) * 230px)); height: auto; aspect-ratio: 1; }
    .players.narrow .hgrids.n2 .hgrid { width: calc(50% - 5px); }
    .players.xnarrow .hgrids.n2 { flex-direction: column; align-items: center; }
    .players.xnarrow .hgrids.n2 .hgrid { width: min(100%, calc(var(--s) * 170px)); }
    .players.xnarrow .hgrids.n2.xl .hgrid { width: min(100%, calc(var(--s) * 230px)); }
    .players.narrow .message { font-size: max(12px, calc(var(--s) * 15px)); }
    .players.narrow .q-text { font-size: max(13px, calc(var(--s) * 18px)); }
    .players.narrow .ans-line { font-size: calc(var(--s) * 25px); gap: calc(var(--s) * 5px); }
    .players.narrow .ans-box { min-width: calc(var(--s) * 104px); height: calc(var(--s) * 54px); font-size: calc(var(--s) * 30px); }
    .players.narrow .story { padding: 10px; gap: 8px; }
    .players.narrow .story .em { width: calc(var(--s) * 40px); height: calc(var(--s) * 40px); font-size: calc(var(--s) * 24px); }
    .players.narrow .story p { font-size: max(13px, calc(var(--s) * 16px)); line-height: 1.5; }
    .players.narrow .vchar { --W: calc(var(--s) * 27px); --D: calc(var(--s) * 10px); padding: 8px 10px; font-size: calc(var(--s) * 24px); }
    .players.narrow .oslot { min-width: calc(var(--s) * 50px); }
    .players.narrow .cmp { font-size: calc(var(--s) * 26px); gap: calc(var(--s) * 6px); }
    .players.narrow .cmp-slot { width: calc(var(--s) * 40px); height: calc(var(--s) * 40px); font-size: calc(var(--s) * 26px); }
    /* 글자로 된 보기만 한 줄로 쌓고, 짧은 수 보기는 두 줄 그대로 둔다 */
    .players.narrow .choices.c2.txtc,
    .players.narrow .choices.c4,
    .players.narrow .ocards { grid-template-columns: minmax(0, 1fr); }
    .players.narrow .btns { justify-content: flex-end; }
    .message {
      min-height: calc(var(--s) * 40px);
      display: flex;
      align-items: center;
      padding: calc(var(--s) * 6px) calc(var(--s) * 12px);
      border-radius: 12px;
      background: rgba(255,255,255,.82);
      color: var(--muted);
      font-size: calc(var(--s) * 14.5px);
      font-weight: 700;
      line-height: 1.38;
      word-break: keep-all;
    }
    .message b { color: var(--ink); }
    .message .num { font-size: 1.05em; }
    .message.ok { background: #e5f8ee; color: #12744a; }
    .message.no { background: #ffeded; color: #b23535; }
    .message.hint { background: #fff5dc; color: #8f5c08; }
    .btns { display: flex; gap: 6px; }
    .btn-check {
      height: calc(var(--s) * 46px);
      min-width: calc(var(--s) * 78px);
      padding: 0 calc(var(--s) * 14px);
      border-radius: 14px;
      background: linear-gradient(180deg, #1cc6b5, #0ea193);
      color: #fff;
      font-size: calc(var(--s) * 17px);
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(14,161,147,.28), inset 0 -3px 0 rgba(0,0,0,.1);
    }
    .btn-check:active { transform: translateY(1px); }
    .btn-sub {
      height: calc(var(--s) * 46px);
      padding: 0 calc(var(--s) * 12px);
      border-radius: 14px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--muted);
      font-size: calc(var(--s) * 15px);
      font-weight: 800;
      white-space: nowrap;
    }

    /* ---------- 답 입력 (키패드) ---------- */
    .ans-line {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: calc(var(--s) * 8px);
      font-size: calc(var(--s) * 30px);
      font-weight: 900;
    }
    .ans-box {
      min-width: calc(var(--s) * 130px);
      height: calc(var(--s) * 60px);
      padding: 0 calc(var(--s) * 14px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: calc(var(--s) * 16px);
      background: #fff;
      border: 2.5px solid var(--teal);
      box-shadow: 0 0 0 5px rgba(18,179,163,.13);
      font-size: calc(var(--s) * 36px);
      font-weight: 900;
    }
    .ans-box .ph { color: #c4ced9; }
    .ans-box .caret {
      width: 3px;
      height: 58%;
      margin-left: 3px;
      border-radius: 2px;
      background: var(--teal);
      animation: blink 1s steps(1) infinite;
    }
    .ans-box.bad { border-color: var(--bad); box-shadow: 0 0 0 5px rgba(236,80,80,.13); }
    @keyframes blink { 50% { opacity: 0; } }
    .unit-txt { color: var(--muted); font-size: calc(var(--s) * 22px); font-weight: 800; }
    .keypad { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(var(--s) * 6px); }
    .keypad.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .key {
      height: calc(var(--s) * 48px);
      border-radius: 12px;
      background: #fff;
      border: 1.5px solid #e0e7ee;
      box-shadow: 0 3px 0 #e0e7ee;
      font-size: calc(var(--s) * 23px);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }
    .key:active { transform: translateY(2px); box-shadow: 0 1px 0 #e0e7ee; }
    .key.fn { background: #f2f6f9; color: var(--muted); font-size: calc(var(--s) * 18px); }
    .key.dotk { display: grid; place-items: center; }
    .key.dotk i { width: calc(var(--s) * 11px); height: calc(var(--s) * 11px); border-radius: 50%; background: var(--coral); }

    /* ---------- 도형 그림 ---------- */
    .pfig { display: block; width: 100%; max-width: calc(var(--s) * 280px); height: auto; max-height: calc(var(--s) * 205px); margin: 0 auto; overflow: visible; }
    .pfig .vl { font: 800 15px Pretendard, sans-serif; fill: #1d2838; }
    .pfig .sl { font: 800 13.5px Pretendard, sans-serif; fill: #c4620a; }
    .pfig .al { font: 800 12.5px Pretendard, sans-serif; fill: #a8500a; }
    .pfig.lab { max-width: calc(var(--s) * 380px); max-height: calc(var(--s) * 260px); }
    .players.narrow .pfig.lab { max-height: calc(var(--s) * 158px); }
    .players.narrow .choices.c1 .choice.txt { min-height: 0; padding-top: calc(var(--s) * 9px); padding-bottom: calc(var(--s) * 9px); }
    .fig-row { display: flex; gap: calc(var(--s) * 8px); justify-content: center; align-items: center; }
    .fig-row .pfig { width: calc(50% - 4px); }
    .choices.figs .choice { padding: calc(var(--s) * 6px); min-height: 0; }
    .choice .card-fig { width: 100%; max-width: none; height: calc(var(--s) * 108px); max-height: none; }
    .players.narrow .choice .card-fig { height: calc(var(--s) * 84px); }
    .choice.right .card-fig path, .choice.wrong .card-fig path { opacity: .92; }
    .lat { display: block; width: 100%; height: auto; overflow: visible; }
    .lat.pbm { max-width: calc(var(--s) * 270px); max-height: calc(var(--s) * 180px); margin: 0 auto; }
    .fc-row { display: flex; align-items: center; justify-content: center; gap: calc(var(--s) * 14px); }
    .fc-row .lat { width: calc(var(--s) * 240px); max-width: 72%; max-height: calc(var(--s) * 170px); }
    .fc-pc { display: grid; place-items: center; padding: calc(var(--s) * 8px); border-radius: 14px; background: var(--soft); }
    .pb-eq { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: calc(var(--s) * 8px); }
    .pb-chip { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; font-size: calc(var(--s) * 13px); font-weight: 800; color: var(--ink-2); }
    .pb-op { font-size: calc(var(--s) * 30px); font-weight: 900; color: var(--ink-2); }
    .pb-x { font-size: calc(var(--s) * 22px); font-weight: 900; color: var(--coral-d); }
    .pc-fig { display: block; overflow: visible; }
    .pb-card { display: grid; place-items: center; min-height: calc(var(--s) * 84px); }
    .life-fig { display: block; width: calc(var(--s) * 150px); height: calc(var(--s) * 150px); margin: 0 auto; }
    .life-fig text { font-family: Pretendard, sans-serif; }
    .players.narrow .choices.txtc.short { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .players.narrow .life-fig { width: calc(var(--s) * 124px); height: calc(var(--s) * 124px); }
    .lhs-t { margin-right: calc(var(--s) * 4px); font-size: calc(var(--s) * 17px); font-weight: 800; color: var(--ink-2); white-space: normal; word-break: keep-all; text-align: right; }

    /* ---------- 도형판 · 대각선 · 조각판 ---------- */
    .geo-wrap, .dg-wrap, .tile-wrap { display: flex; justify-content: center; width: 100%; }
    .geo { display: block; width: 100%; max-width: calc(var(--s) * 340px); max-height: calc(var(--s) * 320px); height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
    .geo .hit, .dg .hit { cursor: pointer; }
    .geo .pulse { animation: ringPulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ringPulse { 0%, 100% { transform: scale(.85); opacity: 1; } 50% { transform: scale(1.25); opacity: .45; } }
    .dg { display: block; width: 100%; max-width: calc(var(--s) * 330px); max-height: calc(var(--s) * 250px); height: auto; overflow: visible; touch-action: none; user-select: none; -webkit-user-select: none; }
    .dg .vl { font: 900 17px Pretendard, sans-serif; fill: #1d2838; pointer-events: none; }
    .lat.tap { width: 100%; max-height: calc(var(--s) * 300px); touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
    .lat.tap.bboard { max-width: calc(var(--s) * 360px); max-height: calc(var(--s) * 280px); }
    .lat.tap.fboard { max-width: calc(var(--s) * 400px); }
    .lat .ghost { fill-opacity: .55; stroke: #1d2838; stroke-width: .05; stroke-dasharray: .12 .08; pointer-events: none; }
    .lat [data-pc] { cursor: pointer; }
    .pb-pal { display: flex; justify-content: center; flex-wrap: wrap; gap: calc(var(--s) * 6px); }
    .pb-btn { display: inline-flex; align-items: center; gap: calc(var(--s) * 6px); min-height: calc(var(--s) * 48px); padding: 4px calc(var(--s) * 10px); border-radius: 14px; background: #fff; border: 2px solid var(--line); box-shadow: 0 3px 0 #e2e9f0; font-size: calc(var(--s) * 14px); font-weight: 850; color: var(--ink-2); }
    .pb-btn.on { border-color: var(--teal); background: var(--teal-s); color: var(--ink); box-shadow: 0 3px 0 #9edfd5, 0 0 0 3px rgba(18,179,163,.18); }
    .pb-btn.out { opacity: .4; }
    .pb-btn b { color: var(--coral-d); }
    .players.narrow .pb-btn span { display: none; }
    .players.short .lat.tap { max-height: calc(var(--s) * 230px); }
    .players.short .lat.tap.bboard { max-height: calc(var(--s) * 220px); }
    .players.short .geo { max-height: calc(var(--s) * 250px); }
    .players.short .dg { max-height: calc(var(--s) * 200px); }
    .players.short .pfig { max-height: calc(var(--s) * 160px); }
    .players.short .pfig.lab { max-height: calc(var(--s) * 145px); }
    .players.short .choice .card-fig { height: calc(var(--s) * 84px); }
    .players.short .pb-btn { min-height: calc(var(--s) * 42px); }
    .players.narrow .pb-btn { min-width: calc(var(--s) * 52px); justify-content: center; }

    /* ---------- 개념 그림 ---------- */
    .cfig-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; }
    .cfig { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 800; color: var(--ink-2); text-align: center; }
    .cfig .pfig { width: 92px; max-width: none; max-height: none; }
    .cfig.wide .pfig { width: 170px; }

    .bell-room { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: var(--amber-s); color: #8a5b00; font-size: 15px; font-weight: 850; white-space: nowrap; }

    .bell-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: calc(var(--s) * 14px) 18px 18px; }
    .bell-panel { padding: 18px; border-radius: 24px; background: #fff; box-shadow: 0 8px 24px rgba(29,40,56,.08); }

    .bell-rosterbox { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

    .bell-chips { flex: 1 1 auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; min-height: 160px; padding: 12px; border-radius: 18px; background: var(--soft); overflow-y: auto; }
    .bell-chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px 0 10px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(29,40,56,.08); font-size: 18px; font-weight: 850; animation: pop .35s ease both; }

    .bell-chip .x:hover { background: #ffeded; color: var(--bad); }
    .bell-empty { margin: auto; color: var(--muted); font-size: 16px; font-weight: 700; line-height: 1.6; text-align: center; }
    .bell-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: var(--ink-2); font-size: 16px; font-weight: 800; }
    .bell-sum .ghost-btn { height: 40px; margin-left: auto; }
    .bell-go { height: 66px; border-radius: 20px; font-size: 23px; }

    .bell-play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 16px; max-width: 1440px; margin: 0 auto; }
    .bell-main { min-width: 0; display: flex; flex-direction: column; gap: calc(var(--s) * 12px); }
    .bell-main > * { width: 100%; max-width: calc(var(--s) * 820px); align-self: center; }
    .bell-qhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
    .bell-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #fff; color: var(--ink-2); font-size: calc(var(--s) * 14px); font-weight: 800; box-shadow: 0 2px 8px rgba(29,40,56,.07); }
    .bell-tag svg { width: calc(var(--s) * 22px); height: calc(var(--s) * 22px); }
    .bell-tag.no { background: var(--ink); color: #fff; }
    .bell-show .choice { position: relative; cursor: default; }
    .bell-show .choice:active { transform: none; box-shadow: 0 4px 0 #e2e9f0; }
    .bell-show .choice .mk { position: absolute; left: 8px; top: 7px; width: calc(var(--s) * 22px); height: calc(var(--s) * 22px); display: grid; place-items: center; border-radius: 50%; background: var(--soft); color: var(--muted); font-size: calc(var(--s) * 12px); font-weight: 900; }
    .bell-show .choice .ct { position: absolute; right: 8px; top: 7px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.85); color: var(--ink-2); font-size: calc(var(--s) * 13px); font-weight: 900; }
    .bell-show .choice.dim { opacity: .4; }
    .bell-padnote { margin: 0; color: var(--teal-d); font-size: calc(var(--s) * 18px); font-weight: 850; text-align: center; }
    .bell-faces { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; min-height: calc(var(--s) * 30px); font-size: calc(var(--s) * 24px); }
    .bell-faces span { animation: pop .3s ease both; }
    .bell-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
    .bell-foot.end { justify-content: center; }
    .bell-count { font-size: calc(var(--s) * 17px); font-weight: 850; white-space: nowrap; }
    .bell-count b { color: var(--teal-d); font-size: 1.3em; }
    .bell-bar { flex: 1 1 120px; height: 12px; border-radius: 999px; background: #e3ebf0; overflow: hidden; }
    .bell-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1cc6b5, #0ea193); transition: width .3s; }
    .bell-next { min-width: 220px; height: calc(var(--s) * 56px); font-size: calc(var(--s) * 19px); }
    .bell-next small { margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.25); font-size: .8em; }
    .bell-result-head { margin: 0; font-size: calc(var(--s) * 24px); font-weight: 900; text-align: center; }
    .bell-result-head b { color: var(--good); }
    .bell-ans { border-color: var(--good); box-shadow: 0 0 0 5px rgba(31,174,106,.15); color: #12804a; }
    .bell-explain { margin: 0; padding: 12px 16px; border-radius: 16px; background: var(--teal-s); font-size: calc(var(--s) * 17px); font-weight: 750; line-height: 1.6; text-align: center; word-break: keep-all; }
    .bell-side { position: sticky; top: 0; align-self: start; display: flex; flex-direction: column; gap: 10px; }
    .bell-side h3 { margin: 0; font-size: 19px; font-weight: 900; }
    .bell-leaders { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .bell-leader { display: grid; grid-template-columns: 28px 30px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 14px; background: var(--soft); font-size: 16px; font-weight: 850; }
    .bell-leader.r1 { background: #fff5d6; }
    .bell-leader .rk { color: var(--muted); font-weight: 900; text-align: center; }
    .bell-leader .em { font-size: 22px; text-align: center; }
    .bell-leader .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bell-leader .pt { text-align: right; font-variant-numeric: tabular-nums; }
    .bell-leader .pt small { display: block; color: var(--good); font-size: 12px; }
    .bell-more { margin: 0; color: var(--muted); font-size: 14px; font-weight: 700; text-align: center; }

    .bell-end { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 980px; margin: 0 auto; text-align: center; }
    .bell-end h2 { margin: 0; font-size: calc(var(--s) * 38px); font-weight: 900; letter-spacing: -.03em; }
    .bell-end .sub { margin: -6px 0 0; color: var(--muted); font-weight: 700; }
    .bell-podium { display: flex; align-items: flex-end; justify-content: center; gap: 14px; width: 100%; }
    .bell-pod { flex: 0 1 220px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bell-pod .em { font-size: calc(var(--s) * 54px); line-height: 1.1; animation: rise .5s both; }
    .bell-pod .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(var(--s) * 22px); font-weight: 900; }
    .bell-pod .pt { color: var(--muted); font-weight: 800; }
    .bell-pod .block { width: 100%; display: grid; place-items: start center; padding-top: 10px; border-radius: 18px 18px 6px 6px; color: #fff; font-size: calc(var(--s) * 32px); font-weight: 900; }
    .bell-pod.p1 .block { height: calc(var(--s) * 160px); background: linear-gradient(180deg, #ffc531, #f0a500); }
    .bell-pod.p2 .block { height: calc(var(--s) * 115px); background: linear-gradient(180deg, #c9d3dd, #9fadbb); }
    .bell-pod.p3 .block { height: calc(var(--s) * 85px); background: linear-gradient(180deg, #eab385, #cf8a4f); }
    .bell-rest { width: min(620px, 100%); }

    /* 학생 태블릿 */
    .bell-pad { display: flex; flex-direction: column; }
    .bp-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
    .bp-me { flex: 1 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 8px; overflow: hidden; font-size: 19px; font-weight: 900; white-space: nowrap; text-overflow: ellipsis; }

    .bp-room { color: var(--muted); font-size: 14px; font-weight: 800; white-space: nowrap; }
    .bp-dot { flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; background: #c4ced9; }
    .bp-dot.open { background: var(--good); }
    .bp-dot.connecting { background: var(--amber); animation: blink 1s infinite; }
    .bp-top .ghost-btn { height: 40px; padding: 0 12px; font-size: 14px; }
    .bp-body { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: safe center; gap: calc(var(--s) * 12px); width: 100%; max-width: 760px; margin: 0 auto; padding: 16px; }
    .bp-form { display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 26px; background: #fff; box-shadow: 0 10px 30px rgba(29,40,56,.1); }

    .bp-field input { height: 56px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--line); color: var(--ink); font: inherit; font-size: 22px; font-weight: 850; user-select: text; -webkit-user-select: text; }
    .bp-field input:focus { outline: none; border-color: var(--teal); }
    .bp-field input.code { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
    .bp-animals { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
    .bp-animals button { height: 54px; border-radius: 14px; border: 2px solid transparent; background: var(--soft); font-size: 30px; }
    .bp-animals button.on { border-color: var(--teal); background: var(--teal-s); }
    .bp-err { min-height: 1.4em; margin: 0; color: var(--bad); font-weight: 800; text-align: center; }
    .bp-form .btn-main, .bp-big .btn-main { height: 60px; font-size: 20px; }
    .bp-big { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 18px; border-radius: 26px; background: #fff; box-shadow: 0 10px 30px rgba(29,40,56,.1); text-align: center; }
    .bp-big .emo { font-size: 76px; line-height: 1; animation: pop .45s ease both; }
    .bp-big h2 { margin: 0; font-size: 32px; font-weight: 900; word-break: keep-all; }
    .bp-big p { margin: 0; color: var(--ink-2); font-size: 19px; font-weight: 750; line-height: 1.55; word-break: keep-all; }
    .bp-big.good h2 { color: #12804a; }
    .bp-big.bad h2 { color: #c13b3b; }
    .bp-big .ans { padding: 8px 16px; border-radius: 14px; background: var(--soft); font-size: 22px; font-weight: 850; }
    .bp-big .bp-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
    .bp-big .bp-btns .ghost-btn { height: 60px; }
    .bp-qhead { display: flex; align-items: center; gap: 10px; font-size: calc(var(--s) * 17px); font-weight: 900; }
    .bp-time { flex: 1 1 auto; height: 12px; border-radius: 999px; background: #e3ebf0; overflow: hidden; }
    .bp-time i { display: block; width: 100%; height: 100%; border-radius: inherit; background: var(--teal); transform-origin: left; transition: transform .2s linear; }
    .bp-time.warn i { background: var(--coral); }
    .bp-left { min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
    .bp-q { display: flex; flex-direction: column; gap: calc(var(--s) * 12px); }
    .bp-q .choice.picked { border-color: var(--teal); background: var(--teal-s); box-shadow: 0 4px 0 var(--teal); color: var(--teal-d); }
    .bp-q.locked .choice:not(.picked) { opacity: .4; }
    .bp-q.locked .keypad, .bp-q.locked .bp-submit { display: none; }
    .bp-submit { width: 100%; height: calc(var(--s) * 60px); font-size: calc(var(--s) * 20px); }
    .bp-msg:empty { display: none; }
    .bp-msg { padding: 12px; border-radius: 16px; background: var(--amber-s); color: #8f5c08; font-size: calc(var(--s) * 18px); font-weight: 850; text-align: center; }
    .bp-msg.hint { background: #ffeded; color: #b23535; }

    /* 시간 대결 */
    body.racing .game-exit, body.racing .game-finish { display: none; }
    .race-board { display: flex; flex-direction: column; gap: 14px; max-width: 1280px; margin: 0 auto; }
    .race-head { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .race-clock { font-size: calc(var(--s) * 64px); font-weight: 900; line-height: 1; color: var(--teal-d); font-variant-numeric: tabular-nums; }
    .race-clock.warn { color: var(--coral); }
    .race-info { margin: 0; color: var(--ink-2); font-size: calc(var(--s) * 16px); font-weight: 750; text-align: center; word-break: keep-all; }
    .race-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .race-list.two { grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); }
    .race-row { display: grid; grid-template-columns: 34px 34px minmax(70px, 150px) minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 16px; background: #fff; box-shadow: 0 4px 12px rgba(29,40,56,.06); font-size: calc(var(--s) * 17px); font-weight: 850; }

    .race-row .rk { color: var(--muted); font-weight: 900; text-align: center; }
    .race-row .em { font-size: 1.5em; text-align: center; }
    .race-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .race-count { color: var(--teal-d); font-size: 64px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }

    /* 단원 평가 (반 전체) */
    .exam-note { display: grid; gap: 6px; margin-top: 12px; padding: 14px 16px; border-radius: 20px; background: #f3efff; }
    .exam-note p { margin: 0; color: var(--ink-2); font-size: 15px; font-weight: 700; line-height: 1.6; word-break: keep-all; }
    .exam-note b { color: #6b3fd6; }
    .exam-privacy { margin: 4px 0 0; color: #6b3fd6; font-size: 14px; font-weight: 800; word-break: keep-all; }
    .bell-chip.warn { background: #ffeded; color: var(--bad); }
    .exam-pv-card { width: min(1180px, 96vw); padding: 22px 22px 0; text-align: left; }
    .exam-pv-head h2 { margin: 0 0 4px; font-size: 28px; }
    .exam-pv-head p { margin: 0; color: var(--muted); font-weight: 700; word-break: keep-all; }
    .exam-pv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; margin-top: 14px; }
    .exam-pv { --s: .72; display: flex; flex-direction: column; min-width: 0; border: 1.5px solid var(--line); border-radius: 18px; background: #fff; overflow: hidden; }
    .exam-pv header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--soft); font-size: 14px; font-weight: 800; color: var(--ink-2); }
    .exam-pv header b { display: grid; place-items: center; min-width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; }
    .exam-pv header .ghost-btn { height: 34px; margin-left: auto; padding: 0 10px; font-size: 13px; }
    .exam-pv header .rate { margin-left: auto; color: var(--good); }
    .exam-pv header .rate.low { color: var(--bad); }
    .exam-pv-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 10px; pointer-events: none; }
    .exam-pv-body .keypad, .exam-pv-body .spk, .exam-pv-body .btns { display: none; }
    .exam-pv footer { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px dashed var(--line); color: var(--good); font-size: 15px; font-weight: 850; }
    .exam-pv footer .ans { color: var(--ink); }
    .exam-pv-card .mix-btns { position: sticky; bottom: 0; justify-content: flex-end; margin: 14px -22px 0; padding: 12px 22px 16px; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); }
    .exam-names-card { width: min(520px, 94vw); text-align: left; }
    .exam-names-card h2 { font-size: 26px; }
    .exam-names-card p { margin: 0 0 8px; color: var(--ink-2); font-weight: 700; line-height: 1.6; word-break: keep-all; }
    .exam-names-card textarea { width: 100%; padding: 12px; border: 2px solid var(--line); border-radius: 14px; font: inherit; font-size: 16px; line-height: 1.5; resize: vertical; }
    .exam-names-card .mix-btns { justify-content: flex-end; margin-top: 12px; }
    .exam-row { grid-template-columns: minmax(56px, 110px) minmax(0, 1fr) 5em 3.2em; }
    .exam-row.done { background: #ecfbf3; }
    .exam-row .ok { min-width: 0; color: var(--ink-2); }
    .exam-row.done .ok { color: var(--good); }
    .exam-row .away { color: var(--coral); font-size: .85em; text-align: right; }
    .exam-end { display: flex; flex-direction: column; gap: 14px; max-width: 1180px; margin: 0 auto; }
    .exam-end-head { text-align: center; }
    .exam-end-head h2 { margin: 0; font-size: calc(var(--s) * 36px); font-weight: 900; }
    .exam-end-head .sub { margin: 4px 0 0; color: var(--ink-2); font-size: 18px; font-weight: 800; }
    .exam-end-head .sub b { color: var(--teal-d); font-size: 1.3em; }
    .exam-end h3 { margin: 0 0 10px; font-size: 20px; font-weight: 900; }
    .exam-rates { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 6px 18px; margin: 0 0 8px; padding: 0; list-style: none; }
    .exam-rates li { display: grid; grid-template-columns: 28px 8.5em minmax(0, 1fr) 3.2em; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; }
    .exam-rates .no { display: grid; place-items: center; height: 26px; border-radius: 8px; background: var(--soft); }
    .exam-rates .sec { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .exam-rates .track { height: 12px; border-radius: 999px; background: #e9eff3; overflow: hidden; }
    .exam-rates .track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1cc6b5, #0ea193); }
    .exam-rates b { text-align: right; font-variant-numeric: tabular-nums; }
    .exam-rates li.low .track i { background: linear-gradient(90deg, #ff8a7a, #e5484d); }
    .exam-rates li.low b, .exam-rates li.low .no { color: var(--bad); }
    .exam-res-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .exam-res-head h3 { margin: 0; }
    .exam-res-head .ghost-btn { height: 40px; }
    .exam-table-wrap { overflow-x: auto; }
    .exam-table { width: 100%; border-collapse: collapse; font-size: 14px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .exam-table th, .exam-table td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    .exam-table th { color: var(--muted); font-size: 12.5px; }
    .exam-table .o { color: var(--good); }
    .exam-table .x { color: var(--bad); font-weight: 900; }

    .exam-table .nm { text-align: left; }
    .bp-nos { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
    .bp-nos button { height: 52px; border-radius: 14px; border: 2px solid transparent; background: var(--soft); font-size: 20px; font-weight: 850; }
    .bp-nos button.on { border-color: #8b5cf0; background: #efeaff; color: #6b3fd6; }
    body.exam-quiet .pscore { display: none; }
    .player-cell.exam-sent .cell-body, .player-cell.exam-sent .btns { pointer-events: none; opacity: .55; }

    @media (max-width: 860px) {
      .bell-lobby, .bell-play { grid-template-columns: minmax(0, 1fr); }

<body>
  <a class="samnori-home-float" href="https://hanssam622.github.io/ssamnori/" aria-label="쌤노리 홈화면으로 가기">쌤노리 홈</a>

  <section id="start-screen" class="screen">
    <div class="start-wrap">
      <div class="hero-text">
        <span class="hero-badge"><b>4-2</b>4단원 · 다각형</span>
        <h1 class="hero-title">다각형맨<span class="tdot"></span></h1>
        <p class="hero-sub">선분으로만 둘러싸인 도형부터 정다각형, 대각선, 모양 조각까지 <br /><strong>도형판 · 대각선 긋기 · 모양 조각</strong>으로 직접 해 봐요</p>
        <div class="hero-actions">
          <button class="start-btn" type="button" onclick="showScreen('game-select-screen')">시작하기 →</button>
          <span class="hero-note">1~6명이 한 화면에서 함께 겨뤄요</span>
        </div>
        <div class="topic-list" aria-hidden="true">
          <span style="--c:var(--p0)">다각형</span>
          <span style="--c:var(--p1)">정다각형</span>
          <span style="--c:var(--pm1)">대각선</span>
          <span style="--c:var(--teal)">모양 만들기</span>
          <span style="--c:var(--pm2)">모양 채우기</span>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="art-card">
          <div id="hero-fig"></div>
          <span class="art-tag" id="hero-tag">삼각형 · 대각선 0개</span>
        </div>
        <div class="kid-art"></div>
        <span class="bubble b1">오각형</span>
        <span class="bubble b2">정육각형</span>
        <span class="bubble b3">대각선</span>
        <span class="bubble b4">모양 조각</span>
      </div>
    </div>
  </section>

  <section id="game-select-screen" class="screen hidden">
    <div class="select-wrap">
      <div class="select-head">
        <div class="brand-mini">
          <div class="kid-art"></div>
          <div>
            <h2>다각형맨<span class="tdot"></span></h2>
            <p>4학년 2학기 · 4. 다각형</p>
          </div>
        </div>
        <div class="head-btns">
          <button class="ghost-btn bell-hl" type="button" onclick="openBellSetup()">🔔 골든벨</button>
          <button class="ghost-btn hl" type="button" onclick="openWorksheet()">🖨 학습지 만들기</button>
          <button class="ghost-btn" type="button" onclick="showScreen('start-screen')">← 처음으로</button>
        </div>
      </div>

      <div class="settings-bar">
        <div class="setting-row">
          <span class="setting-label">참가 인원</span>
          <div class="seg" id="player-seg"></div>
        </div>
        <div class="setting-row">
          <span class="setting-label">제한 시간</span>
          <select id="timer-select" class="select" aria-label="제한 시간">
            <option value="60">1분</option>
            <option value="90" selected>1분 30초</option>
            <option value="180">3분</option>
            <option value="300">5분</option>
            <option value="none">무제한</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-label">읽어 주기</span>
          <button id="voice-toggle" class="toggle-btn on" type="button" onclick="toggleVoice()">🔊 켜짐</button>
        </div>
      </div>

      <p class="cap-note" id="cap-note"></p>
      <nav class="stage-nav" id="stage-nav" aria-label="단계 바로 가기"></nav>
      <div id="stages"></div>
    </div>
  </section>

  <section id="game-screen" class="game-screen hidden">
    <div class="topbar">
      <button class="ghost-btn game-exit" type="button" onclick="exitGame()">← 목록</button>
      <div class="top-title">
        <h1 id="mode-title">다각형맨</h1>
        <p id="mode-sub"></p>
      </div>
      <div class="timer" id="timer">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle class="track" cx="30" cy="30" r="25" />
          <circle class="bar" id="timer-bar" cx="30" cy="30" r="25" stroke-dasharray="157.08" stroke-dashoffset="0" />
        </svg>
        <span id="time-left">∞</span>
      </div>
      <div class="top-actions">
        <button class="ghost-btn opt" id="voice-toggle-2" type="button" onclick="toggleVoice()">🔊 소리</button>
        <button class="ghost-btn opt" type="button" onclick="toggleFullscreen()">⛶ 전체화면</button>
        <button class="ghost-btn game-finish" type="button" onclick="finishGame()">🏁 결과</button>
      </div>
    </div>
    <div class="players" id="players"></div>
  </section>

  <section id="bell-screen" class="game-screen bell-screen hidden">
    <div class="topbar">
      <button class="ghost-btn" type="button" onclick="bellQuit()">← 끝내기</button>
      <div class="top-title">
        <h1 id="bell-title">🔔 다각형맨 골든벨</h1>
        <p id="bell-sub"></p>
      </div>
      <div class="timer hidden" id="bell-timer">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle class="track" cx="30" cy="30" r="25" />
          <circle class="bar" id="bell-timer-bar" cx="30" cy="30" r="25" stroke-dasharray="157.08" stroke-dashoffset="0" />
        </svg>
        <span id="bell-time-left"></span>
      </div>
      <div class="top-actions">
        <span class="bell-room" id="bell-room"></span>
        <button class="ghost-btn opt" id="voice-toggle-3" type="button" onclick="toggleVoice()">🔊 소리</button>
        <button class="ghost-btn opt" type="button" onclick="toggleFullscreen()">⛶ 전체화면</button>
        <button class="ghost-btn hidden" id="bell-finish" type="button" onclick="bellFinish()">🏁 결과</button>
      </div>
    </div>
    <div class="bell-body" id="bell-body"></div>
  </section>

  <section id="bell-join-screen" class="screen bell-pad hidden">
    <div class="bp-top">
      <span class="bp-me" id="bp-me"></span>
      <span class="bp-room" id="bp-room"></span>
      <span class="bp-dot" id="bp-dot"></span>
      <button class="ghost-btn" type="button" onclick="bellLeave()">나가기</button>
    </div>
    <div class="bp-body" id="bp-body"></div>
  </section>

  <div id="result-overlay" class="overlay hidden"></div>
  <div id="concept-overlay" class="overlay hidden" onclick="if (event.target === this) hideConcept()"></div>
  <div id="mix-overlay" class="overlay hidden" onclick="if (event.target === this) hideMix()"></div>
  <div id="notice-overlay" class="overlay hidden" onclick="if (event.target === this) hideNotice()"></div>
  <div id="ws-overlay" class="overlay hidden" onclick="if (event.target === this) hideWorksheet()"></div>
  <div id="bell-overlay" class="overlay hidden" onclick="if (event.target === this) hideBellSetup()"></div>
  <div id="print-root"></div>

    /* =========================================================
       모양 조각 (삼각 격자)
       격자점 (i, j)는 평면에서 (i + j/2, j·√3/2)에 있다.
       단위 정삼각형은 무게중심을 3배 한 정수 좌표 "X,Y"로 부른다.
       X를 3으로 나눈 나머지가 1이면 위로 뾰족한 삼각형, 2이면 아래로 뾰족한 삼각형.
       ========================================================= */
    const SQ3 = Math.sqrt(3);
    const mod3 = (v) => ((v % 3) + 3) % 3;
    const tk = (X, Y) => `${X},${Y}`;
    const tParse = (k) => k.split(',').map(Number);
    function latXY(i, j) { return [i + j / 2, (j * SQ3) / 2]; }
    function triVerts(X, Y) {
      if (mod3(X) === 1) {
        const i = (X - 1) / 3;
        const j = (Y - 1) / 3;
        return [[i, j], [i + 1, j], [i, j + 1]];
      }
      const i = (X - 2) / 3;
      const j = (Y - 2) / 3;
      return [[i + 1, j], [i + 1, j + 1], [i, j + 1]];
    }
    // 평면 좌표 → 그 점을 품은 단위 삼각형
    function triAt(x, y) {
      const j = y / (SQ3 / 2);
      const i = x - j / 2;
      const fi = Math.floor(i);
      const fj = Math.floor(j);
      return (i - fi) + (j - fj) < 1 ? tk(3 * fi + 1, 3 * fj + 1) : tk(3 * fi + 2, 3 * fj + 2);
    }
    function triCenter(k) {
      const [X, Y] = tParse(k);
      return latXY(X / 3, Y / 3);
    }

    // 교과서 모양 조각 (격자에 놓이는 네 가지 + 격자에 안 놓이는 두 가지)
    const PIECES = {
      tri:   { name: '정삼각형', color: '#1fa65a', dark: '#11753d', tris: [[1, 1]] },
      rhomb: { name: '마름모', color: '#2f7fe0', dark: '#1b56a3', tris: [[1, 1], [2, 2]] },
      trap:  { name: '사다리꼴', color: '#ef4b3c', dark: '#ad2a1e', tris: [[1, 1], [2, 2], [4, 1]] },
      hex:   { name: '정육각형', color: '#ffcf1f', dark: '#b88a00', tris: [[1, 1], [-1, 2], [-2, 1], [-1, -1], [1, -2], [2, -1]] },
      sq:    { name: '정사각형', color: '#f58a2a', dark: '#b45c10' },
      thin:  { name: '마름모', color: '#c9c3b8', dark: '#8d867a' }

    const LAT_TYPES = ['tri', 'rhomb', 'trap', 'hex'];
    // 각 조각의 놓을 수 있는 방향 (60°씩 돌려서 겹치는 것은 하나로)
    const ORIENTS = {};
    (function buildOrients() {
      const rot = ([X, Y]) => [-Y, X + Y];
      LAT_TYPES.forEach((t) => {
        const seen = new Set();
        ORIENTS[t] = [];
        let cur = PIECES[t].tris.map((c) => [...c]);
        for (let r = 0; r < 6; r += 1) {
          const sorted = [...cur].sort((a, b) => a[1] - b[1] || a[0] - b[0]);
          const m = mod3(sorted[0][0]);
          const dx = sorted[0][0] - m;
          const dy = sorted[0][1] - m;
          const norm = sorted.map(([X, Y]) => [X - dx, Y - dy]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
          const key = norm.map(([X, Y]) => tk(X, Y)).join(' ');
          if (!seen.has(key)) { seen.add(key); ORIENTS[t].push(norm); }
          cur = cur.map(rot);
        }
      });
    }());

    // 삼각형 t를 덮으면서 region 안, used 밖에 놓이는 모든 자리
    function placementsAt(type, t, region, used) {
      const [TX, TY] = tParse(t);
      const out = [];
      const seen = new Set();
      ORIENTS[type].forEach((o) => {
        o.forEach(([AX, AY]) => {
          if (mod3(AX) !== mod3(TX)) return;
          const dx = TX - AX;
          const dy = TY - AY;
          const keys = o.map(([X, Y]) => tk(X + dx, Y + dy));
          if (!keys.every((k) => region.has(k) && !(used && used.has(k)))) return;
          const id = [...keys].sort().join(' ');
          if (seen.has(id)) return;
          seen.add(id);
          out.push(keys);
        });
      });
      return out;
    }

    // 삼각형 모음의 바깥 둘레. 하나로 이어진 구멍 없는 도형이면 꼭짓점 목록을 준다.
    function outlineOf(keys) {
      const cnt = new Map();
      const dirEdges = [];
      keys.forEach((k) => {
        const v = triVerts(...tParse(k));
        for (let e = 0; e < 3; e += 1) {
          const a = v[e];
          const b = v[(e + 1) % 3];
          const ak = `${a[0]}:${a[1]}`;
          const bk = `${b[0]}:${b[1]}`;
          const uk = ak < bk ? `${ak}|${bk}` : `${bk}|${ak}`;
          cnt.set(uk, (cnt.get(uk) || 0) + 1);
          dirEdges.push([ak, bk, uk, a, b]);
        }
      });
      const next = new Map();
      const pt = new Map();
      let pinch = false;
      dirEdges.forEach(([ak, bk, uk, a, b]) => {
        if (cnt.get(uk) !== 1) return;
        if (next.has(ak)) pinch = true;
        next.set(ak, bk);
        pt.set(ak, a);
        pt.set(bk, b);
      });
      const loops = [];
      const done = new Set();
      next.forEach((_, start) => {
        if (done.has(start)) return;
        const loop = [];
        let cur = start;
        let guard = 0;
        while (!done.has(cur) && guard < 5000) {
          done.add(cur);
          loop.push(pt.get(cur));
          cur = next.get(cur);
          guard += 1;
        }
        loops.push(loop);
      });
      return { loops, simple: !pinch && loops.length === 1, pts: loops[0] || [] };
    }
    // 한 직선 위에 이어진 꼭짓점을 빼고 진짜 꼭짓점만 남긴다
    function cornersOf(pts) {
      const n = pts.length;
      const out = [];
      for (let k = 0; k < n; k += 1) {
        const a = pts[(k + n - 1) % n];
        const b = pts[k];
        const c = pts[(k + 1) % n];
        const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
        if (cr !== 0) out.push(b);
      }
      return out;
    }
    function shapeInfo(keys) {
      if (!keys.length) return { simple: false, sides: 0, corners: [] };
      const o = outlineOf(keys);
      const corners = o.simple ? cornersOf(o.pts) : [];
      return { simple: o.simple, sides: corners.length, corners, loops: o.loops };
    }

    // 격자 다각형(꼭짓점은 격자점) 안에 들어가는 단위 삼각형
    function regionOfPoly(vs) {
      const P = vs.map(([i, j]) => latXY(i, j));
      const inside = (x, y) => {
        let c = false;
        for (let a = 0, b = P.length - 1; a < P.length; b = a, a += 1) {
          if ((P[a][1] > y) !== (P[b][1] > y) && x < ((P[b][0] - P[a][0]) * (y - P[a][1])) / (P[b][1] - P[a][1]) + P[a][0]) c = !c;
        }
        return c;
      };
      const is = vs.map((v) => v[0]);
      const js = vs.map((v) => v[1]);
      const out = [];
      for (let j = Math.min(...js) - 1; j <= Math.max(...js) + 1; j += 1) {
        for (let i = Math.min(...is) - Math.max(...js) - 2; i <= Math.max(...is) - Math.min(...js) + 2; i += 1) {
          [[3 * i + 1, 3 * j + 1], [3 * i + 2, 3 * j + 2]].forEach(([X, Y]) => {
            const [x, y] = latXY(X / 3, Y / 3);
            if (inside(x, y)) out.push(tk(X, Y));
          });
        }
      }
      return out;
    }

    // 주어진 조각들로 region을 빈틈없이 채우는 방법 하나 (없으면 null)
    function solveTiling(regionKeys, types, opts = {}) {
      const region = new Set(regionKeys);
      const order = [...regionKeys].sort((a, b) => {
        const [ax, ay] = tParse(a);
        const [bx, by] = tParse(b);
        return ay - by || ax - bx;
      });
      const used = new Set();
      const plan = [];
      let steps = 0;
      const limit = opts.limit || 60000;
      const prefer = opts.prefer || types;
      function go() {
        steps += 1;
        if (steps > limit) return false;
        const t = order.find((k) => !used.has(k));
        if (!t) return true;
        for (const type of prefer) {
          if (!types.includes(type)) continue;
          const cands = placementsAt(type, t, region, used);
          for (const keys of (opts.shuffle ? shuffle(cands) : cands)) {
            keys.forEach((k) => used.add(k));
            plan.push({ type, keys });
            if (go()) return true;
            plan.pop();
            keys.forEach((k) => used.delete(k));
          }
        }
        return false;
      }
      return go() ? plan : null;
    }

    // 조각을 하나씩 이어 붙여 모양을 만든다 (구멍·꼭짓점만 맞닿기 없이)
    function growShape(types, count, opts = {}) {
      const bound = opts.bound || 3;
      const within = (keys) => keys.every((k) => {
        const [x, y] = triCenter(k);
        return Math.abs(x) <= bound + 1.2 && Math.abs(y) <= bound * 0.87 + 0.6;
      });
      for (let attempt = 0; attempt < 60; attempt += 1) {
        const plan = [];
        const used = new Set();
        const first = pick(types);
        const fo = pick(ORIENTS[first]);
        const firstKeys = fo.map(([X, Y]) => tk(X, Y));
        plan.push({ type: first, keys: firstKeys });
        firstKeys.forEach((k) => used.add(k));
        let ok = true;
        for (let n = 1; n < count && ok; n += 1) {
          // 지금 모양의 바깥 이웃 삼각형 중 하나를 골라 거기에 조각을 붙인다
          const nb = [];
          used.forEach((k) => {
            const [X, Y] = tParse(k);
            const ns = mod3(X) === 1 ? [[X + 1, Y + 1], [X - 2, Y + 1], [X + 1, Y - 2]] : [[X - 1, Y - 1], [X + 2, Y - 1], [X - 1, Y + 2]];
            ns.forEach(([a, b]) => { const kk = tk(a, b); if (!used.has(kk)) nb.push(kk); });
          });
          let placed = false;
          for (let tries = 0; tries < 30 && !placed; tries += 1) {
            const t = pick(nb);
            const type = pick(types);
            const all = new Set();
            const [TX, TY] = tParse(t);
            for (let dx = -12; dx <= 12; dx += 1) for (let dy = -12; dy <= 12; dy += 1) all.add(tk(TX + dx, TY + dy));
            const cands = shuffle(placementsAt(type, t, all, used)).filter(within);
            for (const keys of cands) {
              const trial = [...used, ...keys];
              const info = shapeInfo(trial);
              if (!info.simple) continue;
              if (opts.maxSides && info.sides > opts.maxSides) continue;
              plan.push({ type, keys });
              keys.forEach((k) => used.add(k));
              placed = true;
              break;
            }
          }
          if (!placed) ok = false;
        }
        if (!ok) continue;
        const info = shapeInfo([...used]);
        if (!info.simple) continue;
        if (opts.sides && !opts.sides.includes(info.sides)) continue;
        return { plan, keys: [...used], info };
      }
      return null;
    }
    /* =========================================================
       도형 만들기와 그리기
       점 목록은 화면 좌표(아래로 갈수록 y가 커짐)로 다룬다.
       ========================================================= */
    const DEG = Math.PI / 180;
    function polyArea(pts) {
      let a = 0;
      pts.forEach((p, k) => { const q = pts[(k + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; });
      return a / 2;
    }
    function sideLens(pts) { return pts.map((p, k) => Math.hypot(pts[(k + 1) % pts.length][0] - p[0], pts[(k + 1) % pts.length][1] - p[1])); }
    // 각 꼭짓점의 안쪽 각 (도)
    function innerAngles(pts) {
      const n = pts.length;
      const sg = Math.sign(polyArea(pts)) || 1;
      return pts.map((b, k) => {
        const a = pts[(k + n - 1) % n];
        const c = pts[(k + 1) % n];
        const v1 = [a[0] - b[0], a[1] - b[1]];
        const v2 = [c[0] - b[0], c[1] - b[1]];
        const ang = Math.acos(clamp((v1[0] * v2[0] + v1[1] * v2[1]) / (Math.hypot(...v1) * Math.hypot(...v2)), -1, 1)) / DEG;
        const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
        return Math.sign(cr) === sg ? ang : 360 - ang;
      });
    }
    function segCross(p1, p2, p3, p4) {
      const d = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
      const d1 = d(p3, p4, p1);
      const d2 = d(p3, p4, p2);
      const d3 = d(p1, p2, p3);
      const d4 = d(p1, p2, p4);
      if (((d1 > 1e-9 && d2 < -1e-9) || (d1 < -1e-9 && d2 > 1e-9)) && ((d3 > 1e-9 && d4 < -1e-9) || (d3 < -1e-9 && d4 > 1e-9))) return true;
      const on = (a, b, c) => Math.abs(d(a, b, c)) < 1e-9 && Math.min(a[0], b[0]) - 1e-9 <= c[0] && c[0] <= Math.max(a[0], b[0]) + 1e-9 && Math.min(a[1], b[1]) - 1e-9 <= c[1] && c[1] <= Math.max(a[1], b[1]) + 1e-9;
      return on(p3, p4, p1) || on(p3, p4, p2) || on(p1, p2, p3) || on(p1, p2, p4);

    function isSimple(pts) {
      const n = pts.length;
      for (let a = 0; a < n; a += 1) {
        for (let b = a + 1; b < n; b += 1) {
          if (b === a + 1 || (a === 0 && b === n - 1)) continue;
          if (segCross(pts[a], pts[(a + 1) % n], pts[b], pts[(b + 1) % n])) return false;

      return true;
    }
    function rotPts(pts, ang) {
      const c = Math.cos(ang);
      const s = Math.sin(ang);
      return pts.map(([x, y]) => [x * c - y * s, x * s + y * c]);
    }
    // 변의 길이와 바깥쪽으로 꺾는 각으로 걸어가며 그린다 (거북이 그리기)
    function turtle(lens, turns) {
      const pts = [[0, 0]];
      let h = 0;
      for (let k = 0; k < lens.length - 1; k += 1) {
        const [x, y] = pts[pts.length - 1];
        pts.push([x + lens[k] * Math.cos(h), y - lens[k] * Math.sin(h)]);
        h += turns[k] * DEG;
      }
      return pts;
    }
    function regularPts(n, rot = 0) {
      // 아랫변이 가로로 놓이게 시작한다
      const base = Math.PI / 2 + Math.PI / n + rot;
      return Array.from({ length: n }, (_, k) => [Math.cos(base + (2 * Math.PI * k) / n), Math.sin(base + (2 * Math.PI * k) / n)]);
    }
    function niceShape(pts, convex) {
      if (!isSimple(pts)) return false;
      const ang = innerAngles(pts);
      const lens = sideLens(pts);
      const mean = lens.reduce((s, v) => s + v, 0) / lens.length;
      if (Math.min(...lens) < mean * 0.42) return false;
      if (convex) return ang.every((a) => a > 30 && a < 166);
      const reflex = ang.filter((a) => a > 180);
