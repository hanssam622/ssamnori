      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.getElementById('concept-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }


    /* =========================================================
       차시별 문제 모음 고르기
       ========================================================= */
    const MIX_KEY = 'polyman-mix-v1';
    let mixSel = new Set(Object.keys(MIX_ITEMS));
    try {
      const saved = JSON.parse(localStorage.getItem(MIX_KEY) || 'null');
      if (Array.isArray(saved)) mixSel = new Set(saved.filter((id) => MIX_ITEMS[id]));
    } catch (err) { /* 저장소를 쓸 수 없으면 전부 고른 상태로 시작한다 */ }
    function saveMixSel() {
      try { localStorage.setItem(MIX_KEY, JSON.stringify([...mixSel])); } catch (err) { /* 무시 */ }
    }

    let mixScope = 'all';
    function mixLessons() { return mixScope === 'all' ? LESSONS : LESSONS.filter((l) => l.stage === mixScope); }
    function mixChosen() { return mixLessons().flatMap((l) => l.items).filter((id) => mixSel.has(id)); }
    function mixCap(ids) { return ids.reduce((m, id) => Math.min(m, MIX_ITEMS[id].cap || 6), 6); }
    const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

    function mixCardHtml(st) {
      const all = st.no === 6;
      const names = LESSONS.filter((l) => l.stage === st.no).map((l) => l.title).join(', ');
      return `
        <article class="card mixc${all ? ' wide' : ''}">
          <div class="card-top"><span class="ic">${ICONS.mix}</span><span class="cap">${all ? '단원 전체' : '차시별'}</span></div>
          <h4>${all ? '단원 전체 문제 모음' : '문제 모음'}</h4>
          <p>${all ? '모든 차시의 문제 유형 중에서 원하는 것만 체크해서 섞어 풀어요.' : `${names} 차시의 문제 유형 중 체크한 것만 섞어서 풀어요.`}</p>
          <button class="go" type="button" onclick="openMix(${all ? "'all'" : st.no})">유형 고르기</button>
        </article>`;
    }

    function openMix(scope) {
      mixScope = scope;
      renderMix();
      document.getElementById('mix-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideMix() {
      document.getElementById('mix-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }
    function renderMix() {
      const chosen = mixChosen();
      const cap = mixCap(chosen);
      const st = mixScope === 'all' ? null : STAGES.find((x) => x.no === mixScope);
      const over = playerCount > cap;
      const limiting = [...new Set(chosen.filter((id) => (MIX_ITEMS[id].cap || 6) === cap).map((id) => MIX_ITEMS[id].label))];
      const capNote = chosen.length && cap < 6
        ? `<span class="mix-cap${over ? ' warn' : ''}">${limiting.join(', ')} 게임으로 인해 최대 ${cap}명까지만 가능합니다${over ? ` (지금 ${playerCount}명)` : ''}</span>`
        : `<span class="mix-cap">1~6명이 함께할 수 있어요</span>`;
      const box = document.getElementById('mix-overlay');
      const prevScroll = box.firstElementChild ? box.firstElementChild.scrollTop : 0;
      box.innerHTML = `
        <div class="result-card mix-card">
          <div class="concept-head">
            <div class="kid-art"></div>
            <div><h2>${st ? `${st.title} 문제 모음` : '단원 전체 문제 모음'}</h2><p>체크한 유형의 문제만 골고루 섞여서 나와요.</p></div>
          </div>
          ${mixLessons().map((l) => {
            const full = l.items.every((id) => mixSel.has(id));
            return `
              <section class="mix-lesson">
                <div class="mix-lesson-head">
                  <span class="mix-page">${l.page}</span>
                  <h3>${l.title}</h3>
                  <button class="mix-all${full ? ' on' : ''}" type="button" onclick="toggleLesson('${l.id}')">${full ? '모두 해제' : '모두 선택'}</button>
                </div>
                <div class="mix-items">${l.items.map((id) => `
                  <button class="mix-chip${mixSel.has(id) ? ' on' : ''}" type="button" aria-pressed="${mixSel.has(id)}" onclick="toggleMixItem('${id}')">
                    <span class="ck">${CHECK}</span><span class="mi">${ICONS[MIX_ITEMS[id].icon]}</span>${MIX_ITEMS[id].label}${MIX_ITEMS[id].cap ? `<span class="mcap">최대 ${MIX_ITEMS[id].cap}명</span>` : ''}
                  </button>`).join('')}
                </div>
              </section>`;
          }).join('')}
          <div class="mix-foot">
            <div class="mix-sum"><span><b>${chosen.length}</b>가지 유형을 골랐어요</span>${capNote}</div>
            <div class="mix-btns">
              <button class="ghost-btn" type="button" onclick="hideMix()">닫기</button>
              <button class="btn-main" type="button" onclick="startMix()"${chosen.length ? '' : ' disabled'}>섞어서 시작 →</button>
            </div>
          </div>
        </div>`;
      box.firstElementChild.scrollTop = prevScroll;
    }
    function toggleMixItem(id) {
      if (mixSel.has(id)) mixSel.delete(id);
      else mixSel.add(id);
      saveMixSel();
      renderMix();
    }
    function toggleLesson(lid) {
      const l = LESSONS.find((x) => x.id === lid);
      const full = l.items.every((id) => mixSel.has(id));
      l.items.forEach((id) => { if (full) mixSel.delete(id); else mixSel.add(id); });
      saveMixSel();
      renderMix();
    }
    function startMix() {
      const chosen = mixChosen();
      if (!chosen.length) return;
      mixPool = chosen;
      mixTall = chosen.some((id) => MIX_ITEMS[id].tall);
      const st = mixScope === 'all' ? null : STAGES.find((x) => x.no === mixScope);
      const lessons = mixLessons().filter((l) => l.items.some((id) => mixSel.has(id)));
      MODES.mix = {
        title: st ? `${st.short} 문제 모음` : '단원 전체 문제 모음',
        icon: 'mix',
        sub: `${lessons.length > 3 ? '단원 전체' : lessons.map((l) => l.title).join(' · ')}에서 고른 ${chosen.length}가지 유형을 섞어 풀어요`,
        cap: mixCap(chosen)
      };
      const go = () => { hideMix(); startGame('mix'); };
      if (playerCount > MODES.mix.cap) {
        const names = [...new Set(chosen.filter((id) => (MIX_ITEMS[id].cap || 6) < playerCount).map((id) => MIX_ITEMS[id].label))];
        showCapNotice(names, MODES.mix.cap, VCALC_WHY, go);
        return;
      }
      go();
    }
    function mixTagHtml(q) {
      const it = MIX_ITEMS[q.mixId];
      return it ? `<div class="mix-tag"><span class="mi">${ICONS[it.icon]}</span>${it.label}</div>` : '';
    }


    /* =========================================================
       인원 제한 안내
       ========================================================= */
    const PEOPLE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6z"/><circle cx="17" cy="9" r="2.7" opacity=".55"/><path d="M15.6 13.7c3.2-.4 6 1.6 6 5.8h-4.4c0-2.3-.6-4.3-1.6-5.8z" opacity=".55"/></svg>';
    const VCALC_WHY = '그림을 직접 다루는 게임이라 한 사람의 칸이 넓어야 해요.';
    function capOf(m) { return MODES[m].cap || 6; }
    function capChip(cap, extra = '') {
      return `<span class="cap pc${cap < 6 ? ' lim' : ''}${playerCount > cap ? ' over' : ''}" data-cap="${cap}">${PEOPLE}${cap < 6 ? `최대 ${cap}명` : '1~6명'}${extra}</span>`;
    }
    // 고른 인원이 게임 제한보다 많을 때 시작 전에 알려 준다
    let noticeGo = null;
    function showCapNotice(names, cap, why, go) {
      noticeGo = go;
      document.getElementById('notice-overlay').innerHTML = `
        <div class="result-card notice-card">
          <div class="notice-ic">${PEOPLE}</div>
          <h2>인원 안내</h2>
          <p class="notice-main"><b>${names.join(', ')}</b> 게임으로 인해 <b>최대 ${cap}명</b>까지만 가능합니다.</p>
          <p class="notice-why">${why}</p>
          <p class="notice-now">지금 고른 인원은 ${playerCount}명이에요. ${cap}명으로 줄여서 시작할까요?</p>
          <div class="result-btns">
            <button class="ghost-btn" type="button" onclick="hideNotice()">취소</button>
            <button class="btn-main" type="button" onclick="acceptNotice()">${cap}명으로 시작 →</button>
          </div>
        </div>`;
      document.getElementById('notice-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideNotice() {
      document.getElementById('notice-overlay').classList.add('hidden');
      const others = ['concept-overlay', 'mix-overlay'].some((id) => !document.getElementById(id).classList.contains('hidden'));
      if (!others) document.body.classList.remove('modal');
    }
    function acceptNotice() {
      const go = noticeGo;
      noticeGo = null;
      hideNotice();
      if (go) go();
    }
    function tryStart(m) {
      const cap = capOf(m);
      if (playerCount > cap) {
        showCapNotice([MODES[m].title], cap, MODES[m].capWhy || '', () => startGame(m));
        return;
      }
      startGame(m);
    }
    function renderCapNote() {
      const note = document.getElementById('cap-note');
      if (!note) return;
      const byCap = {};
      Object.entries(MODES).forEach(([k, M]) => {
        if (k === 'mix' || !M.cap || M.cap >= playerCount) return;
        (byCap[M.cap] = byCap[M.cap] || []).push(M.title);
      });
      const lines = Object.entries(byCap).map(([cap, titles]) => `<b>${titles.join(' · ')}</b> 게임은 최대 ${cap}명까지만 가능합니다.`);
      note.innerHTML = lines.length ? `${PEOPLE}<span>${lines.join(' ')} 나머지 게임은 ${playerCount}명이 함께할 수 있어요.</span>` : '';
      document.querySelectorAll('.cap.pc').forEach((el) => el.classList.toggle('over', playerCount > Number(el.dataset.cap)));
    }

    /* =========================================================
       화면 전환 / 설정
       ========================================================= */
    let heroTimer = null;
    function heroSvg(n, k) {
      const d = allDiags(n).slice(0, k).map((l) => ({ ...l, w: 3.4, color: '#e64f95' }));
      return figSvg({ pts: regularPts(n) }, { w: 300, h: 300, pad: 26, sw: 6, fill: FIG_FILLS[(n - 3) % FIG_FILLS.length], lines: d, dots: true, dotR: 7, dotFill: '#ff5b4f', cls: 'hero-poly' });
    }
    function animateHero() {
      const g = document.getElementById('hero-fig');
      const tag = document.getElementById('hero-tag');
      if (!g) return;
      clearInterval(heroTimer);
      let n = 3;
      let k = 0;
      let hold = 0;
      const draw = () => {
        g.innerHTML = heroSvg(n, k);
        tag.textContent = `${polyName(n)} · 대각선 ${k}개`;
      };
      draw();
      heroTimer = setInterval(() => {
        if (document.getElementById('start-screen').classList.contains('hidden')) { clearInterval(heroTimer); return; }
        if (k < diagN(n)) { k += 1; draw(); return; }
        hold += 1;
        if (hold < 4) return;
        hold = 0;
        n = n >= 8 ? 3 : n + 1;
        k = 0;
        draw();
      }, 360);
    }
    function showScreen(id) {
      document.querySelectorAll('.screen, .game-screen').forEach((el) => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      document.body.classList.toggle('playing', ['game-screen', 'bell-screen', 'bell-join-screen'].includes(id));
      if (id === 'game-select-screen') { renderPlayerSeg(); renderCapNote(); }
      if (id === 'start-screen') animateHero();
    }

    function renderPlayerSeg() {
      document.getElementById('player-seg').innerHTML = [1, 2, 3, 4, 5, 6]
        .map((i) => `<button type="button" class="${i === playerCount ? 'on' : ''}" onclick="setPlayers(${i})">${i}명</button>`)
        .join('');
    }
    function setPlayers(n) { playerCount = n; renderPlayerSeg(); renderCapNote(); }

    function cardHtml(m) {
      const M = MODES[m];
      const capTxt = capChip(capOf(m), m === 'exam' ? ' · 시간 무제한' : '');
      const sel = M.opts
        ? `<select class="card-select" id="opt-${m}" aria-label="문제 유형">${OPT_CHOICES[M.opts].map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`
        : '';
      return `
        <article class="card${M.wide ? ' wide' : ''}" style="--tint:${M.tint}">
          <div class="card-top"><span class="ic">${ICONS[M.icon]}</span>${capTxt}</div>
          <h4>${M.title}</h4>
          <p>${M.desc}</p>
          ${sel}
          <button class="go" type="button" onclick="tryStart('${m}')">${m === 'exam' ? '평가 시작' : '시작'}</button>
        </article>`;
    }
    function renderStages() {
      document.getElementById('stage-nav').innerHTML = STAGES
        .map((st) => `<button class="stage-chip" type="button" style="--sc:${st.color}" onclick="jumpStage(${st.no})"><b>${st.no}</b>${st.short}</button>`)
        .join('');
      document.getElementById('stages').innerHTML = STAGES.map((st) => `
        <section class="stage" id="stage-${st.no}" style="--sc:${st.color}">
          <div class="stage-head">
            <span class="stage-no">${st.no}</span>
            <h3 class="stage-title">${st.title}</h3>
            <span class="stage-page">${st.page}</span>
            <button class="stage-ws" type="button" onclick="openWorksheet(${st.no})">🖨 학습지</button>
          </div>
          <div class="cards">
            ${st.concept ? `
              <article class="card concept" style="--tint:#d6f3ee">
                <div class="card-top"><span class="ic">${ICONS.concept}</span><span class="cap">개념</span></div>
                <h4>개념 알아보기</h4>
                <p>${CONCEPTS[st.concept].desc}</p>
                <button class="go" type="button" onclick="showConcept('${st.concept}')">펼쳐 보기</button>
              </article>` : ''}
            ${st.no === 6 ? mixCardHtml(st) : ''}
            ${st.concept ? mixCardHtml(st) : ''}
            ${st.items.map(cardHtml).join('')}
          </div>
        </section>`).join('');
    }
    function jumpStage(no) {
      document.getElementById(`stage-${no}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* =========================================================
       게임 시작 / 종료
       ========================================================= */
    const START_MSG = {
      choice: '알맞은 답을 골라 보세요.',
      keypad: '키패드로 답을 써 보세요.',
      ox: '알맞은 것을 골라 보세요.',
      geo: '점을 차례로 누르고 처음 점을 다시 누르면 완성! 마지막 점을 다시 누르면 지워져요.',
      diag: '꼭짓점 두 개를 차례로 누르면 선분이 그어져요. 같은 선분을 다시 그으면 지워져요.',
      tile: '아래에서 조각을 고르고 판을 눌러 놓아요. 놓은 조각을 누르면 빠져요.'
    };
    const UNIT_SAY = { '개': '개', cm: ' 센티미터', '°': '도' };

    function createPlayer(idx) {
      const prevQ = players[idx] && players[idx].q ? players[idx].q : null;
      const q = mode === 'exam' ? examQuestionFor(idx) : makeQuestion(prevQ && prevQ.key, prevQ && prevQ.mixId);
      return setupPlayer(idx, q);
    }
    function setupPlayer(idx, q) {
      const p = { idx, q, tries: 0, state: '', message: '', locked: !q, picked: [], pickedWhy: [], input: '', inputBad: false };
      if (!q) return p;
      if (q.kind === 'keypad' && !q.ansText) q.ansText = `${q.ans}${q.unit === '°' ? '°' : q.unit ? ` ${q.unit}` : ''}`;
      p.message = START_MSG[q.kind] || START_MSG.choice;
      if (q.kind === 'ox') p.stage = 'ox';
      if (q.kind === 'geo') { p.path = []; p.closed = false; }
      if (q.kind === 'diag') {
        p.lines = [];
        p.sel = null;
        p.dP = fitPts(q.pts, 280, 210, 32).pts;
        if (q.from) p.message = '꼭짓점 ㄱ을 누르고, 이을 꼭짓점을 눌러요.';
      }
      if (q.kind === 'tile') {
        p.placed = [];
        p.sel = q.types[0];
        p.regionSet = new Set(q.region);
        if (q.mode === 'build') p.message = '조각을 고르고 판을 눌러 놓아요. 다 만들면 확인을 눌러요.';
      }
      return p;
    }
    function startGame(selectedMode) {
      mode = selectedMode;
      const sel = document.getElementById(`opt-${mode}`);
      modeOpt = sel ? sel.value : 'all';
      const cap = MODES[mode].cap;
      if (cap && playerCount > cap) playerCount = cap;
      scores = Array(playerCount).fill(0);
      combos = Array(playerCount).fill(0);
      if (mode === 'exam') {
        examQueues = Array.from({ length: playerCount }, () => buildExamQueue());
        examIndex = Array(playerCount).fill(0);
        examLog = Array.from({ length: playerCount }, () => []);
      }
      players = [];
      players = Array.from({ length: playerCount }, (_, idx) => createPlayer(idx));
      gameActive = true;
      const M = MODES[mode];
      document.getElementById('mode-title').innerHTML = `<span class="ic">${ICONS[M.icon]}</span>${M.title}`;
      document.getElementById('mode-sub').textContent = M.sub;
      showScreen('game-screen');
      renderPlayers();
      startTimer();
    }

    function setTimerUi(left, total) {
      const t = document.getElementById('timer');
      const bar = document.getElementById('timer-bar');
      const label = document.getElementById('time-left');
      if (total === null) {
        t.className = 'timer inf';
        label.textContent = '∞';
        bar.style.strokeDashoffset = '0';
        return;
      }
      t.className = `timer${left <= 10 ? ' warn' : ''}`;
      label.textContent = String(Math.max(0, left));
      bar.style.strokeDashoffset = String(157.08 * (1 - Math.max(0, left) / total));
    }
    function startTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; }
      const selected = mode === 'exam' ? 'none' : document.getElementById('timer-select').value;
      if (selected === 'none') { setTimerUi(0, null); return; }
      timeTotal = Number.parseInt(selected, 10) || 90;
      timeLeft = timeTotal;
      setTimerUi(timeLeft, timeTotal);
      timerId = setInterval(() => {
        if (!gameActive) return;
        timeLeft -= 1;
        setTimerUi(timeLeft, timeTotal);
        if (timeLeft <= 0) finishGame();
      }, 1000);
    }

    function stopAll() {
      gameActive = false;
      if (timerId) { clearInterval(timerId); timerId = null; }
      Object.values(nextTimers).forEach((t) => clearTimeout(t));
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
    function exitGame() {
      stopAll();
      document.getElementById('result-overlay').classList.add('hidden');
      showScreen('game-select-screen');
    }

    function finishGame() {
      // 시간 대결 중인 태블릿은 결과 창 대신 칠판에 마지막 점수를 보내고 기다린다.
      if (BP.race && BP.race.running) { bellRaceStop(); return; }
      if (BP.exam && BP.exam.running) { bellExamStop(); return; }
      if (!players.length) return;
      stopAll();
      const ranking = scores
        .map((score, idx) => ({ score, idx, animal: ANIMALS[idx % ANIMALS.length] }))
        .sort((a, b) => b.score - a.score);
      let rank = 0;
      let prev = null;
      ranking.forEach((item, pos) => {
        if (item.score !== prev) { rank = pos + 1; prev = item.score; }
        item.rank = rank;
      });
      const exam = mode === 'exam';
      const scoreText = (item) => (exam
        ? `${item.score} / 100점 <small>(${(examLog[item.idx] || []).filter((r) => r.correct).length}/${EXAM_TOTAL})</small>`
        : `${item.score}점`);
      document.getElementById('result-overlay').innerHTML = `
        <div class="result-card">
          <div class="kid-art"></div>
          <h2>${exam ? '마무리 평가 결과' : '결과 발표'}</h2>
          <p class="sub">${MODES[mode].title}</p>
          ${ranking.map((item) => `
            <div class="rank-row r${item.score > 0 ? item.rank : 0}">
              <span class="rk">${item.rank}</span>
              <span>${item.animal.emoji} ${item.animal.name}</span>
              <strong>${scoreText(item)}</strong>
            </div>`).join('')}
          <div class="result-btns">
            ${exam ? '' : '<button class="btn-main" type="button" onclick="hideResult()">계속하기</button>'}
            <button class="${exam ? 'btn-main' : 'ghost-btn'}" type="button" onclick="restartGame()">다시 하기</button>
            <button class="ghost-btn" type="button" onclick="exitGame()">게임 목록</button>
          </div>
        </div>`;
      document.getElementById('result-overlay').classList.remove('hidden');
      blip('fanfare');
    }

    function hideResult() {
      document.getElementById('result-overlay').classList.add('hidden');
      if (mode === 'exam') return;
      gameActive = true;
      players = players.map((p, idx) => (p.locked ? createPlayer(idx) : p));
      renderPlayers();
      startTimer();
    }

    function restartGame() {
      document.getElementById('result-overlay').classList.add('hidden');
      startGame(mode);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    /* =========================================================
       렌더링
       ========================================================= */
    const TALL = Object.keys(MIX_ITEMS).filter((id) => MIX_ITEMS[id].tall).concat(['exam']);
    let narrowCells = false;
    function isTall() { return mode === 'mix' ? mixTall : TALL.includes(mode); }
    function columnCount() {
      const w = window.innerWidth;
      if (w < 760) return isTall() ? 1 : Math.min(playerCount, 2);
      // 태블릿처럼 화면이 좁은데 인원이 많으면 두 줄로 나눈다
      if (playerCount > 3 && w / playerCount < (isTall() ? 330 : 190)) return Math.ceil(playerCount / 2);
      return playerCount;
    }
    function cellMetrics() {
      const cols = columnCount();
      const rows = Math.ceil(playerCount / cols);
      const bar = document.querySelector('.topbar');
      const top = bar && bar.offsetHeight ? bar.offsetHeight : 80;
      return { cols, rows, w: window.innerWidth / cols, h: (window.innerHeight - top) / rows };
    }
    function cellScale(m) {
      const tall = isTall();
      // 좁은 칸은 보기를 한 줄로 쌓고 세로셈·자리판 같은 부품을 따로 줄이므로 글씨를 덜 줄인다
      const narrow = m.w < 330;
      const wBase = tall ? (narrow ? 300 : 400) : (narrow ? 250 : 300);
      const s = Math.min(m.w / wBase, m.h / (tall ? 720 : 780));
      return clamp(Math.round(s * 1000) / 1000, 0.62, 1.3);
    }
    function renderPlayers() {
      const grid = document.getElementById('players');
      const m = cellMetrics();
      narrowCells = m.w < 330;
      grid.classList.toggle('xnarrow', m.w < 240);
      grid.style.gridTemplateColumns = `repeat(${m.cols}, minmax(0, 1fr))`;
      grid.style.gridTemplateRows = `repeat(${m.rows}, minmax(0, 1fr))`;
      grid.style.setProperty('--s', cellScale(m));
      grid.classList.toggle('narrow', narrowCells);
      grid.classList.toggle('short', m.h < 440);
      grid.innerHTML = players.map((p) => `<section class="player-cell theme-${p.idx % 6}" id="cell-${p.idx}">${cellInner(p)}</section>`).join('');
    }
    function renderCell(idx) {
      const cell = document.getElementById(`cell-${idx}`);
      if (cell && players[idx]) cell.innerHTML = cellInner(players[idx]);
    }

    function speakerBtn(idx) {
      return `<button class="spk" type="button" onclick="speakQ(${idx})" aria-label="문제 읽어 주기">${SPK}</button>`;
    }
    function speakQ(idx) {
      const p = players[idx];
      if (p && p.q) speak(p.q.speech);
    }

    function cellInner(p) {
      // 시간 대결·평가 중인 태블릿에는 학생이 고른 이름(번호)과 동물을 보여 준다
      const a = BP.me && ((BP.race && BP.race.running) || (BP.exam && BP.exam.running))
        ? { emoji: BP.exam && BP.exam.running ? '📝' : bellEmoji(BP.me.avatar), name: bellEsc(BP.me.name) }
        : ANIMALS[p.idx % ANIMALS.length];
      const q = p.q;
      const body = !q ? examDoneBody(p) : (BODIES[q.kind] || choiceBody)(p);
      const prog = mode === 'exam'
        ? `<span class="prog-chip">${Math.min(examIndex[p.idx] + (q ? 1 : 0), EXAM_TOTAL)} / ${EXAM_TOTAL}</span>`
        : '';
      const combo = mode === 'speed' && combos[p.idx] >= 2 ? `<span class="combo-chip">🔥 ${combos[p.idx]}연속</span>` : '';
      return `
        <div class="answer-overlay" id="ov-${p.idx}"></div>
        <div class="player-header">
          <span class="pname"><span class="av">${a.emoji}</span><span class="nm">${a.name}</span></span>
          <span class="pscore-wrap">${combo}${prog}<span class="pscore" id="sc-${p.idx}">${STAR}${scores[p.idx]}</span></span>
        </div>
        <div class="cell-body">${mode === 'mix' && q ? mixTagHtml(q) : ''}${body}</div>
        <div class="controls">
          <div class="message ${p.state}" id="msg-${p.idx}"><span>${p.message}</span></div>
          <div class="btns">${q ? controlsHtml(p) : ''}</div>
        </div>`;
    }

    function controlsHtml(p) {
      if (p.locked) return '';
      const k = p.q.kind;
      const skip = mode === 'exam' ? '' : `<button class="btn-sub" type="button" onclick="skipQuestion(${p.idx})">넘기기</button>`;
      const check = (fn) => `<button class="btn-check" type="button" onclick="${fn}(${p.idx})">확인</button>`;
      const sub = (fn, label) => `<button class="btn-sub" type="button" onclick="${fn}(${p.idx})">${label}</button>`;
      if (k === 'keypad') return `${skip}${check('submitAns')}`;
      if (k === 'geo') return `${sub('geoUndo', '되돌리기')}${check('geoDone')}`;
      if (k === 'diag') return `${sub('diagClear', '모두 지우기')}${skip}`;
      if (k === 'tile') return p.q.mode === 'build' ? `${sub('tileUndo', '되돌리기')}${check('buildCheck')}` : `${sub('tileUndo', '되돌리기')}${skip}`;
      return skip;
    }

    /* ---------- 문제 본문 ---------- */
    function choiceBtns(p, list, cls, pickedList, ans) {
      return list.map((c, i) => {
        const picked = pickedList.includes(i);
        const isAns = c.v === ans;
        let st = '';
        if (picked && !isAns) st = ' wrong';
        if (p.locked && isAns) st = ' right';
        return `<button class="choice${cls ? ` ${cls}` : ''}${st}" type="button" onclick="choose(${p.idx},${i})">${c.html}</button>`;
      }).join('');
    }
    function qCard(p, prompt, visual) {
      return `<div class="q-card"><div class="q-text"><span>${prompt}</span>${speakerBtn(p.idx)}</div>${visual || ''}</div>`;
    }

    function choiceBody(p) {
      const q = p.q;
      const cols = q.cols || 2;
      // 다각형 이름처럼 짧은 글자 보기는 좁은 칸에서도 두 칸으로 둔다
      const short = q.txt && cols === 2 && q.choices.every((c) => String(c.html).replace(/<[^>]+>/g, '').length <= 9);
      return `${qCard(p, q.prompt, q.visual)}
        <div class="choices c${cols}${q.txt ? ' txtc' : ''}${short ? ' short' : ''}${q.figs ? ' figs' : ''}">${choiceBtns(p, q.choices, q.txt ? 'txt' : q.figs ? 'figc' : '', p.picked, q.ans)}</div>`;
    }

    function ansBoxHtml(p) {
      return `<span class="ans-box${p.inputBad ? ' bad' : ''}" id="ans-${p.idx}">${p.input ? numHtml(p.input) : '<span class="ph">?</span>'}${p.locked ? '' : '<span class="caret"></span>'}</span>`;
    }
    function keypadHtml(idx) {
      const keys = narrowCells
        ? ['7', '8', '9', 'del', '4', '5', '6', '', '1', '2', '3', '0']
        : ['1', '2', '3', '4', '5', 'del', '6', '7', '8', '9', '0', ''];
      return `<div class="keypad${narrowCells ? ' k4' : ''}">${keys.map((k) => {
        if (k === '') return '<span></span>';
        if (k === 'del') return `<button class="key fn" type="button" onclick="kp(${idx},'del')" aria-label="지우기">⌫</button>`;
        return `<button class="key" type="button" onclick="kp(${idx},'${k}')">${k}</button>`;
      }).join('')}</div>`;
    }
    function keypadBody(p) {
      const q = p.q;
      const line = `<div class="ans-line">${q.lhs || ''}${ansBoxHtml(p)}${q.unit ? `<span class="unit-txt">${q.unit}</span>` : ''}</div>`;
      return `${qCard(p, q.prompt || '답을 써 보세요.', `${q.visual || ''}${line}`)}${p.locked ? '' : keypadHtml(p.idx)}`;
    }

    function oxBody(p) {
      const q = p.q;
      const why = p.stage === 'why';
      const list = why ? q.reasons : [{ v: 'yes', html: q.yes }, { v: 'no', html: q.no }];
      const ans = why ? q.why : (q.isYes ? 'yes' : 'no');
      return `${qCard(p, why ? q.whyPrompt : q.prompt, q.visual)}
        <div class="choices ${why ? 'c1' : 'c2'} txtc">${choiceBtns(p, list, 'txt', why ? p.pickedWhy : p.picked, ans)}</div>`;
    }

    /* ---------- 도형판 ---------- */
    const GEO_BOARDS = {
      sq: (() => { const a = []; for (let r = 0; r < 5; r += 1) for (let c = 0; c < 5; c += 1) a.push([c, r]); return a; })(),
      tri: (() => { const a = []; for (let r = 0; r < 5; r += 1) for (let c = 0; c < (r % 2 ? 5 : 6); c += 1) a.push([c + (r % 2 ? 0.5 : 0), (r * SQ3) / 2]); return a; })()
    };
    function geoCorners(pts) {
      const n = pts.length;
      return pts.filter((b, k) => {
        const a = pts[(k + n - 1) % n];
        const c = pts[(k + 1) % n];
        return Math.abs((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0])) > 1e-6;
      });
    }
    function geoSvg(p) {
      const q = p.q;
      const D = GEO_BOARDS[q.board];
      const xs = D.map((d) => d[0]);
      const ys = D.map((d) => d[1]);
      const pad = 0.55;
      const minx = Math.min(...xs) - pad;
      const miny = Math.min(...ys) - pad;
      const w = Math.max(...xs) - Math.min(...xs) + pad * 2;
      const h = Math.max(...ys) - Math.min(...ys) + pad * 2;
      let s = `<svg class="geo" viewBox="${r2(minx)} ${r2(miny)} ${r2(w)} ${r2(h)}" aria-hidden="true">`;
      s += `<rect x="${r2(minx + 0.08)}" y="${r2(miny + 0.08)}" width="${r2(w - 0.16)}" height="${r2(h - 0.16)}" rx="0.32" fill="#ffefc4" stroke="#e7b44a" stroke-width="0.05"/>`;
      const path = p.path.map((k) => D[k]);
      if (path.length >= 2 || (p.closed && path.length >= 3)) {
        const d = `M${path.map(([x, y]) => `${r2(x)} ${r2(y)}`).join('L')}${p.closed ? 'Z' : ''}`;
        s += `<path d="${d}" fill="${p.closed ? 'rgba(58,127,242,.2)' : 'none'}" stroke="#3a7ff2" stroke-width="0.09" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      D.forEach(([x, y], k) => {
        const at = p.path.indexOf(k);
        if (at === 0 && !p.closed && p.path.length >= 3) s += `<circle cx="${r2(x)}" cy="${r2(y)}" r="0.24" fill="none" stroke="#ff5b4f" stroke-width="0.05" class="pulse"/>`;
        s += `<circle cx="${r2(x)}" cy="${r2(y)}" r="${at >= 0 ? 0.13 : 0.09}" fill="${at >= 0 ? (at === p.path.length - 1 && !p.closed ? '#ff5b4f' : '#1f5fc0') : '#9b7a33'}"/>`;
      });
      if (!p.locked) D.forEach(([x, y], k) => { s += `<circle cx="${r2(x)}" cy="${r2(y)}" r="0.46" fill="transparent" data-gi="${k}" data-p="${p.idx}" class="hit"/>`; });
      return `${s}</svg>`;
    }
    function geoBody(p) {
      return qCard(p, p.q.prompt, `<div class="geo-wrap">${geoSvg(p)}</div><div class="q-sub">${p.q.board === 'tri' ? '세모 도형판' : '네모 도형판'} · 이은 점 ${p.path.length}개</div>`);
    }

    /* ---------- 대각선 긋기 ---------- */
    function diagSvg(p) {
      const q = p.q;
      const P = p.dP;
      const n = P.length;
      let s = '<svg class="dg" viewBox="0 0 280 210" aria-hidden="true">';
      s += `<path d="${pathD(P, true)}" fill="#eef4ff" stroke="#1d2838" stroke-width="3" stroke-linejoin="round"/>`;
      p.lines.forEach((key) => {
        const [a, b] = key.split('-').map(Number);
        s += `<path d="M${r1(P[a][0])} ${r1(P[a][1])}L${r1(P[b][0])} ${r1(P[b][1])}" stroke="#e64f95" stroke-width="3.4" stroke-linecap="round"/>`;
      });
      const c = centroid(P);
      P.forEach(([x, y], k) => {
        const on = p.sel === k;
        const star = q.from && k === 0;
        s += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${on ? 10 : 7}" fill="${on ? '#ffd2e6' : star ? '#ffe9a8' : '#fff'}" stroke="${on ? '#e64f95' : '#1d2838'}" stroke-width="${on ? 3.4 : 2.4}"/>`;
        const dx = x - c[0];
        const dy = y - c[1];
        const l = Math.hypot(dx, dy) || 1;
        s += `<text x="${r1(x + (dx / l) * 19)}" y="${r1(y + (dy / l) * 19)}" class="vl" text-anchor="middle" dominant-baseline="central">${VLAB[k]}</text>`;
      });
      if (!p.locked) P.forEach(([x, y], k) => { s += `<circle cx="${r1(x)}" cy="${r1(y)}" r="22" fill="transparent" data-dv="${k}" data-p="${p.idx}" class="hit"/>`; });
      return `${s}</svg>`;
    }
    function diagBody(p) {
      return qCard(p, p.q.prompt, `<div class="dg-wrap">${diagSvg(p)}</div><div class="q-sub">그은 대각선 <b>${p.lines.length}개</b></div>`);
    }

    /* ---------- 모양 조각 놓기 ---------- */
    function tileLeft(p, t) {
      if (!p.q.counts) return null;
      return (p.q.counts[t] || 0) - p.placed.filter((x) => x.type === t).length;
    }
    function tileBody(p) {
      const q = p.q;
      const pal = q.types.map((t) => {
        const left = tileLeft(p, t);
        return `<button class="pb-btn${p.sel === t ? ' on' : ''}${left === 0 ? ' out' : ''}" type="button" onclick="tileSel(${p.idx},'${t}')">${pieceSvg(t, 20)}<span>${PB_LAB[t]}${left != null ? ` <b>×${left}</b>` : ''}</span></button>`;
      }).join('');
      const keys = p.placed.flatMap((x) => x.keys);
      const showOutline = q.mode === 'build' && p.placed.length >= 2 && shapeInfo(keys).simple;
      const board = latSvg(q.region, p.placed, { idx: p.idx, grid: q.mode !== 'build', board: q.mode === 'build', unionOutline: showOutline, cls: q.mode === 'build' ? 'bboard' : 'fboard', pad: 0.25 });
      const info = q.mode === 'build' ? `놓은 조각 <b>${p.placed.length}개</b>` : `놓은 조각 <b>${p.placed.length}개</b> · 빈칸 ${q.region.length - keys.length ? '남았어요' : '없어요'}`;
      return `${qCard(p, q.prompt, `<div class="tile-wrap">${board}</div><div class="q-sub">${info}</div>`)}<div class="pb-pal">${pal}</div>`;
    }

    function examDoneBody(p) {
      const log = examLog[p.idx] || [];
      const correct = log.filter((r) => r.correct).length;
      const secs = [...new Set(log.map((r) => r.sec))];
      return `
        <div class="done-card">
          <div class="kid-art"></div>
          <div class="done-score">${scores[p.idx]}점</div>
          <div class="done-sub">${EXAM_TOTAL}문제 중 ${correct}문제를 맞혔어요!<br />친구들이 끝날 때까지 기다려요.</div>
          <div class="done-list">${secs.map((s) => {
            const rs = log.filter((r) => r.sec === s);
            return `<div class="done-row"><span>${s}</span><span>${rs.filter((r) => r.correct).length} / ${rs.length}</span></div>`;
          }).join('')}</div>
        </div>`;
    }

    const BODIES = { choice: choiceBody, keypad: keypadBody, ox: oxBody, geo: geoBody, diag: diagBody, tile: tileBody };

    /* =========================================================
       정답 처리
       ========================================================= */
    function setMsg(idx, html, state = '') {
      const p = players[idx];
      if (!p) return;
      p.message = html;
      p.state = state;
      const el = document.getElementById(`msg-${idx}`);
      if (el) { el.innerHTML = `<span>${html}</span>`; el.className = `message ${state}`; }
    }

    function queueNext(idx, p, ms) {
      clearTimeout(nextTimers[idx]);
      nextTimers[idx] = setTimeout(() => {
        if (!gameActive || players[idx] !== p) return;
        players[idx] = createPlayer(idx);
        renderCell(idx);
      }, ms);
    }

    function award(idx, msg, speechText) {
      const p = players[idx];
      if (!p || p.locked) return;
      let gain = p.tries === 0 ? 2 : 1;
      if (mode === 'speed') {
        combos[idx] += 1;
        if (combos[idx] >= 3) gain += 1;
      }
      scores[idx] += gain;
      if (BP.race && BP.race.running) { BP.race.correct += 1; bellRaceReport(); }
      p.state = 'ok';
      p.locked = true;
      p.message = `${msg} <b>+${gain}점</b>`;
      renderCell(idx);
      const sc = document.getElementById(`sc-${idx}`);
      if (sc) sc.classList.add('bump');
      showAnswerOverlay(idx, true);
      blip('ok');
      if (speechText) speak(speechText);
      queueNext(idx, p, mode === 'speed' ? 1000 : 1800);
    }

    function miss(idx, msg) {
      const p = players[idx];
      if (!p) return;
      p.tries += 1;
      p.state = 'no';
      p.message = msg;
      if (mode === 'speed') combos[idx] = 0;
      renderCell(idx);
      showAnswerOverlay(idx, false);
      blip('no');
    }

    function resolve(idx, ok, okMsg, noMsg, speechText) {
      if (mode === 'exam') { examAdvance(idx, ok); return; }
      if (ok) award(idx, okMsg, speechText);
      else miss(idx, noMsg);
    }

    function examAdvance(idx, correct) {
      const p = players[idx];
      const q = p.q;
      examLog[idx].push({ sec: q.sec, correct });
      if (correct) scores[idx] += EXAM_POINT;
      examIndex[idx] += 1;
      p.locked = true;
      // 반 전체 평가 중인 태블릿은 맞았는지 알려 주지 않고 칠판에만 보낸다
      if (BP.exam && BP.exam.running) { bellExamAnswered(p, correct); return; }
      p.state = correct ? 'ok' : 'no';
      const ansText = q.ansText || (q.choices ? (q.choices.find((c) => c.v === q.ans) || {}).html : '');
      p.message = correct ? `정답! <b>+${EXAM_POINT}점</b>` : `아쉬워요. 정답: <b>${ansText}</b>`;
      renderCell(idx);
      showAnswerOverlay(idx, correct);
      blip(correct ? 'ok' : 'no');
      clearTimeout(nextTimers[idx]);
      nextTimers[idx] = setTimeout(() => {
        if (players[idx] !== p) return;
        players[idx] = createPlayer(idx);
        renderCell(idx);
        if (examIndex.every((v) => v >= EXAM_TOTAL)) finishGame();
      }, correct ? 1100 : 2400);
    }

    function skipQuestion(idx) {
      if (!gameActive || !players[idx]) return;
      if (mode === 'speed') combos[idx] = 0;
      players[idx] = createPlayer(idx);
      renderCell(idx);
    }

    const CONF_COLORS = ['#ff5b4f', '#12b3a3', '#ffb12b', '#3a7ff2', '#e64f95', '#8b5cf0'];
    function showAnswerOverlay(idx, correct) {
      const ov = document.getElementById(`ov-${idx}`);
      if (!ov) return;
      let conf = '';
      if (correct) {
        conf = `<div class="confetti">${Array.from({ length: 16 }, (_, i) => {
          const ang = (i / 16) * Math.PI * 2 + Math.random() * 0.4;
          const dist = 90 + Math.random() * 80;
          return `<i style="--c:${CONF_COLORS[i % CONF_COLORS.length]};--dx:${Math.round(Math.cos(ang) * dist)}px;--dy:${Math.round(Math.sin(ang) * dist)}px"></i>`;
        }).join('')}</div>`;
      }
      ov.className = `answer-overlay ${correct ? 'correct' : 'wrong'}`;
      ov.innerHTML = `${conf}<div class="answer-mark">${correct ? '○' : '✕'}</div>`;
      clearTimeout(overlayTimers[idx]);
      overlayTimers[idx] = setTimeout(() => {
        const live = document.getElementById(`ov-${idx}`);
        if (!live) return;
        live.className = 'answer-overlay';
        live.innerHTML = '';
      }, correct ? 950 : 800);
    }

    /* ---------- 고르기 ---------- */
    function choose(idx, i) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q) return;
      const q = p.q;
      if (q.kind === 'ox') { oxChoose(idx, i); return; }
      if (p.picked.includes(i)) return;
      p.picked.push(i);
      const ok = q.choices[i].v === q.ans;
      if (mode === 'exam') { examAdvance(idx, ok); return; }
      if (ok) award(idx, `정답! ${q.explain || ''}`, q.okSpeech);
      else miss(idx, q.wrongWhy && q.wrongWhy[q.choices[i].v] ? `아쉬워요. ${q.wrongWhy[q.choices[i].v]}` : '아쉬워요. 다시 골라 보세요.');
    }
    function oxChoose(idx, i) {
      const p = players[idx];
      const q = p.q;
      if (p.stage === 'ox') {
        if (p.picked.includes(i)) return;
        const saidYes = i === 0;
        if (saidYes && q.isYes) { award(idx, q.okYes, q.okYes.replace(/<[^>]+>/g, '')); return; }
        if (!saidYes && !q.isYes) {
          p.stage = 'why';
          p.state = 'ok';
          p.message = '맞아요! 그 이유를 골라 보세요.';
          renderCell(idx);
          blip('tick');
          return;
        }
        p.picked.push(i);
        miss(idx, saidYes ? q.hintYes : q.hintNo);
        return;
      }
      if (p.pickedWhy.includes(i)) return;
      if (q.reasons[i].v === q.why) { award(idx, q.okNo, q.okNo.replace(/<[^>]+>/g, '')); return; }
      p.pickedWhy.push(i);
      miss(idx, '다시 골라 보세요. 그림을 꼼꼼히 살펴봐요.');
    }

    /* ---------- 키패드 ---------- */
    function kp(idx, key) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q || p.q.kind !== 'keypad') return;
      if (key === 'del') p.input = p.input.slice(0, -1);
      else if (/^[0-9]$/.test(key)) {
        if (p.input.length >= 5) return;
        p.input = p.input === '0' ? key : p.input + key;
      } else return;
      p.inputBad = false;
      const el = document.getElementById(`ans-${idx}`);
      if (el) el.outerHTML = ansBoxHtml(p);
    }
    function submitAns(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q) return;
      const q = p.q;
      if (!p.input) { setMsg(idx, '답을 써 주세요.', 'hint'); return; }
      const ok = parseNum(p.input) === q.ans;
      p.inputBad = !ok;
      resolve(idx, ok, `정답! ${q.explain || ''}`, `다시 생각해 봐요.${q.hint ? ` ${q.hint}` : ''}`, q.okSpeech || `${q.ans}${UNIT_SAY[q.unit] || ''}`);
    }

    /* ---------- 도형판 누르기 ---------- */
    function geoTap(idx, k) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q || p.q.kind !== 'geo' || p.closed) return;
      const D = GEO_BOARDS[p.q.board];
      const path = p.path;
      const say = (m, st = 'hint') => setMsg(idx, m, st);
      if (!path.length) { path.push(k); blip('tick'); renderCell(idx); return; }
      const last = path[path.length - 1];
      if (k === last) { path.pop(); renderCell(idx); return; }
      if (k === path[0]) {
        if (path.length < 3) { say('점을 3개 이상 이어야 도형을 닫을 수 있어요.'); return; }
        for (let i = 1; i < path.length - 2; i += 1) {
          if (segCross(D[path[i]], D[path[i + 1]], D[last], D[k])) { say('선이 서로 엇갈리면 안 돼요. 되돌리기를 눌러 고쳐 보세요.'); return; }
        }
        p.closed = true;
        geoCheck(idx);
        return;
      }
      if (path.includes(k)) { say('이미 이은 점이에요. 다른 점을 골라요.'); return; }
      for (let i = 0; i < path.length - 2; i += 1) {
        if (segCross(D[path[i]], D[path[i + 1]], D[last], D[k])) { say('선이 서로 엇갈리거나 겹치면 안 돼요.'); return; }
      }
      if (path.length >= 2) {
        const a = D[path[path.length - 2]];
        const b = D[last];
        const c = D[k];
        const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
        const dot = (b[0] - a[0]) * (c[0] - b[0]) + (b[1] - a[1]) * (c[1] - b[1]);
        if (Math.abs(cr) < 1e-6 && dot < 0) { say('왔던 선을 따라 되돌아가면 안 돼요.'); return; }
      }
      path.push(k);
      blip('tick');
      if (p.state === 'hint' || p.state === 'no') { p.state = ''; p.message = START_MSG.geo; }
      renderCell(idx);
    }
    function geoUndo(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.q.kind !== 'geo') return;
      p.closed = false;
      p.path.pop();
      renderCell(idx);
    }
    function geoDone(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.q.kind !== 'geo') return;
      if (p.path.length < 3) { setMsg(idx, '점을 3개 이상 이어 보세요.', 'hint'); return; }
      geoTap(idx, p.path[0]);
    }
    function geoCheck(idx) {
      const p = players[idx];
      const q = p.q;
      const D = GEO_BOARDS[q.board];
      const pts = p.path.map((k) => D[k]);
      const cs = geoCorners(pts);
      const n = cs.length;
      const lineNote = cs.length < pts.length ? ' 곧은 선 위에 있는 점은 꼭짓점이 아니에요.' : '';
      const fail = (m) => { p.closed = false; miss(idx, m); };
      if (n < 3 || Math.abs(polyArea(pts)) < 1e-6) { fail('선분 3개 이상으로 둘러싸야 다각형이에요.'); return; }
      if (q.reg) {
        const L = sideLens(cs);
        const A = innerAngles(cs);
        const eqS = Math.max(...L) - Math.min(...L) < 1e-6;
        const eqA = Math.max(...A) - Math.min(...A) < 0.5;
        if (n === q.n && eqS && eqA) { award(idx, `정답! 변의 길이와 각의 크기가 모두 같은 ${regName(n)}이에요.`, `${regName(n)}을 만들었어요`); return; }
        if (n !== q.n) { fail(`지금은 ${polyName(n)}이에요. 변이 ${q.n}개인 ${regName(q.n)}을 만들어요.${lineNote}`); return; }
        fail(eqS ? '변의 길이는 모두 같지만 각의 크기가 모두 같지는 않아요.' : '변의 길이가 모두 같지는 않아요. 변의 길이를 똑같이 맞춰 보세요.');
        return;
      }
      if (n === q.n) { award(idx, `정답! 변 ${n}개, 꼭짓점 ${n}개인 ${polyName(n)}이에요.`, `${polyName(n)}을 만들었어요`); return; }
      fail(`지금 만든 도형은 변이 ${n}개인 ${polyName(n)}이에요. 변이 ${q.n}개가 되게 고쳐 보세요.${lineNote}`);
    }

    /* ---------- 대각선 누르기 ---------- */
    function diagTap(idx, v) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q || p.q.kind !== 'diag') return;
      const q = p.q;
      if (p.sel === null) { p.sel = v; blip('tick'); renderCell(idx); return; }
      if (p.sel === v) { p.sel = null; renderCell(idx); return; }
      const a = p.sel;
      const b = v;
      p.sel = null;
      const n = q.n;
      if ((b - a + n) % n === 1 || (a - b + n) % n === 1) {
        p.tries += 1;
        p.state = 'no';
        p.message = `${VLAB[a]}${gwaWa(VLAB_KO[a])} ${VLAB[b]}${eunNeun(VLAB_KO[b])} 이웃한 꼭짓점이에요. 이으면 대각선이 아니라 변이 돼요!`;
        blip('no');
        renderCell(idx);
        return;
      }
      if (q.from && a !== 0 && b !== 0) {
        p.state = 'hint';
        p.message = '꼭짓점 ㄱ에서 긋는 대각선만 그어요.';
        renderCell(idx);
        return;
      }
      const key = a < b ? `${a}-${b}` : `${b}-${a}`;
      const at = p.lines.indexOf(key);
      if (at >= 0) p.lines.splice(at, 1);
      else p.lines.push(key);
      blip('tick');
      if (p.lines.length === q.target) {
        award(idx, q.from ? `정답! 꼭짓점 ㄱ에서 그을 수 있는 대각선은 ${q.target}개예요.` : `정답! ${polyName(n)}의 대각선은 모두 ${q.target}개예요.`, q.from ? `꼭짓점 기역에서 그을 수 있는 대각선은 ${q.target}개예요` : `${polyName(n)}의 대각선은 모두 ${q.target}개예요`);
        return;
      }
      p.state = '';
      p.message = `대각선 ${p.lines.length}개를 그었어요. 더 그을 수 있을까요?`;
      renderCell(idx);
    }
    function diagClear(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.q.kind !== 'diag') return;
      p.lines = [];
      p.sel = null;
      renderCell(idx);
    }

    /* ---------- 모양 조각 놓기 ---------- */
    function tileSel(idx, t) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.q.kind !== 'tile') return;
      p.sel = t;
      if (p.state === 'hint') { p.state = ''; p.message = START_MSG.tile; }
      renderCell(idx);
    }
    function tileUndo(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.q.kind !== 'tile' || !p.placed.length) return;
      p.placed.pop();
      renderCell(idx);
    }
    function latPoint(svg, e) {
      const m = svg.getScreenCTM();
      if (!m) return null;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      const r = pt.matrixTransform(m.inverse());
      return [r.x, -r.y];
    }
    function tileCandidate(p, pt) {
      const t = triAt(pt[0], pt[1]);
      if (!p.regionSet.has(t)) return null;
      const used = new Set(p.placed.flatMap((x) => x.keys));
      if (used.has(t)) return null;
      const cands = placementsAt(p.sel, t, p.regionSet, used);
      if (!cands.length) return { none: true };
      let best = null;
      let bd = Infinity;
      cands.forEach((keys) => {
        const cs = keys.map(triCenter);
        const cx = cs.reduce((s, c) => s + c[0], 0) / cs.length;
        const cy = cs.reduce((s, c) => s + c[1], 0) / cs.length;
        const d = Math.hypot(cx - pt[0], cy - pt[1]);
        if (d < bd) { bd = d; best = keys; }
      });
      return { keys: best };
    }
    function showGhost(idx, keys, type) {
      const g = document.getElementById(`ghost-${idx}`);
      if (!g) return;
      g.setAttribute('d', keys ? keysPath(keys) : '');
      if (type) g.style.fill = PIECES[type].color;
    }
    function placePiece(idx, keys) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.q.kind !== 'tile') return;
      const used = new Set(p.placed.flatMap((x) => x.keys));
      if (keys.some((k) => used.has(k) || !p.regionSet.has(k))) return;
      p.placed.push({ type: p.sel, keys });
      blip('put');
      const q = p.q;
      if (q.mode === 'fill' && used.size + keys.length === p.regionSet.size) {
        award(idx, `빈틈없이 채웠어요! 모양 조각 ${p.placed.length}개를 사용했어요.`, `빈틈없이 채웠어요. 모양 조각 ${p.placed.length}개를 썼어요`);
        return;
      }
      if (p.state === 'hint' || p.state === 'no') { p.state = ''; p.message = q.mode === 'build' ? '좋아요! 다 만들면 확인을 눌러요.' : START_MSG.tile; }
      renderCell(idx);
    }
    function removePiece(idx, i) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.q.kind !== 'tile') return;
      p.placed.splice(i, 1);
      blip('tick');
      renderCell(idx);
    }
    function buildCheck(idx) {
      const p = players[idx];
      if (!gameActive || !p || p.locked || p.q.kind !== 'tile') return;
      const q = p.q;
      if (!p.placed.length) { setMsg(idx, '조각을 골라 판 위에 놓아 보세요.', 'hint'); return; }
      if (q.counts) {
        const t = LAT_TYPES.find((ty) => (q.counts[ty] || 0) !== p.placed.filter((x) => x.type === ty).length);
        if (t) { setMsg(idx, q.counts[t] ? `${PB_LAB[t]} 조각을 ${q.counts[t]}개 모두 사용해요. (지금 ${p.placed.filter((x) => x.type === t).length}개)` : `${PB_LAB[t]} 조각은 쓰지 않아요.`, 'hint'); return; }
      } else if (p.placed.length !== q.k) {
        setMsg(idx, `모양 조각을 ${q.k}개 사용해요. (지금 ${p.placed.length}개)`, 'hint');
        return;
      }
      const info = shapeInfo(p.placed.flatMap((x) => x.keys));
      if (!info.simple) { miss(idx, '조각끼리 변과 변이 맞닿게 이어 붙여요. 떨어져 있거나 꼭짓점만 닿으면 하나의 다각형이 아니에요.'); return; }
      if (info.sides !== q.n) { miss(idx, `지금 만든 모양은 변이 ${info.sides}개인 ${polyName(info.sides)}이에요. ${polyName(q.n)}이 되게 바꿔 보세요.`); return; }
      award(idx, `정답! 변이 ${q.n}개인 ${polyName(q.n)}을 만들었어요.`, `${polyName(q.n)}을 만들었어요`);
    }

    // 도형판·대각선·조각판은 손가락이나 마우스로 누른다
    const tileDrags = {};
    document.addEventListener('pointerdown', (e) => {
      const t = e.target;
      if (!t || !t.closest) return;
      const gi = t.closest('[data-gi]');
      if (gi) { e.preventDefault(); geoTap(Number(gi.dataset.p), Number(gi.dataset.gi)); return; }
      const dv = t.closest('[data-dv]');
      if (dv) { e.preventDefault(); diagTap(Number(dv.dataset.p), Number(dv.dataset.dv)); return; }
      const svg = t.closest('svg.lat.tap');
      if (!svg) return;
      e.preventDefault();
      const idx = Number(svg.dataset.p);
      const p = players[idx];
      if (!gameActive || !p || p.locked || !p.q || p.q.kind !== 'tile') return;
      const pc = t.closest('[data-pc]');
      if (pc) { removePiece(idx, Number(pc.dataset.pc)); return; }
      if (tileLeft(p, p.sel) === 0) { setMsg(idx, `${PB_LAB[p.sel]} 조각은 다 썼어요. 다른 조각을 골라요.`, 'hint'); return; }
      const pt = latPoint(svg, e);
      if (!pt) return;
      const c = tileCandidate(p, pt);
      if (!c) return;
      if (c.none) { setMsg(idx, `여기에는 ${PB_LAB[p.sel]} 조각이 들어가지 않아요.`, 'hint'); return; }
      tileDrags[e.pointerId] = { idx, keys: c.keys, svg };
      showGhost(idx, c.keys, p.sel);
    });
    document.addEventListener('pointermove', (e) => {
      const d = tileDrags[e.pointerId];
      if (!d) return;
      const p = players[d.idx];
      if (!p || p.q.kind !== 'tile') return;
      const pt = latPoint(d.svg, e);
      if (!pt) return;
      const c = tileCandidate(p, pt);
      if (c && c.keys) { d.keys = c.keys; showGhost(d.idx, c.keys, p.sel); }
    });
    document.addEventListener('pointerup', (e) => {
      const d = tileDrags[e.pointerId];
      if (!d) return;
      delete tileDrags[e.pointerId];
      showGhost(d.idx, null);
      placePiece(d.idx, d.keys);
    });
    document.addEventListener('pointercancel', (e) => {
      const d = tileDrags[e.pointerId];
      if (!d) return;
      delete tileDrags[e.pointerId];
      showGhost(d.idx, null);
    });

    /* =========================================================
       학습지 만들기
       ========================================================= */
    // per: 한 장의 문제 수, cols: 칸 수
    const WS_TYPES = [
      { id: 'find', st: 1, title: '다각형 찾기', guide: '다각형에는 ○표, 다각형이 아닌 도형에는 ✕표 하세요.', per: 12, cols: 4 },
      { id: 'name', st: 1, title: '변과 꼭짓점, 이름 쓰기', guide: '변과 꼭짓점의 수를 세어 쓰고, 다각형의 이름을 쓰세요.', per: 9, cols: 3 },
      { id: 'dots', st: 1, title: '점 종이에 다각형 그리기', guide: '점을 이어 주어진 다각형을 그려 보세요. 곧은 선 위의 점은 꼭짓점이 아니에요.', per: 6, cols: 3 },
      { id: 'reg', st: 2, title: '정다각형 찾기', guide: '정다각형이면 ○, 아니면 ✕ 하고, 정다각형이 아닌 까닭을 쓰세요.', per: 6, cols: 2 },
      { id: 'regcalc', st: 2, title: '정다각형의 변과 각', guide: '정다각형은 변의 길이와 각의 크기가 모두 같아요. □ 안에 알맞은 수를 쓰세요.', per: 6, cols: 2 },
      { id: 'diag', st: 3, title: '대각선 긋기', guide: '자를 대고 대각선을 모두 그은 뒤, 대각선의 수를 쓰세요.', per: 9, cols: 3 },
      { id: 'pb', st: 4, title: '모양 조각의 관계', guide: '모양 조각을 보고 □ 안에 알맞은 수를 쓰세요.', per: 6, cols: 2 },
      { id: 'make', st: 4, title: '만든 모양의 이름', guide: '모양 조각으로 만든 모양의 변의 수를 세고, 이름을 쓰세요. 곧게 이어진 변은 하나의 변이에요.', per: 9, cols: 3 },
      { id: 'fill', st: 5, title: '모양 채우기', guide: '모양 조각으로 빈틈없이 채워 보세요. 점선을 따라 선을 긋고 조각 색으로 칠해요.', per: 4, cols: 2 },
      { id: 'fillcount', st: 5, title: '몇 개로 채울까?', guide: '주어진 조각만으로 빈틈없이 채우려면 몇 개가 필요한지 쓰세요.', per: 6, cols: 2 },
      { id: 'fix', st: 6, title: '설명 탐정', guide: '도형을 잘못 설명한 것을 찾아 기호를 쓰세요.', per: 6, cols: 2 },
      { id: 'life', st: 6, title: '생활 속 다각형', guide: '물건에서 찾을 수 있는 도형의 이름을 쓰세요.', per: 9, cols: 3 }
    ];
    const ws = { type: 'find', pages: 1, key: true, data: [] };
    function wsType() { return WS_TYPES.find((t) => t.id === ws.type) || WS_TYPES[0]; }
    // 점 종이 예시 답 (5×5)
    const DOT_EX = {
      3: [[0, 4], [4, 4], [2, 0]],
      4: [[1, 0], [4, 1], [3, 4], [0, 3]],
      5: [[2, 0], [4, 2], [3, 4], [1, 4], [0, 2]],
      6: [[1, 0], [3, 0], [4, 2], [3, 4], [1, 4], [0, 2]],
      7: [[1, 0], [3, 0], [4, 1], [4, 3], [2, 4], [0, 3], [0, 1]],
      8: [[1, 0], [3, 0], [4, 1], [4, 3], [3, 4], [1, 4], [0, 3], [0, 1]]
    };
    const MARKS = ['㉠', '㉡', '㉢'];
    function wsItem(T) {
      switch (T.id) {
        case 'find': {
          const yes = Math.random() < 0.55;
          const sh = yes ? { pts: randPolygon(randInt(3, 8), 0.3) } : randNonPoly(Math.random() < 0.6 ? 'curve' : 'open');
          return { key: uid(), yes, sh };
        }
        case 'name': { const n = pick([3, 4, 5, 5, 6, 6, 7, 7, 8, 8]); return { key: uid(), n, pts: randPolygon(n, 0.3) }; }
        case 'dots': { const n = randInt(3, 8); return { key: `d${n}${uid()}`, n }; }
        case 'reg': {
          const yes = Math.random() < 0.4;
          const sh = yes ? regShape(pick([3, 4, 5, 6, 8]), randInt(2, 6)) : randNonReg();
          return { key: uid(), yes, sh };
        }
        case 'regcalc': return withOpt('all', makeRegCalc);
        case 'diag': { const n = pick([4, 4, 5, 5, 6, 6]); return { key: uid(), n, pts: n === 4 ? quadPts() : randConvex(n) }; }
        case 'pb': { let q; do { q = makePbHow(); } while (q.kind !== 'keypad'); return q; }
        case 'make': {
          const g = growShape(LAT_TYPES, pick([2, 2, 3, 3, 4]), { sides: [3, 4, 5, 6, 7, 8], maxSides: 8 });
          return { key: g.keys.sort().join(''), plan: g.plan, n: g.info.sides };
        }
        case 'fill': {
          const s = Math.random() < 0.75 ? pick(SILS) : (grownSil(LAT_TYPES, randInt(4, 6)) || pick(SILS));
          return { key: `${s.name}${uid()}`, s, sol: solveTiling(s.keys, LAT_TYPES, { shuffle: true }) };
        }
        case 'fillcount': return makeFillCount();
        case 'fix': {
          const k = pick(Object.keys(FIX_FIGS));
          const d = FIX_FIGS[k]();
          const picks = shuffle([...shuffle(d.t).slice(0, 2), pick(d.f)]);
          return { key: `${k}${picks.join('')}`, fig: d.fig, picks, ans: picks.findIndex((v) => d.f.includes(v)) };
        }
        case 'life': { const q = makeLife(); return { key: q.key, it: LIFE.find((x) => `lf${x.id}` === q.key), ans: q.ans }; }
        default: return null;
      }
    }
    function wsGen() {
      const T = wsType();
      const pages = [];
      for (let pg = 0; pg < ws.pages; pg += 1) {
        const items = [];
        const seen = new Set();
        let guard = 0;
        while (items.length < T.per && guard < T.per * 20) {
          const q = wsItem(T);
          guard += 1;
          if (seen.has(q.key) && guard < T.per * 12) continue;
          seen.add(q.key);
          items.push(q);
        }
        pages.push({ items });
      }
      ws.data = pages;
    }
    function wsDots(ans, n) {

    /* =========================================================
       골든벨
       칠판(선생님)이 문제를 내고, 반 친구들이 각자 태블릿으로 같은 문제를 한꺼번에 풀어요.

       ========================================================= */
    const BELL_SERVER_URL = 'https://ssamnori-bell.thinkchain-hansang.workers.dev';
    // 선생님 컴퓨터의 파일(file://)로 열었을 때 학생 QR이 가리킬 다각형맨 주소
    const BELL_PAGE_URL = 'https://hanssam622.github.io/ssamnori/games/polygonman/index.html';
    const PAGE_PARAMS = new URLSearchParams(location.search);
    // 내 컴퓨터에서 서버를 시험할 때만 ?bellServer=http://localhost:8787 처럼 바꿀 수 있다
    const BELL_LOCAL = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(PAGE_PARAMS.get('bellServer') || '') ? PAGE_PARAMS.get('bellServer') : '';
    const BELL_SERVER = BELL_LOCAL || BELL_SERVER_URL;
    const BELL_CFG_KEY = 'polyman-bell-v1';
    const BELL_ME_KEY = 'polyman-bell-me';
    const BELL_MAX_POINTS = 1000;
    const BELL_LEADERS = 5;
    const BELL_EXTEND = 10;
    // 태블릿에서 0초 직전에 누른 답이 칠판에 닿을 때까지 조금 더 기다린다
    const BELL_GRACE_MS = 600;
    const BELL_ANIMALS = [
      ['dog', '🐶'], ['cat', '🐱'], ['rabbit', '🐰'], ['fox', '🦊'], ['bear', '🐻'], ['panda', '🐼'], ['koala', '🐨'],
      ['tiger', '🐯'], ['lion', '🦁'], ['cow', '🐮'], ['pig', '🐷'], ['frog', '🐸'], ['monkey', '🐵'], ['chick', '🐤'],
      ['penguin', '🐧'], ['owl', '🦉'], ['unicorn', '🦄'], ['octopus', '🐙'], ['whale', '🐳'], ['dino', '🦖']
    ];
    const bellEmoji = (id) => (BELL_ANIMALS.find(([k]) => k === id) || BELL_ANIMALS[0])[1];

    function bellEsc(s) {

    // 골든벨에서 낼 수 있는 유형: 태블릿에서 한 번 눌러 답하는 것만 낸다.
    // 도형판·대각선 긋기·조각 놓기는 빼고, ○✕ 뒤에 이유를 고르는 문제는 한 번에 고르는 모양으로 바꾼다.
    const BELL_SKIP = new Set(['geo', 'regGeo', 'diagDraw', 'build', 'fill', 'fillOne']);
    const BELL_LABEL = {};
    const BELL_LESSONS = LESSONS.map((l) => ({ ...l, items: l.items.filter((id) => !BELL_SKIP.has(id)) })).filter((l) => l.items.length);
    const BELL_IDS = BELL_LESSONS.flatMap((l) => l.items);

    // 시간 대결: 태블릿마다 기존 다각형맨 게임을 돌리므로 도형판·조각 놓기까지 모든 유형을 낼 수 있다.
    const BELL_RACES = [60, 90, 180, 300];

    const bellTimeText = (sec) => (sec % 60 ? `${Math.floor(sec / 60) ? `${Math.floor(sec / 60)}분 ` : ''}${sec % 60}초` : `${sec / 60}분`);

    // 단원 평가: 제한 시간(분, 0은 무제한)과 끝난 뒤 학생 태블릿에 점수를 보여 줄지
    const EXAM_MINS = [10, 15, 20, 30, 40, 0];

    let bellCfg = { kind: 'bell', sel: [...BELL_IDS], count: 10, seconds: 20, auto: 0, race: 180, raceSel: [...RACE_IDS], examMin: 20, examShow: true };
    try {

          kind: BELL_KINDS.includes(saved.kind) ? saved.kind : 'bell',

    // 지금 고른 게임 방식의 유형 목록
    const bellSelKey = () => (bellCfg.kind === 'race' ? 'raceSel' : 'sel');
    const bellLessons = () => (bellCfg.kind === 'race' ? LESSONS : BELL_LESSONS);
    const bellItemLabel = (id) => (bellCfg.kind === 'race' ? MIX_ITEMS[id].label : BELL_LABEL[id] || MIX_ITEMS[id].label);

    /* ---------- 방 연결 (칠판과 태블릿이 함께 쓴다) ---------- */
    // 학교 와이파이에서 조용히 끊기거나 태블릿이 잠들었다 깨어나도 저절로 다시 붙는다.
    class BellSocket {
      constructor(url, handlers) {
        this.url = url;
        this.h = handlers;
        this.queue = [];
        this.retry = 0;
        this.stopped = false;
        this.fatal = false;
        this.lastHeard = 0;
        this.probe = this.probe.bind(this);
        document.addEventListener('visibilitychange', this.probe);
        window.addEventListener('online', this.probe);
        // 만든 쪽이 이 소켓을 변수에 담은 뒤에 연결을 시작한다
        setTimeout(() => this.connect(), 0);
      }
      connect() {
        if (this.stopped || this.fatal) return;
        this.h.status('connecting');
        let ws;
        try { ws = new WebSocket(this.url()); } catch (err) { this.later(); return; }
        this.ws = ws;
        ws.onopen = () => {
          if (this.ws !== ws) return;
          this.lastHeard = Date.now();
          clearTimeout(this.stable);
          this.stable = setTimeout(() => { this.retry = 0; }, 30000);
          while (this.queue.length) ws.send(this.queue.shift());
          clearInterval(this.pinger);
          this.pinger = setInterval(() => this.check(), 10000);
          this.h.status('open');
        };
        ws.onmessage = (e) => {
          if (this.ws !== ws) return;
          this.lastHeard = Date.now();
          let m;
          try { m = JSON.parse(e.data); } catch (err) { return; }
          if (m.t === 'pong') return;
          if (m.t === 'closed' || (m.t === 'error' && ['kicked', 'closed', 'not-found', 'full'].includes(m.code))) this.fatal = true;
          this.h.message(m);
        };
        ws.onclose = () => {
          if (this.ws !== ws) return;
          clearInterval(this.pinger);
          if (this.stopped || this.fatal) { this.h.status('closed'); return; }
          this.later();
        };
        ws.onerror = () => ws.close();
      }
      later() {
        this.h.status('connecting');
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.connect(), Math.min(10000, 500 * 2 ** Math.min(this.retry++, 5)));
      }
      // 25초 동안 아무 말도 못 받았으면 끊긴 것으로 보고 다시 붙는다. 핑에는 Cloudflare가 대신 답한다.
      check() {
        if (document.visibilityState === 'hidden' || !this.ws || this.ws.readyState !== 1) return;
        if (Date.now() - this.lastHeard > 25000) this.restart();
        else this.ws.send('{"t":"ping"}');
      }
      // 화면이 다시 켜지거나 와이파이가 돌아오면 핑을 보내 보고, 5초 안에 답이 없으면 다시 붙는다.
      probe() {
        const ws = this.ws;
        if (this.stopped || this.fatal || document.visibilityState === 'hidden' || !ws || ws.readyState !== 1) return;
        const at = Date.now();
        ws.send('{"t":"ping"}');
        setTimeout(() => { if (this.ws === ws && this.lastHeard < at) this.restart(); }, 5000);
      }
      restart() {
        const old = this.ws;
        this.ws = null;
        clearInterval(this.pinger);
        try { old.close(); } catch (err) { /* 이미 닫힘 */ }
        this.connect();
      }
      send(m) {
        if (this.stopped || this.fatal) return;
        const s = JSON.stringify(m);
        if (this.ws && this.ws.readyState === 1) this.ws.send(s);
        else this.queue.push(s);
      }
      close() {
        this.stopped = true;
        document.removeEventListener('visibilitychange', this.probe);
        window.removeEventListener('online', this.probe);
        clearTimeout(this.timer);
        clearTimeout(this.stable);
        clearInterval(this.pinger);
        try { if (this.ws) this.ws.close(1000); } catch (err) { /* 이미 닫힘 */ }
      }
    }

    /* ---------- 골든벨 문제: 다각형맨 문제를 '한 번에 답하는' 모양으로 ---------- */
    // input: 'choice'(보기 고르기, ans는 번호) 또는 'keypad'(수 쓰기, ans는 자연수)
    function toBell(raw) {
      const q = raw.kind === 'ox' ? oxToChoice(raw) : raw;
      const base = { speech: q.speech, explain: q.explain || '' };
      if (q.kind === 'choice') {
        const ans = q.choices.findIndex((c) => c.v === q.ans);
        return { ...base, input: 'choice', prompt: q.prompt, visual: q.visual || '', choices: q.choices.map((c) => c.html), cols: q.cols || 2, txt: Boolean(q.txt), figs: Boolean(q.figs), ans, ansHtml: ans >= 0 ? q.choices[ans].html : '' };
      }
      if (q.kind === 'keypad') {
        return { ...base, input: 'keypad', prompt: q.prompt || '', visual: q.visual || '', lhs: q.lhs || '', unit: q.unit || '', ans: q.ans, ansHtml: `${q.ans}${q.unit === '°' ? '°' : q.unit ? ` ${q.unit}` : ''}` };
      }
      return null;
    }

    // 고른 유형을 돌아가며 내고, 같은 문제는 다시 내지 않는다.
    function bellMakeSet() {
      const ids = shuffle(bellCfg.sel.filter((id) => BELL_IDS.includes(id)));
      if (!ids.length) return [];
      const out = [];
      const keys = new Set();
      for (let guard = 0; out.length < bellCfg.count && guard < bellCfg.count * 10; guard += 1) {
        const id = ids[out.length % ids.length];
        const raw = MIX_ITEMS[id].make();
        if (raw.key && keys.has(raw.key)) continue;
        const bq = toBell(raw);
        if (!bq || (bq.input === 'choice' && bq.ans < 0) || (bq.input === 'keypad' && !Number.isInteger(bq.ans))) continue;
        keys.add(raw.key);
        out.push({ ...bq, id, label: BELL_LABEL[id] || MIX_ITEMS[id].label });
      }
      return out;
    }

    // 맞히면 바로 1000점, 시간이 다 될 즈음이면 500점. 틀리면 0점.
    function bellPoints(ms, seconds) {
      const ratio = Math.min(1, Math.max(0, ms) / Math.max(1000, seconds * 1000));
      return Math.round(BELL_MAX_POINTS * (1 - ratio / 2));
    }

    /* ---------- 골든벨 준비 (유형·문제 수·시간 고르기) ---------- */

    function renderBellSetup() {

      const race = bellCfg.kind === 'race';
