          okSpeech: ans
        };
      }
      if (t === 'what') {
        return {
          kind: 'choice', key: 'wwhat', ans: 'a', txt: true, cols: 1,
          choices: shuffle([
            { v: 'a', html: '시간에 따라 변하는 모습' },
            { v: 'b', html: '항목별 크기를 그림으로 나타낸 모습' },
            { v: 'c', html: '전체를 몇 부분으로 나눈 모습' },
            { v: 'd', html: '자료를 이름의 가나다 순서로 늘어놓은 모습' }
          ]),
          prompt: '꺾은선그래프는 무엇을 알아보기 쉬운 그래프일까요?',
          speech: '꺾은선그래프는 무엇을 알아보기 쉬운 그래프일까요?',
          explain: '꺾은선그래프는 시간에 따라 변하는 모습을 알아보기 쉬워요.'
        };
      }
      return {
        kind: 'choice', key: 'wseg', ans: 'seg', txt: true,
        choices: shuffle([{ v: 'seg', html: '선분' }, { v: 'curve', html: '곡선' }, { v: 'bar', html: '막대' }, { v: 'pic', html: '그림' }]),
        prompt: '꺾은선그래프는 시간에 따라 변하는 양을 점으로 표시하고, 그 점들을 <b>무엇</b>으로 이어 그린 그래프일까요?',
        speech: '꺾은선그래프는 시간에 따라 변하는 양을 점으로 표시하고, 그 점들을 무엇으로 이어 그린 그래프일까요?',
        explain: '점들을 선분으로 이어 그린 그래프를 꺾은선그래프라고 해요.', okSpeech: '선분'
      };
    }

    /* ---------- 2. 눈금 한 칸의 크기 ---------- */
    function makeGUnit() {
      let G = makeGraph({ wave: waveOpt() });
      if (!G.wave) {
        const pers = [5, 5, 2, 10].filter((pp) => {
          const g = fitScale({ ...G, per: pp });
          const cnt = Math.round(g.hi / (pp * g.step));
          return cnt >= 2 && cnt <= 8;
        });
        if (pers.length) G = fitScale({ ...G, per: pick(pers) });
      }
      const major = r2(G.per * G.step);
      return {
        kind: 'keypad', key: `un${G.id}${G.per}${G.step}`, ans: G.step, dot: dotOf(G),
        prompt: '세로 눈금 <b>한 칸</b>은 얼마를 나타낼까요?',
        visual: graphQ(G),
        lhs: '<span class="lhs-t">한 칸</span>', unit: unitTxt(G),
        speech: '세로 눈금 한 칸은 얼마를 나타낼까요? 큰 눈금 사이가 몇 칸인지 세어 보세요.',
        explain: `큰 눈금 ${G.per}칸이 ${fmt(major)}${uSp(G.yUnit)}이므로 한 칸은 ${fmt(major)} ÷ ${G.per} = ${fmt(G.step)}`,
        hint: `큰 눈금 사이를 몇 칸으로 나누었는지 세어 보세요.`,
        okSpeech: vSay(G, G.step)
      };
    }

    /* ---------- 3. 꺾은선그래프 읽기 ---------- */
    function makeGRead() {
      const G = makeGraph({ wave: waveOpt() });
      const i = randInt(0, G.xs.length - 1);
      if (Math.random() < 0.72) {
        return {
          kind: 'keypad', key: `rd${G.id}${i}${G.vals[i]}`, ans: G.vals[i], dot: dotOf(G),
          prompt: `<b>${xText(G, i)}</b>의 ${G.subj}${eunNeun(G.subj)} 얼마일까요?`,
          visual: graphQ(G),
          lhs: `<span class="lhs-t">${xText(G, i)}</span>`, unit: unitTxt(G),
          speech: `${xSay(G, i)}의 ${G.subj}${eunNeun(G.subj)} 얼마일까요?`,
          explain: `${xText(G, i)}의 점에서 왼쪽으로 가면 ${vText(G, G.vals[i])}`,
          hint: `세로 눈금 한 칸은 ${fmt(G.step)}${uSp(G.yUnit)}예요.`,
          okSpeech: vSay(G, G.vals[i])
        };
      }
      const cand = G.vals.map((v, k) => k).filter((k) => G.vals.filter((v) => sameNum(v, G.vals[k])).length === 1);
      const k = pick(cand);
      return {
        kind: 'choice', key: `rv${G.id}${k}`, ans: k, txt: true,
        choices: xChoices(G, k),
        prompt: `${G.subj}${iGa(G.subj)} <b>${vText(G, G.vals[k])}</b>인 때는 언제일까요?`,
        visual: graphQ(G),
        speech: `${G.subj}${iGa(G.subj)} ${vSay(G, G.vals[k])}인 때는 언제일까요?`,
        explain: `${vText(G, G.vals[k])}에 찍힌 점은 ${xText(G, k)}이에요.`, okSpeech: xSay(G, k)
      };
    }

    /* ---------- 4. 물결선 ---------- */
    function makeGWave() {
      const t = pick(['clear', 'clear', 'clear', 'good', 'omit', 'omit']);
      const G = makeGraph({ wave: true });
      if (t === 'clear') {
        const U = unwaved(G);
        return {
          kind: 'choice', key: `wc${G.id}${uid()}`, ans: 'wave', figs: true,
          choices: shuffle([{ v: 'wave', html: graphCard(G) }, { v: 'plain', html: graphCard(U) }]),
          prompt: `${G.subj}${iGa(G.subj)} 변하는 모습이 더 <b>뚜렷하게</b> 나타나는 그래프를 골라 보세요.`,
          visual: gTitle(G),
          speech: `두 그래프 중에서 ${G.subj}${iGa(G.subj)} 변하는 모습이 더 뚜렷하게 나타나는 그래프를 골라 보세요.`,
          explain: `물결선으로 0부터 ${fmt(G.lo)}까지를 줄여서 세로 눈금 한 칸의 크기가 작아졌어요. 그래서 변화가 뚜렷하게 보여요.`,
          wrongWhy: { plain: '이 그래프는 0부터 모두 나타내서 점들이 위쪽에 모여 있어 변화가 잘 보이지 않아요.' },
          okSpeech: '물결선을 사용한 그래프예요'
        };
      }
      if (t === 'good') {
        return {
          kind: 'choice', key: 'wgood', ans: 'a', txt: true, cols: 1,
          choices: shuffle([
            { v: 'a', html: '필요 없는 부분을 줄여서 변하는 모습을 뚜렷하게 볼 수 있어요.' },
            { v: 'b', html: '자료의 값이 더 커져요.' },
            { v: 'c', html: '가장 큰 값은 나타내지 않아도 돼요.' },
            { v: 'd', html: '점들을 선분으로 잇지 않아도 돼요.' }
          ]),
          prompt: '꺾은선그래프에서 물결선(≈)을 사용하면 좋은 점은 무엇일까요?',
          visual: graphQ(G),
          speech: '꺾은선그래프에서 물결선을 사용하면 좋은 점은 무엇일까요?',
          explain: '물결선으로 필요 없는 부분을 줄이면 세로 눈금 한 칸의 크기를 작게 할 수 있어 변화가 뚜렷하게 보여요.'
        };
      }
      const u = uSp(G.yUnit);
      const major = r2(G.step * G.per);
      const opts = [`0${u}부터 ${fmt(G.lo)}${u}까지`, `${fmt(G.lo)}${u}부터 ${fmt(G.hi)}${u}까지`, `0${u}부터 ${fmt(G.hi)}${u}까지`, `${fmt(r2(G.lo + major))}${u}부터 ${fmt(G.hi)}${u}까지`];
      return {
        kind: 'choice', key: `wo${G.id}${G.lo}`, ans: opts[0], txt: true, cols: 1,
        choices: mkChoices(opts[0], opts.slice(1)),
        prompt: '이 그래프에서 물결선(≈)으로 <b>줄여서</b> 나타낸 부분은 어디일까요?',
        visual: graphQ(G),
        speech: '이 그래프에서 물결선으로 줄여서 나타낸 부분은 어디일까요?',
        explain: `물결선 아래에는 0, 위에는 ${fmt(G.lo)}부터 쓰여 있어요. 0부터 ${fmt(G.lo)}까지를 줄였어요.`
      };
    }

    /* ---------- 5. 나타내는 순서 ---------- */
    const STEPS = [
      '알맞은 제목을 써요.',
      '가로와 세로에 각각 무엇을 나타낼지 정해요.',
      '가로와 세로 눈금의 단위를 정해요.',
      '가장 큰 값까지 나타낼 수 있도록 세로 눈금 한 칸의 크기를 정해요.',
      '가로 눈금과 세로 눈금이 만나는 곳에 점을 찍고, 점들을 선분으로 이어요.'
    ];
    const stepList = (k) => `<ol class="step-list">${STEPS.slice(0, k).map((t) => `<li>${t}</li>`).join('')}<li class="q">?</li></ol>`;
    function makeGSteps() {
      const t = pick(['next', 'next', 'next', 'scale', 'after', 'title']);
      if (t === 'next') {
        const k = randInt(1, 4);
        return {
          kind: 'choice', key: `sn${k}`, ans: STEPS[k], txt: true, cols: 1,
          choices: mkChoices(STEPS[k], shuffle(STEPS.filter((_, i) => i !== k))),
          prompt: `꺾은선그래프로 나타내는 순서예요. <b>${k + 1}번째</b>에 할 일은 무엇일까요?`,
          visual: stepList(k),
          speech: `꺾은선그래프로 나타내는 순서예요. ${k + 1}번째에 할 일은 무엇일까요?`,
          explain: `${k + 1}번째: ${STEPS[k]}`
        };
      }
      if (t === 'scale') {
        return {
          kind: 'choice', key: 'sscale', ans: 'a', txt: true, cols: 1,
          choices: shuffle([
            { v: 'a', html: '가장 큰 값까지 나타낼 수 있도록 정해요.' },
            { v: 'b', html: '가장 작은 값만 나타낼 수 있도록 정해요.' },
            { v: 'c', html: '조사한 때의 수만큼으로 정해요.' },
            { v: 'd', html: '제목의 글자 수만큼으로 정해요.' }
          ]),
          prompt: '세로 눈금 한 칸의 크기는 어떻게 정할까요?',
          speech: '세로 눈금 한 칸의 크기는 어떻게 정할까요?',
          explain: '가장 큰 값까지 나타낼 수 있도록 세로 눈금 한 칸의 크기를 정해요.'
        };
      }
      if (t === 'after') {
        return {
          kind: 'choice', key: 'safter', ans: 'a', txt: true, cols: 1,
          choices: shuffle([
            { v: 'a', html: '점들을 선분으로 이어요.' },
            { v: 'b', html: '점들을 곡선으로 이어요.' },
            { v: 'c', html: '점마다 막대를 그려요.' },
            { v: 'd', html: '찍은 점을 모두 지워요.' }
          ]),
          prompt: '가로 눈금과 세로 눈금이 만나는 곳에 점을 모두 찍었어요. 다음에는 무엇을 할까요?',
          speech: '가로 눈금과 세로 눈금이 만나는 곳에 점을 모두 찍었어요. 다음에는 무엇을 할까요?',
          explain: '점들을 선분으로 이어 꺾은선그래프를 완성해요.'
        };
      }
      const G = makeGraph();
      const others = shuffle(SCEN.filter((s) => s.title !== G.title && s.xLab !== G.xLab).map((s) => s.title));
      const fake = `${G.yLab}별 ${G.xLab}`;
      return {
        kind: 'choice', key: `stt${G.id}`, ans: G.title, txt: true, cols: 1,
        choices: mkChoices(G.title, [fake, ...others]),
        prompt: '이 표를 꺾은선그래프로 나타낼 때 알맞은 <b>제목</b>은 무엇일까요?',
        visual: tableHtml(G, { title: false }),
        speech: '이 표를 꺾은선그래프로 나타낼 때 알맞은 제목은 무엇일까요?',
        explain: `${G.xLab}에 따라 ${G.subj}${iGa(G.subj)} 어떻게 변하는지 나타내므로 '${G.title}'`
      };
    }

    /* ---------- 6. 세로 눈금 정하기 ---------- */
    const CAND_STEPS = [1, 2, 5, 10, 20, 50];
    const SCALE_FALLBACK = { id: 'fest', title: '연도별 마을 축제 방문자 수', subj: '방문자 수', xLab: '연도', xUnit: '년', xs: XS.year, yLab: '방문자 수', yUnit: '명', W: 'amt', step: 1, u: [1, 99] };
    function makeGScale() {
      if (Math.random() < 0.42) {
        const G = makeGraph({ wave: true });
        const major = r2(G.step * G.per);
        const min = Math.min(...G.vals);
        const u = uSp(G.yUnit);
        const opts = [G.lo, r2(G.lo + major), 0, r2(G.lo + 2 * major)];
        return {
          kind: 'choice', key: `scw${G.id}${G.lo}`, ans: G.lo, txt: true,
          choices: mkChoices(G.lo, opts.slice(1), 4, (v) => `${fmt(v)}${u}`),
          prompt: '물결선(≈)을 사용하여 나타내려고 해요. 물결선 위의 세로 눈금을 <b>얼마부터</b> 시작하면 가장 알맞을까요?',
          visual: tableHtml(G),
          speech: '물결선을 사용하여 나타내려고 해요. 물결선 위의 세로 눈금을 얼마부터 시작하면 가장 알맞을까요?',
          explain: `가장 작은 값이 ${fmt(min)}이므로 물결선 위를 ${fmt(G.lo)}부터 시작하면 모든 값을 나타내면서 필요 없는 부분을 줄일 수 있어요.`,
          wrongWhy: Object.fromEntries([[r2(G.lo + major), `${fmt(r2(G.lo + major))}부터 시작하면 가장 작은 값 ${fmt(min)}을 나타낼 수 없어요.`], [r2(G.lo + 2 * major), `가장 작은 값 ${fmt(min)}을 나타낼 수 없어요.`], [0, '0부터 시작하면 물결선을 쓰는 까닭이 없어요. 필요 없는 부분을 줄여 보세요.']])
        };
      }
      for (let tries = 0; tries < 200; tries += 1) {
        const k = randInt(1, 3);
        const s = CAND_STEPS[k];
        const prev = CAND_STEPS[k - 1];
        const next = CAND_STEPS[k + 1];
        const R = pick([10, 12, 15, 20]);
        const n = 5;
        const lowMax = Math.floor((prev * R) / s) + 1;
        if (lowMax > R) continue;
        const uMax = randInt(lowMax, R);
        const us = [uMax, ...Array.from({ length: n - 1 }, () => randInt(Math.max(1, Math.floor(uMax / 3)), uMax))];
        const vals = shuffle(us).map((x) => x * s);
        if (vals.every((v) => v % next === 0)) continue;
        if (new Set(vals).size < 4) continue;
        const max = Math.max(...vals);
        const fits = SCEN.filter((d) => !d.wave && d.W !== 'grow' && d.W !== 'weight' && d.W !== 'temp' && max <= d.u[1] * d.step * 1.6 && max >= d.u[1] * d.step * 0.5);
        const def = fits.length ? pick(fits) : SCALE_FALLBACK;
        const G = { ...def, xs: def.xs().slice(0, n), vals };
        const u = uSp(G.yUnit);
        const bad = vals.find((v) => v % next !== 0);
        const alt = CAND_STEPS[k + 2] || CAND_STEPS[k - 2];
        return {
          kind: 'choice', key: `scs${s}${R}${vals.join('')}`, ans: s, txt: true,
          choices: mkChoices(s, [prev, next, alt], 4, (v) => `${v}${u}`),
          prompt: `세로 눈금을 <b>${R}칸</b>으로 그리려고 해요. 표의 값을 모두 나타내려면 세로 눈금 한 칸을 얼마로 하면 가장 알맞을까요?`,
          visual: tableHtml(G),
          speech: `세로 눈금을 ${R}칸으로 그리려고 해요. 표의 값을 모두 나타내려면 세로 눈금 한 칸을 얼마로 하면 가장 알맞을까요?`,
          explain: `한 칸을 ${s}${u}로 하면 ${R}칸으로 ${s * R}${u}까지 나타낼 수 있고, 모든 값이 눈금에 딱 맞아요.`,
          wrongWhy: Object.fromEntries([
            [prev, `한 칸을 ${prev}${u}로 하면 ${prev * R}${u}까지만 나타낼 수 있어서 가장 큰 값 ${max}${u}를 나타낼 수 없어요.`],
            [next, `한 칸을 ${next}${u}로 하면 ${bad}${u}처럼 눈금과 눈금 사이에 있는 값이 생겨요.`],
            [alt, alt > s ? `한 칸을 ${alt}${u}로 하면 눈금 사이에 있는 값이 생기고, 변화도 잘 보이지 않아요.` : `한 칸을 ${alt}${u}로 하면 가장 큰 값을 나타낼 수 없어요.`]
          ])
        };
      }
      return makeGSteps();
    }

    /* ---------- 7. 꺾은선그래프 그리기 ---------- */
    function makeGPlot() {
      const G = makeGraph({ wave: waveOpt() });
      return {
        kind: 'plot', key: `pl${G.id}${G.vals.join('')}`, G,
        prompt: '표를 보고 꺾은선그래프를 완성해 보세요.',
        speech: `표를 보고 ${G.title} 꺾은선그래프를 완성해 보세요. 세로줄을 눌러 점을 찍어요.`
      };
    }

    /* ---------- 8. 표와 같은 그래프 찾기 ---------- */
    function makeGMatch() {
      const G = makeGraph({ wave: Math.random() < 0.3 });
      const n = G.vals.length;
      const inRange = (v) => v >= G.lo && v <= G.hi;
      const variants = [];
      const sigs = new Set([G.vals.join(',')]);
      const push = (arr, i) => { const sg = arr.join(','); if (!sigs.has(sg)) { sigs.add(sg); variants.push({ arr, i }); } };
      for (let t = 0; t < 60 && variants.length < 3; t += 1) {
        const arr = [...G.vals];
        const kind = variants.length === 1 ? 'swap' : 'shift';
        let at;
        if (kind === 'swap') {
          at = randInt(0, n - 2);
          if (sameNum(arr[at], arr[at + 1])) continue;
          [arr[at], arr[at + 1]] = [arr[at + 1], arr[at]];
        } else {
          at = randInt(0, n - 1);
          const nv = r2(arr[at] + pick([-3, -2, -1, 1, 2, 3]) * G.step);
          if (!inRange(nv)) continue;
          arr[at] = nv;
        }
        push(arr, at);
      }
      const choices = shuffle([{ v: 'ans', html: graphCard(G) }, ...variants.map((x, k) => ({ v: `d${k}`, html: graphCard(G, { vals: x.arr }) }))]);
      return {
        kind: 'choice', key: `mt${G.id}${G.vals.join('')}`, ans: 'ans', figs: true,
        choices,
        prompt: '표를 바르게 나타낸 꺾은선그래프를 찾아보세요.',
        visual: tableHtml(G),
        speech: '표를 바르게 나타낸 꺾은선그래프를 찾아보세요. 점 하나하나를 표와 비교해 보세요.',
        explain: '모든 점이 표의 값과 같은 그래프예요.',
        wrongWhy: Object.fromEntries(variants.map((x, k) => [`d${k}`, `${xText(G, x.i)}의 점이 표와 달라요.`]))
      };
    }

    /* ---------- 9. 가장 많은 때 · 적은 때 ---------- */
    function makeGMax() {
      for (let t = 0; t < 40; t += 1) {
        const G = makeGraph({ wave: Math.random() < 0.3 });
        const hi = Math.random() < 0.6;
        const i = uniqueIdx(G.vals, hi ? Math.max : Math.min);
        const j = uniqueIdx(G.vals, hi ? Math.min : Math.max);
        if (i < 0 || j < 0) continue;
        const word = hi ? G.W.hi : G.W.lo;
        return {
          kind: 'choice', key: `mx${G.id}${hi}${i}`, ans: i, txt: true,
          choices: xChoices(G, i, [j]),
          prompt: `${G.subj}${iGa(G.subj)} <b>${word}</b> 때는 언제일까요?`,
          visual: graphQ(G),
          speech: `${G.subj}${iGa(G.subj)} ${word} 때는 언제일까요?`,
          explain: `${hi ? '가장 높은' : '가장 낮은'} 점은 ${xText(G, i)}이에요. (${vText(G, G.vals[i])})`,
          okSpeech: xSay(G, i)
        };
      }
      return makeGRead();
    }

    /* ---------- 10. 가장 많이 변한 때 ---------- */
    const PREV_WORD = { '월': '전월', '년': '전년도', '시': '1시간 전', '요일': '전날' };
    function consecutive(G) {
      if (G.xUnit === '요일') return true;
      return G.xs.every((x, i) => i === 0 || Number(x) - Number(G.xs[i - 1]) === 1);
    }
    function makeGChange() {
      for (let t = 0; t < 80; t += 1) {
        const kindT = pick(['inc', 'inc', 'dec', 'same', 'big']);
        const G = makeGraph({ wave: Math.random() < 0.25, dec: kindT === 'dec' });
        const n = G.vals.length;
        if (kindT === 'same') {
          const k = randInt(0, n - 2);
          G.vals[k + 1] = G.vals[k];
          const flats = G.vals.slice(0, -1).filter((v, i) => sameNum(v, G.vals[i + 1])).length;
          if (flats !== 1) continue;
          const choices = shuffle(G.xs.slice(0, -1).map((_, i) => i)).slice(0, 3);
          if (!choices.includes(k)) choices[0] = k;
          return {
            kind: 'choice', key: `cs${G.id}${k}`, ans: k, txt: true,
            choices: shuffle(choices).map((i) => ({ v: i, html: between(G, i) })),
            prompt: `${G.subj}${iGa(G.subj)} <b>변하지 않은</b> 때는 언제와 언제 사이일까요?`,
            visual: graphQ(G),
            speech: `${G.subj}${iGa(G.subj)} 변하지 않은 때는 언제와 언제 사이일까요?`,
            explain: `${between(G, k)}에는 선분이 옆으로 반듯해요. 값이 ${vText(G, G.vals[k])}로 같아요.`
          };
        }
        const d = G.vals.slice(1).map((v, i) => r2(v - G.vals[i]));
        let k;
        let word;
        if (kindT === 'inc') { k = uniqueIdx(d, Math.max); word = G.W.incN; if (k >= 0 && d[k] <= 0) k = -1; }
        else if (kindT === 'dec') { k = uniqueIdx(d, Math.min); word = G.W.decN; if (k >= 0 && d[k] >= 0) k = -1; }
        else { const ad = d.map(Math.abs); k = uniqueIdx(ad, Math.max); word = ''; }
        if (k < 0) continue;
        const ids = shuffle(d.map((_, i) => i).filter((i) => i !== k)).slice(0, 3);
        const ask = kindT === 'big' ? '변화가 <b>가장 큰</b>' : `가장 많이 <b>${word}</b>`;
        const askS = kindT === 'big' ? '변화가 가장 큰' : `가장 많이 ${word}`;
        const amt = `${vText(G, Math.abs(d[k]))}`;
        if (kindT !== 'big' && consecutive(G) && PREV_WORD[G.xUnit] && Math.random() < 0.5) {
          const pw = PREV_WORD[G.xUnit];
          return {
            kind: 'choice', key: `cp${G.id}${kindT}${k}`, ans: k + 1, txt: true,
            choices: xChoices(G, k + 1, ids.map((i) => i + 1).concat(0).slice(0, 2)),
            prompt: `${pw}${gwaWa(pw)} 비교하여 ${G.subj}${iGa(G.subj)} ${ask} 때는 언제일까요?`,
            visual: graphQ(G),
            speech: `${pw}${gwaWa(pw)} 비교하여 ${G.subj}${iGa(G.subj)} ${askS} 때는 언제일까요?`,
            explain: `${xText(G, k + 1)}에는 ${pw}보다 ${amt} ${kindT === 'inc' ? G.W.incP : G.W.decP} 선분이 가장 많이 기울어졌어요.`,
            okSpeech: xSay(G, k + 1)
          };
        }
        return {
          kind: 'choice', key: `cb${G.id}${kindT}${k}`, ans: k, txt: true, cols: 1,
          choices: shuffle([k, ...ids]).map((i) => ({ v: i, html: between(G, i) })),
          prompt: `${G.subj}${iGa(G.subj)} ${ask} 때는 언제와 언제 사이일까요?`,
          visual: graphQ(G),
          speech: `${G.subj}${iGa(G.subj)} ${askS} 때는 언제와 언제 사이일까요?`,
          explain: `${between(G, k)}의 선분이 가장 많이 기울어졌어요. (${amt} ${d[k] > 0 ? G.W.incP : G.W.decP})`
        };
      }
      return makeGMax();
    }

    /* ---------- 11. 얼마나 변했을까? ---------- */
    function makeGDiff() {
      for (let t = 0; t < 40; t += 1) {
        const G = makeGraph({ wave: waveOpt() });
        const n = G.vals.length;
        if (Math.random() < 0.25) {
          const mx = Math.max(...G.vals);
          const mn = Math.min(...G.vals);
          const ans = r2(mx - mn);
          return {
            kind: 'keypad', key: `df${G.id}r${ans}`, ans, dot: dotOf(G),
            prompt: `${G.subj}${iGa(G.subj)} ${G.W.hi} 때와 ${G.W.lo} 때의 <b>차</b>는 얼마일까요?`,
            visual: graphQ(G), unit: unitTxt(G),
            speech: `${G.subj}${iGa(G.subj)} ${G.W.hi} 때와 ${G.W.lo} 때의 차는 얼마일까요?`,
            explain: `${fmt(mx)} − ${fmt(mn)} = ${fmt(ans)}`,
            hint: '가장 높은 점과 가장 낮은 점의 값을 각각 읽어 보세요.'
          };
        }
        const i = randInt(0, n - 2);
        const j = Math.random() < 0.75 ? i + 1 : randInt(i + 1, n - 1);
        const dv = r2(G.vals[j] - G.vals[i]);
        if (sameNum(dv, 0)) continue;
        const up = dv > 0;
        return {
          kind: 'keypad', key: `df${G.id}${i}${j}`, ans: Math.abs(dv), dot: dotOf(G),
          prompt: `<b>${xText(G, j)}</b>${eunNeun(xText(G, j))} <b>${xText(G, i)}</b>보다 ${G.subj}${iGa(G.subj)} 얼마나 ${up ? G.W.incQ : G.W.decQ}?`,
          visual: graphQ(G, { hlX: [i, j] }), unit: unitTxt(G),
          speech: `${xSay(G, j)}${eunNeun(xText(G, j))} ${xSay(G, i)}보다 ${G.subj}${iGa(G.subj)} 얼마나 ${up ? G.W.incQ : G.W.decQ}?`,
          explain: `${fmt(Math.max(G.vals[i], G.vals[j]))} − ${fmt(Math.min(G.vals[i], G.vals[j]))} = ${fmt(Math.abs(dv))}`,
          hint: `두 점의 값을 각각 읽고 큰 수에서 작은 수를 빼요.`
        };
      }
      return makeGRead();
    }

    /* ---------- 12. 어떻게 변하고 있을까? ---------- */
    function trendText(W, sh) {
      return { up: `계속 ${W.incG} 있어요.`, down: `계속 ${W.decG} 있어요.`, updown: `${W.incD} ${W.decG} 있어요.`, downup: `${W.decD} ${W.incG} 있어요.` }[sh];
    }
    function makeGTrend() {
      if (Math.random() < 0.3) {
        const sh = pick(['up', 'up', 'down']);
        const G = makeGraph({ shape: sh, dec: sh === 'down', wave: Math.random() < 0.3 });
        if (G.shape !== sh) return makeGTrend();
        const ans = `더 ${sh === 'up' ? G.W.incF : G.W.decF} 것 같아요.`;
        return {
          kind: 'choice', key: `tf${G.id}${sh}`, ans, txt: true, cols: 1,
          choices: mkChoices(ans, [`더 ${sh === 'up' ? G.W.decF : G.W.incF} 것 같아요.`, '변하지 않을 것 같아요.', '0이 될 것 같아요.']),
          prompt: `이대로 변한다면 ${G.subj}${eunNeun(G.subj)} 앞으로 어떻게 될까요?`,
          visual: graphQ(G),
          speech: `이대로 변한다면 ${G.subj}${eunNeun(G.subj)} 앞으로 어떻게 될까요?`,
          explain: `선이 계속 ${sh === 'up' ? '올라가고' : '내려가고'} 있으니 앞으로도 ${sh === 'up' ? G.W.incF : G.W.decF} 것 같아요.`
        };
      }
      const sh = pick(['up', 'down', 'updown', 'downup']);
      const G = makeGraph({ shape: sh, dec: sh !== 'up', wave: Math.random() < 0.25 });
      if (G.shape !== sh) return makeGTrend();
      const ans = trendText(G.W, sh);
      return {
        kind: 'choice', key: `tr${G.id}${sh}`, ans, txt: true, cols: 1,
        choices: shuffle(['up', 'down', 'updown', 'downup'].map((x) => ({ v: trendText(G.W, x), html: trendText(G.W, x) }))),
        prompt: `${G.subj}${eunNeun(G.subj)} 어떻게 변하고 있을까요?`,
        visual: graphQ(G),
        speech: `${G.subj}${eunNeun(G.subj)} 어떻게 변하고 있을까요? 선의 모양을 살펴보세요.`,
        explain: `선이 ${{ up: '계속 오른쪽 위로 올라가요', down: '계속 오른쪽 아래로 내려가요', updown: '올라가다가 내려가요', downup: '내려가다가 올라가요' }[sh]}. → ${ans}`
      };
    }

    /* ---------- 13. 조사하고 나타내기 ---------- */
    const PROC = ['조사할 주제를 정해요.', '자료를 수집해요.', '수집한 자료를 표로 정리해요.', '표를 보고 꺾은선그래프로 나타내요.', '그래프를 보고 알게 된 점과 우리가 할 수 있는 일을 이야기해요.'];
    const TIME_TOPICS = ['연도별 우리 지역의 폭염 일수', '월별 우리 지역의 강수량', '시각별 교실의 온도', '날짜별 강낭콩 싹의 키', '연도별 우리 학교 학생 수', '월별 우리 집 전기 사용량', '연도별 한파 일수', '시각별 운동장의 기온'];
    const CAT_TOPICS = ['좋아하는 과일별 학생 수', '나라별 금메달 수', '학년별 안경을 쓴 학생 수', '마을별 심은 나무 수', '혈액형별 학생 수', '반별 재활용품 수집량', '좋아하는 운동별 학생 수', '동물원의 동물 종류별 수'];
    function makeGProject() {
      const t = pick(['order', 'order', 'topic', 'topic', 'reverse']);
      if (t === 'order') {
        const k = randInt(1, 4);
        return {
          kind: 'choice', key: `po${k}`, ans: PROC[k], txt: true, cols: 1,
          choices: mkChoices(PROC[k], shuffle(PROC.filter((_, i) => i !== k))),
          prompt: `자료를 수집하여 꺾은선그래프로 나타내는 과정이에요. <b>${k + 1}번째</b>에 할 일은 무엇일까요?`,
          visual: `<ol class="step-list">${PROC.slice(0, k).map((x) => `<li>${x}</li>`).join('')}<li class="q">?</li></ol>`,
          speech: `자료를 수집하여 꺾은선그래프로 나타내는 과정이에요. ${k + 1}번째에 할 일은 무엇일까요?`,
          explain: `${k + 1}번째: ${PROC[k]}`
        };
      }
      if (t === 'topic') {
        const ans = pick(TIME_TOPICS);
        return {
          kind: 'choice', key: `pt${ans}`, ans, txt: true, cols: 1,
          choices: mkChoices(ans, shuffle(CAT_TOPICS)),
          prompt: '꺾은선그래프로 나타내기에 가장 알맞은 조사 주제는 무엇일까요?',
          speech: '꺾은선그래프로 나타내기에 가장 알맞은 조사 주제는 무엇일까요?',
          explain: '시간에 따라 변하는 자료는 꺾은선그래프로 나타내면 변화를 알아보기 쉬워요.'
        };
      }
      const ans = pick(CAT_TOPICS);
      return {
        kind: 'choice', key: `pr${ans}`, ans, txt: true, cols: 1,
        choices: mkChoices(ans, shuffle(TIME_TOPICS)),
        prompt: '꺾은선그래프로 나타내기에 <b>알맞지 않은</b> 주제는 무엇일까요?',
        speech: '꺾은선그래프로 나타내기에 알맞지 않은 주제는 무엇일까요?',
        explain: `'${ans}'${eunNeun(ans)} 시간에 따라 변하는 자료가 아니라서 막대그래프로 비교하는 것이 알맞아요.`
      };
    }

    /* ---------- 14. 그래프 보고 표 완성 ---------- */
    function makeGTable() {
      const G = makeGraph({ wave: waveOpt() });
      const i = randInt(0, G.xs.length - 1);
      return {
        kind: 'keypad', key: `tb${G.id}${i}${G.vals[i]}`, ans: G.vals[i], dot: dotOf(G),
        prompt: '꺾은선그래프를 보고 표의 <b>빈칸</b>에 알맞은 수를 써 보세요.',
        visual: `${graphQ(G, { hlX: [i] })}${tableHtml(G, { blank: [i], title: false })}`,
        lhs: `<span class="lhs-t">${xText(G, i)}</span>`, unit: unitTxt(G),
        speech: `꺾은선그래프를 보고 표의 빈칸에 알맞은 수를 써 보세요. ${xSay(G, i)}의 값이에요.`,
        explain: `${xText(G, i)}의 점은 ${vText(G, G.vals[i])}`,
        hint: `세로 눈금 한 칸은 ${fmt(G.step)}${uSp(G.yUnit)}예요.`
      };
    }

    /* ---------- 15. 잘못 찍은 점 찾기 ---------- */
    function makeGWrong() {
      const G = makeGraph({ wave: Math.random() < 0.3 });
      const n = G.vals.length;
      for (let t = 0; t < 40; t += 1) {
        const i = randInt(0, n - 1);
        const w = r2(G.vals[i] + pick([-3, -2, -2, -1, 1, 2, 2, 3]) * G.step);
        if (w < G.lo || w > G.hi) continue;
        const vals = [...G.vals];
        vals[i] = w;
        return {
          kind: 'choice', key: `wr${G.id}${i}${w}`, ans: i, txt: true,
          choices: xChoices(G, i),
          prompt: '표를 보고 그린 꺾은선그래프예요. <b>잘못</b> 찍은 점은 언제일까요?',
          visual: `${tableHtml(G, { title: false })}${graphQ(G, { vals })}`,
          speech: '표를 보고 그린 꺾은선그래프예요. 잘못 찍은 점은 언제일까요?',
          explain: `${xText(G, i)}${eunNeun(xText(G, i))} ${vText(G, G.vals[i])}인데 ${vText(G, w)}에 점을 찍었어요.`,
          okSpeech: xSay(G, i)
        };
      }
      return makeGTable();
    }

    /* ---------- 16. 알맞은 그래프 고르기 ---------- */
    const GKIND = { picto: '그림그래프', bar: '막대그래프', line: '꺾은선그래프' };
    const PICTO_TOPICS = ['마을별 사과 생산량', '지역별 도서관 수', '권역별 쌀 생산량', '마을별 자전거 수'];
    function makeGChoose() {
      const r = Math.random();
      let ans;
      let sit;
      if (r < 0.45) { ans = 'line'; sit = `${pick(TIME_TOPICS)}의 <b>변화</b>를 알아보기 쉽게 나타내려고 해요.`; }
      else if (r < 0.85) { ans = 'bar'; const tp = pick(CAT_TOPICS); sit = `${tp}${eulReul(tp)} <b>한눈에 비교</b>하려고 해요.`; }
      else { ans = 'picto'; const tp = pick(PICTO_TOPICS); sit = `${tp}${eulReul(tp)} 지도 위에 <b>그림</b>으로 나타내 많고 적음을 쉽게 알아보려고 해요.`; }
      return {
        kind: 'choice', key: `ch${stripTags(sit)}`, ans, txt: true, cols: 3,
        choices: ['picto', 'bar', 'line'].map((v) => ({ v, html: GKIND[v] })),
        prompt: `${sit}<br />어떤 그래프로 나타내면 가장 알맞을까요?`,
        speech: `${stripTags(sit)} 어떤 그래프로 나타내면 가장 알맞을까요?`,
        explain: { line: '시간에 따라 변하는 모습은 꺾은선그래프로 나타내면 알아보기 쉬워요.', bar: '항목별 크기를 한눈에 비교하려면 막대그래프가 알맞아요.', picto: '지역별 많고 적음을 그림으로 나타내려면 그림그래프가 알맞아요.' }[ans],
        okSpeech: GKIND[ans]
      };
    }

    /* ---------- 17. 막대그래프와 꺾은선그래프 ---------- */
    function makeGBarLine() {
      const t = pick(['easy', 'easy', 'compare', 'which']);
      const G = makeGraph({ wave: false });
      if (t === 'easy') {
        return {
          kind: 'choice', key: `be${G.id}${uid()}`, ans: 'line', figs: true,
          choices: shuffle([{ v: 'bar', html: graphCard(G, { bars: true }) }, { v: 'line', html: graphCard(G) }]),
          prompt: `같은 자료를 나타낸 두 그래프예요. ${G.subj}${iGa(G.subj)} <b>변하는 모습</b>을 알아보기 더 쉬운 그래프는?`,
          visual: gTitle(G),
          speech: `같은 자료를 나타낸 두 그래프예요. ${G.subj}${iGa(G.subj)} 변하는 모습을 알아보기 더 쉬운 그래프는 어느 것일까요?`,
          explain: '꺾은선그래프는 선분이 기울어진 정도로 변화의 크기를 한눈에 알 수 있어요.',
          wrongWhy: { bar: '막대그래프는 크기를 비교하기 쉽지만, 변하는 모습은 꺾은선그래프가 더 잘 보여요.' }
        };
      }
      if (t === 'compare') {
        const ok = `두 그래프 모두 가로는 ${G.xLab}, 세로는 ${G.yLab}${eulReul(G.yLab)} 나타내요.`;
        return {
          kind: 'choice', key: `bc${G.id}`, ans: ok, txt: true, cols: 1,
          choices: mkChoices(ok, shuffle(['막대그래프는 점을 찍고 선분으로 이어서 나타내요.', '꺾은선그래프는 막대의 길이로 수량을 나타내요.', '두 그래프의 세로 눈금 한 칸의 크기가 서로 달라요.', '꺾은선그래프에는 제목을 쓰지 않아요.'])),
          prompt: '막대그래프와 꺾은선그래프를 <b>바르게</b> 비교한 것을 찾아보세요.',
          visual: `${gTitle(G)}<div class="g-pair">${graphCard(G, { bars: true })}${graphCard(G)}</div>`,
          speech: '막대그래프와 꺾은선그래프를 바르게 비교한 것을 찾아보세요.',
          explain: '같은 자료를 나타냈으니 가로·세로와 눈금은 같아요. 막대그래프는 막대의 길이로, 꺾은선그래프는 점과 선분으로 나타내요.'
        };
      }
      const qs = [
        ['line', '시간에 따라 <b>변하는 모습</b>을 알아보기 쉬운 그래프는 무엇일까요?'],
        ['bar', '항목별 수량의 <b>많고 적음</b>을 막대의 길이로 한눈에 비교하기 쉬운 그래프는 무엇일까요?'],
        ['picto', '자료의 값을 <b>그림의 크기와 수</b>로 나타낸 그래프는 무엇일까요?'],
        ['line', '점들을 <b>선분</b>으로 이어 나타낸 그래프는 무엇일까요?']
      ];
      const [ans, prompt] = pick(qs);
      return {
        kind: 'choice', key: `bw${prompt}`, ans, txt: true, cols: 3,
        choices: ['picto', 'bar', 'line'].map((v) => ({ v, html: GKIND[v] })),
        prompt, speech: stripTags(prompt),
        explain: { line: '꺾은선그래프는 점을 선분으로 이어 시간에 따른 변화를 나타내요.', bar: '막대그래프는 막대의 길이로 크기를 비교해요.', picto: '그림그래프는 그림의 크기와 수로 값을 나타내요.' }[ans],
        okSpeech: GKIND[ans]
      };
    }

    /* ---------- 18. 두 꺾은선그래프 ---------- */
    const TWO = [
      { id: 'age', title: '연도별 유소년층과 노년층 인구수', subj: '인구수', xLab: '연도', xUnit: '년', xs: XS.year, yLab: '인구수', yUnit: '만 명', W: 'amt', names: ['유소년층', '노년층'], step: 10, wave: true, a: { u: [56, 70], d: [1, 3], shapes: ['down'] }, b: { u: [62, 92], d: [2, 5], shapes: ['up'] } },
      { id: 'inout', title: '시각별 교실 안과 밖의 온도', subj: '온도', xLab: '시각', xUnit: '시', xPre: '오전', xs: XS.am, yLab: '온도', yUnit: '°C', W: 'temp', names: ['교실 안', '교실 밖'], step: 1, a: { u: [16, 24], d: [1, 2], shapes: ['up', 'any'] }, b: { u: [4, 22], d: [2, 5], shapes: ['up'] } },
      { id: 'plants', title: '월별 두 식물의 키', subj: '키', xLab: '월', xUnit: '월', xs: XS.month5, yLab: '키', yUnit: 'cm', W: 'grow', names: ['가 식물', '나 식물'], step: 2, a: { u: [2, 24], d: [1, 2], shapes: ['up'] }, b: { u: [1, 24], d: [2, 6], shapes: ['up'] } },
      { id: 'books', title: '요일별 두 반의 도서 대출 수', subj: '도서 대출 수', xLab: '요일', xUnit: '요일', xs: XS.week, yLab: '대출 수', yUnit: '권', W: 'amt', names: ['1반', '2반'], step: 1, a: { u: [3, 22], d: [1, 6], shapes: ['any'] }, b: { u: [3, 22], d: [1, 6], shapes: ['any'] } }
    ];
    function makeTwo() {
      for (let t = 0; t < 100; t += 1) {
        const T = pick(TWO);
        const ua = genUnits(5, T.a, pick(T.a.shapes));
        const ub = genUnits(5, T.b, pick(T.b.shapes));
        if (!ua || !ub) continue;
        const G = fitScale({ ...T, W: WORDS[T.W], xs: T.xs().slice(0, 5), vals: ua.map((x) => r2(x * T.step)), vals2: ub.map((x) => r2(x * T.step)), per: 5 });
        const diffs = G.vals.map((v, i) => r2(Math.abs(v - G.vals2[i])));
        if (diffs.some((d) => d === 0) && T.id !== 'books') continue;
        if (uniqueIdx(diffs, Math.max) < 0 || uniqueIdx(diffs, Math.min) < 0) continue;
        return { G, diffs };
      }
      return null;
    }
    const legendHtml = (G) => `<div class="g-legend"><span><i style="background:${GC.line}"></i>${G.names[0]}</span><span><i style="background:${GC.line2}"></i>${G.names[1]}</span></div>`;
    function makeGTwo() {
      const r = makeTwo();
      if (!r) return makeGMax();
      const { G, diffs } = r;
      const vis = `${graphQ(G)}${legendHtml(G)}`;
      const t = pick(['dmax', 'dmin', 'at', 'at', 'trend']);
      const pair = `${G.names[0]}${gwaWa(G.names[0])} ${G.names[1]}의 ${G.subj}`;
      if (t === 'at') {
        const i = randInt(0, 4);
        return {
          kind: 'keypad', key: `tw${G.id}at${i}${diffs[i]}`, ans: diffs[i], dot: dotOf(G),
          prompt: `<b>${xText(G, i)}</b>에 ${pair} 차는 얼마일까요?`,
          visual: vis, unit: unitTxt(G),
          speech: `${xSay(G, i)}에 ${pair} 차는 얼마일까요?`,
          explain: `${fmt(Math.max(G.vals[i], G.vals2[i]))} − ${fmt(Math.min(G.vals[i], G.vals2[i]))} = ${fmt(diffs[i])}`
        };
      }
      if (t === 'trend') {
        const upA = G.vals.every((v, i) => i === 0 || v > G.vals[i - 1]);
        const upB = G.vals2.every((v, i) => i === 0 || v > G.vals2[i - 1]);
        const dnA = G.vals.every((v, i) => i === 0 || v < G.vals[i - 1]);
        if (upA !== upB) {
          const ans = upA ? 0 : 1;
          return {
            kind: 'choice', key: `tw${G.id}tr${ans}`, ans, txt: true,
            choices: [{ v: 0, html: G.names[0] }, { v: 1, html: G.names[1] }],
            prompt: `${G.subj}${iGa(G.subj)} <b>계속 ${G.W.incG}</b> 있는 것은 어느 쪽일까요?`,
            visual: vis,
            speech: `${G.subj}${iGa(G.subj)} 계속 ${G.W.incG} 있는 것은 어느 쪽일까요?`,
            explain: `${G.names[ans]}의 선이 계속 오른쪽 위로 올라가요.${dnA && ans === 1 ? ` ${G.names[0]}${eunNeun(G.names[0])} 계속 ${G.W.decG} 있어요.` : ''}`
          };
        }
      }
      const big = t !== 'dmin';
      const i = uniqueIdx(diffs, big ? Math.max : Math.min);
      return {
        kind: 'choice', key: `tw${G.id}${big}${i}`, ans: i, txt: true,
        choices: xChoices(G, i),
        prompt: `${pair} 차가 <b>${big ? '가장 큰' : '가장 작은'}</b> 때는 언제일까요?`,
        visual: vis,
        speech: `${pair} 차가 ${big ? '가장 큰' : '가장 작은'} 때는 언제일까요?`,
        explain: `두 점 사이가 ${big ? '가장 많이 벌어진' : '가장 가까운'} 때는 ${xText(G, i)}이에요. (차: ${vText(G, diffs[i])})`,
        okSpeech: xSay(G, i)
      };
    }

    /* ---------- 19. 설명 탐정 ---------- */
    function graphFacts(G) {
      const n = G.vals.length;
      const u = (v) => vText(G, v);
      const T = [];
      const F = [];
      const iMax = uniqueIdx(G.vals, Math.max);
      const iMin = uniqueIdx(G.vals, Math.min);
      T.push(`세로 눈금 한 칸은 ${u(G.step)}${unitEul(G.yUnit)} 나타내요.`);
      F.push(`세로 눈금 한 칸은 ${u(r2(G.step * pick([2, 5])))}${unitEul(G.yUnit)} 나타내요.`);
      if (iMax >= 0) {
        T.push(`${G.subj}${iGa(G.subj)} ${G.W.hi} 때는 ${xText(G, iMax)}이에요.`);
        const o = (iMax + randInt(1, n - 1)) % n;
        F.push(`${G.subj}${iGa(G.subj)} ${G.W.hi} 때는 ${xText(G, o)}이에요.`);
      }
      if (iMin >= 0) T.push(`${G.subj}${iGa(G.subj)} ${G.W.lo} 때는 ${xText(G, iMin)}이에요.`);
      const i = randInt(0, n - 1);
      T.push(`${xText(G, i)}의 ${G.subj}${eunNeun(G.subj)} ${u(G.vals[i])}${unitIe(G.yUnit)}.`);
      const w = r2(G.vals[i] + pick([-2, -1, 1, 2]) * G.step);
      F.push(`${xText(G, i)}의 ${G.subj}${eunNeun(G.subj)} ${u(w)}${unitIe(G.yUnit)}.`);
      const k = randInt(0, n - 2);
      const d = r2(G.vals[k + 1] - G.vals[k]);
      if (!sameNum(d, 0)) {
        T.push(`${xText(G, k + 1)}에는 ${xText(G, k)}보다 ${u(Math.abs(d))} ${d > 0 ? G.W.incP : G.W.decP}`);
        F.push(`${xText(G, k + 1)}에는 ${xText(G, k)}보다 ${u(Math.abs(d))} ${d > 0 ? G.W.decP : G.W.incP}`);
      }
      if (G.wave) { T.push(`물결선으로 0부터 ${u(G.lo)}까지를 줄여서 나타냈어요.`); F.push('물결선을 사용해 가장 큰 값 부분을 줄여서 나타냈어요.'); }
      else F.push('물결선을 사용하여 필요 없는 부분을 줄였어요.');
      return { T: shuffle(T), F: shuffle(F) };
    }
    function makeGFix() {
      const G = makeGraph({ wave: Math.random() < 0.3 });
      const { T, F } = graphFacts(G);
      const askWrong = Math.random() < 0.7;
      const picks = askWrong ? [...T.slice(0, 3), F[0]] : [...F.slice(0, 3), T[0]];
      if (picks.length < 4 || new Set(picks).size < 4) return makeGFix();
      const ans = picks[3];
      return {
        kind: 'choice', key: `fx${G.id}${ans}`, ans, txt: true, cols: 1,
        choices: shuffle(picks).map((v) => ({ v, html: v })),
        prompt: askWrong ? '꺾은선그래프를 보고 <b>잘못</b> 말한 것을 찾아보세요.' : '꺾은선그래프를 보고 <b>바르게</b> 말한 것을 찾아보세요.',
        visual: graphQ(G),
        speech: askWrong ? '꺾은선그래프를 보고 잘못 말한 것을 찾아보세요.' : '꺾은선그래프를 보고 바르게 말한 것을 찾아보세요.',
        explain: askWrong ? `"${ans}"는 틀린 설명이에요.` : `"${ans}"가 바른 설명이에요.`
      };
    }

    /* ---------- 단원 마무리 평가 ---------- */
    const EXAM_SECS = ['꺾은선그래프', '나타내기', '해석하기', '자료 수집', '그래프 선택', '실력 다지기'];
    const EXAM_PLAN = [
      [makeGWhat, 0], [makeGUnit, 0], [makeGRead, 0], [makeGRead, 0], [makeGWave, 0],
      [makeGSteps, 1], [makeGScale, 1], [makeGMatch, 1],
      [makeGMax, 2], [makeGChange, 2], [makeGDiff, 2], [makeGTrend, 2],
      [makeGProject, 3], [makeGTable, 3], [makeGWrong, 3],
      [makeGChoose, 4], [makeGBarLine, 4],
      [makeGTwo, 5], [makeGFix, 5], [makeGFix, 5]
    ];
    function examMake(i) {
      const [mk, sec] = EXAM_PLAN[i];
      return { ...withOpt('all', mk), sec: EXAM_SECS[sec] };
    }
    function buildExamQueue() { return EXAM_PLAN.map((_, i) => examMake(i)); }
    function examQuestionFor(idx) {
      const queue = examQueues[idx];
      if (!queue) return null;
      return queue[examIndex[idx]] || null;
    }

    const MAKERS = {
      gWhat: makeGWhat, gUnit: makeGUnit, gRead: makeGRead, gWave: makeGWave,
      gSteps: makeGSteps, gScale: makeGScale, gPlot: makeGPlot, gMatch: makeGMatch,
      gMax: makeGMax, gChange: makeGChange, gDiff: makeGDiff, gTrend: makeGTrend,
      gProject: makeGProject, gTable: makeGTable, gWrong: makeGWrong,
      gChoose: makeGChoose, gBarLine: makeGBarLine,
      gTwo: makeGTwo, gFix: makeGFix
    };
    function makeQuestion(prevKey, prevMix) {
      if (mode === 'mix') return makeMixQuestion(prevKey, prevMix);
      let q = MAKERS[mode]();
      for (let i = 0; i < 6 && q.key && q.key === prevKey; i += 1) q = MAKERS[mode]();
      return q;
    }

    /* ---------- 차시별 문제 모음 ---------- */
    // tall: 그래프를 직접 그리거나 그래프 여러 개를 비교하는 문제
    const MIX_ITEMS = Object.fromEntries(Object.keys(MAKERS).map((id) => [id, {
      label: MODES[id].title, icon: MODES[id].icon, make: () => withOpt('all', MAKERS[id]),
      tall: ['gWhat', 'gWave', 'gPlot', 'gMatch', 'gTable', 'gWrong', 'gBarLine'].includes(id)
    }]));

    // 교과서 차시 순서 (stage: 게임 목록의 단계 번호)
    const LESSONS = [
      { id: 'l1', stage: 1, title: '꺾은선그래프', page: '110~111쪽', items: ['gWhat', 'gUnit', 'gRead', 'gWave'] },
      { id: 'l2', stage: 2, title: '꺾은선그래프로 나타내기', page: '112~117쪽', items: ['gSteps', 'gScale', 'gPlot', 'gMatch'] },
      { id: 'l3', stage: 3, title: '꺾은선그래프 해석하기', page: '118~119쪽', items: ['gMax', 'gChange', 'gDiff', 'gTrend'] },
      { id: 'l4', stage: 4, title: '자료를 수집하여 나타내기', page: '120~121쪽', items: ['gProject', 'gTable', 'gWrong'] },
      { id: 'l5', stage: 5, title: '알맞은 그래프 선택하기', page: '122~123쪽', items: ['gChoose', 'gBarLine'] },
      { id: 'l6', stage: 6, title: '두 꺾은선 · 마무리', page: '124~129쪽', items: ['gTwo', 'gFix'] }
    ];

    let mixPool = [];
    let mixTall = false;
    function makeMixQuestion(prevKey, prevMix) {
      const pool = mixPool.length > 1 ? mixPool.filter((id) => id !== prevMix) : mixPool;
      const id = pick(pool);
      let q = MIX_ITEMS[id].make();
      for (let i = 0; i < 6 && q.key && q.key === prevKey; i += 1) q = MIX_ITEMS[id].make();
      return { ...q, mixId: id };
    }

    /* =========================================================
       개념 알아보기
       ========================================================= */
    let conceptRows = [];

    function showConcept(key) {
      const c = CONCEPTS[key];
      conceptRows = c.rows();
      document.getElementById('concept-overlay').innerHTML = `
        <div class="result-card concept-card">
          <div class="concept-head">
            <div class="kid-art"></div>
            <div><h2>${c.title}</h2><p>${c.sub}</p></div>
          </div>
          ${conceptRows.map((r, i) => `
            <div class="crow">
              <div class="fig">${r.fig}</div>
              <div>
                <h3><span>${r.title}</span><button class="spk" type="button" onclick="speak(conceptRows[${i}].say)" aria-label="설명 읽어 주기">${SPK}</button></h3>
                <p>${r.text}</p>
              </div>
            </div>`).join('')}
          <div class="result-btns">
            <button class="btn-main" type="button" onclick="hideConcept(); tryStart('${c.mode}')">문제 풀러 가기 →</button>
            <button class="ghost-btn" type="button" onclick="hideConcept()">닫기</button>
          </div>
        </div>`;
      document.getElementById('concept-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideConcept() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.getElementById('concept-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }


    /* =========================================================
       차시별 문제 모음 고르기
       ========================================================= */
    const MIX_KEY = 'linegraphman-mix-v1';
    let mixSel = new Set(Object.keys(MIX_ITEMS));
    try {
      const saved = JSON.parse(localStorage.getItem(MIX_KEY) || 'null');
      if (Array.isArray(saved)) mixSel = new Set(saved.filter((id) => MIX_ITEMS[id]));
    } catch (err) { /* 저장소를 쓸 수 없으면 전부 고른 상태로 시작한다 */ }
    function saveMixSel() {
      try { localStorage.setItem(MIX_KEY, JSON.stringify([...mixSel])); } catch (err) { /* 무시 */ }
    }

    let mixScope = 'all';
    function mixLessons() { return mixScope === 'all' ? LESSONS : LESSONS.filter((l) => l.stage === mixScope); }
    function mixChosen() { return mixLessons().flatMap((l) => l.items).filter((id) => mixSel.has(id)); }
    function mixCap(ids) { return ids.reduce((m, id) => Math.min(m, MIX_ITEMS[id].cap || 6), 6); }
    const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

    function mixCardHtml(st) {
      const all = st.no === STAGES.length;
      const names = LESSONS.filter((l) => l.stage === st.no).map((l) => l.title).join(', ');
      return `
        <article class="card mixc${all ? ' wide' : ''}">
          <div class="card-top"><span class="ic">${ICONS.mix}</span><span class="cap">${all ? '단원 전체' : '차시별'}</span></div>
          <h4>${all ? '단원 전체 문제 모음' : '문제 모음'}</h4>
          <p>${all ? '모든 차시의 문제 유형 중에서 원하는 것만 체크해서 섞어 풀어요.' : `${names} 차시의 문제 유형 중 체크한 것만 섞어서 풀어요.`}</p>
          <button class="go" type="button" onclick="openMix(${all ? "'all'" : st.no})">유형 고르기</button>
        </article>`;
    }

    function openMix(scope) {
      mixScope = scope;
      renderMix();
      document.getElementById('mix-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideMix() {
      document.getElementById('mix-overlay').classList.add('hidden');
      document.body.classList.remove('modal');
    }
    function renderMix() {
      const chosen = mixChosen();
      const cap = mixCap(chosen);
      const st = mixScope === 'all' ? null : STAGES.find((x) => x.no === mixScope);
      const over = playerCount > cap;
      const limiting = [...new Set(chosen.filter((id) => (MIX_ITEMS[id].cap || 6) === cap).map((id) => MIX_ITEMS[id].label))];
      const capNote = chosen.length && cap < 6
        ? `<span class="mix-cap${over ? ' warn' : ''}">${limiting.join(', ')} 게임으로 인해 최대 ${cap}명까지만 가능합니다${over ? ` (지금 ${playerCount}명)` : ''}</span>`
        : `<span class="mix-cap">1~6명이 함께할 수 있어요</span>`;
      const box = document.getElementById('mix-overlay');
      const prevScroll = box.firstElementChild ? box.firstElementChild.scrollTop : 0;
      box.innerHTML = `
        <div class="result-card mix-card">
          <div class="concept-head">
            <div class="kid-art"></div>
            <div><h2>${st ? `${st.title} 문제 모음` : '단원 전체 문제 모음'}</h2><p>체크한 유형의 문제만 골고루 섞여서 나와요.</p></div>
          </div>
          ${mixLessons().map((l) => {
            const full = l.items.every((id) => mixSel.has(id));
            return `
              <section class="mix-lesson">
                <div class="mix-lesson-head">
                  <span class="mix-page">${l.page}</span>
                  <h3>${l.title}</h3>
                  <button class="mix-all${full ? ' on' : ''}" type="button" onclick="toggleLesson('${l.id}')">${full ? '모두 해제' : '모두 선택'}</button>
                </div>
                <div class="mix-items">${l.items.map((id) => `
                  <button class="mix-chip${mixSel.has(id) ? ' on' : ''}" type="button" aria-pressed="${mixSel.has(id)}" onclick="toggleMixItem('${id}')">
                    <span class="ck">${CHECK}</span><span class="mi">${ICONS[MIX_ITEMS[id].icon]}</span>${MIX_ITEMS[id].label}${MIX_ITEMS[id].cap ? `<span class="mcap">최대 ${MIX_ITEMS[id].cap}명</span>` : ''}
                  </button>`).join('')}
                </div>
              </section>`;
          }).join('')}
          <div class="mix-foot">
            <div class="mix-sum"><span><b>${chosen.length}</b>가지 유형을 골랐어요</span>${capNote}</div>
            <div class="mix-btns">
              <button class="ghost-btn" type="button" onclick="hideMix()">닫기</button>
              <button class="btn-main" type="button" onclick="startMix()"${chosen.length ? '' : ' disabled'}>섞어서 시작 →</button>
            </div>
          </div>
        </div>`;
      box.firstElementChild.scrollTop = prevScroll;
    }
    function toggleMixItem(id) {
      if (mixSel.has(id)) mixSel.delete(id);
      else mixSel.add(id);
      saveMixSel();
      renderMix();
    }
    function toggleLesson(lid) {
      const l = LESSONS.find((x) => x.id === lid);
      const full = l.items.every((id) => mixSel.has(id));
      l.items.forEach((id) => { if (full) mixSel.delete(id); else mixSel.add(id); });
      saveMixSel();
      renderMix();
    }
    function startMix() {
      const chosen = mixChosen();
      if (!chosen.length) return;
      mixPool = chosen;
      mixTall = chosen.some((id) => MIX_ITEMS[id].tall);
      const st = mixScope === 'all' ? null : STAGES.find((x) => x.no === mixScope);
      const lessons = mixLessons().filter((l) => l.items.some((id) => mixSel.has(id)));
      MODES.mix = {
        title: st ? `${st.short} 문제 모음` : '단원 전체 문제 모음',
        icon: 'mix',
        sub: `${lessons.length > 3 ? '단원 전체' : lessons.map((l) => l.title).join(' · ')}에서 고른 ${chosen.length}가지 유형을 섞어 풀어요`,
        cap: mixCap(chosen)
      };
      const go = () => { hideMix(); startGame('mix'); };
      if (playerCount > MODES.mix.cap) {
        const names = [...new Set(chosen.filter((id) => (MIX_ITEMS[id].cap || 6) < playerCount).map((id) => MIX_ITEMS[id].label))];
        showCapNotice(names, MODES.mix.cap, VCALC_WHY, go);
        return;
      }
      go();
    }
    function mixTagHtml(q) {
      const it = MIX_ITEMS[q.mixId];
      return it ? `<div class="mix-tag"><span class="mi">${ICONS[it.icon]}</span>${it.label}</div>` : '';
    }


    /* =========================================================
       인원 제한 안내
       ========================================================= */
    const PEOPLE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6z"/><circle cx="17" cy="9" r="2.7" opacity=".55"/><path d="M15.6 13.7c3.2-.4 6 1.6 6 5.8h-4.4c0-2.3-.6-4.3-1.6-5.8z" opacity=".55"/></svg>';
    const VCALC_WHY = '그래프에 점을 직접 찍는 게임이라 한 사람의 칸이 넓어야 해요.';
    function capOf(m) { return MODES[m].cap || 6; }
    function capChip(cap, extra = '') {
      return `<span class="cap pc${cap < 6 ? ' lim' : ''}${playerCount > cap ? ' over' : ''}" data-cap="${cap}">${PEOPLE}${cap < 6 ? `최대 ${cap}명` : '1~6명'}${extra}</span>`;
    }
    // 고른 인원이 게임 제한보다 많을 때 시작 전에 알려 준다
    let noticeGo = null;
    function showCapNotice(names, cap, why, go) {
      noticeGo = go;
      document.getElementById('notice-overlay').innerHTML = `
        <div class="result-card notice-card">
          <div class="notice-ic">${PEOPLE}</div>
          <h2>인원 안내</h2>
          <p class="notice-main"><b>${names.join(', ')}</b> 게임으로 인해 <b>최대 ${cap}명</b>까지만 가능합니다.</p>
          <p class="notice-why">${why}</p>
          <p class="notice-now">지금 고른 인원은 ${playerCount}명이에요. ${cap}명으로 줄여서 시작할까요?</p>
          <div class="result-btns">
            <button class="ghost-btn" type="button" onclick="hideNotice()">취소</button>
            <button class="btn-main" type="button" onclick="acceptNotice()">${cap}명으로 시작 →</button>
          </div>
        </div>`;
      document.getElementById('notice-overlay').classList.remove('hidden');
      document.body.classList.add('modal');
    }
    function hideNotice() {
      document.getElementById('notice-overlay').classList.add('hidden');
      const others = ['concept-overlay', 'mix-overlay'].some((id) => !document.getElementById(id).classList.contains('hidden'));
      if (!others) document.body.classList.remove('modal');
    }
    function acceptNotice() {
      const go = noticeGo;
      noticeGo = null;
      hideNotice();
      if (go) go();
    }
    function tryStart(m) {
      const cap = capOf(m);
      if (playerCount > cap) {
        showCapNotice([MODES[m].title], cap, MODES[m].capWhy || '', () => startGame(m));
        return;
      }
      startGame(m);
    }
    function renderCapNote() {
      const note = document.getElementById('cap-note');
      if (!note) return;
      const byCap = {};
      Object.entries(MODES).forEach(([k, M]) => {
        if (k === 'mix' || !M.cap || M.cap >= playerCount) return;
        (byCap[M.cap] = byCap[M.cap] || []).push(M.title);
      });
      const lines = Object.entries(byCap).map(([cap, titles]) => `<b>${titles.join(' · ')}</b> 게임은 최대 ${cap}명까지만 가능합니다.`);
      note.innerHTML = lines.length ? `${PEOPLE}<span>${lines.join(' ')} 나머지 게임은 ${playerCount}명이 함께할 수 있어요.</span>` : '';
      document.querySelectorAll('.cap.pc').forEach((el) => el.classList.toggle('over', playerCount > Number(el.dataset.cap)));
    }

    /* =========================================================
       화면 전환 / 설정
       ========================================================= */
    function showScreen(id) {
      document.querySelectorAll('.screen, .game-screen').forEach((el) => el.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      document.body.classList.toggle('playing', ['game-screen', 'bell-screen', 'bell-join-screen'].includes(id));
      if (id === 'game-select-screen') { renderPlayerSeg(); renderCapNote(); }
      if (id === 'start-screen') animateHero();
    }

    function renderPlayerSeg() {
      document.getElementById('player-seg').innerHTML = [1, 2, 3, 4, 5, 6]
        .map((i) => `<button type="button" class="${i === playerCount ? 'on' : ''}" onclick="setPlayers(${i})">${i}명</button>`)
        .join('');
    }
    function setPlayers(n) { playerCount = n; renderPlayerSeg(); renderCapNote(); }

    function cardHtml(m) {
      const M = MODES[m];
      const capTxt = capChip(capOf(m), m === 'exam' ? ' · 시간 무제한' : '');
      const sel = M.opts
        ? `<select class="card-select" id="opt-${m}" aria-label="문제 유형">${OPT_CHOICES[M.opts].map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`
        : '';
      return `
        <article class="card${M.wide ? ' wide' : ''}" style="--tint:${M.tint}">
          <div class="card-top"><span class="ic">${ICONS[M.icon]}</span>${capTxt}</div>
          <h4>${M.title}</h4>
          <p>${M.desc}</p>
          ${sel}
          <button class="go" type="button" onclick="tryStart('${m}')">${m === 'exam' ? '평가 시작' : '시작'}</button>
        </article>`;
    }
    function renderStages() {
      document.getElementById('stage-nav').innerHTML = STAGES
        .map((st) => `<button class="stage-chip" type="button" style="--sc:${st.color}" onclick="jumpStage(${st.no})"><b>${st.no}</b>${st.short}</button>`)
        .join('');
      document.getElementById('stages').innerHTML = STAGES.map((st) => `
        <section class="stage" id="stage-${st.no}" style="--sc:${st.color}">
          <div class="stage-head">
            <span class="stage-no">${st.no}</span>
            <h3 class="stage-title">${st.title}</h3>
            <span class="stage-page">${st.page}</span>
            <button class="stage-ws" type="button" onclick="openWorksheet(${st.no})">🖨 학습지</button>
          </div>
          <div class="cards">
            ${st.concept ? `
              <article class="card concept" style="--tint:#d6f3ee">
                <div class="card-top"><span class="ic">${ICONS.concept}</span><span class="cap">개념</span></div>
                <h4>개념 알아보기</h4>
                <p>${CONCEPTS[st.concept].desc}</p>
                <button class="go" type="button" onclick="showConcept('${st.concept}')">펼쳐 보기</button>
              </article>` : ''}
            ${st.no === STAGES.length ? mixCardHtml(st) : ''}
            ${st.concept ? mixCardHtml(st) : ''}
            ${st.items.map(cardHtml).join('')}
          </div>
        </section>`).join('');
    }
    function jumpStage(no) {
      document.getElementById(`stage-${no}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* =========================================================
       게임 시작 / 종료
       ========================================================= */
    const START_MSG = {
      choice: '알맞은 답을 골라 보세요.',
      keypad: '키패드로 답을 써 보세요.',
      ox: '알맞은 것을 골라 보세요.',
      ...APP_START_MSG
    };

    function createPlayer(idx) {
      const prevQ = players[idx] && players[idx].q ? players[idx].q : null;
      let q;
      QCTX.narrow = cellMetrics().w < 330;
      try { q = mode === 'exam' ? examQuestionFor(idx) : makeQuestion(prevQ && prevQ.key, prevQ && prevQ.mixId); } finally { QCTX.narrow = false; }
      return setupPlayer(idx, q);
    }
    function setupPlayer(idx, q) {
      const p = { idx, q, tries: 0, state: '', message: '', locked: !q, picked: [], pickedWhy: [], input: '', inputBad: false };
      if (!q) return p;
      if (q.kind === 'keypad' && !q.ansText) q.ansText = withUnit(q.ans, q.unit);
      p.message = START_MSG[q.kind] || START_MSG.choice;
      if (q.kind === 'ox') p.stage = 'ox';
      if (APP_SETUP[q.kind]) APP_SETUP[q.kind](p, q);
      return p;
    }
    function startGame(selectedMode) {
      mode = selectedMode;
      const sel = document.getElementById(`opt-${mode}`);
      modeOpt = sel ? sel.value : 'all';
      const cap = MODES[mode].cap;
      if (cap && playerCount > cap) playerCount = cap;
      scores = Array(playerCount).fill(0);
      combos = Array(playerCount).fill(0);
      if (mode === 'exam') {
        examQueues = Array.from({ length: playerCount }, () => buildExamQueue());
        examIndex = Array(playerCount).fill(0);
        examLog = Array.from({ length: playerCount }, () => []);
      }
      players = [];
      players = Array.from({ length: playerCount }, (_, idx) => createPlayer(idx));
      gameActive = true;
      const M = MODES[mode];
      document.getElementById('mode-title').innerHTML = `<span class="ic">${ICONS[M.icon]}</span>${M.title}`;
      document.getElementById('mode-sub').textContent = M.sub;
      showScreen('game-screen');
      renderPlayers();
      startTimer();
    }

    function setTimerUi(left, total) {
      const t = document.getElementById('timer');
      const bar = document.getElementById('timer-bar');
      const label = document.getElementById('time-left');
      if (total === null) {
        t.className = 'timer inf';
        label.textContent = '∞';
        bar.style.strokeDashoffset = '0';
        return;
      }
      t.className = `timer${left <= 10 ? ' warn' : ''}`;
      label.textContent = String(Math.max(0, left));
      bar.style.strokeDashoffset = String(157.08 * (1 - Math.max(0, left) / total));
    }
    function startTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; }
      const selected = mode === 'exam' ? 'none' : document.getElementById('timer-select').value;
      if (selected === 'none') { setTimerUi(0, null); return; }
      timeTotal = Number.parseInt(selected, 10) || 90;
      timeLeft = timeTotal;
      setTimerUi(timeLeft, timeTotal);
      timerId = setInterval(() => {
        if (!gameActive) return;
        timeLeft -= 1;
        setTimerUi(timeLeft, timeTotal);
        if (timeLeft <= 0) finishGame();
      }, 1000);
    }

    function stopAll() {
      gameActive = false;
      if (timerId) { clearInterval(timerId); timerId = null; }
      Object.values(nextTimers).forEach((t) => clearTimeout(t));
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
    function exitGame() {
      stopAll();
      document.getElementById('result-overlay').classList.add('hidden');
      showScreen('game-select-screen');
    }

    function finishGame() {
      // 시간 대결 중인 태블릿은 결과 창 대신 칠판에 마지막 점수를 보내고 기다린다.
      if (BP.race && BP.race.running) { bellRaceStop(); return; }
      if (BP.exam && BP.exam.running) { bellExamStop(); return; }
      if (!players.length) return;
      stopAll();
      const ranking = scores
        .map((score, idx) => ({ score, idx, animal: ANIMALS[idx % ANIMALS.length] }))
        .sort((a, b) => b.score - a.score);
      let rank = 0;
      let prev = null;
      ranking.forEach((item, pos) => {
        if (item.score !== prev) { rank = pos + 1; prev = item.score; }
        item.rank = rank;
      });
      const exam = mode === 'exam';
      const scoreText = (item) => (exam
        ? `${item.score} / 100점 <small>(${(examLog[item.idx] || []).filter((r) => r.correct).length}/${EXAM_TOTAL})</small>`
        : `${item.score}점`);
      document.getElementById('result-overlay').innerHTML = `
        <div class="result-card">
          <div class="kid-art"></div>
          <h2>${exam ? '마무리 평가 결과' : '결과 발표'}</h2>
          <p class="sub">${MODES[mode].title}</p>
          ${ranking.map((item) => `
            <div class="rank-row r${item.score > 0 ? item.rank : 0}">
              <span class="rk">${item.rank}</span>
              <span>${item.animal.emoji} ${item.animal.name}</span>
              <strong>${scoreText(item)}</strong>
            </div>`).join('')}
          <div class="result-btns">
            ${exam ? '' : '<button class="btn-main" type="button" onclick="hideResult()">계속하기</button>'}
            <button class="${exam ? 'btn-main' : 'ghost-btn'}" type="button" onclick="restartGame()">다시 하기</button>
            <button class="ghost-btn" type="button" onclick="exitGame()">게임 목록</button>
          </div>
        </div>`;
      document.getElementById('result-overlay').classList.remove('hidden');
      blip('fanfare');
    }

    function hideResult() {
      document.getElementById('result-overlay').classList.add('hidden');
      if (mode === 'exam') return;
      gameActive = true;
      players = players.map((p, idx) => (p.locked ? createPlayer(idx) : p));
      renderPlayers();
      startTimer();
    }

    function restartGame() {
      document.getElementById('result-overlay').classList.add('hidden');
      startGame(mode);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    /* =========================================================
       렌더링
       ========================================================= */
    const TALL = Object.keys(MIX_ITEMS).filter((id) => MIX_ITEMS[id].tall).concat(['exam']);
    let narrowCells = false;
    function isTall() { return mode === 'mix' ? mixTall : TALL.includes(mode); }
    function columnCount() {
      const w = window.innerWidth;
      if (w < 760) return isTall() ? 1 : Math.min(playerCount, 2);
      // 태블릿처럼 화면이 좁은데 인원이 많으면 두 줄로 나눈다
      if (playerCount > 3 && w / playerCount < (isTall() ? 330 : 190)) return Math.ceil(playerCount / 2);
      return playerCount;
    }
    function cellMetrics() {
      const cols = columnCount();
      const rows = Math.ceil(playerCount / cols);
      const bar = document.querySelector('.topbar');
      const top = bar && bar.offsetHeight ? bar.offsetHeight : 80;
      return { cols, rows, w: window.innerWidth / cols, h: (window.innerHeight - top) / rows };
    }
    function cellScale(m) {
      const tall = isTall();
      // 좁은 칸은 보기를 한 줄로 쌓고 세로셈·자리판 같은 부품을 따로 줄이므로 글씨를 덜 줄인다
      const narrow = m.w < 330;
      const wBase = tall ? (narrow ? 300 : 400) : (narrow ? 250 : 300);
      const s = Math.min(m.w / wBase, m.h / (tall ? 720 : 740));
      return clamp(Math.round(s * 1000) / 1000, 0.62, 1.3);
    }
    function renderPlayers() {
      const grid = document.getElementById('players');
      const m = cellMetrics();
      narrowCells = m.w < 330;
      grid.classList.toggle('xnarrow', m.w < 240);
      grid.style.gridTemplateColumns = `repeat(${m.cols}, minmax(0, 1fr))`;
      grid.style.gridTemplateRows = `repeat(${m.rows}, minmax(0, 1fr))`;
      grid.style.setProperty('--s', cellScale(m));
      grid.classList.toggle('narrow', narrowCells);
      grid.classList.toggle('short', m.h < 440);
      grid.innerHTML = players.map((p) => `<section class="player-cell theme-${p.idx % 6}" id="cell-${p.idx}">${cellInner(p)}</section>`).join('');
    }
    function renderCell(idx) {
      const cell = document.getElementById(`cell-${idx}`);
      if (cell && players[idx]) cell.innerHTML = cellInner(players[idx]);
    }

    function speakerBtn(idx) {
      return `<button class="spk" type="button" onclick="speakQ(${idx})" aria-label="문제 읽어 주기">${SPK}</button>`;
    }
    function speakQ(idx) {
      const p = players[idx];
      if (p && p.q) speak(p.q.speech);
    }

    function cellInner(p) {
      // 시간 대결·평가 중인 태블릿에는 학생이 고른 이름(번호)과 동물을 보여 준다
      const a = BP.me && ((BP.race && BP.race.running) || (BP.exam && BP.exam.running))
        ? { emoji: BP.exam && BP.exam.running ? '📝' : bellEmoji(BP.me.avatar), name: bellEsc(BP.me.name) }
        : ANIMALS[p.idx % ANIMALS.length];
      const q = p.q;
      const body = !q ? examDoneBody(p) : (BODIES[q.kind] || choiceBody)(p);
      const prog = mode === 'exam'
        ? `<span class="prog-chip">${Math.min(examIndex[p.idx] + (q ? 1 : 0), EXAM_TOTAL)} / ${EXAM_TOTAL}</span>`
        : '';
      const combo = mode === 'speed' && combos[p.idx] >= 2 ? `<span class="combo-chip">🔥 ${combos[p.idx]}연속</span>` : '';
      return `
        <div class="answer-overlay" id="ov-${p.idx}"></div>
        <div class="player-header">
          <span class="pname"><span class="av">${a.emoji}</span><span class="nm">${a.name}</span></span>
          <span class="pscore-wrap">${combo}${prog}<span class="pscore" id="sc-${p.idx}">${STAR}${scores[p.idx]}</span></span>
        </div>
        <div class="cell-body">${mode === 'mix' && q ? mixTagHtml(q) : ''}${body}</div>
        <div class="controls">
          <div class="message ${p.state}" id="msg-${p.idx}"><span>${p.message}</span></div>
          <div class="btns">${q ? controlsHtml(p) : ''}</div>
        </div>`;
    }

    function controlsHtml(p) {
      if (p.locked) return '';
      const k = p.q.kind;
      const skip = mode === 'exam' ? '' : `<button class="btn-sub" type="button" onclick="skipQuestion(${p.idx})">넘기기</button>`;
      const check = (fn, label = '확인') => `<button class="btn-check" type="button" onclick="${fn}(${p.idx})">${label}</button>`;
      const sub = (fn, label) => `<button class="btn-sub" type="button" onclick="${fn}(${p.idx})">${label}</button>`;
      if (k === 'keypad') return `${skip}${check('submitAns')}`;
      if (APP_CONTROLS[k]) return APP_CONTROLS[k](p, { skip, check, sub });
      return skip;
    }

    /* ---------- 문제 본문 ---------- */
    function choiceBtns(p, list, cls, pickedList, ans) {
      return list.map((c, i) => {
        const picked = pickedList.includes(i);
        const isAns = c.v === ans;
        let st = '';
        if (picked && !isAns) st = ' wrong';
        if (p.locked && isAns) st = ' right';
        return `<button class="choice${cls ? ` ${cls}` : ''}${st}" type="button" onclick="choose(${p.idx},${i})">${c.html}</button>`;
      }).join('');
    }
    function qCard(p, prompt, visual) {
      return `<div class="q-card"><div class="q-text"><span>${prompt}</span>${speakerBtn(p.idx)}</div>${visual || ''}</div>`;
    }

    function choiceBody(p) {
      const q = p.q;
      const cols = q.cols || 2;
      // 짧은 글자 보기는 좁은 칸에서도 두 칸으로 둔다
      const short = q.txt && cols === 2 && q.choices.every((c) => stripTags(c.html).length <= 9);
      return `${qCard(p, q.prompt, q.visual)}
        <div class="choices c${cols}${q.txt ? ' txtc' : ''}${short ? ' short' : ''}${q.figs ? ` figs${q.choices.length === 2 ? ' two' : ''}` : ''}">${choiceBtns(p, q.choices, q.txt ? 'txt' : q.figs ? 'figc' : '', p.picked, q.ans)}</div>`;
    }

    function ansBoxHtml(p) {
      return `<span class="ans-box${p.inputBad ? ' bad' : ''}" id="ans-${p.idx}">${p.input ? numHtml(p.input) : '<span class="ph">?</span>'}${p.locked ? '' : '<span class="caret"></span>'}</span>`;
    }
    function keypadHtml(idx, dot) {
      const d = dot ? '.' : '';
      const keys = narrowCells
        ? ['7', '8', '9', 'del', '4', '5', '6', d, '1', '2', '3', '0']
        : ['1', '2', '3', '4', '5', 'del', '6', '7', '8', '9', '0', d];
      return `<div class="keypad${narrowCells ? ' k4' : ''}">${keys.map((k) => {
        if (k === '') return '<span></span>';
        if (k === 'del') return `<button class="key fn" type="button" onclick="kp(${idx},'del')" aria-label="지우기">⌫</button>`;
        if (k === '.') return `<button class="key dotk" type="button" onclick="kp(${idx},'.')" aria-label="소수점"><i></i></button>`;
        return `<button class="key" type="button" onclick="kp(${idx},'${k}')">${k}</button>`;
      }).join('')}</div>`;
    }
    function keypadBody(p) {
      const q = p.q;
      const line = `<div class="ans-line">${q.lhs || ''}${ansBoxHtml(p)}${q.unit ? `<span class="unit-txt">${q.unit}</span>` : ''}</div>`;
      return `${qCard(p, q.prompt || '답을 써 보세요.', `${q.visual || ''}${line}`)}${p.locked ? '' : keypadHtml(p.idx, q.dot)}`;
    }

    function oxBody(p) {
      const q = p.q;
      const why = p.stage === 'why';
      const list = why ? q.reasons : [{ v: 'yes', html: q.yes }, { v: 'no', html: q.no }];
      const ans = why ? q.why : (q.isYes ? 'yes' : 'no');
      return `${qCard(p, why ? q.whyPrompt : q.prompt, q.visual)}
        <div class="choices ${why ? 'c1' : 'c2'} txtc">${choiceBtns(p, list, 'txt', why ? p.pickedWhy : p.picked, ans)}</div>`;
    }

    /* =========================================================
